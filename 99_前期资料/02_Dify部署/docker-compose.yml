version: '3.8'

services:
  # Dify Web UI (前端)
  dify-web:
    image: langgenius/dify-web:latest
    container_name: dify-web
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://dify-api:5001
      - NEXT_PUBLIC_APP_URL=http://localhost/studio
    ports:
      - "3000:3000"
    depends_on:
      - dify-api
    networks:
      - dify-network

  # Dify API (后端服务)
  dify-api:
    image: langgenius/dify-api:latest
    container_name: dify-api
    restart: unless-stopped
    environment:
      # 基础配置
      - MODE=production
      - DEBUG=false
      - SECRET_KEY=${SECRET_KEY}
      
      # 数据库配置
      - DB_USERNAME=postgres
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=dify
      
      # Redis配置
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      
      # Weaviate (矢量数据库)
      - WEAVIATE_ENABLED=true
      - WEAVIATE_ENDPOINT=http://weaviate:8080
      - WEAVIATE_API_KEY=${WEAVIATE_API_KEY}
      
      # 嵌入模型和LLM配置
      - EMBEDDING_MODEL_NAME=BGE-large-zh-v1.5
      - EMBEDDING_MODEL_PROVIDER=huggingface
      - EMBEDDING_MODEL_PATH=/models/
      
      # LLM提供商密钥
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      
      # 其他配置
      - TIMEZONE=${TIME_ZONE:-Asia/Shanghai}
      - CONSOLE_WEB_URL=http://localhost/console
      - FILES_UPLOAD_BASE_PATH=/data/storage
      
    ports:
      - "5001:5001"
    
    volumes:
      - /data/dify/storage:/workspace/data
      - /data/dify/logs:/workspace/logs
    
    depends_on:
      - postgres
      - redis
      - weaviate
    
    networks:
      - dify-network

  # Dify Worker (异步任务处理)
  dify-worker:
    image: langgenius/dify-api:latest
    container_name: dify-worker
    restart: unless-stopped
    command: celery -A app.celery worker -l info
    
    environment:
      # 使用与dify-api相同的环境变量
      - MODE=production
      - DEBUG=false
      - SECRET_KEY=${SECRET_KEY}
      
      - DB_USERNAME=postgres
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=dify
      
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      
      - WEAVIATE_ENABLED=true
      - WEAVIATE_ENDPOINT=http://weaviate:8080
      - WEAVIATE_API_KEY=${WEAVIATE_API_KEY}
      
      - EMBEDDING_MODEL_NAME=BGE-large-zh-v1.5
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      
      - TIMEZONE=${TIME_ZONE:-Asia/Shanghai}
    
    depends_on:
      - postgres
      - redis
      - dify-api
    
    networks:
      - dify-network

  # PostgreSQL (业务数据库)
  postgres:
    image: postgres:15-alpine
    container_name: dify-postgres
    restart: unless-stopped
    
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=dify
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --locale=C
    
    volumes:
      - /data/dify/postgres:/var/lib/postgresql/data
      - /data/dify/postgres_backup:/backup
    
    ports:
      - "5432:5432"
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    
    networks:
      - dify-network

  # Redis (缓存和消息队列)
  redis:
    image: redis:7-alpine
    container_name: dify-redis
    restart: unless-stopped
    
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --maxmemory 512mb
    
    volumes:
      - /data/dify/redis:/data
    
    ports:
      - "6379:6379"
    
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    
    networks:
      - dify-network

  # Weaviate (向量数据库)
  weaviate:
    image: semitechnologies/weaviate:latest
    container_name: dify-weaviate
    restart: unless-stopped
    
    environment:
      - QUERY_DEFAULTS_LIMIT=25
      - AUTHENTICATION_APIKEY_ENABLED=true
      - AUTHENTICATION_APIKEY_ALLOWED_KEYS=${WEAVIATE_API_KEY}
      - AUTHENTICATION_APIKEY_USERS=admin
      - AUTHORIZATION_ADMIN_LIST=admin
      - CLUSTER_HOSTNAME=weaviate
      - PERSISTENCE_DATA_PATH=/var/lib/weaviate
      - BACKUP_FILESYSTEM_PATH=/backups
    
    volumes:
      - /data/dify/weaviate:/var/lib/weaviate
      - /data/dify/weaviate_backups:/backups
    
    ports:
      - "8080:8080"
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/.well-known/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    
    networks:
      - dify-network

  # Nginx (反向代理，可选但推荐)
  nginx:
    image: nginx:alpine
    container_name: dify-nginx
    restart: unless-stopped
    
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /data/dify/nginx_logs:/var/log/nginx
    
    ports:
      - "80:80"
      - "443:443"
    
    depends_on:
      - dify-web
      - dify-api
    
    networks:
      - dify-network

networks:
  dify-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  weaviate_data:
