    context: 生产保障体系的重要组成部分。
    example: "完善辅材管理体系，建立关键辅材供应商备份机制，防范供应断档风险"
    notes: 关键辅材须建立至少两家合格供应商，防范单一来源风险

  - id: TT-MME-051
    category: mme_term
    domain: 原料保障管理能力域
    term: 原料信息化管理
