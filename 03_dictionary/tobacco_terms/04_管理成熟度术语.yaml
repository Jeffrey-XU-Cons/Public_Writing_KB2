    context: 研发管理现代化的重要支撑。
    example: "建立研发管理信息系统，实现项目进度、经费使用、成果归档的数字化管理"
    notes: 研发信息化须与企业整体数字化转型规划协同推进

  - id: TT-MME-042
    category: mme_term
    domain: 技术研发管理能力域
    term: 研发绩效评价
