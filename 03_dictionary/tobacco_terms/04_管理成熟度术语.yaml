    definition: 原料保障能力域的子域，评估企业对采购烟叶从收购标准制定、入库检验到醇化过程管理的质量全链条管控能力。
    context: 保障产品品质一致性的基础管理职能。
    example: "强化原料质量管控体系建设，实现入库烟叶质量的精准分级和追溯管理"
    notes: 质量管控须建立从产地到使用的完整追溯链条

  - id: TT-MME-046
    category: mme_term
