    context: 工业企业核心竞争力的原料保障维度。
    example: "原料保障能力域评价重点关注原料质量稳定性和供应链风险管控能力"
    notes: 原料保障直接影响产品品质和品牌竞争力

  - id: TT-MME-044
    category: mme_term
