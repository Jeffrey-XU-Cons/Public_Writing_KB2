    context: 原料供应链的源头管理环节。
    example: "建立精准的烟叶采购计划管理机制，实现产销存三端数据的动态平衡"
    notes: 采购计划须提前编制，为产区种植安排留足时间

  - id: TT-MME-045
    category: mme_term
    domain: 原料保障管理能力域
