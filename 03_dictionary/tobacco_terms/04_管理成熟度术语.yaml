  background: |
    烟草行业管理成熟度评价体系是国家烟草专卖局推行的、覆盖工业企业和商业企业
    各主要业务领域的管理能力评估体系。通过量化评价各企业在不同能力域的管理成熟
    度等级，推动行业整体管理水平持续提升。评价结果用于行业绩效考核和管理提升指导。

# ===== 通用评价概念 =====

mme_terms:

  - id: TT-MME-001
    category: mme_term
    domain: 通用评价概念
    term: 管理成熟度评价
    abbreviation: 成熟度评价
    definition: 按照国家烟草专卖局统一制定的评价标准，对烟草企业在各主要管理领域的规范化、精细化、系统化程度进行量化评估的管理活动。
    context: 行业管理提升的重要工具和绩效考核的重要依据。
    example: "参加本年度管理成熟度评价，在技术研发和生产制造两个能力域取得优秀等级"
    notes: 评价结果直接影响企业绩效考核结果，须认真对待

  - id: TT-MME-002
    category: mme_term
    domain: 通用评价概念
    term: 能力域
    definition: 管理成熟度评价体系中，按照业务或管理职能划分的一级评价单元，每个能力域代表企业某一主要管理领域，如技术研发、生产制造等。
    context: 评价体系的顶层分类维度。
    example: "本次评价覆盖技术研发、原料保障、生产制造三个能力域，共涉及20个能力子域"
    notes: 行业目前设有8个主要能力域，卷烟厂为独立的综合性评价单元

  - id: TT-MME-003
    category: mme_term
    domain: 通用评价概念
    term: 能力子域
    definition: 在能力域之下，对某一管理职能进行进一步细化的二级评价单元，每个能力子域含若干核心要素。
    context: 评价体系的中间层，连接能力域和核心要素。
    example: "技术研发能力域包含科技创新管理、研发项目管理、知识产权管理等多个能力子域"
    notes: 能力子域的设置反映了该业务领域的核心管理关注点

  - id: TT-MME-004
    category: mme_term
    domain: 通用评价概念
    term: 核心要素
    definition: 能力子域下，对具体管理活动、制度建设、工具应用等最细颗粒度的评价单元，是直接打分的基本单位。
    context: 评价打分和整改提升的最基本对象。
    example: "研发项目管理子域下，项目立项审批、里程碑管理、成果验收等均为核心要素"
    notes: 核心要素的评分依据须有可查证的文档或数据支撑

  - id: TT-MME-005
    category: mme_term
    domain: 通用评价概念
    term: 成熟度等级
    definition: 对企业在某一能力域或核心要素的管理水平的分级描述，通常分为五个等级：初始级（L1）、规范级（L2）、管控级（L3）、优化级（L4）、卓越级（L5）。
    context: 评价结果的核心表现形式。
    example: "经评价，该企业技术研发能力域整体达到管控级（L3），部分核心要素达到优化级（L4）"
    notes: 不同等级对应不同的分数区间和管理特征描述

  - id: TT-MME-006
    category: mme_term
    domain: 通用评价概念
    term: 初始级
    abbreviation: L1
    definition: 管理成熟度最低等级，特征为管理活动以事后应对为主，缺乏系统性规划和文档化制度，过度依赖个人能力。
    context: 描述管理薄弱领域的等级，评价中出现须重点整改。
    example: "部分基层单位在物资管理方面仍处于初始级，亟需建立规范化制度体系"
    notes: 初始级意味着管理存在根本性缺陷，须优先纳入整改计划

  - id: TT-MME-007
    category: mme_term
    domain: 通用评价概念
    term: 规范级
    abbreviation: L2
    definition: 管理成熟度第二等级，特征为已建立基本制度规程，管理活动基本规范化，但系统性和一致性仍有不足。
    context: 多数行业企业基础管理领域的通常水平。
    example: "经过上年度整改，该项能力子域由初始级提升至规范级，制度建设基本到位"
    notes: 规范级是管理建设的基本门槛，须持续向管控级迈进

  - id: TT-MME-008
    category: mme_term
    domain: 通用评价概念
    term: 管控级
    abbreviation: L3
    definition: 管理成熟度第三等级，特征为建立了完善的管理体系，能够对管理过程进行有效监控，管理结果可预期可复现。
    context: 行业对大多数能力域的标准要求水平。
    example: "深入推进管理提升，确保各主要能力域在年底前全部达到管控级以上"
    notes: 管控级是行业评价的"合格线"，大多数企业应达到此水平

  - id: TT-MME-009
    category: mme_term
    domain: 通用评价概念
    term: 优化级
    abbreviation: L4
    definition: 管理成熟度第四等级，特征为能够基于数据分析持续优化管理过程，管理活动与企业战略高度协同，具备主动改进能力。
    context: 行业重点企业和重点能力域的目标水平。
    example: "确立优化级建设目标，在重点能力域率先实现数据驱动的持续管理优化"
    notes: 优化级意味着企业具备了基于量化数据的管理改进能力

  - id: TT-MME-010
    category: mme_term
    domain: 通用评价概念
    term: 卓越级
    abbreviation: L5
    definition: 管理成熟度最高等级，特征为在行业内形成最佳实践，具备引领和示范价值，能够持续推动行业整体水平提升。
    context: 行业标杆企业在优势领域追求的最高目标水平。
    example: "将卓越级作为品牌管理领域的中长期建设目标，努力打造行业标杆"
    notes: 达到卓越级的企业须有可供行业推广的典型做法和创新案例

  - id: TT-MME-011
    category: mme_term
    domain: 通用评价概念
    term: 自评
    full_form: 管理成熟度自我评价
    definition: 被评企业按照统一的评价指标体系，对自身各能力域管理成熟度进行内部评估打分的过程，是正式评价的前提和基础。
    context: 评价工作流程的首要环节。
    example: "按照行业统一要求完成自评，自评报告须如实反映企业管理现状"
    notes: 自评结果与专家评价结果的差距，反映企业对自身管理的客观认知程度

  - id: TT-MME-012
    category: mme_term
    domain: 通用评价概念
    term: 第三方评价
    definition: 由行业认可的、独立于被评企业的专业评价机构，依据统一标准对企业管理成熟度进行客观评估的评价方式。
    context: 保障评价结果客观性和公信力的重要机制。
    example: "引入第三方评价机构开展独立评估，确保评价结果客观公正"
    notes: 第三方评价机构须经行业主管部门认可，具备相应资质

  - id: TT-MME-013
    category: mme_term
    domain: 通用评价概念
    term: 评审专家
    definition: 由行业主管部门遴选认定的、具备特定业务领域专业知识和管理评价经验的专家人员，参与管理成熟度评价工作。
    context: 评价工作质量的重要保障。
    example: "邀请5名行业评审专家对企业生产制造能力域进行现场评审"
    notes: 评审专家须回避与被评单位存在利益关联的情形

  - id: TT-MME-014
    category: mme_term
    domain: 通用评价概念
    term: 现场核查
    definition: 评审专家通过查阅文档、访谈人员、实地观察等方式，对被评企业自评结论进行现场验证的评价活动。
    context: 评价过程中最重要的证据收集环节。
    example: "评审专家组开展为期两天的现场核查，重点审查关键制度文件和执行记录"
    notes: 现场核查须查看实际运行证据，不能仅审查制度文本

  - id: TT-MME-015
    category: mme_term
    domain: 通用评价概念
    term: 评价证据
    definition: 支撑管理成熟度评分的、能够客观证明管理活动已落实的材料，包括制度文件、执行记录、数据报表、现场照片等。
    context: 评价打分的客观依据，须真实、完整、可核查。
    example: "整理归档本年度各核心要素的评价证据，确保证据链完整闭合"
    notes: 证据须与所支撑的核心要素直接关联，不接受间接或无关证据

  - id: TT-MME-016
    category: mme_term
    domain: 通用评价概念
    term: 成熟度得分
    definition: 按照评分规则，对各核心要素赋分后逐级汇总，最终形成的能力子域、能力域乃至整体的综合得分。
    context: 评价结果的量化表现形式，用于横向比较和纵向跟踪。
    example: "技术研发能力域综合得分82.5分，较上年度提升4.3分"
    notes: 各能力域权重不同，汇总计算时须使用加权方法

  - id: TT-MME-017
    category: mme_term
    domain: 通用评价概念
    term: 整改提升计划
    definition: 针对评价发现的管理短板和不足，制定的包含整改措施、责任主体、完成时限的行动计划。
    context: 评价工作的核心价值体现，须推动实际管理改进。
    example: "根据评价反馈意见，制定详细整改提升计划，按季度跟踪落实进展"
    notes: 整改计划须具体可操作，避免停留于原则性表述

  - id: TT-MME-018
    category: mme_term
    domain: 通用评价概念
    term: 标杆对标
    definition: 以行业内同类最优企业为参照，对比差距、学习借鉴其先进管理经验和做法，推动自身管理水平提升的方法。
    context: 管理提升和整改促进的重要方法论。
    example: "开展行业内部标杆对标，学习借鉴先进单位在物流管理方面的优秀做法"
    notes: 对标须选择真正领先的标杆，避免选择容易超越的低水平参照

  - id: TT-MME-019
    category: mme_term
    domain: 通用评价概念
    term: 管理短板
    definition: 经评价识别出的、与行业平均水平或目标水平存在明显差距的管理能力领域，是管理提升的优先工作方向。
    context: 整改提升规划的重要输入。
    example: "客观分析管理短板，集中资源优先攻克制约发展的关键管理弱项"
    notes: 管理短板须区分根本原因（制度缺失、执行不力、能力不足）

  - id: TT-MME-020
    category: mme_term
    domain: 通用评价概念
    term: 最佳实践
    definition: 在管理成熟度评价中被认定为行业领先、具有推广价值的管理方法、工具或制度创新案例。
    context: 行业管理经验共享和标杆学习的重要载体。
    example: "将企业在精益生产管理方面形成的最佳实践，提炼成行业可推广的管理方法"
    notes: 最佳实践须有可复制性，不能只是特殊条件下的一次性成功

  - id: TT-MME-021
    category: mme_term
    domain: 通用评价概念
    term: 持续改进
    definition: 基于评价结果和日常监测，识别改进机会，制定并实施改进措施，形成管理能力螺旋上升的循环改进机制。
    context: 管理成熟度评价体系的核心价值取向。
    example: "建立持续改进机制，将评价工作的价值从一次性诊断延伸到长效管理提升"
    notes: 持续改进须体现在管理实践中，而非停留在报告中

  - id: TT-MME-022
    category: mme_term
    domain: 通用评价概念
    term: PDCA循环
    full_form: 计划-执行-检查-改进循环
    definition: 管理活动的基本循环模式：Plan（计划）→Do（执行）→Check（检查）→Act（改进），是管理成熟度评价中检验管理规范性的重要参考框架。
    context: 评价指标体系的设计逻辑基础。
    example: "评价专家重点审查各能力子域的PDCA管理闭环是否真正建立并有效运转"
    notes: PDCA闭环是管控级以上成熟度的基本特征要求

  - id: TT-MME-023
    category: mme_term
    domain: 通用评价概念
    term: 关键绩效指标
    abbreviation: KPI
    definition: 衡量各能力域管理活动结果和过程质量的量化指标体系，是管理成熟度评价的量化支撑。
    context: 评价证据的重要组成部分，须有历史数据支撑。
    example: "构建各能力域KPI监测体系，为管理成熟度评价提供客观量化依据"
    notes: KPI须满足SMART原则（具体、可量化、可实现、相关、有时限）

  - id: TT-MME-024
    category: mme_term
    domain: 通用评价概念
    term: 评价周期
    definition: 管理成熟度评价开展的时间频率，行业通常按年度开展正式评价，中间穿插阶段性跟踪检查。
    context: 评价工作组织管理的时间框架。
    example: "按年度评价周期安排评价工作，4月完成自评，6月完成专家评审，8月反馈结果"
    notes: 评价周期的设置须保证评价结果的连续可比性

  - id: TT-MME-025
    category: mme_term
    domain: 通用评价概念
    term: 管理成熟度报告
    definition: 评价工作完成后，由评价机构或评审专家组出具的、对被评企业各能力域成熟度水平进行综合描述和分析的正式报告。
    context: 评价工作的最终成果文件，是整改提升的行动依据。
    example: "认真研读管理成熟度评价报告，找准自身问题，制定针对性整改方案"
    notes: 成熟度报告须包含优势认可和问题指出两个维度

  - id: TT-MME-026
    category: mme_term
    domain: 通用评价概念
    term: 能力建设
    definition: 针对评价发现的能力短板，通过制度建设、流程优化、工具引入、人员培训等手段，系统提升特定管理领域能力水平的行动。
    context: 整改提升工作的总称。
    example: "制定三年能力建设计划，有重点、分步骤提升各能力域成熟度等级"
    notes: 能力建设须区分长期建设（体系性）和短期整改（问题性）

  - id: TT-MME-027
    category: mme_term
    domain: 通用评价概念
    term: 评价指标体系
    definition: 由能力域、能力子域、核心要素三层次构成的、对管理活动进行系统化评估的指标框架，是开展管理成熟度评价的基础工具。
    context: 评价工作的方法论基础。
    example: "深入理解评价指标体系，将各项指标要求转化为日常管理改进的行动指引"
    notes: 评价指标体系由行业主管部门统一制定，各单位须对照执行

  - id: TT-MME-028
    category: mme_term
    domain: 通用评价概念
    term: 评价结果运用
    definition: 将管理成熟度评价结果与绩效考核、资源配置、干部使用、管理改进等工作挂钩，确保评价工作发挥实际效用的机制。
    context: 评价工作的价值实现环节。
    example: "强化评价结果运用，将成熟度评级纳入企业年度绩效考核重要指标"
    notes: 评价结果须与实质性激励约束挂钩，否则评价流于形式

  - id: TT-MME-029
    category: mme_term
    domain: 通用评价概念
    term: 管理成熟度提升专项行动
    definition: 行业或企业针对成熟度评价短板，集中资源、系统推进的专项管理改进活动，通常设定明确的目标等级和时间节点。
    context: 将评价问题转化为行动计划的重要工作形式。
    example: "启动管理成熟度提升专项行动，力争重点能力域在两年内提升一个等级"
    notes: 专项行动须有年度推进计划和阶段性里程碑

  - id: TT-MME-030
    category: mme_term
    domain: 通用评价概念
    term: 能力成熟度模型
    abbreviation: CMM
    definition: 以软件能力成熟度模型（CMM/CMMI）为参考，结合烟草行业管理特点，构建的分级评价管理能力成熟度的方法论框架。
    context: 行业管理成熟度评价体系的方法论来源之一。
    example: "借鉴成熟度模型理论，构建符合行业特点的管理能力评价框架"
    notes: 行业管理成熟度模型已在CMM基础上进行了大量本土化适配

# ===== 技术研发管理能力域 =====

