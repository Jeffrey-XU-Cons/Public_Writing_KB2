    context: 原料价值增值和品质提升的关键管理职能。
    example: "优化烟叶醇化管理体系，建立差异化醇化管理策略，提升醇化效果"
    notes: 醇化管理须建立质量档案，支撑配方使用决策

  - id: TT-MME-050
