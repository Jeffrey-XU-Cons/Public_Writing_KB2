    context: 原料管理数字化转型的重要内容。
    example: "建立烟叶原料信息化管理平台，实现产地信息、质量档案、库存状态的数字化管理"
    notes: 原料信息化须与企业ERP系统深度集成

  - id: TT-MME-052
