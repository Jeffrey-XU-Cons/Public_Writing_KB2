    domain: 物资保障管理能力域
    term: 物资信息化管理
    definition: 物资保障能力域的子域，评估企业在采购管理信息系统、电子化招标平台、仓储WMS系统等信息化工具应用方面的水平。
    context: 提升物资管理效率和透明度的技术支撑。
    example: "推进物资管理信息化，实现采购、库存、使用的全流程线上管理"
    notes: 物资信息化系统须与财务系统集成，实现数据一致性

  - id: TT-MME-063
    category: mme_term
    domain: 物资保障管理能力域
    term: 节能降耗管理
    definition: 物资保障能力域的子域，评估企业在能源介质（水、电、气、汽）使用管理和消耗降低方面的精细化程度。
    context: 绿色低碳发展战略在物资保障层面的具体体现。
    example: "建立能源分项计量管理体系，推动水电气等能源介质的精细化消耗管控"
    notes: 节能降耗须设定量化目标，并通过计量手段追踪执行效果

# ===== 生产制造管理能力域 =====

  - id: TT-MME-064
    category: mme_term
    domain: 生产制造管理能力域
    term: 生产制造管理能力域
    definition: 管理成熟度评价体系中，专门评估工业企业在生产计划、制造过程控制、质量管理、设备管理、安全环保方面管理成熟度的评价模块。
    context: 工业企业最核心的管理能力域之一。
    example: "生产制造能力域是评价体系中权重最大的能力域之一，须重点加强"
    notes: 生产制造管理直接决定产品品质和企业竞争力

  - id: TT-MME-065
    category: mme_term
    domain: 生产制造管理能力域
    term: 生产计划管理
    definition: 生产制造能力域的子域，评估企业在年度、月度生产计划编制、执行监控、动态调整方面的精准化程度。
    context: 生产管理的顶层统筹职能。
    example: "建立生产计划与销售预测的动态协同机制，提升计划准确率"
    notes: 生产计划须在国家批准的年度指标内执行，不得超计划

  - id: TT-MME-066
    category: mme_term
    domain: 生产制造管理能力域
    term: 制造过程控制
    definition: 生产制造能力域的子域，评估企业在关键工序参数监控、异常处理、过程能力分析方面的系统化管控水平。
    context: 质量稳定性保障的核心管理职能。
    example: "提升制造过程控制水平，推行统计过程控制（SPC），降低产品品质波动"
    notes: 过程控制是预防性质量管理的核心手段

  - id: TT-MME-067
    category: mme_term
    domain: 生产制造管理能力域
    term: 产品质量管理
    definition: 生产制造能力域的子域，评估企业在原料检验、过程检验、成品检验和质量体系维护方面的规范化程度。
    context: 保障产品合格率和品质一致性的核心职能。
    example: "完善产品质量管理体系，实现质量问题快速响应和根本原因分析闭环"
    notes: 质量管理体系须定期接受内外部审核，保持持续有效

  - id: TT-MME-068
    category: mme_term
    domain: 生产制造管理能力域
    term: 设备管理
    definition: 生产制造能力域的子域，评估企业在设备预防性维护、点检制度、故障管理和OEE提升方面的管理规范性和有效性。
    context: 保障生产稳定运行和设备综合效率的管理职能。
    example: "建立设备全生命周期管理体系，推行预防性维护策略，减少非计划停机"
    notes: 设备管理成熟度直接影响生产能力的稳定性和利用效率

  - id: TT-MME-069
    category: mme_term
    domain: 生产制造管理能力域
    term: 安全生产管理
    definition: 生产制造能力域的子域，评估企业在安全生产制度建设、隐患排查治理、应急管理和安全培训方面的系统化程度。
    context: 生产管理的底线性要求和企业社会责任体现。
    example: "深化安全生产标准化建设，推行安全生产责任制考核，确保安全生产形势稳定"
    notes: 安全生产是刚性要求，发生重大事故将直接影响评价结论

  - id: TT-MME-070
    category: mme_term
    domain: 生产制造管理能力域
    term: 环境管理
    definition: 生产制造能力域的子域，评估企业在废气、废水、固废处置方面的达标管理和主动改进能力。
    context: 合规运营和绿色发展的重要管理职能。
    example: "完善环境管理体系，所有排放指标稳定达标，持续推进超低排放改造"
    notes: 环保达标是经营合法性的基本前提，须建立长效管理机制

  - id: TT-MME-071
    category: mme_term
    domain: 生产制造管理能力域
    term: 智能制造推进
    definition: 生产制造能力域的子域，评估企业在生产自动化、数字化车间建设、MES应用、工业互联网部署方面的推进程度和成效。
    context: 行业制造业转型升级的重要评价维度。
    example: "智能制造推进成效显著，关键工序自动化率提升至92%，实现少人化生产"
    notes: 智能制造推进须与产品质量提升和成本降低相结合，防止为智能而智能

  - id: TT-MME-072
    category: mme_term
    domain: 生产制造管理能力域
    term: 能源管理
    definition: 生产制造能力域的子域，评估企业在能源计量、分析、节约和管理信息化方面的系统化程度。
    context: 降本增效和绿色发展战略的交叉管理职能。
    example: "建立能源管控中心，实现能源消耗的实时监控和动态优化管理"
    notes: 单箱综合能耗是核心考核指标，须持续下降

  - id: TT-MME-073
    category: mme_term
    domain: 生产制造管理能力域
    term: 精益生产管理
    definition: 生产制造能力域的子域，评估企业在精益生产工具应用（5S、看板、改善活动等）、浪费消除和价值流优化方面的深度和成效。
    context: 生产效率和质量持续改进的方法论落地评估。
    example: "深入推进精益生产管理，开展全员改善活动，持续消除生产七大浪费"
    notes: 精益生产须形成全员参与的企业文化，不能只是管理层的项目

  - id: TT-MME-074
    category: mme_term
    domain: 生产制造管理能力域
    term: 产品追溯管理
    definition: 生产制造能力域的子域，评估企业在卷烟生产全过程赋码、追溯数据管理和问题产品快速召回能力方面的水平。
    context: 质量管理和市场监管的重要技术支撑。
    example: "完善产品追溯管理体系，实现从原料到成品的全链条可追溯"
    notes: 追溯系统须与行业统一的商品追溯平台对接

  - id: TT-MME-075
    category: mme_term
    domain: 生产制造管理能力域
    term: 生产信息化管理
    definition: 生产制造能力域的子域，评估企业在MES系统、生产数据采集分析、数字化看板等信息化工具在生产管理中的应用深度。
    context: 制造管理数字化转型的综合评估。
    example: "深化生产信息化管理，实现生产全过程数据实时采集、分析和预警"
    notes: 生产信息化须实现与ERP、质量系统的数据贯通，形成集成管理能力

# ===== 市场营销管理能力域 =====

  - id: TT-MME-076
    category: mme_term
    domain: 市场营销管理能力域
    term: 市场营销管理能力域
    definition: 管理成熟度评价体系中，专门评估企业在市场研究、品牌管理、客户服务、渠道管理、销售数据分析等营销职能管理成熟度的评价模块。
    context: 工业企业和商业企业均涉及的重要能力域。
    example: "市场营销能力域评价重点检验品牌管理体系的系统性和客户服务质量"
    notes: 工业侧重品牌管理，商业侧重渠道管理和客户服务

  - id: TT-MME-077
    category: mme_term
    domain: 市场营销管理能力域
    term: 品牌管理体系
    definition: 市场营销能力域的子域，评估工业企业在品牌战略规划、品牌组合管理、品牌价值评估方面的系统化程度。
    context: 工业企业市场竞争力的核心管理职能。
    example: "构建完善的品牌管理体系，明确品牌发展路径和各品规的市场定位"
    notes: 品牌管理须与技术研发和营销传播深度协同

  - id: TT-MME-078
    category: mme_term
    domain: 市场营销管理能力域
    term: 市场研究管理
    definition: 市场营销能力域的子域，评估企业在消费者研究、竞品分析、市场趋势判断方面的系统化程度和应用深度。
    context: 市场导向产品开发和营销决策的信息基础。
    example: "加强市场研究管理，建立消费者洞察与新品开发的直接联系机制"
    notes: 市场研究须建立持续跟踪机制，不能仅靠一次性调查

  - id: TT-MME-079
    category: mme_term
    domain: 市场营销管理能力域
    term: 销售计划管理
    definition: 市场营销能力域的子域，评估企业在年度销售目标制定、分解落实、过程监控和动态调整方面的精准管理水平。
    context: 市场营销管理的总纲性职能。
    example: "完善销售计划管理体系，实现销售目标与生产计划、原料保障的协同联动"
    notes: 销售计划准确率是衡量销售管理成熟度的核心指标之一

  - id: TT-MME-080
    category: mme_term
    domain: 市场营销管理能力域
    term: 客户关系管理
    abbreviation: CRM
    definition: 市场营销能力域的子域，评估商业企业对零售客户信息管理、分级服务、需求响应和满意度管理方面的系统化程度。
    context: 商业企业渠道竞争力的核心管理职能。
    example: "建立客户关系管理系统，实现零售客户的精准画像和个性化服务"
    notes: 客户满意度是客户关系管理成效的终极衡量标准

  - id: TT-MME-081
    category: mme_term
    domain: 市场营销管理能力域
    term: 市场秩序维护
    definition: 市场营销能力域的子域，评估商业企业在查处无证经营、打击假冒伪劣、防止窜货等市场监管职能的履行规范性和有效性。
    context: 烟草专卖制度维护的执法管理职能。
    example: "强化市场秩序维护，健全举报奖励机制，形成群防群治的市场管控格局"
    notes: 市场秩序维护是专卖行政主管部门的法定职责，须严格履行

  - id: TT-MME-082
    category: mme_term
    domain: 市场营销管理能力域
    term: 新品推广管理
    definition: 市场营销能力域的子域，评估工业企业将新产品推向市场的计划制定、推广执行、效果评估和推广方案迭代优化的管理规范性。
    context: 新产品市场化成功率的管理保障。
    example: "建立新品推广管理规范，从上市前教育、上市期推广到上市后评估形成完整闭环"
    notes: 新品推广须遵守卷烟广告和促销的法律限制

  - id: TT-MME-083
    category: mme_term
    domain: 市场营销管理能力域
    term: 价格管理
    definition: 市场营销能力域的子域，评估企业在执行国家规定价格政策、监控市场价格波动和处置异常价格方面的管理规范性。
    context: 专卖制度维护和市场稳定的重要管理职能。
    example: "严格执行国家卷烟价格政策，建立市场价格异动预警和快速响应机制"
    notes: 价格违规是严重的合规问题，须有效防范

  - id: TT-MME-084
    category: mme_term
    domain: 市场营销管理能力域
    term: 渠道管理
    definition: 市场营销能力域的子域，评估商业企业在零售终端管理、渠道结构优化、零售客户准入和退出方面的系统化程度。
    context: 商业企业市场管理能力的重要体现。
    example: "优化渠道管理体系，合理控制零售许可证总量，提升渠道整体服务质量"
    notes: 渠道管理须在专卖许可证管理框架内规范推进

  - id: TT-MME-085
    category: mme_term
    domain: 市场营销管理能力域
    term: 市场信息管理
    definition: 市场营销能力域的子域，评估企业在市场销售数据采集、分析挖掘和决策应用方面的系统化程度。
    context: 数据驱动营销决策的基础管理能力。
    example: "建立市场信息管理平台，实现销售数据的实时采集、多维分析和可视化展示"
    notes: 市场信息管理须打通工业和商业的数据壁垒，形成全链条洞察

  - id: TT-MME-086
    category: mme_term
    domain: 市场营销管理能力域
    term: 区域市场管理
    definition: 市场营销能力域的子域，评估商业企业对辖区内市场的精细化分区管理、差异化营销策略制定和执行能力。
    context: 商业企业提升区域市场竞争力的管理职能。
    example: "实施区域差异化市场管理，根据各乡镇市场特点制定个性化营销策略"
    notes: 区域市场管理须与客户经理的服务区域划分相协调

  - id: TT-MME-087
    category: mme_term
    domain: 市场营销管理能力域
    term: 营销数字化
    definition: 市场营销能力域的子域，评估企业在数字化营销工具应用、营销数据平台建设、客户数字化服务方面的推进深度。
    context: 营销管理现代化转型的综合评估维度。
    example: "推进营销数字化转型，建立客户移动端服务平台，提升客户服务便捷性"
    notes: 营销数字化须在专卖法规允许范围内推进，不得突破相关限制

# ===== 物流管理能力域 =====

  - id: TT-MME-088
    category: mme_term
    domain: 物流管理能力域
    term: 物流管理能力域
    definition: 管理成熟度评价体系中，专门评估商业企业在卷烟物流网络规划、运营管理、配送服务质量和物流信息化方面管理成熟度的评价模块。
    context: 商业企业服务能力和运营效率的核心评价维度。
    example: "物流管理能力域评价重点关注配送服务质量和物流运营效率"
    notes: 物流管理直接决定客户服务体验和运营成本水平

  - id: TT-MME-089
    category: mme_term
    domain: 物流管理能力域
    term: 物流网络管理
    definition: 物流管理能力域的子域，评估商业企业在物流设施布局规划、物流中心建设和配送路由优化方面的系统性规划和执行能力。
    context: 物流服务能力的基础性建设职能。
    example: "科学规划物流网络布局，优化物流中心辐射范围，填补配送覆盖盲区"
    notes: 物流网络布局须考虑服务覆盖率、配送效率和运营成本三者平衡

  - id: TT-MME-090
    category: mme_term
    domain: 物流管理能力域
    term: 仓储运营管理
    definition: 物流管理能力域的子域，评估物流中心在入库验收、分拣作业、出库配货等仓储运营环节的规范化程度和效率水平。
    context: 物流中心日常运营管理的核心职能。
    example: "优化仓储运营管理流程，引入自动化分拣设备，提升仓储作业效率"
    notes: 仓储运营须在保证准确率的前提下追求效率提升

  - id: TT-MME-091
    category: mme_term
    domain: 物流管理能力域
    term: 运输管理
    definition: 物流管理能力域的子域，评估商业企业在运输资源管理、路线优化、车辆调度和在途货物监控方面的管理规范性。
    context: 物流配送服务质量的直接决定因素。
    example: "加强运输管理，推行GPS实时监控，实现配送全程可视化跟踪"
