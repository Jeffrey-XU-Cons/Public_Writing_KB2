    context: 保障原料供应连续性的风险管理职能。
    example: "建立原料供应链风险管理体系，制定多种情景下的应急保障预案"
    notes: 供应链风险管理须识别关键风险点并建立可操作的应急预案

  - id: TT-MME-053
    category: mme_term
    domain: 原料保障管理能力域
    term: 绿色采购管理
