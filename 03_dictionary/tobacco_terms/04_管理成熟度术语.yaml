    context: 客户满意度的直接体现。
    example: "建立配送服务质量标准和客户投诉快速响应机制，持续提升服务水平"
    notes: 配送服务质量须通过客户满意度调查定期评估

  - id: TT-MME-093
    category: mme_term
    domain: 物流管理能力域
    term: 物流信息化管理
    definition: 物流管理能力域的子域，评估商业企业WMS、TMS等物流信息系统的建设完善程度和在实际运营中的应用深度。
    context: 物流运营数字化转型的综合评估。
    example: "深化物流信息化管理，建立订单-仓储-配送-签收的全链路数字化管理能力"
    notes: 物流信息化系统须与商业管理核心系统实现数据贯通

  - id: TT-MME-094
    category: mme_term
    domain: 物流管理能力域
    term: 物流成本管理
    definition: 物流管理能力域的子域，评估商业企业对物流各项费用的预算管理、过程控制和绩效分析的精细化程度。
    context: 商业企业降本增效的重要管理职能。
    example: "建立物流成本精细化核算体系，推动单件配送成本的持续降低"
    notes: 物流成本管理须在保证服务质量的前提下合理降低成本

  - id: TT-MME-095
    category: mme_term
    domain: 物流管理能力域
    term: 物流安全管理
    definition: 物流管理能力域的子域，评估商业企业在货物安全、行车安全和仓库安全方面的制度建设和执行有效性。
    context: 物流运营的底线性安全管理要求。
    example: "完善物流安全管理制度，强化运输途中防损防盗能力和应急处置机制"
    notes: 卷烟是高价值管控商品，防盗防损是物流安全管理的重中之重

  - id: TT-MME-096
    category: mme_term
    domain: 物流管理能力域
    term: 绿色物流管理
    definition: 物流管理能力域的子域，评估商业企业在新能源配送车辆推广、包装减量化、碳排放管理方面的工作推进情况。
    context: 双碳目标在物流领域的具体落实。
    example: "加快绿色物流管理体系建设，新能源配送车辆占比持续提升"
    notes: 绿色物流须有年度行动计划和量化目标

  - id: TT-MME-097
    category: mme_term
    domain: 物流管理能力域
    term: 应急保障管理
    definition: 物流管理能力域的子域，评估商业企业应对极端天气、设备故障、突发事件等情况下保障正常配送服务的预案和响应能力。
    context: 物流服务可靠性的风险保障职能。
    example: "建立完善的物流应急保障体系，定期演练节假日和极端条件下的配送保障预案"
    notes: 应急保障须有具体的应急预案和资源储备

  - id: TT-MME-098
    category: mme_term
    domain: 物流管理能力域
    term: 智慧物流建设
    definition: 物流管理能力域的子域，评估商业企业运用物联网、AI、大数据等技术实现物流智能化的推进程度。
    context: 物流现代化建设的前沿评估维度。
    example: "深入推进智慧物流建设，探索无人配送、智能分拣等新技术应用"
    notes: 智慧物流建设须结合企业实际，防止超越发展阶段的盲目投入

# ===== 综合管理能力域 =====

  - id: TT-MME-099
    category: mme_term
    domain: 综合管理能力域
    term: 综合管理能力域
    definition: 管理成熟度评价体系中，评估企业在战略管理、人力资源、财务管理、党建、信息化、风险内控等综合性管理职能成熟度的评价模块。
    context: 覆盖企业支撑性管理职能的综合性评价域。
    example: "综合管理能力域全面评估企业各支撑性管理职能的系统化水平"
    notes: 综合管理是各业务能力域有效运转的基础支撑

  - id: TT-MME-100
    category: mme_term
    domain: 综合管理能力域
    term: 战略管理
    definition: 综合管理能力域的子域，评估企业在战略规划制定、战略落地执行、战略绩效评估方面的系统化程度。
    context: 企业中长期发展能力的核心评价维度。
    example: "提升战略管理水平，建立战略与预算、绩效的协同联动机制"
    notes: 战略管理须形成从战略规划到运营计划的完整传导链条

  - id: TT-MME-101
    category: mme_term
    domain: 综合管理能力域
    term: 人力资源管理
    definition: 综合管理能力域的子域，评估企业在人才规划、选用育留、绩效考核、薪酬激励方面的系统化管理水平。
    context: 企业核心竞争力构建的人才基础管理职能。
    example: "完善人力资源管理体系，建立以价值创造为导向的人才选拔和激励机制"
    notes: 人力资源管理须与企业战略深度对接

  - id: TT-MME-102
    category: mme_term
    domain: 综合管理能力域
    term: 财务管理
    definition: 综合管理能力域的子域，评估企业在预算管理、成本核算、资金管理、财务分析和合规报告方面的规范化程度。
    context: 企业运营效率和风险控制的财务管理基础。
    example: "加强财务管理能力建设，提升全面预算管理的精细化水平"
    notes: 财务管理须同时满足合规性和管理决策支持两方面要求

  - id: TT-MME-103
    category: mme_term
    domain: 综合管理能力域
    term: 党建工作管理
    definition: 综合管理能力域的子域，评估企业党委（党组）在政治建设、思想建设、组织建设、作风建设、纪律建设方面的规范化程度。
    context: 国有企业性质决定了党建工作是综合管理评价的重要维度。
    example: "将党建工作管理纳入综合管理成熟度评价，推动党建与业务深度融合"
    notes: 党建工作须与中心工作深度融合，不能与业务管理两张皮

  - id: TT-MME-104
    category: mme_term
    domain: 综合管理能力域
    term: 全面风险管理
    definition: 综合管理能力域的子域，评估企业识别、评估、监控和应对战略、运营、财务、法律合规等各类风险的系统化能力。
    context: 企业稳健经营的基础性管理职能。
    example: "建立健全全面风险管理体系，实现风险识别评估的系统化和动态化"
    notes: 全面风险管理须涵盖内部审计和廉洁风险防控

  - id: TT-MME-105
    category: mme_term
    domain: 综合管理能力域
    term: 信息化与数字化管理
    definition: 综合管理能力域的子域，评估企业在信息系统规划建设、数据治理、网络安全管理和数字化转型推进方面的整体水平。
    context: 企业数字化转型能力的综合评估维度。
    example: "统筹推进信息化与数字化管理，提升全业务领域的数字化管理能力"
    notes: 信息化与数字化管理须有统一的顶层规划，防止碎片化建设

  - id: TT-MME-106
    category: mme_term
    domain: 综合管理能力域
    term: 法务合规管理
    definition: 综合管理能力域的子域，评估企业在合同管理、法律事务处理、合规审查和法律风险防范方面的规范化程度。
    context: 依法治企的重要管理职能。
    example: "加强法务合规管理能力建设，建立合规审查嵌入业务流程的工作机制"
    notes: 法务合规须前置到业务决策过程，而非仅在问题出现后介入

  - id: TT-MME-107
    category: mme_term
    domain: 综合管理能力域
    term: 档案管理
    definition: 综合管理能力域的子域，评估企业在文件归档、档案分类、保管期限管理和档案利用方面的规范化程度。
    context: 管理规范化的基础性工作，也是各类评价的证据支撑。
    example: "加强档案管理基础建设，推行电子档案与实体档案并行管理模式"
    notes: 档案管理是评价证据的重要来源，管理规范直接影响评价质量

  - id: TT-MME-108
    category: mme_term
    domain: 综合管理能力域
    term: 企业文化管理
    definition: 综合管理能力域的子域，评估企业在核心价值观建设、文化传播、行为规范和文化氛围营造方面的系统化程度。
    context: 企业软实力和凝聚力的管理基础。
    example: "深化企业文化管理，推动核心价值观内化于心、外化于行"
    notes: 企业文化须与战略方向和管理导向高度一致

  - id: TT-MME-109
    category: mme_term
    domain: 综合管理能力域
    term: 社会责任管理
    definition: 综合管理能力域的子域，评估企业在承担税收贡献、助农帮扶、控烟公益、环境保护等社会责任方面的主动性和系统化程度。
    context: 企业合法性建设和品牌形象管理的重要维度。
    example: "完善社会责任管理体系，定期发布社会责任报告，主动接受社会监督"
    notes: 烟草行业社会责任管理须平衡多方期待，把握表述分寸

  - id: TT-MME-110
    category: mme_term
    domain: 综合管理能力域
    term: 绩效管理体系
    definition: 综合管理能力域的子域，评估企业在绩效目标设定、过程辅导、绩效评价和结果运用方面的系统化管理水平。
    context: 推动战略落地和激励约束的核心管理工具。
    example: "构建科学的绩效管理体系，强化绩效结果与干部使用、薪酬分配的挂钩机制"
    notes: 绩效管理须连接战略目标和个人行为，避免指标设计失真

  - id: TT-MME-111
    category: mme_term
    domain: 综合管理能力域
    term: 综合保障管理
    definition: 综合管理能力域的子域，评估企业在行政后勤、安全保卫、车辆管理等综合保障职能方面的规范化程度。
    context: 企业运营支撑的综合性管理职能。
    example: "整合优化综合保障管理职能，提升服务内部客户的效率和质量"
    notes: 综合保障管理须防止管理粗放、资源浪费

  - id: TT-MME-112
    category: mme_term
    domain: 综合管理能力域
    term: 创新管理
    definition: 综合管理能力域的子域，评估企业建立的推动管理创新、鼓励员工创新建议、推广创新成果的机制完善程度。
    context: 持续改进和企业活力的重要管理职能。
    example: "建立管理创新激励机制，鼓励全员参与管理改进，推广内部最佳实践"
    notes: 管理创新须区别于技术研发创新，聚焦管理流程和工具的改进

# ===== 卷烟厂管理能力域 =====

  - id: TT-MME-113
    category: mme_term
    domain: 卷烟厂管理能力域
    term: 卷烟厂管理能力域
    definition: 管理成熟度评价体系中，专门针对卷烟厂（制造单元）设立的综合性评价模块，覆盖工厂生产管理、质量管理、设备管理、安全环保和员工管理等核心管理职能。
    context: 工业企业中直接生产单元的专项评价维度，是生产制造能力域的细化补充。
    example: "卷烟厂管理能力域评价深入生产一线，综合评估工厂级管理水平"
    notes: 卷烟厂评价是对工业企业评价的向下延伸，与公司层评价形成互补

  - id: TT-MME-114
    category: mme_term
    domain: 卷烟厂管理能力域
    term: 工厂生产运营管理
    definition: 卷烟厂能力域的子域，评估工厂在日常生产组织、作业标准化、异常处理机制方面的规范化程度和运营效率。
    context: 卷烟厂核心运营管理职能的综合评估。
    example: "优化工厂生产运营管理，推行标准化作业，提升日常生产的稳定性"
    notes: 生产运营规范化是提升产品品质一致性的基础

  - id: TT-MME-115
    category: mme_term
    domain: 卷烟厂管理能力域
    term: 工厂质量管理
    definition: 卷烟厂能力域的子域，评估工厂在原料检验、工序在线质量监控、成品检验和质量异常处理方面的执行规范性和有效性。
    context: 卷烟厂质量保障的关键职能。
    example: "强化工厂质量管理，建立多层次质量防护体系，确保出厂产品全部达标"
    notes: 工厂质量管理须与公司质量管理体系一体运作

  - id: TT-MME-116
    category: mme_term
    domain: 卷烟厂管理能力域
    term: 设备点检与维护管理
    definition: 卷烟厂能力域的子域，评估工厂在设备日常点检、计划性维护、故障快速响应和备件管理方面的规范化执行情况。
    context: 设备可靠性保障的一线执行管理。
    example: "严格执行设备点检与维护管理制度，将设备故障率控制在行业先进水平"
    notes: 设备点检须落实到班组层面，实现全员设备管理

  - id: TT-MME-117
    category: mme_term
    domain: 卷烟厂管理能力域
    term: 安全生产现场管理
    definition: 卷烟厂能力域的子域，评估工厂在生产现场安全操作规程执行、危险源识别管控和安全隐患排查方面的一线管理水平。
    context: 生产安全的现场管理职能。
    example: "深化安全生产现场管理，强化班组级安全管理责任，消灭安全隐患于萌芽"
    notes: 现场安全管理须将制度转化为操作层面的具体规程

  - id: TT-MME-118
    category: mme_term
    domain: 卷烟厂管理能力域
    term: 环境保护现场管理
    definition: 卷烟厂能力域的子域，评估工厂在废气排放控制、废水处理、固废分类处置等环保设施运营和合规管理方面的规范性。
    context: 工厂层面的环保合规管理职能。
    example: "加强环境保护现场管理，确保各环保设施正常运行，排放指标持续达标"
    notes: 环保设施须有专人负责日常运维，建立运行记录台账

  - id: TT-MME-119
    category: mme_term
    domain: 卷烟厂管理能力域
    term: 班组管理
    definition: 卷烟厂能力域的子域，评估工厂在班组建设、班组长培养、班组绩效管理和班组创新活动方面的规范化程度。
    context: 卷烟厂管理水平的基层基础。
    example: "深化班组建设，培育一批高素质班组长，以过硬的班组管理支撑工厂高质量运转"
    notes: 班组是现场管理的基本单元，班组管理水平直接反映工厂管理的底层能力

  - id: TT-MME-120
    category: mme_term
    domain: 卷烟厂管理能力域
    term: 员工技能管理
    definition: 卷烟厂能力域的子域，评估工厂在员工岗位技能标准制定、技能培训、技能鉴定和高技能人才培育方面的系统化程度。
    context: 工厂核心制造能力的人才基础。
    example: "完善员工技能管理体系，建立多级技能晋升通道，提升操作人员技能水平"
    notes: 高技能工人是支撑制造质量的关键人力资源

  - id: TT-MME-121
    category: mme_term
    domain: 卷烟厂管理能力域
    term: 5S管理
    definition: 卷烟厂能力域的子域，评估工厂在整理（Seiri）、整顿（Seiton）、清扫（Seiso）、清洁（Seiketsu）、素养（Shitsuke）方面的日常执行水平。
    context: 工厂现场管理规范化的基础性评价指标。
    example: "深化5S管理，打造整洁有序的生产现场环境，以良好的现场管理促进品质提升"
    notes: 5S是工厂现场管理的基础，也是精益生产的起点

  - id: TT-MME-122
    category: mme_term
    domain: 卷烟厂管理能力域
    term: 工厂能耗管理
    definition: 卷烟厂能力域的子域，评估工厂在分项能耗计量、用能分析、节能措施实施和单箱能耗控制方面的精细化管理水平。
    context: 生产制造降本增效和绿色发展的直接体现。
    example: "推进工厂能耗精细化管理，建立班组能耗核算机制，推动全员节能"
    notes: 单箱综合能耗须与行业标杆比较，持续推动降低

  - id: TT-MME-123
    category: mme_term
    domain: 卷烟厂管理能力域
    term: 烟丝质量管理
    definition: 卷烟厂能力域的子域，评估工厂在制丝工序的原料准备、工艺参数控制、烟丝质量检测和品质调整方面的精细化程度。
    context: 卷烟产品感官质量的直接决定因素。
    example: "加强烟丝质量管理，建立烟丝关键品质指标的实时监控和预警机制"
    notes: 烟丝质量的稳定性是品牌产品品质一致性的核心保障

  - id: TT-MME-124
    category: mme_term
    domain: 卷烟厂管理能力域
    term: 卷包质量管理
    definition: 卷烟厂能力域的子域，评估工厂在卷烟成型、过滤嘴接装、包装工序的质量在线监控和快速响应方面的管理规范性。
    context: 卷烟外观品质和物理指标合格率的保障管理。
    example: "加强卷包质量管理，推行在线视觉检测技术，实现外观缺陷零流出"
    notes: 卷包工序是决定成品外观和规格一致性的关键工序

  - id: TT-MME-125
    category: mme_term
    domain: 卷烟厂管理能力域
    term: 物料管控
    definition: 卷烟厂能力域的子域，评估工厂在烟叶、烟丝、辅材等生产物料的领用管控、消耗核算和节约管理方面的精细化程度。
    context: 生产成本管控的现场管理职能。
    example: "完善物料管控机制，精准核算各工序物料消耗，推动降低单箱物料消耗"
    notes: 物料管控须建立到班组级的消耗核算体系

  - id: TT-MME-126
    category: mme_term
    domain: 卷烟厂管理能力域
    term: 工厂信息化应用
    definition: 卷烟厂能力域的子域，评估工厂在MES系统应用、设备数据采集、数字化看板使用等信息化工具在一线生产中的实际应用深度。
    context: 工厂数字化制造能力的现场评估。
    example: "深化工厂信息化应用，实现生产过程数据实时采集和可视化管理"
    notes: 信息化应用价值须通过操作人员使用便利性和管理决策支持效果来体现

  - id: TT-MME-127
