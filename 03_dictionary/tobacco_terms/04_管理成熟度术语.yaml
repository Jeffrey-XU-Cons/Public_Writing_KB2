    term: 库存管理与动态平衡
    definition: 原料保障能力域的子域，评估企业在原料库存监控、安全库存管理、库存结构优化方面的精细化管理水平。
    context: 原料供应风险防范和资金占用优化的管理职能。
    example: "建立原料库存动态监控平台，实现库存结构、品质和资金占用的可视化管理"
    notes: 库存管理须在保障供应安全与降低资金占用之间寻找最优平衡

  - id: TT-MME-047
    category: mme_term
    domain: 原料保障管理能力域
    term: 配方原料保障
    definition: 原料保障能力域的子域，评估企业确保重点品牌配方所需特定产地和等级烟叶稳定供应的能力，包括原料产地合作和备用方案建设。
    context: 品牌品质一致性的原料基础保障。
