# 烟草行业术语库 - 组织术语
# 生成日期：2026-03-15
# 覆盖范围：行业管理体制、评价体系相关组织、行业特色机构

meta:
  version: "1.0"
  category: org_term
  total_count: 35

terms:

  # ===== 行业管理体制类 =====

  - id: TT-ORG-001
    category: org_term
    term: "国家烟草专卖局"
    full_form: "国家烟草专卖局"
    abbreviation: "国家局"
    definition: |
      国务院直属机构，依法对全国烟草专卖工作实施统一领导和管理，
      同时以中国烟草总公司名义承担企业管理职能，实行政企合一体制。
      负责制定烟草行业发展政策、战略规划，监督管理烟草专卖工作。
    context: "行业方针政策发布、重大决策部署、向上级汇报时使用"
    example: "认真贯彻落实国家局党组决策部署，确保行业各项工作有序推进。"
    source: "烟草行业管理体制"

  - id: TT-ORG-002
    category: org_term
    term: "中国烟草总公司"
    full_form: "中国烟草总公司"
    abbreviation: "中烟总公司/总公司"
    definition: |
      以国家烟草专卖局名义承担行政管理职能的同时，以中国烟草总公司
      名义对全国烟草行业实施统一经营管理。是烟草行业的最高经营管理机构，
      负责统筹全行业生产经营和资源配置。
    context: "经营管理层面文件、行业内部汇报"
    example: "按照总公司统一部署，积极推进行业各项重点工作。"
    source: "烟草行业管理体制"

  - id: TT-ORG-003
    category: org_term
    term: "统一领导、垂直管理、专卖专营"
    full_form: "统一领导、垂直管理、专卖专营"
    abbreviation: null
    definition: |
      烟草行业的基本管理体制。"统一领导"指国家烟草专卖局对全行业统一领导；
      "垂直管理"指上下级之间形成垂直管理关系，地方烟草机构对同级地方政府
      不负责，只对上级烟草机构负责；"专卖专营"指烟草实行专卖制度，
      由国家统一经营管理。
    context: "描述行业体制特点、政策表述、向政府机关汇报时使用"
    example: "烟草行业实行统一领导、垂直管理、专卖专营的体制，确保行业规范有序运行。"
    source: "烟草行业管理体制"

  - id: TT-ORG-004
    category: org_term
    term: "工业公司"
    full_form: "XX中烟工业有限责任公司"
    abbreviation: "XX中烟/工业公司"
    definition: |
      烟草行业的生产制造主体，承担卷烟及新型烟草产品的研发、生产、品牌运营等职能。
      各省（区、市）一般设一家工业公司（中烟公司），直属国家局（总公司）管理。
      典型如：湖南中烟工业有限责任公司、云南中烟工业有限责任公司等。
    context: "工商协同文件、行业内部报告、生产经营汇报"
    example: "积极推动工业公司与商业公司深化协同，实现产销一体化运营。"
    source: "烟草行业管理体制"

  - id: TT-ORG-005
    category: org_term
    term: "商业公司"
    full_form: "XX省烟草专卖局（公司）"
    abbreviation: "省局/商业公司"
    definition: |
      烟草行业的市场流通主体，承担卷烟批发销售、物流配送、市场管理、
      终端维护等职能。一般实行"局、公司合一"体制，即省（区、市）烟草
      专卖局与省（区、市）烟草公司一套班子、两块牌子。
    context: "工商协同文件、市场营销汇报、物流管理报告"
    example: "商业公司聚焦市场一线，强化终端维护和客户服务，切实提升客户满意度。"
    source: "烟草行业管理体制"

  - id: TT-ORG-006
    category: org_term
    term: "卷烟厂"
    full_form: "XX卷烟厂"
    abbreviation: "厂"
    definition: |
      工业公司下属的生产加工实体，是卷烟生产的基本单元，承担卷烟制丝、
      卷包等生产加工任务。部分大型工业公司拥有多个卷烟厂。
      卷烟厂既有行政管理属性，也有独立的生产经营核算功能。
    context: "生产制造汇报、质量管理文件、厂级管理成熟度评价"
    example: "各卷烟厂要严格落实质量管控要求，确保产品质量稳定达标。"
    source: "烟草行业管理体制"

  - id: TT-ORG-007
    category: org_term
    term: "工商分开"
    full_form: "烟草工商分开"
    abbreviation: null
    definition: |
      烟草行业工业与商业分开管理的体制安排。工业公司负责产品研发生产，
      商业公司负责市场销售流通，双方在职能定位上明确区分，
      防止利益冲突，规范市场秩序。
    context: "行业改革文件、体制机制说明"
    example: "进一步落实工商分开要求，明确各自职责边界，规范工商关系。"
    source: "烟草行业管理体制"

  - id: TT-ORG-008
    category: org_term
    term: "工商协同"
    full_form: "工商协同（工业公司与商业公司协同）"
    abbreviation: null
    definition: |
      在工商分开的前提下，工业公司与商业公司在品牌推广、市场开发、
      产品调拨、信息共享等方面开展深度协作，实现优势互补，
      共同服务卷烟市场健康发展。是行业的重要运营机制。
    context: "市场营销文件、行业汇报、工商协同推进方案"
    example: "深化工商协同机制，实现产销信息共享，合力推动品牌做大做强。"
    source: "烟草行业管理体制"

  - id: TT-ORG-009
    category: org_term
    term: "行业党委"
    full_form: "中国烟草总公司党委"
    abbreviation: "行业党委"
    definition: |
      烟草行业最高党组织，设在中国烟草总公司，负责对全行业党的建设
      实施统一领导，研究审定行业重大事项，推进行业党建与生产经营深度融合。
    context: "党建工作文件、重大决策部署表述"
    example: "行业党委深入推进党建与生产经营融合，充分发挥党组织战斗堡垒作用。"
    source: "烟草行业管理体制"

  - id: TT-ORG-010
    category: org_term
    term: "局党组"
    full_form: "国家烟草专卖局党组"
    abbreviation: "局党组"
    definition: |
      国家烟草专卖局内部设立的党的领导机构，负责贯彻落实党中央决策部署，
      研究审定局重大事项，对行业党的工作负总责。
    context: "政治表述、重大决策部署文件"
    example: "局党组深入学习贯彻党的二十届三中全会精神，部署行业改革重点任务。"
    source: "烟草行业管理体制"

  - id: TT-ORG-011
    category: org_term
    term: "省级局（公司）"
    full_form: "XX省（自治区、直辖市）烟草专卖局（公司）"
    abbreviation: "省局（公司）"
    definition: |
      省级烟草专卖行政管理和经营管理机构，实行局、公司合一体制。
      承担本辖区烟草专卖行政执法、市场监管、卷烟批发销售、物流配送等职能，
      受国家局（总公司）垂直管理。
    context: "省级层面文件、汇报、工作报告"
    example: "省局（公司）要切实履行主体责任，抓好各项任务落实。"
    source: "烟草行业管理体制"

  - id: TT-ORG-012
    category: org_term
    term: "地市级局（公司）"
    full_form: "XX市烟草专卖局（公司）"
    abbreviation: "地市局（公司）"
    definition: |
      地市级烟草专卖行政管理和经营管理机构，承担所辖区域的烟草专卖
      行政管理和卷烟批发销售工作，受省级局（公司）垂直管理。
    context: "地市层面工作文件、基层汇报"
    example: "各地市局（公司）要结合本地实际，扎实推进各项工作落地见效。"
    source: "烟草行业管理体制"

  - id: TT-ORG-013
    category: org_term
    term: "零售客户"
    full_form: "卷烟零售客户"
    abbreviation: "零售户/客户"
    definition: |
      持有烟草专卖零售许可证，经营卷烟零售业务的个体工商户或单位。
      是烟草商业公司的直接服务对象，也是卷烟终端销售的主体。
    context: "市场营销、客户管理、终端维护类文件"
    example: "强化零售客户服务，提升客户满意度，夯实市场基础。"
    source: "烟草行业管理体制"

  # ===== 评价体系相关组织 =====

  - id: TT-ORG-014
    category: org_term
    term: "管理成熟度评价委员会"
    full_form: "烟草行业管理成熟度评价委员会"
    abbreviation: "评价委员会"
    definition: |
      烟草行业管理成熟度评价工作的领导与组织机构，负责统筹推进评价体系建设，
      审定评价规则和标准，组织开展各类评价活动，对评价结果进行认定。
    context: "管理成熟度评价文件、评价工作报告"
    example: "评价委员会组织开展年度管理成熟度评价，对达标单位予以认定。"
    source: "烟草行业管理成熟度评价体系"

  - id: TT-ORG-015
    category: org_term
    term: "评价工作组"
    full_form: "管理成熟度评价工作组"
    abbreviation: "评价工作组"
    definition: |
      具体承担管理成熟度评价工作的执行组织，由行业专家和管理人员组成，
      负责制定评价方案、开展现场评审、出具评价报告等工作。
    context: "评价实施阶段的文件、评价工作方案"
    example: "评价工作组按照评价规则，对各单位的管理成熟度进行系统评审。"
    source: "烟草行业管理成熟度评价体系"

  - id: TT-ORG-016
    category: org_term
    term: "能力域负责人"
    full_form: "管理成熟度评价能力域负责人"
    abbreviation: "域负责人"
    definition: |
      在管理成熟度评价体系中，负责某一能力域（如技术研发、生产制造等）
      评价工作的专项负责人，承担本域评价规则解释、评审实施和结果认定工作。
    context: "评价工作分工文件、评价报告"
    example: "各能力域负责人要深入理解评价标准，确保评价工作客观公正。"
    source: "烟草行业管理成熟度评价体系"

  - id: TT-ORG-017
    category: org_term
    term: "第三方评价机构"
    full_form: "第三方独立评价机构"
    abbreviation: "第三方机构"
    definition: |
      受托对烟草企业管理成熟度进行独立评价的外部专业机构，
      不参与被评价单位的生产经营活动，能够提供客观中立的评价意见，
      增强评价结果的公信力。
    context: "管理成熟度评价、引入外部评估的文件"
    example: "引入第三方评价机构，对公司管理体系进行客观评估，查找差距短板。"
    source: "烟草行业管理成熟度评价体系"

  - id: TT-ORG-018
    category: org_term
    term: "评审专家"
    full_form: "管理成熟度评审专家"
    abbreviation: "评审专家"
    definition: |
      参与烟草行业管理成熟度评价工作的专业人员，具备相关专业背景和评价资质，
      负责对被评价单位的管理能力和实践水平进行专业判断。
    context: "评价工作相关文件、评审现场"
    example: "由行业评审专家组成评审组，对各单位开展现场评审。"
    source: "烟草行业管理成熟度评价体系"

  # ===== 行业特色机构 =====

  - id: TT-ORG-019
    category: org_term
    term: "烟叶生产基地"
    full_form: "烟草行业烟叶生产基地"
    abbreviation: "基地/基地单位"
    definition: |
      烟草工业公司为保障优质原料稳定供应，与特定烟叶产区（烟农和地方烟草商业）
      建立合作关系形成的原料生产基地。实行"三全基地"建设模式（全面、全程、全员），
      工业公司深度参与基地的种植技术指导、质量标准制定和收购评级工作。
    context: "原料保障报告、基地建设工作汇报"
    example: "深化烟叶生产基地建设，推进工商深度协同，持续提升原料适配率。"
    source: "烟草行业原料保障体系"

  - id: TT-ORG-020
    category: org_term
    term: "基地单位"
    full_form: "烟叶生产基地单位（商业公司）"
    abbreviation: "基地单位"
    definition: |
      在烟叶生产基地建设中，承担原料生产组织和管理职能的烟草商业公司（通常为产区省级或地市级局）。
      作为工业公司的基地管理对象，负责具体实施基地烟叶种植、收购、调拨等工作。
    context: "原料基地协同文件、基地建设汇报"
    example: "积极推进与基地单位的深度协同，共同提升基地烟叶质量水平。"
    source: "烟草行业原料保障体系"

  - id: TT-ORG-021
    category: org_term
    term: "行业技术中心"
    full_form: "烟草行业（企业）技术中心"
    abbreviation: "技术中心"
    definition: |
      烟草行业内设立的技术研发和创新支撑机构，承担产品研发、工艺技术研究、
      质量检测等职能。分为行业级技术中心（国家局认定）和企业级技术中心，
      是烟草科技创新体系的核心载体。
    context: "科技创新文件、研发管理汇报"
    example: "充分发挥技术中心的创新引领作用，加大关键核心技术攻关力度。"
    source: "烟草行业科技创新体系"

  - id: TT-ORG-022
    category: org_term
    term: "行业工程技术研究中心"
    full_form: "烟草行业工程技术研究中心"
    abbreviation: "工程技术研究中心/工程中心"
    definition: |
      由国家局（总公司）认定，依托骨干企业或科研机构建立的专项技术研究中心，
      聚焦行业重大技术方向开展协同攻关。侧重技术工程化和产业化应用，
      与技术中心形成互补的行业科技创新架构。
    context: "科技创新体系建设、行业技术合作文件"
    example: "依托行业工程技术研究中心，加快新技术向产业化应用的转化。"
    source: "烟草行业科技创新体系"

  - id: TT-ORG-023
    category: org_term
    term: "技术创新联合体"
    full_form: "烟草技术创新联合体"
    abbreviation: "创新联合体"
    definition: |
      由工业企业牵头，联合商业公司、科研院所、高等院校等多方主体，
      围绕共同技术目标组建的协同创新组织，旨在集聚行业内外创新资源，
      突破重大关键技术。
    context: "科技创新、产学研合作类文件"
    example: "组建技术创新联合体，集中力量开展加热卷烟核心技术协同攻关。"
    source: "烟草行业科技创新体系"

  - id: TT-ORG-024
    category: org_term
    term: "烟草科学研究院"
    full_form: "中国烟草总公司郑州烟草研究院/各省级烟草科研院所"
    abbreviation: "烟草科研院所/郑烟院"
    definition: |
      承担全行业基础性、前沿性科学研究的专门科研机构。
      郑州烟草研究院是行业最高科研机构，各工业公司也设有企业技术中心或研究院，
      共同构成行业科技创新体系。
    context: "基础研究、科研合作文件"
    example: "加强与烟草科研院所合作，推动前沿技术成果向产业化方向转化。"
    source: "烟草行业科技创新体系"

  - id: TT-ORG-025
    category: org_term
    term: "客户经理"
    full_form: "烟草商业公司客户经理"
    abbreviation: "客户经理"
    definition: |
      烟草商业公司面向零售客户提供服务的一线销售和服务人员，
      负责维护客户关系、开展市场调查、落实营销政策、提升客户满意度等工作，
      是商业公司连接市场终端的重要纽带。
    context: "市场营销、客户管理、终端维护类文件"
    example: "充分发挥客户经理一线作用，精准把握市场需求变化，及时反馈市场信息。"
    source: "烟草商业市场营销体系"

  - id: TT-ORG-026
    category: org_term
    term: "品牌维护员"
    full_form: "卷烟品牌维护员"
    abbreviation: "品牌维护员/品维员"
    definition: |
      由工业公司派驻或委托、负责在终端市场开展品牌推广、陈列维护、
      消费者互动等工作的人员，直接面向零售终端，配合商业公司开展品牌营销活动。
    context: "市场营销、工商协同、品牌推广类文件"
    example: "充分发挥品牌维护员的终端触达优势，强化品牌形象在零售终端的展示。"
    source: "烟草工商协同营销体系"

  - id: TT-ORG-027
    category: org_term
    term: "调度中心"
    full_form: "烟草行业卷烟调度中心/物流调度中心"
    abbreviation: "调度中心"
    definition: |
      负责卷烟调拨、物流配送统一调度的职能部门或机构，
      承担卷烟产品从生产到销售的全链条流通调度管理工作，
      是"统一大物流"体系的核心运营单元。
    context: "物流管理、卷烟调拨文件"
    example: "调度中心统筹优化配送资源，提升全链条物流运营效率。"
    source: "烟草行业物流管理体系"

  - id: TT-ORG-028
    category: org_term
    term: "工商联席会"
    full_form: "工商协同联席会议"
    abbreviation: "工商联席会"
    definition: |
      工业公司与商业公司定期召开的协调会议机制，用于沟通市场信息、
      协调产销计划、解决协同问题，是深化工商协同的重要制度安排。
    context: "工商协同、营销管理类文件"
    example: "建立定期工商联席会制度，及时沟通市场变化，协调产销供需平衡。"
    source: "烟草行业工商协同机制"

  - id: TT-ORG-029
    category: org_term
    term: "派驻机构"
    full_form: "工业公司在市场区域的派驻机构"
    abbreviation: "派驻机构/驻地机构"
    definition: |
      工业公司在重要市场区域设立的常驻营销服务机构，承担本品牌在当地的
      市场开发、品牌推广、工商协同等工作，是工业公司深入市场一线的前沿阵地。
    context: "市场营销、工商协同文件"
    example: "充分发挥派驻机构的纽带作用，推动工商协同向纵深发展。"
    source: "烟草工商协同营销体系"

  - id: TT-ORG-030
    category: org_term
    term: "行业监管部门"
    full_form: "烟草行业监管机构（含国家局监管职能部门）"
    abbreviation: "监管部门"
    definition: |
      承担烟草行业规范管理和监督检查职能的部门，包括国家局相关司局和
      省级局监管职能部门，负责行业合规管理、穿透式监管、市场专卖执法等工作。
    context: "监督管理、合规治理类文件"
    example: "监管部门加强对关键业务环节的穿透式监管，有效防控行业经营风险。"
    source: "烟草行业监管体制"

  - id: TT-ORG-031
    category: org_term
    term: "物资供应商"
    full_form: "烟草行业物资材料供应商"
    abbreviation: "供应商"
    definition: |
      向烟草企业提供卷烟纸、接装纸、滤棒成型纸、香精香料等原辅材料的外部企业。
      烟草企业通过集中采购、供应商评价等机制对供应商进行管理，
      确保材料质量稳定达标。
    context: "物资保障、采购管理类文件"
    example: "加强对外部供应商的质量管控，确保原辅材料质量持续满足生产需求。"
    source: "烟草行业物资保障体系"

  - id: TT-ORG-032
    category: org_term
    term: "集采机构"
    full_form: "烟草行业集中采购机构"
    abbreviation: "集采机构"
    definition: |
      承担烟草行业集中采购职能的专门机构，通过统一组织采购降低成本、
      规范采购行为，是烟草采购交易监管改革的重要载体。
    context: "采购管理、成本控制类文件"
    example: "充分发挥集采机构的规模优势，持续提升采购性价比。"
    source: "烟草行业采购管理体制"

  - id: TT-ORG-033
    category: org_term
    term: "能源管控中心"
    full_form: "卷烟工厂能源管控中心"
    abbreviation: "能源中心/能管中心"
    definition: |
      卷烟厂设立的专门负责能源统一监测、调度和管理的功能中心，
      通过实时监控各车间能耗数据，优化能源使用，推进节能降耗，
      是绿色工厂建设的重要支撑。
    context: "生产制造、绿色发展、节能减排类文件"
    example: "建立能源管控中心，实现全厂能源数据集中监控，持续降低单箱能耗。"
    source: "烟草行业生产制造管理体系"

  - id: TT-ORG-034
    category: org_term
    term: "打叶复烤企业"
    full_form: "烟叶打叶复烤加工企业"
    abbreviation: "复烤企业/复烤厂"
    definition: |
      对收购后的原烟进行打叶复烤加工，生产片烟产品，为卷烟工厂提供标准化
      烟叶原料的加工企业。是烟叶原料从初加工向精加工的关键环节。
    context: "原料保障、供应链管理类文件"
    example: "加强与打叶复烤企业的协同配合，提升原料加工精细化水平。"
    source: "烟草行业原料保障体系"

  - id: TT-ORG-035
    category: org_term
    term: "行业联合体"
    full_form: "烟草行业重大项目联合建设单位/行业企业联合体"
    abbreviation: "联合体"
    definition: |
      为完成行业重大项目或技术攻关，由多家烟草企业共同组成的合作联合体，
      资源共享、责任共担，共同推进特定目标的实现。
    context: "重大科技攻关、行业重点项目文件"
    example: "通过联合体模式，集聚全行业资源，加快重大科技成果转化进程。"
    source: "烟草行业科技创新与协同机制"
