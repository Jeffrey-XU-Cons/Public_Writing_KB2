content: |
  # 烟草行业公文用语词典
  # 建设时间：2026-03-17
  # 版本：1.0

  ---

  ## 简介

  本文档收集烟草行业公文写作中的常用用语、禁用词、高频易错搭配等，为提高公文质量提供参考。

  ---

  ## 第一部分：常用公文用语库（COU）

  ### COU-001 行文开头常用表述

  | 序号 | 用语 | 适用场景 | 说明 |
  |------|------|--------|------|
  | COU-001-001 | 根据...精神 | 通知、方案 | 强调上级指示 |
  | COU-001-002 | 为进一步... | 通知、函 | 说明目的 |
  | COU-001-003 | 针对... | 报告、总结 | 针对性表述 |
  | COU-001-004 | 按照要求 | 各类文件 | 体现执行力 |

  ### COU-002 问题表述用语

  | 序号 | 用语 | 示例 | 说明 |
  |------|------|------|------|
  | COU-002-001 | 存在的主要问题 | 当前工作中存在的主要问题有... | 标准表述 |
  | COU-002-002 | 薄弱环节 | 管理中仍存在薄弱环节 | 指出不足 |
  | COU-002-003 | 亟待解决 | 以下问题亟待解决 | 强调紧迫性 |

  ### COU-003 成绩表述用语

  | 序号 | 用语 | 示例 | 说明 |
  |------|------|------|------|
  | COU-003-001 | 取得显著成效 | 各项工作取得显著成效 | 通用表述 |
  | COU-003-002 | 率先... | 率先建立... | 强调领先性 |
  | COU-003-003 | 实现...目标 | 圆满实现年度目标 | 总结性表述 |

  ---

  ## 第二部分：禁用词表（PW）

  ### 类别一：法律与权力用语

  | 序号 | 禁用词 | 替代表述 | 说明 |
  |------|--------|--------|------|
  | PW-001 | 必须（在法律规定时） | 应当、应该 | 除非明确法律规定 |
  | PW-002 | 严格禁止 | 禁止、不得 | 表述过于绝对 |
  | PW-003 | 违法犯罪 | 违反法律规定 | 用词更专业 |

  ### 类别二：价值判断用语

  | 序号 | 禁用词 | 替代表述 | 说明 |
  |------|--------|--------|------|
  | PW-004 | 最好的 | 较好的、更好的 | 避免绝对化 |
  | PW-005 | 完全 | 基本、较为 | 政府文件用词 |
  | PW-006 | 一定要 | 应当、应该 | 更加规范 |

  ### 类别三：俗语与非规范用语

  | 序号 | 禁用词 | 替代表述 | 说明 |
  |------|--------|--------|------|
  | PW-007 | 要不得 | 不适当、不可行 | 非规范用语 |
  | PW-008 | 虚拟语气词 | 删除 | 公文禁忌 |
  | PW-009 | 网络用语 | 规范表述 | 保持庄重 |

  ---

  ## 第三部分：高频易错搭配表（MM）

  ### MM-001 常见搭配错误

  | 序号 | 错误搭配 | 正确搭配 | 例句 | 说明 |
  |------|---------|---------|------|------|
  | MM-001-001 | 制定规划 | 编制规划 | 编制十四五规划 | 动词选择错误 |
  | MM-001-002 | 落实...任务 | 完成...任务 | 完成全年任务 | 用词不当 |
  | MM-001-003 | 加强...意识 | 增强...意识 | 增强安全意识 | 动词不搭配 |
  | MM-001-004 | 深化改革 | 推进改革 | 推进体制机制改革 | 语境使用 |

  ### MM-002 量词使用错误

  | 序号 | 错误 | 正确 | 说明 |
  |------|------|------|------|
  | MM-002-001 | 一项规划 | 一个规划 | 规划用"个" |
  | MM-002-002 | 召开一个会议 | 召开一次会议 | 会议用"次" |
  | MM-002-003 | 进行一次改革 | 推进一项改革 | 改革用"项" |

  ---

  ## 第四部分：高频套话替换表（CP）

  ### CP-001 开头常见套话

  | 序号 | 原套话 | 建议修改 | 原因 |
  |------|--------|---------|------|
  | CP-001-001 | 当前形势发生了新变化 | 面对新变化、新形势 | 更加简洁 |
  | CP-001-002 | 以...为指导 | 以...为引领 | 更加文雅 |
  | CP-001-003 | 新的历史时期 | 新时代 | 表述更准确 |

  ### CP-002 结尾常见套话

  | 序号 | 原套话 | 建议修改 | 原因 |
  |------|--------|---------|------|
  | CP-002-001 | 本决定自发布之日起执行 | 自发布之日起施行 | 规范化表述 |
  | CP-002-002 | 各部门要认真落实 | 删除（已在前文说明） | 避免重复 |
  | CP-002-003 | 特此通知 | 因执行情况，删除或保留 | 视文种而定 |

  ---

  ## 第五部分：烟草行业专业术语库（TT）

  ### TT-001 管理相关

  | 序号 | 术语 | 解释 | 常见错误 |
  |------|------|------|---------|
  | TT-001-001 | 管理诊断 | 对企业管理状况的系统评估 | 误用"管理诊疗" |
  | TT-001-002 | 成熟度评价 | 按标准对企业成熟度进行评估 | 误用"成熟度评估" |
  | TT-001-003 | 对标共建 | 与先进单位比较学习 | 误用"对标建设" |
  | TT-001-004 | 全要素管理 | 涵盖所有管理要素的综合管理 | 误用"全方位管理" |

  ### TT-002 物流相关

  | 序号 | 术语 | 解释 | 常见错误 |
  |------|------|------|---------|
  | TT-002-001 | 物流一体化 | 采购、加工、配送等环节一体化运作 | 误用"物流整合" |
  | TT-002-002 | 智慧物流 | 运用信息技术的物流系统 | 误用"智能物流" |
  | TT-002-003 | 精益管理 | 消除浪费的管理方法 | 误用"精细管理" |

  ### TT-003 政策相关

  | 序号 | 术语 | 解释 | 常见错误 |
  |------|------|------|---------|
  | TT-003-001 | 高质量发展 | 符合新发展理念的发展方式 | 误用"高速度发展" |
  | TT-003-002 | 协同配套 | 各要素相互协调配合 | 误用"协同搭配" |
  | TT-003-003 | 体系建设 | 系统完整的建设方案 | 误用"体系建立" |

  ---

  ## 使用说明

  1. **常用用语库（COU）**：在公文写作时参考，遵循规范用语
  2. **禁用词表（PW）**：提高警觉，避免使用
  3. **搭配表（MM）**：检查动词与宾语是否搭配得当
  4. **套话替换表（CP）**：寻找更加精准、生动的表述
  5. **专业术语库（TT）**：确保行业术语使用准确

  ---

  *词典持续更新中... 最后更新：2026-03-16*

