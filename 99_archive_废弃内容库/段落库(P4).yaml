- file_title: 2019年烟草 行业工作会 张建民
  category: 待分类
  file_path: 00_raw_materials/个人历史交付物/待分类/2019年烟草 行业工作会 张建民.md
  paragraph_type: 开头段落
  paragraph_index: 1
  content: 这次会议的主要任务是，深入学习贯彻习近平新时代中国特色社会主义思想和党的十九大精神，认真贯彻落实中央经济工作会议精神，传达学习贯彻国务院领导同志批示精神，按照工信部党组的要求，总结2018年烟草工作，分析行业形势，部署2019年重点任务，研究建设现代化烟草经济体系、推动烟草行业高质量发展的实施意见。工信部党组对这次会议高度重视，下午部党组书记、部长苗圩同志将作重要讲话，工信部党组成员、驻部纪检监察组组长郭开朗同志到会指导，我们要认真抓好贯彻落实。下面，我代表国家局党组，讲三点意见。
  word_count: 243
  quality_score: A级
- file_title: 2019年烟草 行业工作会 张建民
  category: 待分类
  file_path: 00_raw_materials/个人历史交付物/待分类/2019年烟草 行业工作会 张建民.md
  paragraph_type: 结尾段落
  paragraph_index: 47
  content: 第五，关于《实施意见》的贯彻落实。这次会议征求大家的意见后，国家局党组将进一步修改完善并尽快印发《实施意见》，同时会进行责任分解和任务细化。行业各单位、各部门要结合自身实际，认真制定贯彻落实的具体方案、具体措施，排出时间表、路线图，明确主攻方向和实施路径，突出抓重点、补短板、强弱项，勇于解决自己遇到的困难和问题，努力在推动高质量发展上不断取得新进展。在贯彻落实过程中，必须坚持党的全面领导，自觉在思想上政治上行动上同以习近平同志为核心的党中央保持高度一致，主动同中央的要求对标对表，对得上的加紧推，对不上的及时改。要加强宣传引导，凝聚思想共识，营造良好氛围，形成行业上下齐心、左右协同、内外和谐、步调一致的强大工作合力。支持和鼓励工商企业发挥自身优势，在贯彻落实过程中建立新机制、尝试新办法、采取新举措，充分发挥主观能动性，创造新经验，争做新典型。各级领导干部要有“功成不必在我”和“功成必定有我”的历史担当，树立正确的政绩观，强化责任落实，加强督促检查，形成一级抓一级、层层抓落实的工作格局，确保各项目标任务和政策措施落地见效。
  word_count: 466
  quality_score: A级
