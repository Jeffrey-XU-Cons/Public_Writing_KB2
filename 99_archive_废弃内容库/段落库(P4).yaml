- file_title: 2020年段铁力  企管会领导讲话全文
  category: 讲话类
  file_path: 00_raw_materials/个人历史交付物/讲话类/2020年段铁力  企管会领导讲话全文(2020年11月19日).md
  paragraph_type: 关键段落(关键词段落)
  paragraph_index: 2
  content: 今年是全面建成小康社会和“十三五”收官之年，也是全面谋划“十四五”蓝图的关键一年。今年以来，行业各单位认真贯彻2020年全国烟草工作会议及2019年企业管理现场会议精神，全面贯彻新发展理念，准确把握高质量发展要求，统筹疫情防控和复工复产，全力以赴抗击疫情，认真落实行业高质量发展“1+6+2”政策体系，突出“六个转向”，聚焦“六大体系”，精益管理各项工作取得了积极进展和明显成效。
