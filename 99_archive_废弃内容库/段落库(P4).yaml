  content: 十三五期间，中国经济在国内外不确定性明显上升的复杂局面下稳中求进，取得了6%以上的经济增长。目前面临消费增速持续下滑，进出口增速大幅下降，虽然房地产开发投资保持坚韧，基建投资有所回升，但受民营经济为主体的制造业投资增速大幅下滑影响，总投资增速亦有所回落。服务业的比重持续上升，劳动力市场持续疲软，居民收入水平增速下降；总和生育率下降，老龄化问题严重，进一步限定未来经济增速。
