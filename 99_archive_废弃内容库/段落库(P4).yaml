- file_title: 贵州烟草商业高质量发展规划
  category: 规划类
  file_path: 00_raw_materials/个人历史交付物/规划类/贵州烟草商业高质量发展规划.md
  paragraph_type: 结尾段落
  paragraph_index: 73
  content: 以建设法治烟草为目标，坚持制度建设与法治监督融合， 法治宣传与法律服务同步，持续推进普法宣传教育、法规服务保障和法律风险防控三大体系建设，全面提升依法行政、依法管理、依法生产经营能力和水平。认真落实“三重一大”制度，严格执行党组（党委）会议、办公会议、董事会、“三项工作”管理委员会、预算管理委员会议事规则，提高民主决策、科学决策水平。围绕“抓好中央专项巡视整改始终是烟草行业的重大政治任务”的要求，抓好抓实2016年以来“两个专项治理”及国家局巡察检查发现的问题整改。推动“应招尽招”“真招实招”“办事公开民主管理同业务工作深入融合”三个保障机制的落地运行，防范规范管理各类风险。加快建设采购管理信息系统，提高采购管理信息化水平，加强规范管理队伍建设。加强审计监督，促进内部审计全覆
    盖，加强重点环节审计和政策执行跟踪审计，全面提升严格规范水平。
  word_count: 374
