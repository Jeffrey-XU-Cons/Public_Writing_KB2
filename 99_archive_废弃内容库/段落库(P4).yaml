- file_title: 湖南烟草商业企业卷烟配送智能调度模式研究2024.10.28
  category: 报告类
  file_path: 00_raw_materials/个人历史交付物/报告类/湖南烟草商业企业卷烟配送智能调度模式研究(精益课题结题报告)2024.10.28.md
  paragraph_type: 关键段落(关键词段落)
  paragraph_index: 2
  content: 近年来，中国烟草行业面临着日益严峻的市场环境和日益多样化的客户需求。《关于推进烟草行业智慧物流建设的指导意见》（中烟办〔2019〕168号）明确指出，建设高效灵活的智能配载模型和具备动态线路规划能力的智能配送调度模式，是提升卷烟配送质量和效率的关键研究方向。同时，《湖南烟草高质量发展提升核心竞争力方案》强调，全省系统应提高作业柔性，以订单量为依据，灵活调整物流作业方式，为零售客户提供多样化服务模式，探索“即访即配”服务，并逐步扩大服务范围。
  word_count: 222
  quality_score: A级
- file_title: 湖南烟草商业企业卷烟配送智能调度模式研究2024.10.28
  category: 报告类
  file_path: 00_raw_materials/个人历史交付物/报告类/湖南烟草商业企业卷烟配送智能调度模式研究(精益课题结题报告)2024.10.28.md
  paragraph_type: 关键段落(关键词段落)
  paragraph_index: 3
  content: 在此背景下，湖南省长株潭烟草物流有限责任公司（以下简称“长株潭烟草物流”）成立了精益课题小组，致力于探索“集约订单、统一调度、柔性分拣、滚动配送”的卷烟配送智能调度新模式，旨在破解分拣配送产能浪费、淡旺季不均衡、配送响应时间长及服务体验差等共性问题。调研发现，随着零售客户数量动态变化、区域分布不均衡以及配送量的淡旺季波动，全省地市级物流和区域物流在配送区域规划、分拣产能利用、配送效能及数字化服务等方面需要提升。
  word_count: 207
  quality_score: B级
