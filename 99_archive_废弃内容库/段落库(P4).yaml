  category: 报告类
  file_path: 00_raw_materials/个人历史交付物/报告类/管理诊断推动物流工作提质增效_河南中烟.md
  paragraph_type: 结尾段落
  paragraph_index: 19
  content: '限制。

    3.开展约束优化。

    通过衡量投入产出，改变辅料高架库库位大小以增加单个托盘承载量，需对辅料自

    动化库进行系统改造，消耗的人力物力成本过高，定义为不可改善的瓶颈。卷包车间现

    场空间主要是指在卷烟机和包装机之间可放置托盘的空间位置大小，在不移动卷烟机和

    包装机的前提下，通过优化托盘摆放方式和AGV 路线，能够有效提高空间利用率，定

    义为可改善的瓶颈。

    4.定位下游需求，将其作为改善目标。

    从卷包车间的实际需求出发，需求可分为减少关键辅料的要料频次、围绕上机适用

    性增强瓶颈辅料周转、建立通用材料换牌不退等，将卷烟纸、盒包装纸、条包装纸、接

    装纸和2种规格的收缩透明膜合计6 类辅料，确定为需要单托配送实现托盘联运辅料。

    5.与上游供应商建立协同，统一制定标准。

    统一外观尺寸标准。辅料供应商到货外观尺寸需满足长度为 1.18 米，宽度为0.98

    米浮动，高度为 1.03 米，上下浮动均不超过 0.02 米。统一单托数量标准。卷烟纸按

    宽度不同分为53 毫米、26.5 毫米、19 毫米3 种类型，分别为每托 80 盘、140 盘、

    196 盘，收缩透明膜按宽度不同分为120 毫米以下的小透明膜和 251 毫米以上的大透

    明膜，分别为每托84 盘和 24 盘，盒包装纸、条包装纸和接装纸因不同规格间差距较

    小实现了全规格统一，分别是每托12 万张2.4 万张、96 盘。

    进而实现辅料仓储作业到货即是标准托盘，入库即可投料生产，作业模式由“分装

    配盘”转化为“整托直入”，实现机械作业代替人工作业的转变，省去拆垛分装作业动

    作，极大减少人工参与，缩短了劳动时间，提高作业效率，降低质量风险。

    九、预期成效及推广建议

    （一）预期成效

    一是为常态化推进物流管理诊断提供了全方位的机制保障。课题立足物流业务实

    际，从“一体化、智慧化、绿色化”的现代物流建设需求出发，明确了提供系统思维、

