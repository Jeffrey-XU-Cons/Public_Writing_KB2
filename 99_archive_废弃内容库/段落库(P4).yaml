  paragraph_index: 2
  content: '一、诊断开展情况

    本次管理诊断通过访谈、资料查询、现场调查等方式，对雄安烟

    草物流工作进行了详细诊断。通过诊断，共发掘雄安物流工作改进机

    会 2 项。

    诊断时间:

    2023 年 6 月 7 日-2023 年 6 月 16 日。

    参与人员:

    省局物流处：黄欣、侯红娟、丁慧君。

    康达信公司：许金发。

    雄安烟草：市局领导、计划营销科科长、物流管理岗（兼）。

    二、改进机会

    （一）单箱物流成本

    【诊断发现】雄安物流费用是在保定单箱物流费用基础上增加

    10%，省局物流处对雄安考核指标中涉及精益物流、智慧物流等重点

    工作考核参照保定结果执行。物流费用分摊、上报导致雄安费用增加

    10%，实际全省物流费用开支中，并不存在保定收取的额外 10%费用。

    建议：雄安物流费用与合同费用脱轨，上报费用与保定保持一致。

    （二）扣除人工和折旧的单箱物流费用

    【诊断发现】雄安 2023 年 1 季度扣除人工和折旧的单箱物流费

    用 203.26 元/箱，同期 223.49 元/箱，单箱物流费用 203.26 元/箱，

    1'
