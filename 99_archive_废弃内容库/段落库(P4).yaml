  quality_score: A级
- file_title: 2020年段铁力  企管会领导讲话全文
  category: 讲话类
  file_path: 00_raw_materials/个人历史交付物/讲话类/2020年段铁力  企管会领导讲话全文(2020年11月19日).md
  paragraph_type: 开头段落
  paragraph_index: 1
  content: 这次会议的主要任务是，深入学习党的十九届五中全会精神，全面贯彻2020年烟草行业半年工作电视电话会议精神，认真落实行业高质量发展“1+6+2”政策体系和提升烟草行业软实力指导意见，总结2020年行业企业管理工作，学习借鉴山东工商及行业先进单位深入推进精益管理、提升企业核心竞争力的好经验、好做法，安排部署2021年行业企业管理工作任务，着力提升企业核心竞争力和行业软实力，全力推动高质量发展。下面，我讲三点意见。
  word_count: 206
  quality_score: A级
- file_title: 2020年段铁力  企管会领导讲话全文
  category: 讲话类
  file_path: 00_raw_materials/个人历史交付物/讲话类/2020年段铁力  企管会领导讲话全文(2020年11月19日).md
  paragraph_type: 结尾段落
  paragraph_index: 42
  content: 三要进一步加强企管人才的培养和储备。企管工作专业性强、综合素质要求高，需要大批具备较好的政策水平、专业知识、分析和沟通能力的复合型人才。对从事企管工作的同志，各级领导要多指导、多支持，为他们多提供培训、调研、交流的机会。从事企管工作的同志要不断增强使命感和责任感，广泛学习先进的管理理念、工具和方法，提高发现问题、分析问题和解决问题的能力。各级企业对业务素质高、责任心强的同志，要敢于压担子、为他们提供更大的成长空间；对于那些非常敬业、业务精通、素质较好的企管人员，要大胆重用，以此引导广大员工立足本职、加速成长；要注重青年人才培养，为企管工作提供更充足的后备力量。
  word_count: 283
  quality_score: B级
