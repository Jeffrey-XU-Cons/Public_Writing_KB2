  paragraph_type: 结尾段落
  paragraph_index: 14
  content: （四）着力强化队伍建设。管理成熟度评价对各部门、各单位都是一项陌生的工作，也没有这方面的专业人才，在实施工作中，难免遇到各种各样的问题。各编制小组高度重视，结合业务实际、强化信息共享，选配工作态度严谨、工作作风扎实、专业能力突出的业务骨干纳入编制小组。编制办公室要从思想转变、专业知识、能力提升三个方面入手，本着“缺什么、补什么，差什么、练什么”的原则，分期分批地进行业务培训，明确该干什么，细化怎样去干，全面提升人员业务素质，努力打造一支专业化、高效化的成熟度评价队伍，保障公司成熟度评价体系建设高水平、高质量、高效率推进。
