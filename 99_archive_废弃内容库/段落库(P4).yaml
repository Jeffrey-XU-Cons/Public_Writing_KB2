- file_title: 1 两支队伍建设一张纸工作法研究与应用 精益课题报告 获省一等奖
  category: 报告类
  file_path: 00_raw_materials/个人历史交付物/报告类/1-两支队伍建设一张纸工作法研究与应用-精益课题报告-获省一等奖.md
  paragraph_type: 开头段落
  paragraph_index: 1
  content: 当前烟草行业面临外部、内部双重压力，外部主要是宏观经济下行压力增大、经济增速换挡回落、禁烟控烟力度加大；内部主要是卷烟消费增量放缓、库存积压过剩，需求拐点临近。面临这一严峻形势，国家烟草专卖局在2013年提出了“精益管理做除法”、“降本提质增效”要求；河南省烟草专卖局（公司）在2016年提出了“精准、精细、求实”工作理念。
  word_count: 162
  quality_score: A级
- file_title: 1 两支队伍建设一张纸工作法研究与应用 精益课题报告 获省一等奖
  category: 报告类
  file_path: 00_raw_materials/个人历史交付物/报告类/1-两支队伍建设一张纸工作法研究与应用-精益课题报告-获省一等奖.md
  paragraph_type: 结尾段落
  paragraph_index: 62
  content: 在课题实施的过程中，发现存在以下问题：一是客户经理不同程度存在因循守旧思想和畏难情绪，如何克服员工在接受新生事物过程中的“惰性”有待深入研究；二是大多数零售客户素质和经营能力较弱，接受现代营销知识过程较长，如何进一步改进培训方式有待认真探索。三是随着一张纸工作法的深入运用，收集积累了很多市场数据资料，接下来如何对市场和业务数据进行分析统计还有待进一步开展。
  word_count: 179
  quality_score: B级
