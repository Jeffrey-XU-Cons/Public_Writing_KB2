- file_title: 4.管理诊断培训会上的讲话
  category: 讲话类
  file_path: 00_raw_materials/个人历史交付物/讲话类/4.管理诊断培训会上的讲话.md
  paragraph_type: 开头段落
  paragraph_index: 0
  content: 全面管理诊断是衡量高质量发展的进度和质量，找准制约高质量发展瓶颈、症结、短板，进一步改进工作，引导全市系统转变发展方式，提升工作质量的重要抓手。今天开展管理诊断培训，目的是解决管理诊断操作问题，针对这次培训，强调三点内容。
  word_count: 111
  quality_score: B级
- file_title: 4.管理诊断培训会上的讲话
  category: 讲话类
  file_path: 00_raw_materials/个人历史交付物/讲话类/4.管理诊断培训会上的讲话.md
  paragraph_type: 结尾段落
  paragraph_index: 3
  content: 要围绕发展理念明显增强、基础管理明显加强、管理水平明显提升、综合绩效明显改善的诊断目的，严格按照诊断方案要求开展诊断工作。一是明确单位局长或分管领导作为管理诊断具体负责人，负责组织好管理诊断小组，负责对单位管理诊断内容和诊断结论的审核。二是管理诊断涉及工作模块多，涉及哪个模块工作就要由哪个岗位负责具体工作的诊断，杜绝1个岗位诊断部门所有工作现象。三是避免“蜻蜓点水”，诊断组要按照LeTCI（水平、趋势、对标、整合）、ADLI（过程、运用、改进、整合）方法对各模块进行逐项诊断，深挖诊断揭示的问题，制定适用自身的整改措施，真正补短板、强弱项。虽然大家已经拿到了岳阳县完成的管理诊断模板，但是各单位情况各有差异，要用好参照，做好分析，避免抄袭。四是注重改进实效，避免在节约水电、整改记录上花费过多的时间和精力，要聚焦制约高质量发展瓶颈、症结、短板，在转变发展方式，提升工作质量，提升对标排名上下功夫。
  word_count: 400
  quality_score: A级
