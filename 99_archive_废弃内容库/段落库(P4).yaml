  content: 未来5年，是推动贵州烟草商业高质量发展至关重要的时期。科学编制和有效实施高质量发展规划，对于抢抓发展机遇、破解重大难题、推动“三大变革”、实现“六个转向”，具有十分重要的意义。依据《中共国家烟草专卖局党组关于建设现代化烟草经济体系推动行业高质量发展的实施意见》（国烟党〔2019〕41号）和《省人民政府关于贯彻新发展理念加快构建现代化经济体系的意见》（黔府发〔2019〕8号）精神，结合实际，制定本规划。
