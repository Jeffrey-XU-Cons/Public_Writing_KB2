  paragraph_type: 结尾段落
  paragraph_index: 22
  content: （五）坚持服务发展，进一步加快数字化转型，不断提升支撑保障能力。**数字化转型方面，**要充分发挥数字化在优化资源配置、提高协同效率、打破数据壁垒、压缩冗余流程、促进效能提升等方面的积极作用，准确把握公司数字化转型所处的发展阶段，把一体化管控平台建设作为当前数字化转型的重要抓手。各部门、各单位要瞄准明年初平台上线的时间节点，遵循“谁产生谁负责”“谁主管谁负责”原则，由项目办统筹、业务条线职能部门分领域总体管理、各单位综合负责，强化培训，选配优秀骨干人员，压实协同责任，严把数据质量关，强化过程管理跟踪、考核督促，认真做好平台系统的实际场景验证与应用，切实提高系统测试应用成效。**服务保障方面，**要持续强化舆情、信访、失泄密等风险防范，确保公司大局稳定。要以便捷、高效、科学为原则，持续优化行政办公流程，统筹公司后勤条线一体化管控，提高行政办公和后勤服务质效。**人才培养方面，**要围绕管理效能攻坚行动部署，聚焦管理成熟度评价体系建设与实施工作要求，统筹策划管理能力提升培训规划，分层级、分领域、分专题开展全员全领域管理知识、管理技能等能力提升培训，为公司管理效能攻坚提供能力保障。
