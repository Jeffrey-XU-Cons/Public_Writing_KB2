  paragraph_type: 开头段落
  paragraph_index: 0
  content: 河南中烟认真学习贯彻习近平新时代中国特色社会主义思想，深入落实党中央、国务院关于深化国有企业改革的决策部署，牢牢把握“加快建设更多世界一流企业”实践要领，全面落实行业“推进高效能治理”战略部署，深入贯彻国家局管理提升三年行动工作部署，着力构建河南中烟“6+1+1”管理成熟度评价体系，努力探索走出一条质量更好、效率更高、服务更优的管理提升新路径，持续提高企业治理体系和治理能力现代化水平，不断增强核心竞争力，造就竞争新优势。现将有关情况汇报如下。
  word_count: 223
  quality_score: A级
- file_title: 5.1 管理成熟度评价体系建设工作汇报 260109 3
  category: 报告类
  file_path: 00_raw_materials/个人历史交付物/报告类/5.1 管理成熟度评价体系建设工作汇报（上报国家局）-260109-3.md
  paragraph_type: 结尾段落
  paragraph_index: 3
  content: 按照“6+1+1”管理成熟度评价体系架构，坚持先行先试，稳步推进成熟度评价体系建设。一是制定基本规则。编制《管理成熟度评价准则 第1部分：构成及要求》，规范管理成熟度模型、特征，为成熟度评价体系的策划、实施、分析、改进提供指引。二是实施试点先行。起草生产制造和卷烟厂成熟度评价准则（试行稿），选取生产制造核心业务及南阳卷烟厂作为试点，对生产制造业务5个能力域、88项核心要素、279条评价条款，以及南阳卷烟厂6个能力域、144项核心要素、500条评价条款，全面开展成熟度评估，精准识别出能力差距与关键短板，深入揭示了制度体系管理颗粒度不足、执行监督不够严格、数字化转型进程滞后等8项系统性问题，提出改进机会42项、提升建议34项，为精准施策确立了主攻方向。三是启动全面推进。成立管理成熟度评价体系建设工作组，工作组下设建设办公室，组建技术研发、原料保障、物资保障、生产制造、市场营销、物流管理、综合管理、卷烟厂8个专项业务组，配齐配强专业力量，形成分工合理、协同高效的推进格局；制定印发《成熟度评价体系全面建设实施方案》，形成3个阶段、8个步骤、25个关键活动的阶段任务图，明确各节点起止时间、责任部门和推进进度，实行挂图作战、定期更新，确保体系建设有序推进、稳步落实。四是强化能力建设。组织84名编制人员开展集中实操演练培训，帮助全员快速建立对体系的整体认知，明确评价体系的基本框架和应用方法；结合业务差异分组开展核心要素、关键举措、评价条款3批24场次专项培训，推动编制人员深入理解评价标准、准确把握评价方法，为体系高质量建设奠定能力基础。五是健全评审机制。建立“业务组内部评审、建设办公室技术评审、多方综合评审”的三级审核流程，以“分层把关+多方协同”模式，确保审核责任清晰、专业把关充分、成果质量可控的效果；各部门负责人、业务分管负责人全程参与评审工作，广泛征求相关部门和条线意见，确保评价体系符合公司实际、具备可操作性。截至2026年1月9日，组织开展两轮次，共60场次技术评审、综合评审，初步形成涵盖六大核心业务能力域26项，能力子域95项，等级特征475项，评价条款2785条；综合管理能力域9项，能力子域32项，等级特征160项，评价条款1792条；卷烟厂能力域6项，能力子域31项，等级特征155项，评价条款1325条的评价体系初稿。
  word_count: 976
  quality_score: A级
