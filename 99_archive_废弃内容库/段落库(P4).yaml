  paragraph_type: 结尾段落
  paragraph_index: 26
  content: '**三是注重协同配合，强化工作推进。**各部门、各单位要站在管理效能攻坚的系统性和全局性角度，正确处理好整体与局部、守正与创新、效率与规范、质量与成本等多方面因素，切实增强管理效能攻坚的整体性和协同性，实现各领域攻坚举措相互支撑，攻坚过程相辅相成，攻坚成果相得益彰。要锚定效能攻坚目标，发扬钉钉子精神，察实情、出实招、求实效，坚决防止、克服脱离实际的纸面攻坚、虚假攻坚。十大领域和主要目标指标各牵头部门主要负责人要把管理效能攻坚抓在手上，既挂帅又出征，重要任务亲自部署、重大事项亲自把关、关键环节亲自协调、落实情况亲自督察，确保管理效能攻坚工作高效推进。各责任部门、单位要增强全局观念，层层传导压力，压紧压实责任，形成“一盘棋”，拧成一股绳，齐心协力把管理效能攻坚任务落到实处。'
