- file_title: 附件2：长株潭烟草物流有限公司十四五战略规划
  category: 规划类
  file_path: 00_raw_materials/个人历史交付物/规划类/附件2：长株潭烟草物流有限公司十四五战略规划.md
  paragraph_type: 结尾段落
  paragraph_index: 50
  content: '（二）第一阶段重点项目（2021 年-2023 年）

    1. 一号高架库建设项目。现有仓储能力、出库能不能满足区域分拨需求，制约了区域分

    拨业务发展；工商共库库容不足，无法满足高峰期湖南中烟业务需求，需及时进行一号库建

    设；项目主体包括高架库5.4万箱，一号高架库入库，一号高架库出库作业设备。

    2.实时出库改造项目。目前分拣作业采取大品规实时补货、实时分拣，异型烟人工提前

    补货的方式；异型烟补货人工成本较高，无法满足高峰期间作业需求和异型烟年均50%-80%

    增长的分拣结构变化，需改造目前出库方式，实现异型烟实施出库，提高出库效率。

    3.联合工房钢结构承重夹层建设项目。分拣线不能满足 120 万箱分拣作业需求，区域分

    拨客户要求更多的区域分拨库存区域和作业面积，平库仓储作业区域不能满足区域分拨和工

    商的仓储需求，需在联合工房平层区域建设钢结构承重夹层，为分拣线扩建和区域分拨业务

    扩展提供场地。

    4.车辆集装单元改造建设项目。全面运用车辆可交换集装单元改造，对新采购、收购或

    转增车辆进行可交换集装单元改造，提高干线运输实载装载率，降低中转交接时间，减少人

    工劳动强度。基于目前高效、规范的中转甩挂业务模式，建立全省适用的区域分拨新能源车

    甩挂运输业务，降低装卸成本、提高中转效率、提高集约化程度、降低中转仓储成本，平均

    中转甩挂成本控制在0.09元/箱/公里。

    5.区域物流配送资源整合项目。在目前承接长沙、株洲、湘潭配送服务基础上，积极探

    索承接娄底等其他区域卷烟配送服务，同时根据省局、市局批复和统一部署，结合其他市州

    需求，积极承接其他市州业务。

    6.区域分拨业务扩张项目。扩展客户服务规模，重点发展甘肃中烟、山东中烟、江苏中

    烟、上海中烟客户群，逐步发展云南中烟、四川中烟、陕西中烟、河南中烟、浙江中烟客户

    群，建设中南片区最大的烟草物流集散中心。搭建区域分拨业务信息系统，建立钟摆式区域

    分拨线路，建立区域分拨调度优化决策平台，提升区域分拨信息化支撑能力，提升区域分拨

    运载优化调度能力。

    7.物流信息化平台建设项目。围绕“物联感知、深度融合、敏捷柔性、智慧管控”的行

    业智慧物流体系建设总体要求，实施信息平台建设，完成营销系统订单、省外分拨业务订单、

    非烟业务订单业务功能建设项目；完成OMS、TMS、车辆安全监控系统、工控网项目、路线动

    态优化、三项工作管理功能建设项目；完成 WMS、OA、大屏指挥调度、BMS、智慧园区项目，

    47'
