  paragraph_type: 关键段落(关键词段落)
  paragraph_index: 1
  content: 各单位要清晰把握管理诊断工作定位，管理诊断并不是考核检查工作，而是帮助基层全面找准定位、挖掘亮点、发现问题、解决问题的有效途径。各单位要把思想统一到“找问题就是找出路”“问题就是机会，就是潜力”上来，卸下思想包袱，要把准工作重点、诊断重心，围绕高质量发展战略目标，真正抓住制约发展的“结”、核心业务的“难”、员工关注的“忧”，集中力量攻坚突破。
  word_count: 172
  quality_score: A级
