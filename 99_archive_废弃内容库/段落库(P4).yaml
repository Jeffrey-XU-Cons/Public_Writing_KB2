  category: 讲话类
  file_path: 00_raw_materials/个人历史交付物/讲话类/2023年现场会《领导参阅——李斌同志对公司管理提升工作的批示和蒋东凯同志在2023年公司管理提升工作现场会上的讲话》正文.md
  paragraph_type: 结尾段落
  paragraph_index: 22
  content: （三）聚焦能力全面提升，加快人才队伍建设。按照工作安排，今年要建立起200人左右的标准化内审员人才队伍，40—50人的核心标准化工作骨干力量。各部门、各单位要按照目标要求持续推进。一是坚持抓实基础培训。各部门、各单位要充分认识标准化人才队伍建设的重要性、长期性和持续性，把标准化技能作为管理人员的必备能力，将培训工作贯穿管理提升全过程，持续加强各级管理人员公司治理、风险防控、标准化知识等领域的理论培训，强化标准化管理思维，提高编写标准、执行标准的能力。二是坚持抓牢实践锻炼。标准化人才队伍建设是推动管理提升的基础和保障，是提高公司管理水平的有效途径。企业管理部要坚持以干代训、以干促学的思路，抽调业务骨干参与管理提升工作，抽调内审员参与公司业务流程标准的评审、修订工作，为公司培养更多优秀管理人才。各部门、各单位要选取优秀内审员参与公司、卷烟厂标准体系内审，增强内审员审核经验和专业技能，促使其思维观念、格局眼界、专业技能等多方面的彻底转变和全面提升。三是坚持抓好正向激励。建立科学的激励机制，对加快标准化人才队伍建设、激励引导标准化人才成长、调动标准化人才创新创造积极性有重要意义。各部门、各单位要以正向激励的方式，充分激发标准化人才自我学习、自我提升、自我成长的内生动力，创造适宜的成长条件，助力标准化人才学习成长。
