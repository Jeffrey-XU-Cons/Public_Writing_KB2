  content: （一）攻坚指标实现较好提升进位。各部门、各单位坚持“跳起摸高、争先进位”，实时跟踪指标完成进度，深入分析研究，找准差距短板，针对性制定提升措施，推动攻坚指标持续向好。截至目前，23项公司级攻坚指标中17项同比提升，13项卷烟厂级攻坚指标中11项同比提升。尤其值得肯定的是，上半年行业通报的公司卷烟工厂109项指标中，3项指标进入行业前三，同比增加2项；14项指标改善幅度进入行业前三，同比增加10项；26项指标进入行业先进水平，同比增加10项；87项指标同比提升，提升率达到79.82%，高于行业指标提升率均值19.23个百分点，公司核心竞争力进一步增强。
