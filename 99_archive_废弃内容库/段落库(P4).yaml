  content: 强化责任分工。建立统筹协调、分工负责、协同推进的规划落实机制，加强统筹调度，明晰职责定位，制定分工方案，细化明确规划总体目标、主要任务、重点工程、重大行动的牵头责任主体和配合落实主体，凝聚形成推动规划实施的强大合力。牵头责任主体要全面落实主要责任，紧盯主要指标和预期目标，准确把握规划提出的一系列重大举措，充分发挥重大行动、工程牵引带动作用，强化沟通协调，强化措施配套，确保完成分项目标任务。配合责任主体要按照职能职责，充分发挥主观能动性，压实责任，强化协同，积极落实分解任务。强化规划街接。坚持全市“一盘棋”，建立健全规划衔接协调机制，配套制定专项规划，协调对接单位规划，做好与本规划确定的发展战略、主要目标和重点任务的有机衔接，形成全面统筹、横向协调、纵向衔接的规划体系。坚持整体推进和重点突破相统一，以重点突破带动整体推进，聚焦事关长远发展的重大战略、具有全局影响的重大政策、支撑高质量发展的重大工程项目，做好规划统筹谋划和衔接落实。深化政策研究应用，加大统筹力度，推动形成规划实施和政策协同的有效机制。完善以年度计划落实.发展规划的工作机制，做好规划目标与年度计划、阶段工作任务有机街接、有效落实，做好年度之间综合平衡，合理确定年度工作重点，以年度目标完成推进规划任务稳步实现。
  word_count: 543
  quality_score: A级
- file_title: 安顺市局十四五规划
  category: 规划类
  file_path: 00_raw_materials/个人历史交付物/规划类/安顺市局十四五规划（定稿） (1).md
  paragraph_type: 关键段落(关键词段落)
  paragraph_index: 3
  content: “十四五”时期，是我国由全面建成小康社会向基本实现社会主义现代化迈进的重要时期，也是推进安顺烟草向高质量发展的关键时期。为准确把握新阶段新形势新变化，认真谋划“十四五”战略部署，更好推动改革发展取得新成效、开创新局面。根据《中华人民共和国国民经济和社会发展第十四个五年规划和2035年远景目标纲要》《贵州省人民政府国民经济和社会发展第十四个五年规划和2035年远景目标纲要》《安顺市人民政府国民经济和社会发展第十四个五年规划和2035年远景目标纲要》《烟草行业“十四五”规划》《贵州省烟草商业“十四五”规划》，通过群策群力、聚智合力、认真编制，紧密结合实际，编制本规划。
  word_count: 285
  quality_score: A级
- file_title: 安顺市局十四五规划
  category: 规划类
  file_path: 00_raw_materials/个人历史交付物/规划类/安顺市局十四五规划（定稿） (1).md
  paragraph_type: 关键段落(关键词段落)
  paragraph_index: 6
  content: ——坚持刀刃向内，推动全面从严治党向纵深发展，实现了政治生态风清气正的“安顺之变”。扎实推进“两学一做”学习教育常态化制度化，深入开展“不忘初心、牢记使命”主题教育和政绩观专题教育，全面落实政治生态突出问题整改、十九届中央巡视国家局党组反馈意见整改、省局（公司）党组常规巡察反馈问题整改，管党治党呈现全面从严从实良好态势。把好选人用人风向标，持续深化人事用工分配制度改革，着力纠“四风”、转作风、大兴三风，强化监督执纪问责，一体推进不敢腐、不能腐、不想腐，党风政风行风持续向好，干部职工更加心齐气顺、更加团结一致，满意度连年上升，实现了政治生态风清气正的“安顺之变”。
  word_count: 284
  quality_score: B级
