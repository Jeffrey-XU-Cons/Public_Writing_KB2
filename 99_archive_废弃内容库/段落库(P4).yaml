  content: 随着疫情在全球范围内扩散，全球经济增速下降。疫情对全球旅游、交通运输等行业造成直接冲击；对产业链全球化的制药、半导体、汽车制造等行业以及强烈顺周期的能源行业造成较大影响。疫情在相关国家的蔓延将打乱全球供应链，GDP增速下降2.0-8.0个百分点。外部需求短期内将出现下滑，中国出口萎缩将对中国经济造成负面影响，预测经济影响将持续18个月。我国出口增速从2019年的
    17.2%下滑到-16.0%，出口增长的断崖式下滑对整体经济、尤其是出口相关行业造成了非常大的负面冲击。
