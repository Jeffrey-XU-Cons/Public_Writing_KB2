- file_title: 张司在管理诊断专家培训班上的开班动员讲话
  category: 讲话类
  file_path: 00_raw_materials/个人历史交付物/讲话类/张司在管理诊断专家培训班上的开班动员讲话.md
  paragraph_type: 关键段落(数据段落)
  paragraph_index: 2
  content: 由运行司主办、进修学院具体承办的行业管理诊断专家培训班今天正式开班了。在培训之前，我做一个简短的动员讲话。这次培训的主要目的是深入贯彻落实2020年全国烟草行业企业管理电视电话会议精神，加强和改进管理诊断工作，依托行业管理诊断专家库，进一步为“管理诊断基层行”工作提供专家人才支撑，为管理诊断工作的开展发挥智囊团作用。本次参加培训的人员主要是刚刚公布的行业管理诊断专家库中的专家，是各省级单位严格把关推荐上来的工作骨干，是各业务司局审核遴选上来的业务精英，是今后行业开展管理诊断工作的中坚力量。首先，我代表运行司向参加培训的全体同志，表示热烈的欢迎和亲切的问候！
