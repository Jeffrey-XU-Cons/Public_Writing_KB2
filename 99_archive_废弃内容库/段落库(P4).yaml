- file_title: 1 两支队伍建设一张纸工作法研究与应用 精益课题报告 获省一等奖
  category: 报告类
  file_path: 00_raw_materials/个人历史交付物/报告类/1-两支队伍建设一张纸工作法研究与应用-精益课题报告-获省一等奖.md
  paragraph_type: 关键段落(关键词段落)
  paragraph_index: 2
  content: 为适应卷烟营销发展新形势，郑州市局（公司）认真领会烟草行业“高质量发展”的部署精神，深入贯彻国家局、省局（公司）关于客户经理队伍转型和现代卷烟零售终端建设的决策要求，提出了“打基础、管长远”发展理念，站在企业战略高度，将建设高质量队伍上升为一项重点工作，常抓不懈，并且首次提出将零售客户纳入到企业营销队伍建设工作中，发出了推进客户经理和零售客户“两支队伍”建设号召。要求对传统的营销服务方式和素质提升途径进行创新改革，打破传统思维，挑战旧有习惯，探寻精益方法，促进提质增效，力求通过持之以恒的努力，使“两支队伍”的素质能力有一个质的提升。
  word_count: 269
  quality_score: A级
