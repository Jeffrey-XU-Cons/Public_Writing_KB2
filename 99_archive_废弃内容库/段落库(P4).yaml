  paragraph_type: 关键段落(数据段落)
  paragraph_index: 15
  content: '供应链协同

    （1）资源共享。协同合作的上下游企业发挥各自的企业优势，相互赋能、

    资源互补；（2）长期深度合作。通过长期合作来建立更稳定的协同关系，以减

    少磨合成本；（3）系统对接。上下游企业通过SDK、API等方式将系统打通，实

    现信息的实时交互。例如，供应商在送货之前，先通过预约系统向公司告知送货

    时间和货物品种及数量，公司可提前对仓库内的人员及设施进行安排。同时，通

    过系统的对接，也可以减少收货环节的很多录入工作。

    2.组织内部协同。

    公司内部因采购、销售、物流、财务等多个部门的责任和立场不同，经常会

    出现公司内部沟通比外部沟通更困难的情况。

