# A2 审核草稿 - 11种文体结构骨架
# 审核重点：
#   1. structure_skeleton 段落顺序是否符合实际写作习惯
#   2. constraints 禁止项是否有遗漏或错误
#   3. quality_checklist 检查项是否针对该文种真实高频问题
# 确认后执行 A3（批量写入151个JSON文件）
# 已移除范围外文体：工作简报、新闻稿件、先进事迹、应急预案、会议主持词、会议记录、活动方案、工作规程、实施细则、办法措施
# 核心文体（7种）：工作汇报、专题汇报、经验材料、工作计划、实施方案、管理制度、会议纪要

---
doc_type: "经验材料"
usage_scene: "向上级汇报或向同级交流推广本单位在某项工作中形成的典型做法和经验，多在工作交流会、现场推进会或接受调研时使用。"
word_count_range: "1000-2500"
structure_skeleton:
  - section: "标题"
    required: true
    rule: "采用'关于XXX工作的经验做法'等格式，点明交流主题和单位，不超过25字。"
  - section: "工作概况与成效（开篇点题）"
    required: true
    rule: "首段150字以内概括本单位总体情况和主要成效（须含关键数据），避免以背景介绍开篇。"
  - section: "主要做法（分条展开，2-5条）"
    required: true
    rule: "每条做法用简练小标题（8字以内）领起；小标题须有实质性概括，避免套话；每条须有具体举措、运作机制或案例；每条300-500字。"
  - section: "创新点或特色说明"
    required: false
    rule: "如有创新机制，须指出与以往做法的区别；不可强行编造创新。"
  - section: "主要成效（数据支撑）"
    required: true
    rule: "列出3-5项可量化的成效指标；数据须注明统计口径和时间范围；不得只写定性成效。"
  - section: "体会与思考"
    required: false
    rule: "较长材料可在结尾写1-2条工作体会，须有理性反思成分；篇幅有限可省略。"
constraints:
  - "做法小标题不得使用'高度重视''深入推进''扎实开展'等套话，须体现本单位的具体措施名称。"
  - "每条做法必须说明'怎么做的'（机制、流程、措施），不得只说'做了什么'（结果）。"
  - "成效数据须有统计时间范围，不得使用没有时间基准的绝对数字。"
  - "不得将上级政策要求直接当作本单位经验（落实上级部署不等于本单位创新做法）。"
  - "若有交流探讨性质，须包含客观存在的不足或待完善之处，不得回避问题。"
quality_checklist:
  - "检查做法小标题是否体现单位特色，将所有小标题单列出来看是否能与其他单位区分开。"
  - "检查每条做法是否有'机制/制度/流程'等可复制要素描述，而非仅是结果陈述。"
  - "检查开篇数据与成效部分数据是否统一，防止前后数字矛盾。"
  - "检查篇幅分布是否合理：做法部分不应少于全文60%，背景和成效各不超过20%。"
  - "检查成效表述是否均有数据支撑，删除所有仅有形容词的成效描述。"

---
doc_type: "工作计划"
usage_scene: "单位或部门在年初、季初或重要工作节点前，明确未来一段时期的工作目标、重点任务和实施安排，是对上呈报或内部执行的纲领性文件。"
word_count_range: "800-2500"
structure_skeleton:
  - section: "指导思想与总体目标"
    required: true
    rule: "首段说明计划编制依据和指导思想（1-2句），重点写总体目标，须包含可量化的核心指标；不超过200字。"
  - section: "工作原则"
    required: false
    rule: "如工作较复杂，可列2-4条工作原则；须是针对本项工作的实质性约束，不得全为套话；简单年度计划可省略。"
  - section: "重点工作任务（分条列项）"
    required: true
    rule: "列出全年/季度重点任务，一般4-8项；每项须包含：任务名称（黑体小标题）、具体措施（2-4条）、责任主体、量化目标；任务描述须用动词开头。"
  - section: "实施步骤或时间安排"
    required: true
    rule: "按季度或月份列出工作节点；时间节点须明确到月份，不得只写'上半年''年内'等模糊表述；可用表格呈现。"
  - section: "保障措施"
    required: false
    rule: "列出组织保障、经费保障、考核机制等，须有具体操作内容；部门内部执行的计划可省略或简写。"
constraints:
  - "每项重点工作必须有量化目标，不得全部使用'进一步加强''持续推进'等无法衡量完成情况的表述。"
  - "时间节点必须明确到月份，不得全篇只用'年内''适时''按时'等模糊表述。"
  - "责任主体必须明确到具体部门或岗位，不得只写'相关部门'。"
  - "不得将上年遗留问题作为新年度新任务包装，延续性工作须注明'续推'或'持续'。"
  - "工作计划不得夹带对上级的请示或资金请求，须单独行文。"
quality_checklist:
  - "检查总体目标中的量化指标是否有数据来源依据，防止目标数字脱离实际。"
  - "检查每项重点工作的时间节点是否与总体部署协调，防止任务节点冲突或堆积。"
  - "检查责任分工是否覆盖所有重点任务，是否存在有任务无主体的情况。"
  - "逐条检查重点工作描述是否使用动词开头的行动导向表述，替换所有名词短语式标题。"
  - "检查全年任务量是否与本单位人力资源匹配，防止计划虚高失去执行可能性。"

---
doc_type: "实施方案"
usage_scene: "将上级决策部署或本单位工作计划转化为可执行的具体行动方案，适用于需要多部门协作、有明确任务节点和考核要求的系统性工作部署。"
word_count_range: "1500-4000"
structure_skeleton:
  - section: "总体要求（含指导思想、基本原则、工作目标）"
    required: true
    rule: "指导思想1-2句说明依据的上级文件和工作方向，不超过100字；基本原则列2-4条，须有实质性约束；工作目标须包含量化指标，明确到年度或阶段。"
  - section: "主要任务（分条列项，3-8条）"
    required: true
    rule: "每条任务采用'（一）标题：……'格式，标题不超过12字；每条须包含：任务内容、实施路径、完成标准、牵头单位；各条任务有内在逻辑顺序，不可随意排列。"
  - section: "职责分工"
    required: true
    rule: "单独列出所有参与单位及其在本方案中的具体职责，采用'×单位负责……'表述；分工须覆盖所有主要任务；总协调单位单独列明。"
  - section: "实施步骤（分阶段）"
    required: true
    rule: "一般分启动准备、全面推进、总结验收三个阶段，每阶段明确起止时间（精确到月份）和主要工作内容；不得少于两个阶段。"
  - section: "保障措施"
    required: true
    rule: "从组织保障、经费保障、制度保障等维度列写，每条须有具体操作内容，不得全为套话。"
  - section: "督查考核"
    required: true
    rule: "说明督导主体、督查频次和方式，明确考核结果运用（纳入绩效、追责问责等）；不得只说'加强督查'而无具体机制。"
constraints:
  - "不得缺少量化工作目标，所有目标须有可测量的完成标准，不接受'基本实现''大幅提升'等模糊表述。"
  - "每项主要任务必须有明确的牵头单位，不得出现'相关单位''各单位''有关部门'等模糊责任主体。"
  - "每个阶段的时间节点须精确到月份，不得使用'上半年''年内''适时'等表述。"
  - "督查考核部分不得虚设，须有具体的考核主体和结果运用机制。"
  - "方案不得将上级政策照抄作为本单位的工作任务，须转化为本单位的具体行动。"
quality_checklist:
  - "检查工作目标中的量化指标是否有对应的任务条款支撑其实现路径。"
  - "检查职责分工中是否每个参与单位都有实质性职责，删除无实际分工内容的单位。"
  - "检查实施步骤中各阶段时间节点是否连贯，不存在时间断档或交叉重叠。"
  - "检查保障措施中是否有切实可操作的内容，将套话替换为具体机制描述。"
  - "检查全方案各部分逻辑自洽：目标→任务→分工→步骤→保障，每个环节均有对应。"

---
doc_type: "管理制度"
usage_scene: "规范单位内部某类工作或行为的长效性制度文件，适用于人事管理、财务管理、业务流程、安全规范等需要建立固定规则的场景。"
word_count_range: "800-3000"
structure_skeleton:
  - section: "第一章 总则"
    required: true
    rule: "依次包含：制度目的、适用范围（明确到人员类别或业务类别）、制度依据；目的须聚焦本制度解决的具体问题，不得泛泛而谈。"
  - section: "第二章 职责分工"
    required: true
    rule: "明确主管部门和执行部门的各自职责，以及相关岗位人员的职责边界；须说明'谁主管''谁执行''谁监督'，不得将所有职责集中于一个部门。"
  - section: "第三章 具体规定（核心条款，可分多章）"
    required: true
    rule: "按逻辑顺序列出管理规则和操作规范，每条规定须明确：适用情形、操作要求或禁止行为、时限要求；条款表述用'应''须''不得''禁止'等规范性词语；每章聚焦一类事项。"
  - section: "第四章 监督与考核"
    required: true
    rule: "规定制度执行的监督主体、检查方式和频次；明确违规的认定标准和处理方式，处罚力度须与违规性质相称；不得只说'将追究责任'而无具体追责机制。"
  - section: "第五章 附则"
    required: true
    rule: "注明制度解释权归属、生效日期和废止的原有制度；有配套附件须列明；生效日期须明确到具体日期。"
constraints:
  - "每条规定必须有明确的行为主体，不得使用'相关人员''有关部门'等无法落实的主体表述。"
  - "条款中须区分'应（义务性要求）''可（授权性规定）''不得（禁止性规定）'，三者不得混用。"
  - "处罚条款须有具体的处罚措施和量级，不得只写'视情处理''予以追究'等无法执行的表述。"
  - "制度的适用范围不得与现行其他制度重叠，须在附则中明确废止或修订旧制度。"
  - "条款内容不得超出制定单位的职权范围，不得设定超出法律授权的惩处内容。"
quality_checklist:
  - "检查每章每条是否有明确的行为主体，逐条识别并替换模糊主体表述。"
  - "检查条款中'应''须''可''不得'的使用是否准确区分义务、授权和禁止三种规范类型。"
  - "检查处罚条款是否与违规行为的严重程度相匹配。"
  - "检查制度生效条款是否明确废止了被本制度替代的旧制度。"
  - "检查制度中引用的其他规定是否为现行有效文件。"

---
doc_type: "会议纪要"
usage_scene: "记录和反映会议主要议题、讨论结论、决定事项和责任分工，具有法定效力，作为贯彻执行会议决定和追溯会议决策的正式依据。"
word_count_range: "500-2000"
structure_skeleton:
  - section: "纪要标识（文头）"
    required: true
    rule: "按GB/T 9704标准，'×××××纪要'居中排布；纪要字号不小于发文机关标识。"
  - section: "基本信息（会议要素）"
    required: true
    rule: "依次注明：会议名称（正式全称）、时间（精确到时分）、地点、主持人姓名及职务、出席人员名单（按职级排序，含姓名职务）、列席人员、缺席及请假人员、记录人。"
  - section: "会议议程或议题"
    required: true
    rule: "列出本次会议审议或讨论的事项，有多个议题时逐一列编号；议题名称须与实际讨论内容一致。"
  - section: "会议内容（分议题记录）"
    required: true
    rule: "按议题顺序分别记录各方发言要点、争议焦点、最终决议；决议须明确表述（'会议一致同意……''会议决定……'），不得模糊化处理；有表决事项须注明票数。"
  - section: "决定事项与责任分工"
    required: true
    rule: "单独列出'决定事项'部分，逐项注明：事项内容、责任单位/责任人、完成时限；此部分是纪要执行核心，须清晰完整，不得仅散在正文中。"
  - section: "纪要印发说明"
    required: false
    rule: "如纪要需报送上级或抄送相关单位，注明印发范围；须经主持人或授权人审核签发后方可印发。"
constraints:
  - "不得将讨论过程中未形成共识的意见表述为'会议决定'，争议意见须如实记录并注明未达成一致。"
  - "不得在纪要中新增会议未讨论的事项，纪要内容须严格限于实际会议内容。"
  - "出席人员名单须与实际签到记录一致，不得将未出席人员记入出席名单。"
  - "决定事项的完成时限不得比实际会议商定的更宽松，且须有责任人而非仅有责任部门。"
  - "涉及组织人事、资金使用等敏感事项的纪要，须按保密规定控制印发范围。"
quality_checklist:
  - "检查决定事项部分是否与正文中每项决议一一对应，防止遗漏。"
  - "检查有表决事项的决议是否记录了表决票数，防止将有异议决议写成'一致同意'。"
  - "检查出席人员名单与签到表是否一致，职务信息是否准确。"
  - "检查决定事项中每条是否都有明确的责任人（非部门）和具体完成时限。"
  - "检查纪要文字是否经主持人或指定负责人审阅确认。"

---
doc_type: "工作汇报"
usage_scene: "向上级领导或主管部门通报某一时期工作进展、完成情况和下步安排，属于常规性、阶段性的向上汇报文体，语言直接，重点突出。"
word_count_range: "1000-3000"
structure_skeleton:
  - section: "开篇：汇报背景与目的"
    required: true
    rule: "用1-2句话说明汇报的工作背景（落实什么部署、针对什么任务）和汇报目的；不超过100字；直接切入，不铺垫废话。"
  - section: "工作开展情况（主体，分条列项）"
    required: true
    rule: "按工作板块或推进逻辑分2-4条，每条用小标题领起（格式'一、……''（一）……'均可）；每条须有：做了什么、怎么做的、达到什么效果；有数据支撑；每条200-500字。"
  - section: "存在的问题和不足"
    required: true
    rule: "如实列出当前工作中存在的主要问题，须具体到具体事项，不得只写'整体推进顺利'等回避性表述；一般2-4条，简洁明了。"
  - section: "下一步工作计划"
    required: true
    rule: "针对存在问题提出下步举措，须有时间节点和责任要求；一般2-4条；不得只写'继续努力''加快推进'等无实质内容的表述。"
constraints:
  - "主体部分不得全篇堆砌已完成工作清单，须有工作进展的逻辑脉络（做了什么→为什么这样做→效果如何）。"
  - "不得在汇报中夹带对上级的请示事项或资金申请，汇报只通报情况，请示须单独行文。"
  - "存在问题部分不得回避，不能以'总体进展顺利''无重大问题'等表述带过。"
  - "时间节点须明确到月份，不得只写'近期''尽快''适时'等模糊表述。"
  - "数据须真实准确，不得使用'大幅提升''显著改善'等无具体数字的模糊成效表述。"
quality_checklist:
  - "检查开篇是否清楚说明了汇报背景（落实哪个部署/针对哪项任务），避免领导不知道汇报的来龙去脉。"
  - "检查主体各条是否都有具体数据或事实，删除所有只有形容词没有数据的段落。"
  - "检查存在问题部分是否真实反映了当前卡点，防止问题部分流于形式。"
  - "检查下步计划中的时间节点是否已落到月份，责任主体是否明确。"
  - "通篇检查是否有'请领导批示''请给予支持'等请示性表述，如有须删除。"

---
doc_type: "专题汇报"
usage_scene: "就某一具体专项任务、重要问题或特定事项，向上级进行有针对性的专项汇报，区别于常规工作汇报，聚焦单一主题，分析更深入，方案更具体。"
word_count_range: "1500-4000"
structure_skeleton:
  - section: "专题背景与汇报目的"
    required: true
    rule: "说明本次专题汇报的缘由（上级要求/工作需要/重要节点），明确汇报的核心问题；100-200字；须交代清楚'为什么要做这个专题汇报'。"
  - section: "基本情况（现状描述）"
    required: true
    rule: "客观描述该专项工作的现状，含关键数据和基本事实；须区分已完成、进行中、未启动三类情况；200-400字；用事实说话，不加主观评价。"
  - section: "主要做法与进展（核心段落）"
    required: true
    rule: "分2-4条介绍在该专项工作上的主要举措和推进情况；每条须有具体措施描述和阶段成效；每条200-400字；须体现工作的逻辑性和系统性。"
  - section: "存在的主要问题及原因分析"
    required: true
    rule: "列出当前专项工作中的主要矛盾和问题，须有原因分析（不能只列问题不分析原因）；问题须有轻重缓急排序；200-400字。"
  - section: "下步工作建议（或请示事项）"
    required: true
    rule: "提出针对性的下步工作建议，须与问题直接对应；如需上级支持或决策，须明确说明请求事项和理由；200-400字；时间节点明确到月份。"
constraints:
  - "专题汇报的'专'体现在：全篇聚焦一个主题，不得把专题汇报写成综合工作汇报。"
  - "原因分析须有实质内容（制度原因/资源原因/能力原因/客观条件），不得只写'重视不够''落实不到位'等无效分析。"
  - "如涉及请示事项，须明确写出'请求上级……'，不得将请示隐藏在建议表述中让上级猜。"
  - "基本情况部分须客观中立，不得在描述现状时加入自我肯定性评价（这部分后面有专门的做法段落）。"
  - "数据须有统计口径说明（时间范围、统计范围），不得使用无来源的数字。"
quality_checklist:
  - "检查全篇是否严格聚焦一个专题，删除与专题无关的其他工作内容。"
  - "检查原因分析是否指向真正的根本原因，而非停留在表象描述。"
  - "检查下步建议是否与存在的问题一一对应，防止'问题'和'建议'两张皮。"
  - "如有请示事项，检查是否表述清楚且有充分依据支撑，防止请示内容模糊导致上级无法决策。"
  - "检查基本情况部分的数据是否有来源说明，确认统计口径与上级熟悉的口径一致。"

# A2 补充骨架 - 讲话稿与报告（修订版）
# 修订依据：2019年全省烟草商业工作会议讲话实际范文
# 修订要点：
#   讲话稿：增加「战略方向」中间层，修正开场写法，补充三段式结构
#   工作报告：数据要求具体化，成效板块并列结构参考烟草系统实际写法
# 审核重点：
#   1. structure_skeleton 段落顺序是否符合实际写作习惯
#   2. constraints 禁止项是否有遗漏或错误
#   3. quality_checklist 检查项是否针对该文种真实高频问题

---
doc_type: "工作会议讲话"
usage_scene: "领导在单位工作会议、年度总结部署会、推进会等场合发表的正式讲话。结构上通常分三大板块：回顾总结、战略方向、年度部署。适用于年度工作会议、半年推进会、专项部署会等场合。"
word_count_range: "3000-8000"
structure_skeleton:
  - section: "开场（交代议程）"
    required: true
    rule: "用1-3句话交代本次会议的主要任务，点明会议依据（落实哪个上级会议精神）和本次会议要完成的议程；不超过150字；不展开，不加任何形势分析或背景铺垫；结尾可以交代其他议程说明（如'刚才XX同志传达了……请大家认真学习'）。"

  - section: "第一部分：工作回顾与总结"
    required: true
    rule: "先用100-200字作总体评价（含核心数据2-4个），再分4-6个工作板块展开；每个板块用'（一）XXXX呈现「X、X、X」的XX态势'格式的小标题领起；每个板块先说聚焦什么（'聚焦……'），再分条（一是/二是/三是）列举具体成效，每条须有数据支撑；全部分条用'一是/二是/三是'格式；最后单独一段指出存在的问题（2-4条，列举式，不展开分析）；全部分板块内容1500-3000字。"

  - section: "第二部分：战略方向与总体要求"
    required: true
    rule: "承上启下，说明当前形势对本单位的要求，引出本阶段工作的总体思路；须引用上级最新战略表述（如行业高质量发展要求）并结合本单位实际转化；提出本单位推进总体工作的核心原则或战略支柱，一般3-5条，用'始终坚持……''坚定不移……'等句式领起；每条300-600字；各条之间有内在逻辑顺序（政治保障→规划引领→质量效益→人才支撑）；全部内容1000-2000字。"

  - section: "第三部分：年度工作部署"
    required: true
    rule: "提出年度总体要求（100-200字，含量化主要预期目标），再分4-6项重点工作部署；每项用'统筹X与Y，推动Z上新水平'或'坚定不移推动Z上新水平'格式的小标题领起；每项下分2-4条具体要求，每条用'一要/二要/三要'格式；每条必须有具体的时间节点（精确到月份或季度）、量化目标和责任要求；全部分条内容1500-3000字。"

  - section: "结尾（动员收尾）"
    required: true
    rule: "3-5句话，用排比句式动员，语气坚定有力；点明当前时间节点的特殊意义（如重要纪念年份、攻坚关键期）；不超过200字；不重复前文内容。"

constraints:
  - "开场不得超过200字，禁止在开场加入形势分析或背景铺垫，直接交代议程。"
  - "工作回顾各板块小标题必须用'呈现「X、X、X」的XX态势'或类似三字格对仗格式，不得使用无特色的通用标题。"
  - "工作回顾每个板块的分条内容必须有具体数据，禁止出现只有定性评价没有数量对比的条目。"
  - "数据须有对比基准（同比增长/历史最好水平/超额完成目标），不得只写绝对数字。"
  - "年度部署每条必须有量化目标，禁止使用'进一步加强''持续推进''切实做好'等无法衡量的表述。"
  - "第二部分战略方向不得缺失，不得将工作回顾直接跳到年度部署，三段式结构必须完整。"
  - "全篇同一意思只在一处表述，工作回顾中提到的问题必须在年度部署中有对应措施，不得两张皮。"

quality_checklist:
  - "检查开场是否在150字以内交代清楚议程，删除所有与议程无关的内容。"
  - "将工作回顾各板块小标题单独列出，检查是否有对仗三字格特色标题，替换所有通用套话标题。"
  - "逐条核查工作回顾的分条数据：每条至少有一个带对比基准的数字（同比/历史/目标完成率）。"
  - "检查第二部分战略方向各条是否与本单位实际结合，删除所有只引用上级文件未转化为本单位要求的段落。"
  - "检查年度部署各条的量化目标：逐条核实是否有具体数字，替换所有模糊表述。"
  - "全文通读检查意思流窜：同一个数据、同一项成绩是否在多处重复，发现后合并到最合适的位置。"
  - "检查结尾是否简短有力，删除所有重复前文内容的段落。"

---
doc_type: "工作报告"
usage_scene: "向上级主管部门、董事会或代表大会等报告一定时期内工作全面情况的正式文件。烟草系统工作报告通常按工作板块并列展开，数据密集，每项成效须有同比对比数据，兼具总结性和汇报性。"
word_count_range: "3000-10000"
structure_skeleton:
  - section: "总体情况概述（开篇）"
    required: true
    rule: "首段200-300字：一句话总体定性（如'保持了稳中有进、稳中提质、稳中增效的良好运行态势'）+核心指标数据（收入、税利、主要业务量等3-5个）+总体特点概括（1-2句）；开篇数据须与后文数据严格一致；不以背景介绍开篇，直接切入成效。"

  - section: "主要工作完成情况（核心段落，按工作板块并列）"
    required: true
    rule: "按工作板块分4-8个板块，每个板块格式固定：小标题用'（X）[工作领域]呈现「X、X、X」的XX态势'；板块开头1-2句说明本板块聚焦什么（'聚焦……'）或采取什么策略；板块正文用'一是/二是/三是'分条展开，每条150-300字，每条必须有：具体举措描述+成效数据（含同比对比）；每个板块400-700字。"

  - section: "重点专项工作说明"
    required: false
    rule: "对报告期内特别重要的专项工作（改革攻坚、重大任务）单独展开；一般1-2项；须说明专项工作背景、主要做法和阶段性成效；每项200-400字；不是必需，视实际情况决定。"

  - section: "存在的主要问题"
    required: true
    rule: "列举式呈现，一般3-5条；格式为'一是……二是……三是……'；每条用'问题名称+简要表现'结构，每条50-100字；须实事求是指出真实卡点，不得以'整体良好''有待加强'等模糊表述带过；此部分不展开分析原因，留给下步安排对应。"

  - section: "下一步工作安排"
    required: true
    rule: "针对问题提出下步重点工作，一般4-6条；与问题部分直接对应；每条用小标题领起，须有量化目标和时间节点（精确到季度或月份）；每条150-300字；结尾可写1-2句总体表态。"

  - section: "需要请示或说明的事项"
    required: false
    rule: "如有需要上级决策或资源支持的事项，单独列出；须明确写出'请求上级……'，不隐藏在建议表述中；视实际情况决定是否包含。"

constraints:
  - "开篇总体评价数据须与后文各板块数据严格一致，全文数据统计口径须统一（时间范围、统计范围）。"
  - "各工作板块分条内容每条至少有一个带同比对比的数据，禁止只写定性成效。"
  - "同比数据须说明对比基准（同比增长X%/超额完成目标X/历史最好水平），不得只写绝对数字。"
  - "各工作板块之间内容不得交叉重叠，同一项工作只在一个板块详细描述。"
  - "问题部分不得回避，不得以总体情况良好带过；每条问题须具体到工作事项，不写方向性大问题。"
  - "下步安排须与问题部分直接对应，每个问题必须有对应的解决措施，不得出现有问题无措施的情况。"
  - "全篇同一成绩、同一数据只在一处出现，开篇提到的数据不在正文各板块重复展开。"

quality_checklist:
  - "检查开篇核心数据是否在后文各板块中均有来源对应，确认数字前后一致无矛盾。"
  - "将各板块小标题单独列出：检查是否有对仗三字格特色标题，是否覆盖本期全部重点工作，是否有内容重叠。"
  - "逐条核查各板块分条数据：每条必须有同比对比数字，删除所有只有形容词没有数据的分条。"
  - "检查问题部分是否真实反映工作卡点，逐条评估：这条问题在领导眼中是否信息量足够。"
  - "检查下步安排每条是否能对应到问题部分的具体某一条，确保一一对应无遗漏。"
  - "全文通读检查意思流窜：同一项成绩或数据是否在多处重复出现，发现后合并到最合适的位置。"