    # # HTTP重定向到HTTPS
    # server {
    #     listen 80;
    #     server_name your-domain.com;
    #     
    #     location /.well-known/acme-challenge {
    #         root /path/to/certbot;
    #     }
    #     
    #     location / {
    #         return 301 https://$server_name$request_uri;
    #     }
    # }
