# 李忠秋《结构化写作》知识条目提炼
# 提炼日期：2026-03-15
# 来源：李忠秋、刘晨、张玮《结构化写作：心中有谱、下笔有神，赢得职场说服力》人民邮电出版社，2017

# ──────────────────────────────
# SP：结构原则
# ──────────────────────────────

- id: SP-001
  type: structure_principle
  title: "结论先行原则"
  content: |
    一次表达只支持一个核心观点或中心思想，且必须放在开头位置。
    无论是标题、序言还是段落，结论都要第一时间呈现。
    金字塔结构中，除最底层事实/数据外，每一层都必须是"结论"。
    错误示例：先罗列细节，最后才用"总之"点出结论。
    正确示例：开篇即给出"从选、育、留三方面着手"，再展开具体措施。
  applicable_types: ["汇报", "报告", "方案", "邮件", "工作总结", "讲话"]
  importance: A
  source: "李忠秋《结构化写作》基础篇·一、论：结论先行"
  usage: rule_engine

- id: SP-002
  type: structure_principle
  title: "以上统下原则"
  content: |
    上一层结论是对下一层信息的概括和总结；下一层信息是对上一层结论的解释和支撑。
    包含三个方向：
    1. 概括——不能只罗列，要对信息进行总结并得出结论；
    2. 论证——有观点必须给出充分依据；
    3. 对应——论点与论据必须在同一范畴内，不能"以偏概全"或"各说各话"。
    错误示例：结论说"三大工具"，下层却混入"关系"和"作用"等不同层次的内容。
  applicable_types: ["报告", "方案", "汇报", "工作总结"]
  importance: A
  source: "李忠秋《结构化写作》基础篇·二、证：以上统下"
  usage: rule_engine

- id: SP-003
  type: structure_principle
  title: "归类分组（MECE）原则"
  content: |
    具有相似性或相互关联的信息要按照一定标准归为同一逻辑范畴，且须满足MECE原则：
    - 相互独立（Mutually Exclusive）：同一分类中各信息之间不能重叠；
    - 完全穷尽（Collectively Exhaustive）：相对于上层结论，下层信息不能有所遗漏。
    信息达到3项及以上，首先考虑分类和排序。
    错误示例：将"职业发展""生活""个人爱好"并列，概念层次不齐。
  applicable_types: ["报告", "方案", "汇报", "工作总结"]
  importance: A
  source: "李忠秋《结构化写作》基础篇·三、类：归类分组"
  usage: rule_engine

- id: SP-004
  type: structure_principle
  title: "逻辑递进（有序排列）原则"
  content: |
    同一逻辑范畴的信息必须按照一定的逻辑顺序排列，三种常用顺序：
    1. 时间顺序——按事情发生先后排列（前、中、后；阶段一、二、三）；
    2. 结构顺序——按整体的组成部分排列，各部分间为并列关系；
    3. 重要顺序——按轻重缓急排列，重点突出、主次分明。
    规则：同一分支中相同层级只能使用同一种排序方式，不可混用。
  applicable_types: ["汇报", "报告", "方案", "工作总结", "讲话"]
  importance: A
  source: "李忠秋《结构化写作》基础篇·四、比：逻辑递进；方法篇·二STEP-2"
  usage: rule_engine

- id: SP-005
  type: structure_principle
  title: "金字塔结构核心模型"
  content: |
    条理清晰的文章背后必有金字塔结构：
    - 顶端：唯一的中心思想/总结论；
    - 横向：从不同维度展开（广度），各分支MECE；
    - 纵向：逐层向下延伸（深度），上下论证对应。
    四个原则对应两个方向：
    - 纵向：结论先行 + 以上统下；
    - 横向：归类分组 + 逻辑递进。
    构建顺序：先纵向（分层）→再横向（定序）。
  applicable_types: ["汇报", "报告", "讲话", "方案", "工作总结"]
  importance: A
  source: "李忠秋《结构化写作》基础篇·四个原则之间的关系；方法篇·四第三步"
  usage: rule_engine

- id: SP-006
  type: structure_principle
  title: "演绎与归纳信息组区分"
  content: |
    金字塔结构中的信息组分两类：
    1. 演绎信息组——下层各项之间是"前因后果"的因果逻辑，可用"因为……所以……"连接；
       常见形式：大前提→小前提→结论（标准式三段论）；
       或：现象→原因→解决方案（常见式三段论）。
    2. 归纳信息组——下层各项之间是"并列"关系，共同支撑上层结论；
       须满足MECE原则；需选择合适的排列顺序。
    注意：演绎信息组中，三段论的"结论"与上层概括形成的"结论"是两个不同概念。
  applicable_types: ["报告", "方案", "说服性写作"]
  importance: B
  source: "李忠秋《结构化写作》方法篇·四第四步·横向结构选顺序"
  usage: rule_engine

- id: SP-007
  type: structure_principle
  title: "现象-原因-方案须一一对应"
  content: |
    采用"现象→原因→解决方案"的层进式演绎结构时，解决方案须与原因一一对应。
    若原因列出3条，解决方案也应对应3条，不可数量错位。
    错误示例：原因列3项，解决方案提4项，读者无法判断对应关系。
  applicable_types: ["方案", "报告", "汇报"]
  importance: B
  source: "李忠秋《结构化写作》方法篇·四第四步"
  usage: rule_engine

- id: SP-008
  type: structure_principle
  title: "四种信息关系模式分类"
  content: |
    信息要素之间的关系可归为四种模式（共16种关系），用于形象化呈现：
    1. 流动模式：线性、流程、循环、关联——体现信息的流向与指向；
    2. 作用模式：对立、合力、平衡、阻碍——体现力量对比与相互作用；
    3. 关系模式：并列、重叠、包含、分割——体现结构与空间层次；
    4. 比较模式：成分、排序、序列、关联——体现数据间的比较关系。
    配套图示：成分→饼图；排序→条形图；序列→柱形图/折线图；关联→散点图。
  applicable_types: ["方案", "汇报", "PPT演示"]
  importance: B
  source: "李忠秋《结构化写作》方法篇·四第五步·结构罗盘·配关系·得图示"
  usage: rule_engine

# ──────────────────────────────
# LR：语言规范
# ──────────────────────────────

- id: LR-001
  type: language_rule
  title: "标题SPA三原则"
  content: |
    职场写作标题须同时满足三项标准：
    S（Simple，简单明确）：形式简洁，控制字数（16字以内），标题本身是一个明确的"结论"。
    P（Profit，利益相关）：突出与读者切身相关的利益点，从对方角度出发（换位思考）。
    A（Accurate，准确客观）：实事求是，不夸大，不过多表达主观情绪；标题须是全文的终极提炼。
    错误示例：《积分贷产品介绍》——言之无物。
    正确示例：《大力推广积分贷产品，实现多方共赢》——结论+利益。
  applicable_types: ["报告", "方案", "邮件", "汇报", "工作总结"]
  importance: A
  source: "李忠秋《结构化写作》方法篇·一STEP-1·WHAT"
  usage: rule_engine

- id: LR-002
  type: language_rule
  title: "标题字数限制16字"
  content: |
    职场正式写作标题应控制在16个字以内。
    不可照搬公众号文章的长标题风格——公众号标题是特殊商业逻辑的产物，不适用于商务写作。
    标题字数过多是无效信息堆砌的表现。
  applicable_types: ["报告", "方案", "邮件", "汇报"]
  importance: B
  source: "李忠秋《结构化写作》方法篇·一STEP-1·WHAT"
  usage: rule_engine

- id: LR-003
  type: language_rule
  title: "语言清晰明确具体三要求"
  content: |
    说服性写作对语言使用有三项基本准则：
    清晰——不使用模糊不清、模棱两可的词语；必要时对概念进行说明澄清。
    明确——观点鲜明，表明立场和态度，避免言之无物、流于形式。
    具体——用细致准确的事实和数据说话，避免过于抽象和笼统；细节描述能增强说服力。
  applicable_types: ["方案", "报告", "说服性写作", "汇报"]
  importance: A
  source: "李忠秋《结构化写作》方法篇·三STEP-3·WHAT"
  usage: rule_engine

- id: LR-004
  type: language_rule
  title: "成果描述用数字避模糊词"
  content: |
    描述工作成果时，务必做到清晰、明确，尽量使用数据说话。
    须避免的模糊词：加大、初步实现、有效提升、基本上、大概、加到多大、何为初步。
    错误示例：加大宣传力度，有效提升了品牌知名度。
    正确示例：新增渠道3个，品牌曝光量提升47%，新增客户超500人。
    若暂无数据，可用预期目标替代（说明"做这件事期望达到的目的是什么"）。
  applicable_types: ["工作总结", "汇报", "报告"]
  importance: B
  source: "李忠秋《结构化写作》方法篇·二STEP-1·HOW"
  usage: rule_engine

- id: LR-005
  type: language_rule
  title: "观点须含措施与预期成果"
  content: |
    说服性写作中，观点（核心结论）须具备两个要素：措施（做什么）+ 成效（预期效果如何）。
    仅有措施没有成效，观点显得空洞；仅有成效没有措施，缺乏可操作性。
    错误示例：观点为"商务礼仪是门实操课程"——含糊，未体现措施和结果。
    正确示例：观点为"申请更多资源，加大通信网络建设，提升市场占有率至50%"。
  applicable_types: ["方案", "说服性写作", "汇报"]
  importance: B
  source: "李忠秋《结构化写作》方法篇·三STEP-1·WHAT"
  usage: rule_engine

- id: LR-006
  type: language_rule
  title: "序言SCQA各项须完整对应"
  content: |
    序言写作中，SCQA四要素各项信息须描述完整，且前后须逻辑衔接顺畅。
    常见错误：
    1. S、C、Q、A信息描述不完整或表述混乱；
    2. S与C之间过渡生硬；
    3. Q为提问而提问，不能引导读者思考正确方向；
    4. A与核心结论不对应（跑偏）；
    5. S描述过于简单，缺乏代入感；
    6. C冲突点不突出、不深刻；
    7. 内容隐含的逻辑经不起推敲。
  applicable_types: ["汇报", "报告", "方案", "邮件"]
  importance: B
  source: "李忠秋《结构化写作》方法篇·一STEP-2·Tips"
  usage: rule_engine

# ──────────────────────────────
# MT：方法论
# ──────────────────────────────

- id: MT-001
  type: methodology
  title: "SCQA序言四要素框架"
  content: |
    职场写作序言采用SCQA模式构建背景导入：
    S（Situation，情境）：对原本稳定状态的描述，是读者认可的已知事实，建立共情与代入感。
    C（Complication，冲突）：打破稳定状态的因素，制造矛盾张力，触发读者心中的疑问。
    Q（Question，疑问）：由冲突引发的问题，引导读者思考方向（若疑问明显，可隐去）。
    A（Answer，回答）：解答疑问，即文章的核心结论/主题。
    A与标题须保持对应，SCQA序言实质是用SCQ导出主题A（结论先行在序言层的体现）。
  applicable_types: ["汇报", "报告", "方案", "邮件", "讲话"]
  importance: A
  source: "李忠秋《结构化写作》方法篇·一STEP-2·WHAT"
  usage: prompt_supplement

- id: MT-002
  type: methodology
  title: "SCQA四种顺序变体"
  content: |
    SCQA四要素可按不同顺序排列，形成不同风格：
    1. 标准式（S→C→Q→A）：平稳铺陈，适合多数正式场合；
    2. 开门见山式（A→S→C）：先抛结论，适合对方已熟悉背景时；
    3. 突出忧虑式（C→S→A）：先呈冲突，适合需要引起重视时；
    4. 突出信心式（Q→S→C→A）：先抛问题，适合需展示解决能力时。
    同一问题还可分为三种结构类型：
    恢复原状型（原有稳定→被破坏→如何恢复）；
    预防隐患型（稳定状态→潜在风险→如何预防）；
    追求理想型（现有基础→不足之处→如何升级）。
  applicable_types: ["汇报", "报告", "方案", "邮件"]
  importance: B
  source: "李忠秋《结构化写作》方法篇·一STEP-2·WHAT"
  usage: prompt_supplement

- id: MT-003
  type: methodology
  title: "并列式内容展开（2W1H）"
  content: |
    传递信息/描述说明类写作，采用2W1H并列框架展开核心内容：
    WHAT——是什么（描述事物本身）；
    WHY——为什么（说明原因/价值）；
    HOW——怎么做（操作方法/实施路径）。
    三者顺序可根据场合灵活调整，也可选择性只展开其中部分。
    若对方已接受前提，可着重HOW；若需先说服，可先说WHY；若需说清楚内容，先说WHAT。
    适用于：向领导汇报工作进展、向同事介绍项目、向客户介绍产品。
  applicable_types: ["汇报", "报告", "方案", "邮件"]
  importance: A
  source: "李忠秋《结构化写作》方法篇·一STEP-3·WHAT"
  usage: prompt_supplement

- id: MT-004
  type: methodology
  title: "层进式内容展开（现象-原因-方案）"
  content: |
    澄清问题/解决问题类写作，采用层进式框架：
    现象（是什么问题）→原因（为什么出现）→解决方案（怎么解决）。
    格式固定，有明确先后顺序：先发现问题，再分析，再解决。
    层进式具有强说服力，因为它隐含逻辑推理（三段论演绎形式）。
    注意：现象、原因、解决方案须一一对应（见SP-007）。
    与并列式的区别：并列式灵活，层进式固定；并列式侧重描述，层进式侧重问题解决。
  applicable_types: ["报告", "方案", "汇报"]
  importance: A
  source: "李忠秋《结构化写作》方法篇·一STEP-3·WHAT"
  usage: prompt_supplement

- id: MT-005
  type: methodology
  title: "工作总结三步法"
  content: |
    写出有思想、有高度的工作总结，分三步：
    第一步 成果分类：用"行动-成果"表梳理主要工作事项及对应成果；区分"行为结果"和"成就结果"，重点突出成就；对成果进行开放式或封闭式分类。
    第二步 排序整理：按时间顺序、结构顺序或重要顺序对工作成果进行排列；同层级只用一种顺序。
    第三步 概括总结：用信息摘要法或逻辑推论法对每一层级进行概括，形成明确的结论；结论须体现措施与成效，不可仅是类名。
    核心公式：工作总结 = 总结工作成果（而非罗列工作内容）。
  applicable_types: ["工作总结", "汇报"]
  importance: A
  source: "李忠秋《结构化写作》方法篇·二"
  usage: prompt_supplement

- id: MT-006
  type: methodology
  title: "行动-成果表工具"
  content: |
    梳理工作成果的基础工具，含两列：
    行动列——填写主要工作事项（"我做了什么"，即行为）；
    成果/目的列——填写对应的"成就结果"（取得了什么成效/价值）。
    使用要点：
    1. 若工作尚未完成，用预期目标代替成果；
    2. 一项行动有多个成果时，分"成果1/成果2"列出；
    3. 日常坚持记录，避免年终总结时无素材可写。
    思考指引：看完"行动"后追问自己"然后呢？"以逼出真正的成果。
  applicable_types: ["工作总结"]
  importance: B
  source: "李忠秋《结构化写作》方法篇·二STEP-1·WHAT"
  usage: prompt_supplement

- id: MT-007
  type: methodology
  title: "开放式与封闭式分类"
  content: |
    对信息进行分类有两种方式：
    开放式分类——自行选定标准进行分类，无固定模型，但必须遵循MECE原则；适合构建个性化框架。
    封闭式分类——直接套用成熟模型（5W1H、SWOT、4P、PDCA、选育用留、ASK等），拿来主义；模型经过实践检验，更容易被对方接受。
    两者本质相通：都是建立结构化、框架性的思维方式。
    选择原则：优先考虑是否有合适的封闭式模型；没有或不适用时再开放式构建。
  applicable_types: ["工作总结", "方案", "报告"]
  importance: B
  source: "李忠秋《结构化写作》方法篇·二STEP-1·WHAT"
  usage: prompt_supplement

- id: MT-008
  type: methodology
  title: "信息摘要法与逻辑推论法"
  content: |
    两种向上层概括结论的方法：
    信息摘要法——从多个具体信息中提炼共同的本质属性，形成上层抽象概念。
    示例：龙猫、仓鼠、蜥蜴、兔子、乌龟→消费者需要小动物做宠物养。
    逻辑推论法——根据多个前提推导出它们共同导向的判断/结果。
    示例：财产共有可能增加税、妨碍遗嘱、使离婚复杂……→财产共有将使你的家庭受到损害。
    区别：摘要法提取共同属性；推论法找共同导向的结果。
    实践中逻辑推论法更常用，难度也更大，需要深度思考。
  applicable_types: ["工作总结", "报告", "汇报", "方案"]
  importance: A
  source: "李忠秋《结构化写作》方法篇·二STEP-3·WHAT"
  usage: prompt_supplement

- id: MT-009
  type: methodology
  title: "WA目标法确定说服目标"
  content: |
    说服性写作前，用WA法设定明确目标：
    W（Who）——说服的对象是谁（具体到人或群体，不能只说"公司"）；
    A（Achievement）——希望对方看完后做到什么（同意/认可/采纳/接受……，并采取哪些行动）。
    完整表述：希望[W]在看完我写的内容之后，能够[A]。
    同一内容面对不同W时，目标不同，观点切入点也不同。
    目标与观点须区分：目标是期望的行动结果；观点是说服内容的核心思想。
  applicable_types: ["方案", "说服性写作", "申请", "汇报"]
  importance: A
  source: "李忠秋《结构化写作》方法篇·三STEP-1·WHAT"
  usage: prompt_supplement

- id: MT-010
  type: methodology
  title: "疑问-回答法构建说服框架"
  content: |
    在明确观点后，站在读者（对方）立场设想其可能产生的疑问，逐一回答，以此构建说服框架。
    操作步骤：
    1. 明确观点（结论）；
    2. 设想对方针对此观点会问哪些问题（换位思考）；
    3. 逐一回答，回答本身也形成新的观点，可继续设想下一层问题；
    4. 横向覆盖越广，纵向越深入，说服力越强。
    最难之处在于"设想问题"——问题必须是对方真正关心的，而非自己掌握的信息的反向推导。
    可配合5W2H模型确保问题覆盖全面（见MT-011）。
  applicable_types: ["方案", "说服性写作", "申请", "汇报"]
  importance: A
  source: "李忠秋《结构化写作》方法篇·三STEP-2·WHAT"
  usage: prompt_supplement

- id: MT-011
  type: methodology
  title: "5W2H设想读者疑问"
  content: |
    运用5W2H模型从七个维度设想读者可能提出的问题，保证问题覆盖全面：
    What——是什么（对象/内容是什么）；
    Who——谁（相关人员是谁）；
    Why——为什么（原因/必要性）；
    Where——在哪里（发生地点/适用范围）；
    When——何时（时间节点/持续时间）；
    How——如何（实施方式/操作步骤）；
    How much——程度/量（范围/影响/费用/数量）。
    注：5W2H是问题引导框架，不代表具体问题本身，需结合实际设想真实疑问。
  applicable_types: ["方案", "说服性写作", "汇报"]
  importance: B
  source: "李忠秋《结构化写作》方法篇·三STEP-2·WHAT；方法篇·四第一步"
  usage: prompt_supplement

- id: MT-012
  type: methodology
  title: "演绎推理三段论应用"
  content: |
    演绎推理是从一般原理推导到特殊结论（从一般到特殊），最常用形式为三段论：
    大前提：某个已知的一般性原理/规律/法则；
    小前提：当前研究的特殊情况；
    结论：由大前提对小前提推导出的判断。
    三段论成立的必要条件：
    1. 前提必须真实（大、小前提内容符合客观事实）；
    2. 推理形式有效（严格遵循逻辑规则）。
    注意：大前提须能"包含"小前提，二者不可割裂；大前提方向错误则一切后续均无效。
    写作应用：大前提描述标准/规律，小前提描述自身情况，结论即观点。
  applicable_types: ["方案", "说服性写作", "汇报"]
  importance: B
  source: "李忠秋《结构化写作》方法篇·三STEP-3·WHAT"
  usage: prompt_supplement

- id: MT-013
  type: methodology
  title: "归纳推理简单枚举法"
  content: |
    归纳推理从个别事物推导出一般结论（从特殊到一般），日常最常用的是简单枚举法：
    列举多个具有相同属性的个体，推导出该类事物的普遍规律。
    应用于写作：将多个并列信息项归纳为共同的上层结论（与信息摘要法/逻辑推论法配合）。
    注意：枚举对象越多，结论可靠性越大；枚举对象过少容易"以偏概全"。
    演绎与归纳的关系：两者相辅相成，归纳形成的结论可成为演绎的大前提；
    在复杂方案中，上层常用归纳，下层常用演绎，或交替使用。
  applicable_types: ["方案", "说服性写作", "报告"]
  importance: B
  source: "李忠秋《结构化写作》方法篇·三STEP-3·WHAT"
  usage: prompt_supplement

- id: MT-014
  type: methodology
  title: "五步方案写作法"
  content: |
    完整方案写作分五步（基于结构思考力三层次模型）：
    第一步 描述问题定方向——用5W2H全面描述问题，弄清"问题是什么"后再动手；
    第二步 基于目标定主题——用WA法确定目标，用SPA原则设计标题，用SCQA写序言；
    第三步 纵向结构分层次——自上而下（疑问-回答展开）或自下而上（罗列→分类→概括）建立框架；
    第四步 横向结构选顺序——明确信息组为演绎型或归纳型，选定排序逻辑；
    第五步 形象表达做演示——用结构罗盘"配得上"三步（配关系→得图示→上包装）进行视觉化处理。
    总原则：先框架再细节，先整体再局部。
  applicable_types: ["方案"]
  importance: A
  source: "李忠秋《结构化写作》方法篇·四"
  usage: prompt_supplement

- id: MT-015
  type: methodology
  title: "纵向框架两种构建路径"
  content: |
    根据写作起点不同，纵向建立框架有两种路径：
    自上而下（有明确主题时）：
      第一步 设定主题；
      第二步 针对主题换位思考，设想对方会提哪些问题；
      第三步 回答这些问题，形成初步框架（可配合2W1H/5W2H）。
    自下而上（手头有大量素材时）：
      第一步 罗列所有信息；
      第二步 对信息进行分类（找共性：静态属性类或动态行动类）；
      第三步 对信息概括形成结论（信息摘要法或逻辑推论法），逐层向上。
    两种路径可交替使用，不是截然割裂的。
  applicable_types: ["方案", "报告", "工作总结"]
  importance: B
  source: "李忠秋《结构化写作》方法篇·四第三步"
  usage: prompt_supplement

- id: MT-016
  type: methodology
  title: '"结构罗盘"配得上"三步法"'
  content: |
    对信息进行形象化（视觉化）呈现，分三步：
    第一步 配关系——深入探寻信息要素之间实际的逻辑关系（参考四种模式16种关系，见SP-008）；
    第二步 得图示——选择与该关系对应的图示（流程图、矩阵图、饼图、柱形图等）直观展现；
    第三步 上包装——用简化、类比、整合、引用等方式对信息进行高度提炼，使其形象易记。
    简化：一段话→一句话→一个字；类比：将关系比喻为熟悉的事物；
    整合：用词语/字母/数字/颜色统一归拢；引用：借用广告语/歌词/名言。
    四种包装方式常组合使用，"简化"往往是起点。
  applicable_types: ["方案", "汇报", "PPT演示"]
  importance: B
  source: "李忠秋《结构化写作》方法篇·四第五步"
  usage: prompt_supplement

- id: MT-017
  type: methodology
  title: "说服三维度综合检验"
  content: |
    一次有效说服须通过三个层面的检验：
    1. 目标明确——读者能看懂、抓住核心诉求（对方知道你要什么）；
    2. 换位思考——读者能看到自己的利益被考虑（对方感到被尊重）；
    3. 有理有据——充分且合理的理由与逻辑支撑（对方能被说服）。
    三步写作过程中的三次视角切换：
    设定目标时——自问自答（我为何要说服？预期是什么？）；
    确定观点时——想象自己与对方沟通（核心诉求是什么？）；
    疑问回答时——完全代入对方立场（对方会关心哪些问题？）。
  applicable_types: ["方案", "说服性写作", "申请", "汇报"]
  importance: A
  source: "李忠秋《结构化写作》方法篇·三"
  usage: prompt_supplement

# ──────────────────────────────
# PM：金句素材
# ──────────────────────────────

- id: PM-001
  type: phrase_material
  title: '""论证类比"四原则口诀"'
  content: |
    结构化写作四个核心原则的速记口诀：
    论——结论先行（一次表达一个核心观点，放在最前）；
    证——以上统下（上层统领下层，下层支撑上层）；
    类——归类分组（相似信息归为同一逻辑范畴）；
    比——逻辑递进（同层信息按逻辑顺序排列）。
    可用于自检：写完一篇文章，逐条对照"论证类比"验证是否合格。
  applicable_types: ["汇报", "报告", "讲话", "方案", "工作总结"]
  importance: A
  source: "李忠秋《结构化写作》基础篇"
  usage: dictionary

- id: PM-002
  type: phrase_material
  title: "工作总结核心公式"
  content: |
    工作总结 = 总结工作成果（而非罗列工作内容）。
    受众关注的是成果，不是过程。
    工作写完后，须追问自己："然后呢？"——如果回答不出来，说明只有行为，没有成就。
    "功劳"是成就，"苦劳"是行为；多数绩效考核以成就为主。
    领导的反馈升级路径：踏实勤恳→有思想有高度→高级职业经理人（靠概括能力实现跨越）。
  applicable_types: ["工作总结", "汇报"]
  importance: A
  source: "李忠秋《结构化写作》方法篇·二"
  usage: dictionary

- id: PM-003
  type: phrase_material
  title: "标题万能公式"
  content: |
    职场写作标题设计公式：谁 + 做了什么事 + 得到什么结果。
    应用示例：
    《积分贷产品介绍》→《大力推广积分贷产品，实现多方共赢》
    《春节内部推荐政策》→《春节期间内推奖励翻翻》
    《4G终端产品营销方案》→《加大资源投入，提升4G客户份额》
    《××公司战略规划报告》→《改革创新，降本增效，提升经营业绩》
    核心逻辑：让读者一眼看到"对你有什么好处"（利益点）。
  applicable_types: ["报告", "方案", "邮件", "汇报", "工作总结"]
  importance: A
  source: "李忠秋《结构化写作》方法篇·一STEP-1·WHAT"
  usage: dictionary

- id: PM-004
  type: phrase_material
  title: "写作自检三连问"
  content: |
    写作或梳理信息时的三个自检问题：
    1."然后呢？"——逼迫自己从行为上升到成果，从现象上升到结论。
    2."你到底想说什么？"（What's your point）——检验结论是否清晰明确。
    3."如果我是对方，还可能提哪些问题？"——推动换位思考，扩大疑问覆盖面。
    适用于：写完初稿后的自查；卡壳时的思维突破；概括结论前的逼迫式追问。
  applicable_types: ["汇报", "报告", "讲话", "方案", "工作总结"]
  importance: B
  source: "李忠秋《结构化写作》方法篇·二STEP-3；方法篇·三STEP-2"
  usage: dictionary

- id: PM-005
  type: phrase_material
  title: "写作失败四大根源诊断"
  content: |
    读者对一篇文章/邮件/方案产生的三类负面反馈：
    不愿看——标题/开头无利益点，无吸引力；
    看不懂——结构松散，观点不清，逻辑混乱；
    记不住——缺乏分类和概括，信息零散堆砌。
    四大根源：
    1. 没有结论先行（让读者猜意图）；
    2. 缺乏分类（信息凌乱，无规律可循）；
    3. 没有概括观点（有分类但没结论，读者仍不明白）；
    4. 缺乏顺序（各类之间没有逻辑关系）。
  applicable_types: ["汇报", "报告", "讲话", "方案", "工作总结"]
  importance: B
  source: "李忠秋《结构化写作》基础篇·四个原则引例分析"
  usage: dictionary

- id: PM-006
  type: phrase_material
  title: "PPT本义与制作标准"
  content: |
    PPT全称PowerPoint：先有清晰的Point（观点），再用Power（图示/形象化）增强。
    一份好的PPT最基本的要求：形成清晰明确的Point，然后让Point更有Power。
    用大段文字直接复制粘贴到PPT，违背了PPT的本意。
    形象化核心：不是配图片，而是用"配得上"三步法呈现信息之间的逻辑关系。
  applicable_types: ["汇报", "方案", "PPT演示"]
  importance: C
  source: "李忠秋《结构化写作》方法篇·二STEP-3；方法篇·四第五步"
  usage: dictionary
