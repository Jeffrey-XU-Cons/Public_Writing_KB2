entries_sp:

  # --- SP-001 to SP-008: 李忠秋《结构化写作》---

  - global_id: SP-001
    orig_id: "SP-001"
    source_file: "李忠秋_结构化写作.yaml"
    title: "结论先行原则"
    importance: A
    summary: |
      一次表达只支持一个核心观点，必须放在开头。标题、序言、段落均要结论第一时间呈现。
      错误：先罗列细节，最后才"总之"。正确：开篇即给出核心结论，再展开。

  - global_id: SP-002
    orig_id: "SP-002"
    source_file: "李忠秋_结构化写作.yaml"
    title: "以上统下原则"
    importance: A
    summary: "上层结论是对下层信息的概括；下层信息是对上层结论的解释。论点与论据必须同一范畴。"

  - global_id: SP-003
    orig_id: "SP-003"
    source_file: "李忠秋_结构化写作.yaml"
    title: "归类分组（MECE）原则"
    importance: A
    summary: "相似信息归为同一逻辑范畴，须满足MECE：相互独立（不重叠）+ 完全穷尽（不遗漏）。"

  - global_id: SP-004
    orig_id: "SP-004"
    source_file: "李忠秋_结构化写作.yaml"
    title: "逻辑递进（有序排列）原则"
    importance: A
    summary: "同一范畴信息按时间/结构/重要性顺序排列，同一分支中不可混用不同排序方式。"

  - global_id: SP-005
    orig_id: "SP-005"
    source_file: "李忠秋_结构化写作.yaml"
    title: "金字塔结构核心模型"
    importance: A
    summary: "顶端=唯一中心思想；纵向=结论先行+以上统下；横向=归类分组+逻辑递进。构建顺序：先纵后横。"

  - global_id: SP-006
    orig_id: "SP-006"
    source_file: "李忠秋_结构化写作.yaml"
    title: "演绎与归纳信息组区分"
    importance: B
    summary: "演绎：从普遍到特殊（大前提→小前提→结论）；归纳：从特殊到普遍（多个相似论据→共同结论）。"

  - global_id: SP-007
    orig_id: "SP-007"
    source_file: "李忠秋_结构化写作.yaml"
    title: "现象-原因-方案须一一对应"
    importance: A
    summary: "问题分析三层次须严格对应：有几个现象就找几个原因，有几个原因就给几个方案，不可跳层。"

  - global_id: SP-008
    orig_id: "SP-008"
    source_file: "李忠秋_结构化写作.yaml"
    title: "四种信息关系模式分类"
    importance: B
    summary: "并列关系/层进关系/因果关系/总分关系——识别段落间关系类型，决定连接词和排列方式。"

  # --- SP-009 to SP-020: 胡森林《公文写作底层心法》---

  - global_id: SP-009
    orig_id: "SP-001"
    source_file: "胡森林_公文写作底层心法.yaml"
    title: "文种选择决策规则（请示/报告/通知/函）"
    importance: A
    summary: |
      请示：需上级批准，一文一事，结尾"请批示"；报告：陈述告知，不含请求，结尾"特此报告"；
      通知：下行布置工作；函：平行机关协商。核心：请示需批复，报告不需要。

  - global_id: SP-010
    orig_id: "SP-002"
    source_file: "胡森林_公文写作底层心法.yaml"
    title: "请示与报告的六大本质区别"
    importance: A
    summary: "性质/内容/结尾/答复/时间/禁止混用——请示事前，报告事中事后；请示必须回复，报告只需知晓。"

  - global_id: SP-011
    orig_id: "SP-003"
    source_file: "胡森林_公文写作底层心法.yaml"
    title: "行文规范三原则（一文一事/逐级行文/不越级）"
    importance: A
    summary: "一文一事；逐级行文不越级（紧急情况须抄送被越级机关）；行文范围与保密等级匹配。"

  - global_id: SP-012
    orig_id: "SP-004"
    source_file: "胡森林_公文写作底层心法.yaml"
    title: "一文一题原则（主题统摄全篇）"
    importance: A
    summary: "一篇公文只能有一个核心主题。主题来源：关注点（最受关心）+ 闪光点（最有价值）+ 不同点（创新处）。"

  - global_id: SP-013
    orig_id: "SP-005"
    source_file: "胡森林_公文写作底层心法.yaml"
    title: "公文内容以'实'为要四标准"
    importance: A
    summary: "判断内容是否'实'的四个维度：是否说明问题/是否反映工作/是否揭示规律/是否提出对策。"

  - global_id: SP-014
    orig_id: "SP-006"
    source_file: "胡森林_公文写作底层心法.yaml"
    title: "结构不板不乱浑然一体原则"
    importance: B
    summary: "不板：结构不僵硬，因文制宜；不乱：层次清晰，逻辑严密；浑然一体：形散神不散。"

  - global_id: SP-015
    orig_id: "SP-007"
    source_file: "胡森林_公文写作底层心法.yaml"
    title: "结构四层次模型"
    importance: B
    summary: "公文结构四层次：篇章级（总体框架）→ 段落级（段间关系）→ 句子级（句间衔接）→ 词汇级（精准用词）。"

  - global_id: SP-016
    orig_id: "SP-008"
    source_file: "胡森林_公文写作底层心法.yaml"
    title: "层次顺序三维逻辑"
    importance: B
    summary: "公文层次的三种基本排列逻辑：①时序（先后）②重要性（主次）③逻辑（因果/总分）。"

  - global_id: SP-017
    orig_id: "SP-009"
    source_file: "胡森林_公文写作底层心法.yaml"
    title: "同一律与矛盾律（逻辑一致性原则）"
    importance: A
    summary: "同一律：全文对同一概念的表述须一致；矛盾律：不得在同一文中出现自相矛盾的表述。"

  - global_id: SP-018
    orig_id: "SP-010"
    source_file: "胡森林_公文写作底层心法.yaml"
    title: "公文'及物'性本质（研究事不研究字）"
    importance: A
    summary: "公文的核心是'事'，写作时应把主要精力放在研究事（事情本身）而非研究字（表达形式）。"

  - global_id: SP-019
    orig_id: "SP-011"
    source_file: "胡森林_公文写作底层心法.yaml"
    title: "观点提炼源于实践高于实践"
    importance: B
    summary: "好观点的提炼标准：来自实际工作（有依据），但不能停留在事实层面（必须升华为规律性认识）。"

  - global_id: SP-020
    orig_id: "SP-012"
    source_file: "胡森林_公文写作底层心法.yaml"
    title: "文以载道价值观优先原则"
    importance: A
    summary: "公文须有正确价值导向。写作者的价值观决定文章的高下：有公心/正气/责任感，才能写出有灵魂的公文。"

