---
# 《笔杆子是怎样炼成的》合并提炼
# 版本A：李永新《笔杆子是怎样炼成的：公文写作实战》清华大学出版社 2021
# 版本B：朱立东/李永新《笔杆子是怎样炼成的2：公文写作模板》清华大学出版社 2023
# 提炼重点：版本A侧重写作实战方法论；版本B侧重各文种共性框架与高频词句
# 提炼时间：2026-03-15
# 去重对象：前4本书（文无第一、公文写作技法大全、机关文稿写作技巧、公文写作大手笔）

entries:

  # ============ 核心认知层（写材料的本质与层次） ============

  - id: BG-001
    type: MT
    title: 写手三个层次与三个对应关系
    content: |
      写手成长三个层次：
      （1）领导出框架，写手能出词句 → 对应水准：以文叙事 → 对应等级：写得像
      （2）领导出思想，写手能出框架 → 对应水准：以文辅政 → 对应等级：写得是
      （3）领导画个圈，写手能出思想 → 对应水准：以文鼎新 → 对应等级：写得好

      路径要求：先从词句积累入手（语感+常用词语），再练谋篇布局（体例+提纲），最终向出思想迈进（深度研究工作+增强方法论）。
    applicable_types: ["汇报", "报告", "讲话", "方案"]
    importance: A
    source: 版本A·前言
    usage: prompt_supplement

  - id: BG-002
    type: SP
    title: 文稿起草本质——深度研究四要素
    content: |
      文稿起草的本质：将深入提出问题、分析问题、解决问题的过程用文字呈现。

      写好材料离不开四个深度研究：
      （1）深度研究事：把工作搞透是基本前提（从上情、下情、内情、外情四维梳理历史沿革/现状/问题/对策）
      （2）深度研究人：把讲者（角色意识/站位思维/文风特点）和受众（关注点/互动点）搞透是写得好的关键
      （3）深度研究体：搞清体例结构是最基础工作（广搜权威范文，照猫画虎定体例）
      （4）深度研究景：主动研究具体场景背景（画面意识+发展眼光+"现挂"技巧）

      一篇材料的深度/广度/温度，取决于对事研究程度；能否写得出彩，取决于对人的研究程度；是否对路，取决于体例研究程度。
    applicable_types: ["汇报", "报告", "讲话", "方案"]
    importance: A
    source: 版本A·第1章
    usage: rule_engine

  - id: BG-003
    type: MT
    title: 平时磨刀五字法——要搜读合练
    content: |
      写好材料的平时积累五字法：
      （1）要：多主动调度，动态兜清情况。平时多要现成的数据统计、汇报总结讲话等成形材料，做到"一调多用"；固化掌握上情/下情/内情/外情四维度。
      （2）搜：四处寻媒介，广泛储备素材。重点看权威报刊（《人民日报》《求是》等）、政府网站文件，搜集常写体例范文。
      （3）读：静心深阅读，注重实际占有。泛读+精读相结合，精读不留痕=读了白读；精读要做好固化（标注/笔记/汇总词句集锦）。
      （4）合：分类萃与合，随时揣摩备用。材料分类储存，汇集总结类小标题，形成可随时调取的素材库。
      （5）练：沙场秋点兵，实战靶向储备。建立几个文稿模板，通过投稿练兵。
    applicable_types: ["汇报", "报告", "讲话", "方案"]
    importance: A
    source: 版本A·第5章
    usage: prompt_supplement

  - id: BG-004
    type: MT
    title: 上情下情内情外情四维情况积累法
    content: |
      素材积累四维度及各自作用：
      （1）上情：掌握各级重要讲话、批示、指示精神 → 增加文章高度（决定材料的下线）
      （2）下情：挖掘基层可复制可传播的亮点做法、共性问题 → 增加文章温度（接地气、务实、有操作性）
      （3）内情：本单位重点业务工作进展数据、历次成形材料 → 决定材料的个性和针对性（集大成）
      （4）外情：前沿理论、先进地区经验、学界文章 → 决定材料的上线（视野思维、务虚谋划）

      战时梳理四情的标准动作：接到任务后分别建立临时档案夹，汇聚各维素材后边汇集边消化边酝酿框架。
    applicable_types: ["汇报", "报告", "讲话", "方案"]
    importance: A
    source: 版本A·第5章/第7章
    usage: rule_engine

  # ============ 定盘子——把握意图层 ============

  - id: BG-005
    type: MT
    title: 定盘子三步骤——吃准材料基本盘
    content: |
      接到写作任务时，需要"定盘子"的三步操作：
      （1）捋清任务来龙去脉：追溯任务来源（是否来自更高层级），逐一研究相关通知/方案/批示/讲话的共性要求和个性要求，必要时直接向上级通话确认具体意图。
      （2）吃准领导意图（"变量"）：写材料的变量=意图，定量=对工作的深度研究。难在意图把握，累在格物致知，贵在两者结合。意图不清时，先拉出不超过一页纸的提纲，由领导审定后再展开写。
      （3）敲定总体写法和素材支撑：采取务虚务实结合，多渠道酝酿框架、主要基调、支撑素材、大致篇幅、起草人员、交稿时间。

      盘子敲好后才能正式动笔，可大大降低推倒重来的风险。
    applicable_types: ["汇报", "报告", "讲话", "方案"]
    importance: A
    source: 版本A·第6章
    usage: rule_engine

  - id: BG-006
    type: MT
    title: 平时把握领导意图七查法
    content: |
      平时动态把握领导意图的七个渠道：
      （1）查领导讲话：系统搜集梳理各内部载体（简报/内刊/工作通报/政务信息）中的领导讲话材料
      （2）查领导指示批示：收集领导批示原文，揣摩关注点和用词习惯
      （3）查领导的调度记录：平时的工作部署会/碰头会纪要等
      （4）查领导走访调研情况：陪同调研或调研后的相关材料
      （5）查领导读书关注点：领导阅读的书报、订阅的公众号、关注的热点
      （6）查领导的专业背景和工作经历：有助于预判其思维特点和语言习惯
      （7）查多研究领导相关的政务信息和上级材料：通读一年以来相关材料后"找到感觉"再动笔
    applicable_types: ["汇报", "报告", "讲话"]
    importance: B
    source: 版本A·第6章
    usage: prompt_supplement

  - id: BG-007
    type: SP
    title: 领导说的公文逻辑七维
    content: |
      领导批评材料"没有逻辑性"时，通常指以下七种逻辑的欠缺：
      （1）领导意图逻辑：是否准确把握领导的关注点和意图（最重要的变量）
      （2）工作内在逻辑：是否符合工作本身历史沿革/发展现状/存在问题/面临形势/下步措施的内在顺序
      （3）唯物辩证逻辑：是否符合马克思主义哲学基本原理（认识论/实践论/矛盾论等）
      （4）文种体例逻辑：是否符合各文种的基本体例框架（总结"三步曲"、专题讲话"三为什么"等）
      （5）段落结构逻辑：各段各部分与主题相关性，起承转合是否顺畅
      （6）语句逻辑：主谓宾定状补是否运用得当
      （7）形式逻辑：概念不交叉，判断科学，推理严谨
    applicable_types: ["汇报", "报告", "讲话", "方案"]
    importance: A
    source: 版本A·第6章
    usage: rule_engine

  - id: BG-008
    type: LR
    title: 领导文稿8分共性2分个性法则
    content: |
      领导讲话等材料通常是8分共性、2分个性：
      - 80%是通用的（共性思维/套路/表达），可花80%的时间研究广义技法
      - 20%是个性化的（领导个人风格/关注点/文风习惯），需花20%的时间研究领导本人

      实操：研究广义技法 → 动态跟进多个不同层级领导的讲话材料（锤炼共性思维、开拓视野、增强语感）；研究个性特点 → 多收集本单位领导以前材料，从讲话/谈话/批示/书报关注中悟其文风、悟其关切。

      适用于例行类会议材料时：9分按历史惯例，1分揣摩领导个人特点。
      适用于领导根据新情况新问题召开的会议材料：切记吃透领导意图，没有吃透时不要贸然动笔。
    applicable_types: ["讲话"]
    importance: A
    source: 版本A·第6章
    usage: rule_engine

  # ============ 搭架子——列提纲层 ============

  - id: BG-009
    type: MT
    title: 列提纲三要：研究事、研究体、实战技巧
    content: |
      搭架子（列提纲）三个维度：
      （1）列提纲前重中之重——深度研究事：从上情（站位）/内情（集大成）/下情（接地气）/外情（辅政价值）四维梳理情况，是持续酝酿提纲和拟出厚实材料的关键步骤
      （2）列提纲前基础要件——深度研究体：先找权威高层级范文确定基本体例，再找相近层级范文确定具体框架，最多找10篇左右研究共性特点
      （3）实战技巧：
         - 一稿过诀窍：将领导反复说的关键词/观点放到提纲里
         - "性感"法则：用"×性""×感"的词语组合概括工作特点和成效
         - 快速列成效类提纲：梳理量上取胜（数据指标）+ 质上取胜（获批示/获排名/获表彰）
         - 快速列措施做法提纲：按"为什么+是什么+怎么办"三块归纳
    applicable_types: ["汇报", "报告", "讲话", "方案"]
    importance: A
    source: 版本A·第7章
    usage: rule_engine

  - id: BG-010
    type: SP
    title: 工作报告/汇报/总结三种文体区别
    content: |
      三种文体的核心特征对比：

      工作报告——"端庄专业年年见"
      - 频次：一年一次（如政府/部门年度工作报告）
      - 受众：参会代表 + 社会大众
      - 体例：主题 + 过去一年工作回顾（成效/做法/经验/问题）+ 未来一年工作建议（指导思想/目标/措施）

      工作汇报——"灵活通俗天天见"
      - 频次：随时（督查巡察/专项会议/领导约谈）
      - 受众：督查巡察主体/有关会议参会人员（听者比讲者更重要）
      - 体例：灵活，可详可简，口语化为主；三段式（基本情况+存在问题+下步打算）最常见

      工作总结——"三段固定时时见"
      - 频次：月/季/半年/年度
      - 受众：各级领导，供掌握情况和决策参考
      - 体例：固定三段式（工作进展+存在问题+下步打算）
    applicable_types: ["汇报", "报告"]
    importance: A
    source: 版本A·第7章/版本B·第三十三章
    usage: rule_engine

  # ============ 敲键子——行文层 ============

  - id: BG-011
    type: MT
    title: 行文敲键子四步法——套摘归堆通读打磨
    content: |
      文稿起草（敲键子）的四步流程：
      （1）套摘堆砌：摘现成段落，先摞到一起
         - 按提纲小标题，从上情/下情/内情/外情文件夹中摘录可用段落，按匹配性排序摞在各小标题下
         - 一般稿摞到够用即可；想出彩则摞到穷尽处（统统榨干，发现出彩素材）
         - 摞的本质：深度熟悉各方面情况，化学反应式融合而非物理叠加
      （2）撮要归堆：合并同类项，向主题聚敛
         - "为什么"（意义/必要性/紧迫性/重要性）归堆、"是什么"归堆、"怎么办"（措施对策）归堆
         - 按匹配性排序，最匹配信息量最大的摞在前面
      （3）通读权衡：查补缺漏项，增新意亮点
         - 检查各级标题是否有遗漏，预设能够出彩的亮点和新意
      （4）捋顺打磨：看起承转合，促气脉贯通
         - 硬伤硬痕直接删掉 → 实在不舍的琢磨换掉 → 基本定形后再写和顺
    applicable_types: ["汇报", "报告", "讲话", "方案"]
    importance: A
    source: 版本A·第8章
    usage: rule_engine

  - id: BG-012
    type: MT
    title: '"抄"材料六条法则'
    content: |
      体制内材料写作如社科学术论文——需文献综述+有机抄录，六条法则：
      （1）形神兼顾"抄"：抄体例之形（照猫画虎定框架）；更要"抄"公文核心逻辑之神（是什么+为什么+怎么办）；所有机关公文都逃不出这一逻辑链
      （2）上下结合"抄"：抄上情（指示要求/重要意义/目标举措）+ 抄下情（基层亮点/实际情况），上下有机结合；汇报材料研究听者比讲者更重要
      （3）新旧对照"抄"：优先抄最新材料，但新材料不一定全面，需新旧比对，汲取精华，做到大集成且新且全
      （4）"抄"多不"抄"少：从多篇文章摘录，包罗上/下/内/外情，成稿才有深度/厚度/鲜度；切忌连地名单位名数据都不改的文抄公
      （5）"抄"外拓思维/"抄"内遵惯性：外部文章看新思维/新观点；内部材料保持单位惯性和特色
      （6）"学""抄"相融合：以揣摩体例、段落、词句为目的精读，把学到的在实际抄改中融合贯通
    applicable_types: ["汇报", "报告", "讲话", "方案"]
    importance: A
    source: 版本A·第8章
    usage: prompt_supplement

  - id: BG-013
    type: SP
    title: 公文核心逻辑三元——是什么·为什么·怎么办
    content: |
      所有机关公文都离不开"是什么、为什么、怎么办"这一核心逻辑链：
      - 是什么：定义/概念/背景阐述（耳熟能详时可省略）
      - 为什么：好事→讲重要性/必要性/紧迫性；坏事→讲危害/紧迫性
      - 怎么办：对策/措施/要求/部署

      讲话稿的全篇、每个部分，甚至每一段基本都是一个完整的三元逻辑链。
      精读名篇时要有意识地"练功"——揣摩每段语句分别属于哪一块，建构自身写作技法库。
    applicable_types: ["汇报", "报告", "讲话", "方案"]
    importance: A
    source: 版本A·第8章
    usage: rule_engine

  - id: BG-014
    type: MT
    title: 交稿有方——不仅要写好更要汇报好
    content: |
      写好稿子只是第一步，交稿的姿势同样重要：
      （1）主动向领导简报写作思路：若提纲有创新或与惯例不同，提前口头说明框架逻辑，引导领导形成预期
      （2）对关键段落加以说明：告知领导哪些是核心观点/亮点/需重点关注的修改点
      （3）面对修改意见保持谦卑：第一稿被修改是正常现象，关键是从领导修改的"花脸稿"中快速学习领导偏好，为下次积累个性化数据
      （4）让领导做选择题而非填空题：不清楚时提供2-3个框架方案供领导选择，而非空着来问"您觉得怎么写"
    applicable_types: ["汇报", "报告", "讲话"]
    importance: B
    source: 版本A·第8章
    usage: prompt_supplement

  # ============ 收果子——总结复盘层 ============

  - id: BG-015
    type: MT
    title: 写后复盘五维提炼法
    content: |
      材料写完后的即时复盘是提升悟性的关键：
      （1）复盘框架：这次为什么列了这样的提纲？换一种思路会更好吗？
      （2）复盘素材：哪些素材用上了？哪些遗漏了？平时如何补上这类短板？
      （3）复盘词句：哪些表述让领导眼前一亮？哪些被删掉了？删的逻辑是什么？
      （4）复盘意图：这次是否真正吃透了领导意图？有没有偏差？下次如何更准？
      （5）复盘体例：这个文种有哪些可固化的框架规律？下次遇到同类任务如何直接迁移？

      精读→吸收→输出→复盘，形成正向循环后，写作悟性会在不知不觉中大幅提升。
    applicable_types: ["汇报", "报告", "讲话", "方案"]
    importance: B
    source: 版本A·第9章
    usage: prompt_supplement

  # ============ 文种模板层（Book B核心贡献） ============

  - id: BG-016
    type: SP
    title: 好公文三要素——言之有序·有物·有心
    content: |
      一篇好公文的三个核心要求（版本B核心框架）：
      （1）言之有序——画"骨"：确定文章的框架结构、组织形式、排列次序和内部构造（谋篇布局）
         - 结构类型：总—分式/总—分—总式/递进式/并列式/对比式
         - 关键：结构稳，才能立得住
      （2）言之有物——填"肉"：填充文章基础内容，充实饱满，实在管用
         - 包含：常用段落套件 + 常用句子 + 高频词语
         - 这是写文章的难点，也是成熟公文的重点
      （3）言之有心——点"魂"：文章点睛之笔，主要指两方面：
         - 为文章确立主题，给骨架血肉注入灵魂
         - 作者一定要走心，素材须反复雕琢化为己用，切忌生搬硬套

      毛泽东："人的头脑是加工厂，没有材料不行，有了材料要经过加工，要产生观点，用观点统率材料。"
    applicable_types: ["汇报", "报告", "讲话", "方案"]
    importance: A
    source: 版本B·前言
    usage: rule_engine

  - id: BG-017
    type: MT
    title: 为文三个层次——情怀·见识·文字
    content: |
      写出的最好文章，写得最好的部分，一定是情怀/见识/文字三者相辅相成的产物：
      （1）情怀（道）："铁肩担道义，妙手著文章"的文胆——价值观是道，方法技巧是术；唯有以道驭术才是写好文章第一法宝
      （2）见识（识）："文章寸心事，得失千古知"的文心——包括视野/经验/思维方式，责任感是这些要素的承载和升华
      （3）文字（技）："别人怀宝剑，我有笔如刀"的文字功夫——运笔如刀，激浊扬清；新时代还要探索科技手段，增强脚力/眼力/脑力/笔力

      境界由高到低：先情怀，次见识，后文字。许多人倒序练习，导致文字工夫不错但材料毫无灵魂。
    applicable_types: ["汇报", "报告", "讲话", "方案"]
    importance: A
    source: 版本B·前言
    usage: prompt_supplement

  - id: BG-018
    type: SP
    title: 法定公文15种类型及行文规范
    content: |
      《党政机关公文处理工作条例》（中办发〔2012〕14号）规定的15种法定公文：

      指令性文件：决议、决定、命令（令）
      公开发布类：公报、公告、通告
      工作联系类：通知、通报、议案、报告、请示、批复、意见、函
      会议记录类：会议纪要

      法定公文特点：权威性、政策性、规范性、程序性、实效性强，可独立行文，具有统一格式。

      关键规范示例：
      - 请示：必须向上级机关行文，一文一事，主送一个上级机关
      - 函：应用广泛，含征求意见类、修改意见类、邀请类等3种主要子类型
      - 批复：必须针对请示作出，与请示一一对应
    applicable_types: ["汇报", "报告"]
    importance: A
    source: 版本B·第一部分
    usage: rule_engine

  - id: BG-019
    type: SP
    title: 部署动员讲话共性框架
    content: |
      部署动员讲话标准结构（适用于各类工作动员部署会议）：

      帽段：说明会议任务和安排（"今天召开××会，主要任务是……下面我讲几点意见"）
      一、为什么干（论述重要性/必要性/紧迫性，可正反两面）
      二、主要问题（列举当前存在的问题，可省略）
      三、部署内容（核心：安排部署工作内容，重点突出）
      四、怎么干（具体要求和措施）
      结尾：号召鼓劲段（鼓舞士气、发出号召）

      "为什么干"常用表达模式：
      - 从上级指示切入（权威性）
      - 从正反两面对比切入（危害/机遇并举）
      - 用"性"字组概括（紧迫性/重要性/必要性/战略性/系统性/艰巨性等）
    applicable_types: ["讲话"]
    importance: A
    source: 版本B·第十八章
    usage: rule_engine

  - id: BG-020
    type: SP
    title: 工作汇报两种共性模板
    content: |
      工作汇报模板1（四段详细型）：
      标题：关于××工作进展情况的汇报
      帽段：总体概括（以××为指导，强化四项举措，取得重大进展）
      一、基本情况/重点工作情况（3-4条，各标题含成效动词：奠定坚实基础/持续扎实开展/稳步推进）
      二、亮点工作（创新/突破/特色3-4条）
      三、主要问题（客观指出2-3条存在不足）
      四、下一步工作总体思路和主要措施（3-4条具体安排）

      工作汇报模板2（三段简洁型）：
      标题：关于××工作情况的汇报/汇报提纲
      按照××要求，现将××工作情况汇报如下：
      一、××工作基本情况（3-5条成效/做法）
      二、当前工作中存在的主要问题（2-3条）
      三、下一步工作打算（3-4条措施）
    applicable_types: ["汇报"]
    importance: A
    source: 版本B·第二十二章
    usage: rule_engine

  - id: BG-021
    type: SP
    title: 工作总结两种共性模板
    content: |
      工作总结模板1（成效措施合一型，最常用）：
      标题：××年××工作总结
      帽段：总体概括（以××为指导，在××领导下，围绕××目标，取得明显成效）
      一、××（工作成效1，标题含成效动词）
      二、××（工作成效2）
      三、××（工作成效3）……（成效与措施融合，各条既有数据又有做法）
      问题段：虽取得成绩，但对比××，还有差距。主要是×；×；×（简写，不必另立标题）
      下步段：下一步将重点抓好以下几个方面（简写）

      工作总结模板2（成效措施分开型）：
      帽段 → 主要成绩列举（直接叙述成效） → 主要措施（另起一段，分条列举采取了哪些举措）→ 问题+下步

      帽段亮点表达："量上取胜"（数据指标）/"质上取胜"（获批示/获全国排名/获表彰）
    applicable_types: ["汇报", "报告"]
    importance: A
    source: 版本B·第三十三章
    usage: rule_engine

  - id: BG-022
    type: SP
    title: 政策部署类意见/通知共性框架
    content: |
      政策部署类文件（意见/实施意见/指导意见/通知）标准结构：

      帽段：概念界定 / 强调必要性意义 / 总结近期成效不足（三选一或省略）
      经××同意，现提出如下意见（就有关事项通知如下）：

      一、总体要求
         （一）指导思想：以××为指导，深入贯彻……坚持××，加快/加强/健全……确保……
         （二）基本原则：坚持××，……（通常3-4条原则，"坚持+名词短语"格式）
         （三）工作目标：到××年，实现……达到……确保……

      二、主要任务（核心内容部分，3-6条，每条均有明确措施主体、时限、量化目标）
      三、保障措施（组织领导/资金保障/监督考核/宣传引导，通常4条）
    applicable_types: ["方案", "报告"]
    importance: A
    source: 版本B·第二章
    usage: rule_engine

  # ============ 高频词语运用 ============

  - id: BG-023
    type: LR
    title: 公文常用"性"字词组汇编
    content: |
      聚焦工作特点、着力增强工作的……性（常用于"为什么干"和总体要求部分）：

      必要性 | 长期性 | 创造性 | 复杂性 | 方向性 | 兜底性 | 鼓动性 | 高效性 | 紧迫性 | 计划性 | 艰巨性 | 坚定性 | 积极性 | 精准性 | 基础性 | 可行性 | 民族性 | 普惠性 | 前瞻性 | 全局性 | 思想性 | 时代性 | 实效性 | 时效性 | 系统性 | 现实性 | 原则性 | 预见性 | 有效性 | 引领性 | 政治性 | 战略性 | 重要性 | 主动性 | 针对性 | 指导性 | 自觉性 | 战斗性

      常用句式：聚焦××，着力增强工作的××性、××性、××性。
    applicable_types: ["汇报", "报告", "讲话", "方案"]
    importance: B
    source: 版本B·第十八章
    usage: dictionary

  - id: BG-024
    type: LR
    title: 公文常用"感"字词组汇编
    content: |
      牢记××理念，着力提高人民群众××感、××感、××感：

      获得感 | 满足感 | 幸福感 | 安全感 | 喜悦感 | 胜利感 | 自豪感 | 归属感 | 成就感 | 紧迫感 | 忧患感 | 使命感 | 方向感 | 责任感 | 危机感 | 压力感 | 认同感 | 敬畏感 | 参与感 | 荣誉感 | 神圣感 | 崇敬感

      常用于以下场合：强调民生工作时用"获得感/幸福感/安全感"；党建教育时用"使命感/责任感/紧迫感"；廉政建设时用"敬畏感/危机感"。
    applicable_types: ["讲话", "报告"]
    importance: B
    source: 版本B·第十八章
