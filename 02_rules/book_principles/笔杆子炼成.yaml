  - id: BG-025
    type: LR
    title: 总结帽段两类高质量表达——量上取胜与质上取胜
    content: |
      工作总结帽段最能抓眼球的两类开门见山写法：

      量上取胜（数据说话）：
      - 截至×月底，共办理××事项×万余件，其中网上办件×万件
      - 累计收缴××亿元，发放贷款××亿元，实现增值收益××亿元
      - 完成××项目××个，交易额××亿元，节约财政性资金××亿元
      - ××项重点攻坚任务全部完成

      质上取胜（荣誉排名）：
      - 获得主要领导肯定性批示×次
      - ××给××部门记集体一/二/三等功
      - ××工作获得全国第一/先进/优秀
      - 在全国率先推出××做法，获国务院/省政府肯定推广

      建议：帽段同时采用"量+质"两种方式，既有厚度又有高度。
    applicable_types: ["汇报", "报告"]
    importance: B
    source: 版本B·第三十三章
    usage: dictionary
