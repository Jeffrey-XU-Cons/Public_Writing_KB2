LOGIC:
  description: 逻辑结构类规则——结构完整性、论点论据一致性、层次逻辑、段落组织等。主要由Agent 4/5 LLM节点执行。
  rule_count: 153
  rules:
  - id: SP-003
    title: 行文规范三原则（一文一事/逐级行文/不越级）
    importance: A
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: 检查是否符合行文三原则： ①一文一事原则——一份公文只办一件事，不得同时处理多个事项； ②逐级行文原则——向上级行文须经本级，不得越级；如有紧急情况越级，须同时抄送被越级机关； ③范围原则——行文范围须与文件保密等级及受众范围相匹配。
      违反以上规范将导致公文效力下降或被退回。
    source_file: 02_rules/book_principles/胡森林_公文写作底层心法.yaml
  - id: SP-004
    title: 一文一题原则（主题统摄全篇）
    importance: A
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: 检查是否存在多主题并存的情况：一篇公文只能有一个核心主题，全部内容须服从该主题。 检查主题来源是否合理：应来自关注点（领导和受众最关心的）、闪光点（最有价值的素材点） 或不同点（体现创新之处），不得游离主题。
      必须包含主题统摄选材、结构、语言的逻辑贯穿，不得出现与主题无关的段落。
    source_file: 02_rules/book_principles/胡森林_公文写作底层心法.yaml
  - id: SP-005
    title: 公文内容以"实"为要四标准
    importance: A
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: 检查公文内容是否满足四个实质性标准： ①真实——检查是否有据可查，有事实支撑，不得虚构或夸大； ②完整——检查是否遗漏关键信息，主要工作、重要数据、关键举措须俱全； ③准确——检查数据、时间、人名、职称等细节是否无误；
      ④具体——检查是否空泛，观点须有具体事实支撑，不得以形容词代替事实。
    source_file: 02_rules/book_principles/胡森林_公文写作底层心法.yaml
  - id: SP-006
    title: 结构不板不乱浑然一体原则
    importance: A
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: 检查公文结构是否满足三个标准： 【不板】检查结构是否为内容服务，不得强套固定模板导致呆板僵化； 【不乱】检查各部分之间是否有清晰的逻辑关联，不得出现内容散乱失控； 【浑然一体】检查开头、主体、结尾是否相互照应，一气贯通。
      检查一级提纲是否扣紧主题，二级提纲是否扣紧一级提纲，各级层次是否环环相扣、首尾相顾。
    source_file: 02_rules/book_principles/胡森林_公文写作底层心法.yaml
  - id: SP-008
    title: 层次顺序三维逻辑
    importance: A
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: 检查公文内容排列顺序是否与内容性质匹配： ①时间顺序——工作进展类内容须按时间节点排列（过去→现在→未来）； ②空间顺序——地域或层级类内容须按空间展开（全局→局部；宏观→微观）； ③意义顺序——按重要性或逻辑关系排列的内容须遵循（重要→次要；原因→结果；问题→措施）。
      必须检查所选顺序与内容性质是否匹配，不得混乱使用。
    source_file: 02_rules/book_principles/胡森林_公文写作底层心法.yaml
  - id: SP-009
    title: 同一律与矛盾律（逻辑一致性原则）
    importance: A
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: 检查是否违反同一律：同一篇文章中同一概念在不同位置使用时内涵必须一致， 不得出现概念偷换，例如"工作质量"在不同段落不得指代不同内涵。 检查是否违反矛盾律：文章各部分的观点、数据、表述之间不得相互矛盾，
      前后提到同一事实必须一致，不得自相矛盾。
    source_file: 02_rules/book_principles/胡森林_公文写作底层心法.yaml
  - id: MT-001
    title: 七步成文法
    importance: A
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: 检查公文写作流程是否经历了关键步骤： ①定调子——是否已确定文章基调（积极/务实/紧迫等）； ②理路子——是否已理清写作思路，明确主题和大致框架； ③搭架子——是否已搭建结构提纲，确定各级标题和内容板块；
      ④填肚子——是否已填充具体内容，含事实、数据、观点、措施； ⑤梳辫子——是否已梳理段落和句子，各部分衔接是否流畅； ⑥戴帽子——开头结尾是否完善，首尾是否呼应，整体是否完整； ⑦过稿子——是否已检查逻辑、事实、格式、文字。
    source_file: 02_rules/book_principles/胡森林_公文写作底层心法.yaml
  - id: MT-004
    title: 把握领导意图三步递进法
    importance: A
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: 检查是否准确理解并提升了领导意图： ①充实完善——是否将领导的初步意图补充完整，填补逻辑空白； ②凝练提高——是否对领导的想法进行了提炼升华，使表述更精准、站位更高； ③延伸挖掘——是否在领导意图基础上进行延伸，挖掘更深层内涵。
      不得机械执行领导原话而不理解精神实质，也不得将写作者自己的意图强加于领导。
    source_file: 02_rules/book_principles/胡森林_公文写作底层心法.yaml
  - id: MT-005
    title: 换位思考四维角度法
    importance: A
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: 检查写作前是否从四个角度进行了换位思考： ①领导角度——是否考虑了领导关注什么、最担心什么、希望强调什么； ②受众角度——是否考虑了受众需要什么信息、能接受什么表达方式； ③工作角度——内容是否符合工作实际和操作逻辑；
      ④对象角度——是否考虑了文件执行对象的实际情况和可操作性。
    source_file: 02_rules/book_principles/胡森林_公文写作底层心法.yaml
  - id: MT-006
    title: 类因果法（公文内容四种逻辑要素）
    importance: A
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: 检查公文内容是否合理运用了四种基本逻辑要素： 【类】——分类/类别是否合理，内容维度是否清晰； 【因】——原因/背景是否阐述清楚，依据是否充分； 【果】——结果/成效是否说明，预期结果是否明确； 【法】——方法/措施是否具体，路径是否可操作。
      检查文种与侧重点是否匹配：汇报侧重"果"，方案侧重"法"，分析侧重"因"，规划侧重"类+法"。
    source_file: 02_rules/book_principles/胡森林_公文写作底层心法.yaml
  - id: MT-008
    title: 段头撮要法（段首点明核心观点）
    importance: A
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    content_summary: 检查每个段落的首句是否为该段的核心观点句：段首句须是判断句/观点句， 不得是描述句或背景句，其余内容须是对首句的阐述、例证或数据支撑。 检查读者只读段首能否掌握全文要点，若不能则须修改段首句。 必须包含段首概括观点的结构，为领导快速审阅和定位修改提供入口。
    source_file: 02_rules/book_principles/胡森林_公文写作底层心法.yaml
  - id: MT-011
    title: 起承转合行文技法
    importance: A
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: 检查公文行文是否符合起承转合的基本技法： 【起】——开头是否开门见山、直奔主题，让读者快速进入核心； 【承】——各部分之间过渡是否自然平顺，不得生硬； 【转】——内容转换、对比或递进是否处理得当； 【合】——结尾是否呼应开头，干净利落，不得拖沓或强行总结。
      须在整篇文章、各大部分之间、段落内部、句与句之间四个层次上逐一检查。
    source_file: 02_rules/book_principles/胡森林_公文写作底层心法.yaml
  - id: MT-013
    title: 文为事作·写前六类研究对象
    importance: A
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    content_summary: 检查起草综合报告/汇报前是否已研究六类内容： ①职能职责——本单位应做什么、能做什么的法定边界是否已明确； ②历史沿革——近五年本单位的工作历程、固定模式和典型成就是否已梳理； ③工作规划——年度计划、五年规划和重点工作安排是否已查阅；
      ④运作机制——内部组织架构、议事制度的频率和主要议程是否已了解； ⑤上级要求——上级对本单位工作的指示、批示和期望是否已提取； ⑥外部经验——兄弟单位的典型做法和创新举措是否已参考。
    source_file: 02_rules/book_principles/胡森林_公文写作底层心法.yaml
  - id: SP-002
    title: 结构三层次
    importance: A
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: '检查公文结构是否在三个层次上保持一致：

      1. 浅层结构——章节、段落、标题的物理排列是否清晰合理；

      2. 表层结构——内容板块之间的逻辑关联与组织方式是否明确；

      3. 深层结构——文章内在的思维逻辑框架是否体现对事物本质的认识。

      必须检查三层结构是否一致：外在排列服从逻辑关联，逻辑关联服从思维框架。

      不得出现浅层结构清晰但深层结构混乱的情况。'
    source_file: 02_rules/book_principles/胡森林_公文写作心法笔杆.yaml
  - id: SP-003_胡森林公文写
    title: 结构三要点
    importance: A
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: '检查公文结构是否同时满足三个要点：

      1. 完整——该有的内容是否都有，是否存在缺项或跑题；

      2. 连贯——各部分之间过渡是否自然，前后是否呼应，上下是否贯通；

      3. 严密——逻辑是否严谨，各部分之间关系是否经得起推敲，是否存在矛盾和漏洞。

      提纲确定后，须用"完整-连贯-严密"三标准逐一审查。'
    source_file: 02_rules/book_principles/胡森林_公文写作心法笔杆.yaml
  - id: SP-004_胡森林公文写
    title: 内容决定结构原则
    importance: A
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: '检查是否先明确"写什么"再决定"怎么排"：不得先套结构再填内容，

      不得出现内容与结构不匹配的情况。

      检查结构类型是否与内容匹配，属于以下四类之一：

      1. 总分式——是否先总后分，先提论点再展开；

      2. 并列式——各部分地位是否平等，横向展开；

      3. 递进式——是否层层深入，逐步推进；

      4. 问题导向式——是否遵循提出问题→分析问题→解决问题的顺序。'
    source_file: 02_rules/book_principles/胡森林_公文写作心法笔杆.yaml
    context_note: 【适用边界】本原则适用于经验材料、调研报告等内容驱动型文体，鼓励因内容灵活设计结构。标准化文种（通知、请示、批复等）应遵循GB/T 9704规定的固定格式，不适用本原则。
  - id: SP-005_胡森林公文写
    title: 公文六要素框架（二八法则应用）
    importance: A
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: '检查公文是否覆盖六个核心要素：

      1. 立意——是否解决了"言之有方"的问题，方向是否正确；

      2. 主题——是否解决了"言之有核"的问题，中心是否明确；

      3. 结构——是否解决了"言之有序"的问题，逻辑是否清晰；

      4. 内容——是否解决了"言之有物"的问题，材料是否充实；

      5. 语言——是否解决了"言之有味"的问题，表达是否得体；

      6. 文气——是否解决了"言之有脉"的问题，气韵是否贯通。'
    source_file: 02_rules/book_principles/胡森林_公文写作心法笔杆.yaml
    context_note: 【适用边界】本框架适用于方案/计划类文体的完整性检查。与CQ-013（面面俱到问题）不冲突：六要素是文档级完整性要求，CQ-013是段落级深度要求。
  - id: LR-008
    title: 论从事出原则
    importance: A
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: '检查是否符合"论从事出"原则：观点须从事实中提炼，结论须从实践中得出。

      不得先有结论再找例子（倒推式论证）；论点必须能从所列事实中自然导出。

      检查方法：遮住观点段，只看事实段，读者能否自己得出同样结论？

      能→论从事出合格；不能→观点与事实脱节，须修改。'
    source_file: 02_rules/book_principles/胡森林_公文写作心法笔杆.yaml
  - id: LR-009
    title: 事实论据四要求
    importance: A
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: '检查公文中使用的事实论据是否满足四个要求：

      1. 真实——事实是否准确无误，是否存在夸大、虚构、失真；

      2. 准确——时间、地点、数字、名称等细节是否精确可核实；

      3. 典型——是否选用最能说明问题、最具代表性的事实，是否堆砌平庸案例；

      4. 切题——事实与所论证的观点是否直接相关，是否牵强附会。

      选材原则：宁少勿滥——一个典型事实胜过十个平庸例子。'
    source_file: 02_rules/book_principles/胡森林_公文写作心法笔杆.yaml
  - id: LR-011
    title: 意群概念与段落组织
    importance: A
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: '检查段落组织是否符合意群原则：

      - 检查是否存在一个段落包含多个不同意思的情况，须拆分；

      - 检查是否存在相同意思被拆成多个段落的情况，须合并；

      - 检查段首句是否为该意群的概括句。

      必须包含以下操作步骤：

      ① 列出所有材料要点；

      ② 按意群归类（相同意思归一组）；

      ③ 为每个意群写段首概括句；

      ④ 以段首句为骨，展开段落。'
    source_file: 02_rules/book_principles/胡森林_公文写作心法笔杆.yaml
  - id: MT-003
    title: 目标思维双维度（靶向+他者）
    importance: A
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: "检查公文写作是否建立了两种目标思维：\n1. 靶向思维——是否明确了写作目标，所有内容取舍是否以\"服务于靶心目标\"为标准；\n   须检查：这篇文章要达到什么效果？读者看完后应有什么改变？\n2.\
      \ 他者思维——是否从读者（使用者、接收者）的立场写作，\n   检查是否存在\"我想说什么\"而非\"读者需要知道什么\"的问题。"
    source_file: 02_rules/book_principles/胡森林_公文写作心法笔杆.yaml
  - id: MT-004_胡森林公文写
    title: 修改五字诀
    importance: A
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: '检查文稿修改是否运用了五种操作：增、删、整、调、换。

      1. 增——是否增加了缺失的内容，补充论据，丰富论证；

      2. 删——是否删去了冗余内容，去掉废话、重复、偏题部分；

      3. 整——是否整理了结构，调整了段落内部的逻辑顺序；

      4. 调——是否调换了段落或层次的前后顺序，优化整体结构；

      5. 换——是否替换了不恰当的词语、句式或论据。

      修改顺序须遵循：先整体（调/整/增/删），再局部（换）；先结构，再内容，再语言。'
    source_file: 02_rules/book_principles/胡森林_公文写作心法笔杆.yaml
  - id: MT-010
    title: 言之有理有据有物三维检验
    importance: A
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: "检查公文内容是否通过三维检验：\n1. 言之有理——是否有明确的论点，逻辑是否成立，推理是否合理；\n2. 言之有据——是否有支撑论点的依据（事实依据、数据依据、政策依据），\n   不得只有观点而无论据；\n\
      3. 言之有物——内容是否具体，是否有实质内容，不得空泛表述。\n三者缺一则文稿要么空洞，要么无据，要么抽象，须逐一检查确保具备。"
    source_file: 02_rules/book_principles/胡森林_公文写作心法笔杆.yaml
  - id: WQ_MT_001
    title: 写作高手三种能力论（认识/公务处理/文字表述）
    importance: A
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: "检查公文写作能力是否在三个层次上均有体现：\n1. 认识能力（第一位）——是否具备对事物的分析概括能力，是否体现了思想深度；\n   检查是否存在\"意不逮物\"问题：写不出往往不是文字表述力不行，而是认识能力不足；\n\
      2. 公务处理能力——是否熟悉行政管理和机关工作程序，是否能抓住工作轻重主次；\n3. 文字表述能力——是否将正确认识准确完美地表达出来，是否符合公文规则格式方法技巧。\n三者排序：认识能力 > 公务处理能力 > 文字表述能力，不得本末倒置只追求文字技巧。"
    source_file: 02_rules/book_principles/王群_公文写作大手笔.yaml
  - id: WQ_MT_003
    title: 立意能力提升三法（高·新·尖）
    importance: A
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: "检查公文立意是否满足高、新、尖三个维度：\n1. 挖本质（高）——是否从材料中跳出来，站在领导机关高度观察问题；\n   是否先深思再落笔，把平凡问题概括升华，挖掘本质；\n2. 找新角度（新）——是否运用了新视角切入，从相反方向或不同侧面立意；\n\
      \   是否避免\"千佛一面\"，选择最有意义的侧面；\n3. 集中突出（尖）——是否只围绕一个核心问题展开，是否做到重点突出、主旨集中。"
    source_file: 02_rules/book_principles/王群_公文写作大手笔.yaml
  - id: WQ_MT_004
    title: 立纲四种基本结构形态
    importance: A
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: '检查公文结构形态是否与文种和内容匹配，属于以下四种之一：

      1. 总分式——各分项须为并列关系，不可有包容从属；意见/通知/决定/领导讲话最常用；

      2. 递进式（因果式）——各段间是否为因果或进层关系，各段顺序是否不可调换；工作部署/经验总结常用；

      3. 承接式（时序式）——是否按事物发展先后顺序排列；信息/简报/会议纪要常用；

      4. 单层式（一段式）——内容是否单一，是否为简短文书如任免通知。

      不得出现结构形态与内容逻辑不符的情况。'
    source_file: 02_rules/book_principles/王群_公文写作大手笔.yaml
  - id: WQ_MT_009
    title: 领导讲稿起草五步准备法
    importance: A
    execution: agent_prompt
    applicable_types:
    - 讲话
    content_summary: '检查领导讲稿起草前是否完成了五项准备：

      1. 把握领导意图——是否弄清精神实质，是否做到两个融贯通（与上级精神融贯+与领导一贯思想融贯）；

      2. 摸清领导特点——是否了解领导职务性质/性格类型/文化修养/年龄特点/讲话风格；

      3. 弄清讲话对象——是否明确了与听众的上下平关系，是否了解听众基本情况和切身关切；

      4. 弄清讲话场合——是否判断了场合类型（开幕式/中间报告/闭幕式）及对应要求；

      5. 确定讲稿提纲——提纲是否详细到大小标题和每层次中心意思，把握不大时是否准备了2-3套方案。'
    source_file: 02_rules/book_principles/王群_公文写作大手笔.yaml
  - id: WQ_MT_010
    title: 领导意图融会贯通两要求
    importance: A
    execution: agent_prompt
    applicable_types:
    - 讲话
    - 报告
    content_summary: "检查起草领导讲稿时是否做到了两个融贯通：\n1. 与上级方针政策融贯——领导意图是否与上级指示精神一致，是否保证政策连续性；\n2. 与该领导一贯思想融贯——是否掌握了该领导的思维方式和历次讲话/批示精神，\n\
      \   使讲稿延续其一贯主张，保证前后一致性。\n同时须检查：是否发扬独立思考，将领导原则性意见化为系统深刻的见解，而非机械呆板执行。"
    source_file: 02_rules/book_principles/王群_公文写作大手笔.yaml
  - id: WQ_SP_001
    title: 公文主旨定义（行文用意和目的）
    importance: A
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: '检查公文主旨是否明确为"行文用意和目的"：

      即这篇公文为什么而写，要达到什么目标，对收文者产生什么效果。

      检查主旨是否统帅全文：一切材料、结构、语言是否均服从行文用意和目的。

      必须检查：主旨是否单一（一文一旨），是否存在与主旨无关的材料被保留；

      检查主旨的出发点是否来自：领导的决策意图 + 实际工作中亟待解决的问题。'
    source_file: 02_rules/book_principles/王群_公文写作大手笔.yaml
  - id: MT-004_公文高手自我
    title: 破题时事势三字经
    importance: A
    execution: agent_prompt
    applicable_types:
    - 讲话
    - 汇报
    - 报告
    - 方案
    content_summary: '检查公文立意（破题）是否具备三个维度：

      （1）时——是否体现了时代背景、当前形势、党的最新路线方针政策；

      　　  是否弄清楚了时代要求，本单位本行业有何新变化；

      （2）事——是否全方位把事情吃透，是否研究了"事"而非只研究"字"；

      　　  是否涵盖哲学层（理论高度）→逻辑层（因果推断）→心理层（靶向思维）三个维度；

      （3）势——是否顺应事物发展的趋势和方向，是否违背了发展规律。

      立意宜高不宜平，必须紧扣时、事、势，才能让文章有理论高度、论述深度、独特角度。'
    source_file: 02_rules/book_principles/公文高手自我修炼.yaml
  - id: MT-005_公文高手自我
    title: 立意四思法：高度深度角度尺度
    importance: A
    execution: agent_prompt
    applicable_types:
    - 讲话
    - 汇报
    - 报告
    - 方案
    content_summary: '检查公文立意是否经过"四思"检验：

      （1）首思高度——是否从理论、政策层面审视，是否在全局中定位，站位是否足够高；

      　　  是否存在就事论事、未能跳出自身层面的问题；

      （2）再思深度——是否深入独到，是否能揭示事物本质和规律，是否具有哲理性理论性；

      （3）三思角度——是否找到最能说明问题本质的切入角度，是否求"新"不落俗套；

      　　  求新是否未"跑题"，是否清楚主要矛盾；

      （4）四思尺度——分寸是否适度，材料多寡、详写略写、藏锋露锋是否把握恰当。'
    source_file: 02_rules/book_principles/公文高手自我修炼.yaml
  - id: MT-006_公文高手自我
    title: 四步成文法：领悟构思布局炼字
    importance: A
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: '检查从接到写作任务到完稿是否经历了四个核心步骤：

      （1）领悟（虚己应物）——是否清空成见，是否深入理解了任务要求，

      　　  领悟力是否兼顾颖悟（举一反三）和通达（通晓世事）；

      （2）构思（神与物游）——是否让思维充分展开，是否已形成写作思路，

      　　  是否过于急于落笔而未充分构思；

      （3）布局（胸有丘壑）——动笔前结构框架是否已清晰，是否仍在边写边想结构；

      （4）炼字（语意两工）——是否同时精炼了语言和意义两个维度，

      　　  炼字是否仅停留于词汇替换而未炼逻辑、炼意思。'
    source_file: 02_rules/book_principles/公文高手自我修炼.yaml
  - id: MT-007
    title: 为文三悟：悟上级悟领导悟听众
    importance: A
    execution: agent_prompt
    applicable_types:
    - 讲话
    - 汇报
    - 报告
    - 方案
    content_summary: '检查写作前是否深度领悟了三个层次：

      （1）悟上级精神——是否学懂弄通党和国家最新路线方针政策，文稿是否与上级精神高度契合；

      （2）悟领导意图——是否透彻理解了出题领导的想法，是否做到：

      　　  ①扩展（领导想说的帮助展开充实）；

      　　  ②挖掘（领导没想到的帮助深化发现）；

      　　  ③完善（领导说不全面的帮助补充平衡）；

      （3）悟听众心理——是否了解文稿受众，是否进行了靶向思维换位思考；

      　　  是否思考了：受众是谁，有何特点，什么观点才能引起共鸣。'
    source_file: 02_rules/book_principles/公文高手自我修炼.yaml
  - id: MT-008_公文高手自我
    title: 功夫在诗外：学好三门课
    importance: A
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: '检查公文写作功力是否在三门基础课上有所体现：

      （1）哲学——是否解决了"怎么看"的认识论问题，立意是否具有理论高度；

      （2）逻辑学——是否解决了"怎么办"的方法论问题，

      　　  是否遵循逻辑推理规律（归纳/演绎/类比），是否存在逻辑错误；

      （3）心理学——是否解决了"为谁写"的对象论问题，

      　　  是否了解受众心理，是否做到顺情入机，动言中务。'
    source_file: 02_rules/book_principles/公文高手自我修炼.yaml
  - id: SP-001
    title: 讲话稿六宜六忌框架
    importance: A
    execution: agent_prompt
    applicable_types:
    - 讲话
    - 汇报
    - 报告
    - 方案
    content_summary: '检查公文（以讲话稿为核心）是否满足六宜六忌的要求：

      （1）立意宜高，忌平——是否具有理论高度和全局视野，是否存在站位低平的问题；

      （2）主题宜明，忌杂——主题是否鲜明集中，是否存在多主题并立相互干扰；

      （3）结构宜紧，忌散——各部分是否紧密围绕主题，层次是否清晰，逻辑是否严密；

      （4）内容宜实，忌空——是否用事实、数据说话，是否存在空喊口号、虚化套话；

      （5）语言宜活，忌陈——语言是否鲜活，表达方式是否多样，是否陈词滥调；

      （6）文气宜通，忌断——行文是否流畅，前后衔接是否自然，读来是否一气呵成。'
    source_file: 02_rules/book_principles/公文高手自我修炼.yaml
  - id: SP-002_公文高手自我
    title: 工作报告五大写作难点
    importance: A
    execution: agent_prompt
    applicable_types:
    - 报告
    content_summary: '检查工作报告是否妥善处理了五个核心难点：

      （1）提炼主题难——主题是否突出了当前工作重点，是否有针对性和指导性，是否能解决突出问题；

      （2）布局结构难——谋篇布局是否充分，提纲是否含主要观点和素材而非干巴巴一句话；

      　　  是否做到了越是鸿篇巨制越大道至简，逻辑结构是否清晰简明；

      （3）表达切实准确难——是否切实准确不体现个人风格，是否兼顾了当前与长远；

      （4）平衡全面与重点难——是否做到全面不失重点、重点不忽视全面；

      　　  是否重点讲了中央部署和领导群众关心的热点难点；

      （5）持续创新难——是否实现了"永远的重复，持续的创新"，

      　　  是否有新思想、新论断、新提法、新举措。'
    source_file: 02_rules/book_principles/公文高手自我修炼.yaml
  - id: SP-005_公文高手自我
    title: 公文三大本质属性
    importance: A
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: '检查公文是否体现三大本质属性：

      （1）实效性——是否以解决实际问题为目的，是否能达到预期目标；

      　　  检查公文发出后是否会达到预期目的，这是最重要的评价尺度；

      （2）论断性——是否将论述（论）和决定（断）有机结合；

      　　  断=要办什么事（结论）；论=办这事的理由（前提）；

      　　  上行文是否侧重于"论"（充分的理由和说服力）；

      　　  下行文是否侧重于"断"（权威性）；

      （3）针对性——是否有明确的受文对象，是否针对特定受众；

      　　  是否了解受文者是谁，是否揣摩其心理，是否有的放矢；

      　　  是否做到顺情入机，动言中务（顺着受文者感情心理，触及工作关键）。'
    source_file: 02_rules/book_principles/公文高手自我修炼.yaml
  - id: BG-001
    title: 写手三个层次与三个对应关系
    importance: A
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: '写手成长三个层次：

      （1）领导出框架，写手能出词句 → 对应水准：以文叙事 → 对应等级：写得像

      （2）领导出思想，写手能出框架 → 对应水准：以文辅政 → 对应等级：写得是

      （3）领导画个圈，写手能出思想 → 对应水准：以文鼎新 → 对应等级：写得好


      路径要求：先从词句积累入手（语感+常用词语），再练谋篇布局（体例+提纲），最终向出思想迈进（深度研究工作+增强方法论）。'
    source_file: 02_rules/book_principles/笔杆子炼成.yaml
  - id: BG-002
    title: 文稿起草本质——深度研究四要素
    importance: A
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: '文稿起草的本质：将深入提出问题、分析问题、解决问题的过程用文字呈现。


      写好材料离不开四个深度研究：

      （1）深度研究事：把工作搞透是基本前提（从上情、下情、内情、外情四维梳理历史沿革/现状/问题/对策）

      （2）深度研究人：把讲者（角色意识/站位思维/文风特点）和受众（关注点/互动点）搞透是写得好的关键

      （3）深度研究体：搞清体例结构是最基础工作（广搜权威范文，照猫画虎定体例）

      （4）深度研究景：主动研究具体场景背景（画面意识+发展眼光+"现挂"技巧）


      一篇材料的深度/广度/温度，取决于对事研究程度；能否写得出彩，取决于对人的研究程度；是否对路，取决于体例研究程度。'
    source_file: 02_rules/book_principles/笔杆子炼成.yaml
  - id: BG-003
    title: 平时磨刀五字法——要搜读合练
    importance: A
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: '写好材料的平时积累五字法：

      （1）要：多主动调度，动态兜清情况。平时多要现成的数据统计、汇报总结讲话等成形材料，做到"一调多用"；固化掌握上情/下情/内情/外情四维度。

      （2）搜：四处寻媒介，广泛储备素材。重点看权威报刊（《人民日报》《求是》等）、政府网站文件，搜集常写体例范文。

      （3）读：静心深阅读，注重实际占有。泛读+精读相结合，精读不留痕=读了白读；精读要做好固化（标注/笔记/汇总词句集锦）。

      （4）合：分类萃与合，随时揣摩备用。材料分类储存，汇集总结类小标题，形成可随时调取的素材库。

      （5）练：沙场秋点兵，实战靶向储备。建立几个文稿模板，通过投稿练兵。'
    source_file: 02_rules/book_principles/笔杆子炼成.yaml
  - id: BG-004
    title: 上情下情内情外情四维情况积累法
    importance: A
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: '素材积累四维度及各自作用：

      （1）上情：掌握各级重要讲话、批示、指示精神 → 增加文章高度（决定材料的下线）

      （2）下情：挖掘基层可复制可传播的亮点做法、共性问题 → 增加文章温度（接地气、务实、有操作性）

      （3）内情：本单位重点业务工作进展数据、历次成形材料 → 决定材料的个性和针对性（集大成）

      （4）外情：前沿理论、先进地区经验、学界文章 → 决定材料的上线（视野思维、务虚谋划）


      战时梳理四情的标准动作：接到任务后分别建立临时档案夹，汇聚各维素材后边汇集边消化边酝酿框架。'
    source_file: 02_rules/book_principles/笔杆子炼成.yaml
  - id: BG-005
    title: 定盘子三步骤——吃准材料基本盘
    importance: A
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: '接到写作任务时，需要"定盘子"的三步操作：

      （1）捋清任务来龙去脉：追溯任务来源（是否来自更高层级），逐一研究相关通知/方案/批示/讲话的共性要求和个性要求，必要时直接向上级通话确认具体意图。

      （2）吃准领导意图（"变量"）：写材料的变量=意图，定量=对工作的深度研究。难在意图把握，累在格物致知，贵在两者结合。意图不清时，先拉出不超过一页纸的提纲，由领导审定后再展开写。

      （3）敲定总体写法和素材支撑：采取务虚务实结合，多渠道酝酿框架、主要基调、支撑素材、大致篇幅、起草人员、交稿时间。


      盘子敲好后才能正式动笔，可大大降低推倒重来的风险。'
    source_file: 02_rules/book_principles/笔杆子炼成.yaml
  - id: BG-007
    title: 领导说的公文逻辑七维
    importance: A
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: '领导批评材料"没有逻辑性"时，通常指以下七种逻辑的欠缺：

      （1）领导意图逻辑：是否准确把握领导的关注点和意图（最重要的变量）

      （2）工作内在逻辑：是否符合工作本身历史沿革/发展现状/存在问题/面临形势/下步措施的内在顺序

      （3）唯物辩证逻辑：是否符合马克思主义哲学基本原理（认识论/实践论/矛盾论等）

      （4）文种体例逻辑：是否符合各文种的基本体例框架（总结"三步曲"、专题讲话"三为什么"等）

      （5）段落结构逻辑：各段各部分与主题相关性，起承转合是否顺畅

      （6）语句逻辑：主谓宾定状补是否运用得当

      （7）形式逻辑：概念不交叉，判断科学，推理严谨'
    source_file: 02_rules/book_principles/笔杆子炼成.yaml
  - id: BG-009
    title: 列提纲三要：研究事、研究体、实战技巧
    importance: A
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: "搭架子（列提纲）三个维度：\n（1）列提纲前重中之重——深度研究事：从上情（站位）/内情（集大成）/下情（接地气）/外情（辅政价值）四维梳理情况，是持续酝酿提纲和拟出厚实材料的关键步骤\n（2）列提纲前基础要件——深度研究体：先找权威高层级范文确定基本体例，再找相近层级范文确定具体框架，最多找10篇左右研究共性特点\n\
      （3）实战技巧：\n   - 一稿过诀窍：将领导反复说的关键词/观点放到提纲里\n   - \"性感\"法则：用\"×性\"\"×感\"的词语组合概括工作特点和成效\n   - 快速列成效类提纲：梳理量上取胜（数据指标）+ 质上取胜（获批示/获排名/获表彰）…"
    source_file: 02_rules/book_principles/笔杆子炼成.yaml
  - id: BG-010
    title: 工作报告/汇报/总结三种文体区别
    importance: A
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    content_summary: '三种文体的核心特征对比：


      工作报告——"端庄专业年年见"

      - 频次：一年一次（如政府/部门年度工作报告）

      - 受众：参会代表 + 社会大众

      - 体例：主题 + 过去一年工作回顾（成效/做法/经验/问题）+ 未来一年工作建议（指导思想/目标/措施）


      工作汇报——"灵活通俗天天见"

      - 频次：随时（督查巡察/专项会议/领导约谈）

      - 受众：督查巡察主体/有关会议参会人员（听者比讲者更重要）

      - 体例：灵活，可详可简，口语化为主；三段式（基本情况+存在问题+下步打算）最常见


      工作总结——"三段固定时时见"

      - 频次：月/季/半年/年度

      - 受众：各级领导…'
    source_file: 02_rules/book_principles/笔杆子炼成.yaml
  - id: BG-011
    title: 行文敲键子四步法——套摘归堆通读打磨
    importance: A
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: "文稿起草（敲键子）的四步流程：\n（1）套摘堆砌：摘现成段落，先摞到一起\n   - 按提纲小标题，从上情/下情/内情/外情文件夹中摘录可用段落，按匹配性排序摞在各小标题下\n   - 一般稿摞到够用即可；想出彩则摞到穷尽处（统统榨干，发现出彩素材）\n\
      \   - 摞的本质：深度熟悉各方面情况，化学反应式融合而非物理叠加\n（2）撮要归堆：合并同类项，向主题聚敛\n   - \"为什么\"（意义/必要性/紧迫性/重要性）归堆、\"是什么\"归堆、\"怎么办\"（措施对策）归堆\n\
      \   - 按匹配性排序，最匹配信息量最大的摞在前面\n（3）通读权衡：查补缺漏项，增新意亮点\n   - 检…"
    source_file: 02_rules/book_principles/笔杆子炼成.yaml
  - id: BG-012
    title: '"抄"材料六条法则'
    importance: A
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: '体制内材料写作如社科学术论文——需文献综述+有机抄录，六条法则：

      （1）形神兼顾"抄"：抄体例之形（照猫画虎定框架）；更要"抄"公文核心逻辑之神（是什么+为什么+怎么办）；所有机关公文都逃不出这一逻辑链

      （2）上下结合"抄"：抄上情（指示要求/重要意义/目标举措）+ 抄下情（基层亮点/实际情况），上下有机结合；汇报材料研究听者比讲者更重要

      （3）新旧对照"抄"：优先抄最新材料，但新材料不一定全面，需新旧比对，汲取精华，做到大集成且新且全

      （4）"抄"多不"抄"少：从多篇文章摘录，包罗上/下/内/外情，成稿才有深度/厚度/鲜度；切忌连地名单位名数据都不改的…'
    source_file: 02_rules/book_principles/笔杆子炼成.yaml
  - id: BG-013
    title: 公文核心逻辑三元——是什么·为什么·怎么办
    importance: A
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: '所有机关公文都离不开"是什么、为什么、怎么办"这一核心逻辑链：

      - 是什么：定义/概念/背景阐述（耳熟能详时可省略）

      - 为什么：好事→讲重要性/必要性/紧迫性；坏事→讲危害/紧迫性

      - 怎么办：对策/措施/要求/部署


      讲话稿的全篇、每个部分，甚至每一段基本都是一个完整的三元逻辑链。

      精读名篇时要有意识地"练功"——揣摩每段语句分别属于哪一块，建构自身写作技法库。'
    source_file: 02_rules/book_principles/笔杆子炼成.yaml
  - id: BG-016
    title: 好公文三要素——言之有序·有物·有心
    importance: A
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: "一篇好公文的三个核心要求（版本B核心框架）：\n（1）言之有序——画\"骨\"：确定文章的框架结构、组织形式、排列次序和内部构造（谋篇布局）\n   - 结构类型：总—分式/总—分—总式/递进式/并列式/对比式\n\
      \   - 关键：结构稳，才能立得住\n（2）言之有物——填\"肉\"：填充文章基础内容，充实饱满，实在管用\n   - 包含：常用段落套件 + 常用句子 + 高频词语\n   - 这是写文章的难点，也是成熟公文的重点\n（3）言之有心——点\"\
      魂\"：文章点睛之笔，主要指两方面：\n   - 为文章确立主题，给骨架血肉注入灵魂\n   - 作者一定要走心，素材须反复雕琢化为…"
    source_file: 02_rules/book_principles/笔杆子炼成.yaml
  - id: BG-017
    title: 为文三个层次——情怀·见识·文字
    importance: A
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: '写出的最好文章，写得最好的部分，一定是情怀/见识/文字三者相辅相成的产物：

      （1）情怀（道）："铁肩担道义，妙手著文章"的文胆——价值观是道，方法技巧是术；唯有以道驭术才是写好文章第一法宝

      （2）见识（识）："文章寸心事，得失千古知"的文心——包括视野/经验/思维方式，责任感是这些要素的承载和升华

      （3）文字（技）："别人怀宝剑，我有笔如刀"的文字功夫——运笔如刀，激浊扬清；新时代还要探索科技手段，增强脚力/眼力/脑力/笔力


      境界由高到低：先情怀，次见识，后文字。许多人倒序练习，导致文字工夫不错但材料毫无灵魂。'
    source_file: 02_rules/book_principles/笔杆子炼成.yaml
  - id: BG-018
    title: 法定公文15种类型及行文规范
    importance: A
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    content_summary: '《党政机关公文处理工作条例》（中办发〔2012〕14号）规定的15种法定公文：


      指令性文件：决议、决定、命令（令）

      公开发布类：公报、公告、通告

      工作联系类：通知、通报、议案、报告、请示、批复、意见、函

      会议记录类：会议纪要


      法定公文特点：权威性、政策性、规范性、程序性、实效性强，可独立行文，具有统一格式。


      关键规范示例：

      - 请示：必须向上级机关行文，一文一事，主送一个上级机关

      - 函：应用广泛，含征求意见类、修改意见类、邀请类等3种主要子类型

      - 批复：必须针对请示作出，与请示一一对应'
    source_file: 02_rules/book_principles/笔杆子炼成.yaml
  - id: BG-019
    title: 部署动员讲话共性框架
    importance: A
    execution: agent_prompt
    applicable_types:
    - 讲话
    content_summary: '部署动员讲话标准结构（适用于各类工作动员部署会议）：


      帽段：说明会议任务和安排（"今天召开××会，主要任务是……下面我讲几点意见"）

      一、为什么干（论述重要性/必要性/紧迫性，可正反两面）

      二、主要问题（列举当前存在的问题，可省略）

      三、部署内容（核心：安排部署工作内容，重点突出）

      四、怎么干（具体要求和措施）

      结尾：号召鼓劲段（鼓舞士气、发出号召）


      "为什么干"常用表达模式：

      - 从上级指示切入（权威性）

      - 从正反两面对比切入（危害/机遇并举）

      - 用"性"字组概括（紧迫性/重要性/必要性/战略性/系统性/艰巨性等）'
    source_file: 02_rules/book_principles/笔杆子炼成.yaml
  - id: BG-020
    title: 工作汇报两种共性模板
    importance: A
    execution: agent_prompt
    applicable_types:
    - 汇报
    content_summary: '工作汇报模板1（四段详细型）：

      标题：关于××工作进展情况的汇报

      帽段：总体概括（以××为指导，强化四项举措，取得重大进展）

      一、基本情况/重点工作情况（3-4条，各标题含成效动词：奠定坚实基础/持续扎实开展/稳步推进）

      二、亮点工作（创新/突破/特色3-4条）

      三、主要问题（客观指出2-3条存在不足）

      四、下一步工作总体思路和主要措施（3-4条具体安排）


      工作汇报模板2（三段简洁型）：

      标题：关于××工作情况的汇报/汇报提纲

      按照××要求，现将××工作情况汇报如下：

      一、××工作基本情况（3-5条成效/做法）

      二、当前工作中存在的主要问题（2-3条）

      三、下一步工作打算（3-4条措施）'
    source_file: 02_rules/book_principles/笔杆子炼成.yaml
  - id: BG-021
    title: 工作总结两种共性模板
    importance: A
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    content_summary: '工作总结模板1（成效措施合一型，最常用）：

      标题：××年××工作总结

      帽段：总体概括（以××为指导，在××领导下，围绕××目标，取得明显成效）

      一、××（工作成效1，标题含成效动词）

      二、××（工作成效2）

      三、××（工作成效3）……（成效与措施融合，各条既有数据又有做法）

      问题段：虽取得成绩，但对比××，还有差距。主要是×；×；×（简写，不必另立标题）

      下步段：下一步将重点抓好以下几个方面（简写）


      工作总结模板2（成效措施分开型）：

      帽段 → 主要成绩列举（直接叙述成效） → 主要措施（另起一段，分条列举采取了哪些举措）→ 问题+下步


      帽段亮点表达…'
    source_file: 02_rules/book_principles/笔杆子炼成.yaml
  - id: BG-022
    title: 政策部署类意见/通知共性框架
    importance: A
    execution: agent_prompt
    applicable_types:
    - 方案
    - 报告
    content_summary: "政策部署类文件（意见/实施意见/指导意见/通知）标准结构：\n\n帽段：概念界定 / 强调必要性意义 / 总结近期成效不足（三选一或省略）\n经××同意，现提出如下意见（就有关事项通知如下）：\n\n\
      一、总体要求\n   （一）指导思想：以××为指导，深入贯彻……坚持××，加快/加强/健全……确保……\n   （二）基本原则：坚持××，……（通常3-4条原则，\"坚持+名词短语\"格式）\n   （三）工作目标：到××年，实现……达到……确保……\n\
      \n二、主要任务（核心内容部分，3-6条，每条均有明确措施主体、时限、量化目标）\n三、保障措施（组织领导/资金保障/监督考核/宣传引导，通常4条）"
    source_file: 02_rules/book_principles/笔杆子炼成.yaml
  - id: SP-001_李忠秋结构化
    title: 结论先行原则
    importance: A
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 方案
    - 邮件
    - 工作总结
    - 讲话
    content_summary: '一次表达只支持一个核心观点或中心思想，且必须放在开头位置。

      无论是标题、序言还是段落，结论都要第一时间呈现。

      金字塔结构中，除最底层事实/数据外，每一层都必须是"结论"。

      错误示例：先罗列细节，最后才用"总之"点出结论。

      正确示例：开篇即给出"从选、育、留三方面着手"，再展开具体措施。'
    source_file: 02_rules/book_principles/李忠秋_结构化写作.yaml
  - id: SP-002_李忠秋结构化
    title: 以上统下原则
    importance: A
    execution: agent_prompt
    applicable_types:
    - 报告
    - 方案
    - 汇报
    - 工作总结
    content_summary: '上一层结论是对下一层信息的概括和总结；下一层信息是对上一层结论的解释和支撑。

      包含三个方向：

      1. 概括——不能只罗列，要对信息进行总结并得出结论；

      2. 论证——有观点必须给出充分依据；

      3. 对应——论点与论据必须在同一范畴内，不能"以偏概全"或"各说各话"。

      错误示例：结论说"三大工具"，下层却混入"关系"和"作用"等不同层次的内容。'
    source_file: 02_rules/book_principles/李忠秋_结构化写作.yaml
  - id: SP-003_李忠秋结构化
    title: 归类分组（MECE）原则
    importance: A
    execution: agent_prompt
    applicable_types:
    - 报告
    - 方案
    - 汇报
    - 工作总结
    content_summary: '具有相似性或相互关联的信息要按照一定标准归为同一逻辑范畴，且须满足MECE原则：

      - 相互独立（Mutually Exclusive）：同一分类中各信息之间不能重叠；

      - 完全穷尽（Collectively Exhaustive）：相对于上层结论，下层信息不能有所遗漏。

      信息达到3项及以上，首先考虑分类和排序。

      错误示例：将"职业发展""生活""个人爱好"并列，概念层次不齐。'
    source_file: 02_rules/book_principles/李忠秋_结构化写作.yaml
  - id: SP-004_李忠秋结构化
    title: 逻辑递进（有序排列）原则
    importance: A
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 方案
    - 工作总结
    - 讲话
    content_summary: '同一逻辑范畴的信息必须按照一定的逻辑顺序排列，三种常用顺序：

      1. 时间顺序——按事情发生先后排列（前、中、后；阶段一、二、三）；

      2. 结构顺序——按整体的组成部分排列，各部分间为并列关系；

      3. 重要顺序——按轻重缓急排列，重点突出、主次分明。

      规则：同一分支中相同层级只能使用同一种排序方式，不可混用。'
    source_file: 02_rules/book_principles/李忠秋_结构化写作.yaml
  - id: SP-005_李忠秋结构化
    title: 金字塔结构核心模型
    importance: A
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    - 工作总结
    content_summary: '条理清晰的文章背后必有金字塔结构：

      - 顶端：唯一的中心思想/总结论；

      - 横向：从不同维度展开（广度），各分支MECE；

      - 纵向：逐层向下延伸（深度），上下论证对应。

      四个原则对应两个方向：

      - 纵向：结论先行 + 以上统下；

      - 横向：归类分组 + 逻辑递进。

      构建顺序：先纵向（分层）→再横向（定序）。'
    source_file: 02_rules/book_principles/李忠秋_结构化写作.yaml
  - id: LR-001
    title: 标题SPA三原则
    importance: A
    execution: agent_prompt
    applicable_types:
    - 报告
    - 方案
    - 邮件
    - 汇报
    - 工作总结
    content_summary: '职场写作标题须同时满足三项标准：

      S（Simple，简单明确）：形式简洁，控制字数（16字以内），标题本身是一个明确的"结论"。

      P（Profit，利益相关）：突出与读者切身相关的利益点，从对方角度出发（换位思考）。

      A（Accurate，准确客观）：实事求是，不夸大，不过多表达主观情绪；标题须是全文的终极提炼。

      错误示例：《积分贷产品介绍》——言之无物。

      正确示例：《大力推广积分贷产品，实现多方共赢》——结论+利益。'
    source_file: 02_rules/book_principles/李忠秋_结构化写作.yaml
  - id: LR-003
    title: 语言清晰明确具体三要求
    importance: A
    execution: agent_prompt
    applicable_types:
    - 方案
    - 报告
    - 说服性写作
    - 汇报
    content_summary: '说服性写作对语言使用有三项基本准则：

      清晰——不使用模糊不清、模棱两可的词语；必要时对概念进行说明澄清。

      明确——观点鲜明，表明立场和态度，避免言之无物、流于形式。

      具体——用细致准确的事实和数据说话，避免过于抽象和笼统；细节描述能增强说服力。'
    source_file: 02_rules/book_principles/李忠秋_结构化写作.yaml
  - id: MT-001_李忠秋结构化
    title: SCQA序言四要素框架
    importance: A
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 方案
    - 邮件
    - 讲话
    content_summary: '职场写作序言采用SCQA模式构建背景导入：

      S（Situation，情境）：对原本稳定状态的描述，是读者认可的已知事实，建立共情与代入感。

      C（Complication，冲突）：打破稳定状态的因素，制造矛盾张力，触发读者心中的疑问。

      Q（Question，疑问）：由冲突引发的问题，引导读者思考方向（若疑问明显，可隐去）。

      A（Answer，回答）：解答疑问，即文章的核心结论/主题。

      A与标题须保持对应，SCQA序言实质是用SCQ导出主题A（结论先行在序言层的体现）。'
    source_file: 02_rules/book_principles/李忠秋_结构化写作.yaml
  - id: MT-003_李忠秋结构化
    title: 并列式内容展开（2W1H）
    importance: A
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 方案
    - 邮件
    content_summary: '传递信息/描述说明类写作，采用2W1H并列框架展开核心内容：

      WHAT——是什么（描述事物本身）；

      WHY——为什么（说明原因/价值）；

      HOW——怎么做（操作方法/实施路径）。

      三者顺序可根据场合灵活调整，也可选择性只展开其中部分。

      若对方已接受前提，可着重HOW；若需先说服，可先说WHY；若需说清楚内容，先说WHAT。

      适用于：向领导汇报工作进展、向同事介绍项目、向客户介绍产品。'
    source_file: 02_rules/book_principles/李忠秋_结构化写作.yaml
  - id: MT-004_李忠秋结构化
    title: 层进式内容展开（现象-原因-方案）
    importance: A
    execution: agent_prompt
    applicable_types:
    - 报告
    - 方案
    - 汇报
    content_summary: '澄清问题/解决问题类写作，采用层进式框架：

      现象（是什么问题）→原因（为什么出现）→解决方案（怎么解决）。

      格式固定，有明确先后顺序：先发现问题，再分析，再解决。

      层进式具有强说服力，因为它隐含逻辑推理（三段论演绎形式）。

      注意：现象、原因、解决方案须一一对应（见SP-007）。

      与并列式的区别：并列式灵活，层进式固定；并列式侧重描述，层进式侧重问题解决。'
    source_file: 02_rules/book_principles/李忠秋_结构化写作.yaml
  - id: MT-005_李忠秋结构化
    title: 工作总结三步法
    importance: A
    execution: agent_prompt
    applicable_types:
    - 工作总结
    - 汇报
    content_summary: '写出有思想、有高度的工作总结，分三步：

      第一步 成果分类：用"行动-成果"表梳理主要工作事项及对应成果；区分"行为结果"和"成就结果"，重点突出成就；对成果进行开放式或封闭式分类。

      第二步 排序整理：按时间顺序、结构顺序或重要顺序对工作成果进行排列；同层级只用一种顺序。

      第三步 概括总结：用信息摘要法或逻辑推论法对每一层级进行概括，形成明确的结论；结论须体现措施与成效，不可仅是类名。

      核心公式：工作总结 = 总结工作成果（而非罗列工作内容）。'
    source_file: 02_rules/book_principles/李忠秋_结构化写作.yaml
  - id: MT-008_李忠秋结构化
    title: 信息摘要法与逻辑推论法
    importance: A
    execution: agent_prompt
    applicable_types:
    - 工作总结
    - 报告
    - 汇报
    - 方案
    content_summary: '两种向上层概括结论的方法：

      信息摘要法——从多个具体信息中提炼共同的本质属性，形成上层抽象概念。

      示例：龙猫、仓鼠、蜥蜴、兔子、乌龟→消费者需要小动物做宠物养。

      逻辑推论法——根据多个前提推导出它们共同导向的判断/结果。

      示例：财产共有可能增加税、妨碍遗嘱、使离婚复杂……→财产共有将使你的家庭受到损害。

      区别：摘要法提取共同属性；推论法找共同导向的结果。

      实践中逻辑推论法更常用，难度也更大，需要深度思考。'
    source_file: 02_rules/book_principles/李忠秋_结构化写作.yaml
  - id: MT-009
    title: WA目标法确定说服目标
    importance: A
    execution: agent_prompt
    applicable_types:
    - 方案
    - 说服性写作
    - 申请
    - 汇报
    content_summary: '说服性写作前，用WA法设定明确目标：

      W（Who）——说服的对象是谁（具体到人或群体，不能只说"公司"）；

      A（Achievement）——希望对方看完后做到什么（同意/认可/采纳/接受……，并采取哪些行动）。

      完整表述：希望[W]在看完我写的内容之后，能够[A]。

      同一内容面对不同W时，目标不同，观点切入点也不同。

      目标与观点须区分：目标是期望的行动结果；观点是说服内容的核心思想。'
    source_file: 02_rules/book_principles/李忠秋_结构化写作.yaml
  - id: MT-010_李忠秋结构化
    title: 疑问-回答法构建说服框架
    importance: A
    execution: agent_prompt
    applicable_types:
    - 方案
    - 说服性写作
    - 申请
    - 汇报
    content_summary: '在明确观点后，站在读者（对方）立场设想其可能产生的疑问，逐一回答，以此构建说服框架。

      操作步骤：

      1. 明确观点（结论）；

      2. 设想对方针对此观点会问哪些问题（换位思考）；

      3. 逐一回答，回答本身也形成新的观点，可继续设想下一层问题；

      4. 横向覆盖越广，纵向越深入，说服力越强。

      最难之处在于"设想问题"——问题必须是对方真正关心的，而非自己掌握的信息的反向推导。

      可配合5W2H模型确保问题覆盖全面（见MT-011）。'
    source_file: 02_rules/book_principles/李忠秋_结构化写作.yaml
  - id: MT-014
    title: 五步方案写作法
    importance: A
    execution: agent_prompt
    applicable_types:
    - 方案
    content_summary: '完整方案写作分五步（基于结构思考力三层次模型）：

      第一步 描述问题定方向——用5W2H全面描述问题，弄清"问题是什么"后再动手；

      第二步 基于目标定主题——用WA法确定目标，用SPA原则设计标题，用SCQA写序言；

      第三步 纵向结构分层次——自上而下（疑问-回答展开）或自下而上（罗列→分类→概括）建立框架；

      第四步 横向结构选顺序——明确信息组为演绎型或归纳型，选定排序逻辑；

      第五步 形象表达做演示——用结构罗盘"配得上"三步（配关系→得图示→上包装）进行视觉化处理。

      总原则：先框架再细节，先整体再局部。'
    source_file: 02_rules/book_principles/李忠秋_结构化写作.yaml
  - id: MT-017
    title: 说服三维度综合检验
    importance: A
    execution: agent_prompt
    applicable_types:
    - 方案
    - 说服性写作
    - 申请
    - 汇报
    content_summary: '一次有效说服须通过三个层面的检验：

      1. 目标明确——读者能看懂、抓住核心诉求（对方知道你要什么）；

      2. 换位思考——读者能看到自己的利益被考虑（对方感到被尊重）；

      3. 有理有据——充分且合理的理由与逻辑支撑（对方能被说服）。

      三步写作过程中的三次视角切换：

      设定目标时——自问自答（我为何要说服？预期是什么？）；

      确定观点时——想象自己与对方沟通（核心诉求是什么？）；

      疑问回答时——完全代入对方立场（对方会关心哪些问题？）。'
    source_file: 02_rules/book_principles/李忠秋_结构化写作.yaml
  - id: PM-001
    title: '""论证类比"四原则口诀"'
    importance: A
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    - 工作总结
    content_summary: '结构化写作四个核心原则的速记口诀：

      论——结论先行（一次表达一个核心观点，放在最前）；

      证——以上统下（上层统领下层，下层支撑上层）；

      类——归类分组（相似信息归为同一逻辑范畴）；

      比——逻辑递进（同层信息按逻辑顺序排列）。

      可用于自检：写完一篇文章，逐条对照"论证类比"验证是否合格。'
    source_file: 02_rules/book_principles/李忠秋_结构化写作.yaml
  - id: PM-002
    title: 工作总结核心公式
    importance: A
    execution: agent_prompt
    applicable_types:
    - 工作总结
    - 汇报
    content_summary: '工作总结 = 总结工作成果（而非罗列工作内容）。

      受众关注的是成果，不是过程。

      工作写完后，须追问自己："然后呢？"——如果回答不出来，说明只有行为，没有成就。

      "功劳"是成就，"苦劳"是行为；多数绩效考核以成就为主。

      领导的反馈升级路径：踏实勤恳→有思想有高度→高级职业经理人（靠概括能力实现跨越）。'
    source_file: 02_rules/book_principles/李忠秋_结构化写作.yaml
  - id: PM-003
    title: 标题万能公式
    importance: A
    execution: agent_prompt
    applicable_types:
    - 报告
    - 方案
    - 邮件
    - 汇报
    - 工作总结
    content_summary: '职场写作标题设计公式：谁 + 做了什么事 + 得到什么结果。

      应用示例：

      《积分贷产品介绍》→《大力推广积分贷产品，实现多方共赢》

      《春节内部推荐政策》→《春节期间内推奖励翻翻》

      《4G终端产品营销方案》→《加大资源投入，提升4G客户份额》

      《××公司战略规划报告》→《改革创新，降本增效，提升经营业绩》

      核心逻辑：让读者一眼看到"对你有什么好处"（利益点）。'
    source_file: 02_rules/book_principles/李忠秋_结构化写作.yaml
  - id: CQ-004
    title: 总分结构对应性
    importance: A
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: 文中的总说和分说是否完全对应？总括句提到几项，下文是否逐一展开？
    source_file: 02_rules/content_quality/quality_rules.yaml
