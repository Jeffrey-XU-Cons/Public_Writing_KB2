  - id: SP-007
    title: 结构四层次模型
    importance: B
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: 检查公文结构是否在四个层次上均保持清晰逻辑： ①文种层次——检查所选文种是否正确，决定整体格式框架； ②篇章层次——检查整体谋篇布局，各大部分关系和顺序是否合理； ③段落层次——检查每段是否围绕一个意义单元，段内结构是否清晰；
      ④句子层次——检查句与句之间是否有逻辑衔接，起承转合是否自然。 不得在任何一个层次上出现混乱。
    source_file: 02_rules/book_principles/胡森林_公文写作底层心法.yaml
  - id: SP-011
    title: 观点提炼源于实践高于实践
    importance: B
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    content_summary: 检查公文观点是否满足两个条件： ①源于实践——观点须从实际工作、真实数据、具体案例中提炼，不得出现空洞主观臆断； ②高于实践——观点须能揭示规律、概括本质，不得仅停留在事实描述层面。 检查观点是否具备四个标准：鲜明（立场清晰）、深刻（揭示本质规律）、
      新颖（有独到见解而非人云亦云）、实用（对工作有指导价值）。
    source_file: 02_rules/book_principles/胡森林_公文写作底层心法.yaml
  - id: MT-002
    title: 时事势三字立意法
    importance: B
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    content_summary: 检查公文立意是否具备三字框架的高度： 【时】——检查是否体现时代背景和当前时点特征，立意是否体现时代性（当前形势、政策导向）； 【事】——检查立意是否紧扣具体事项，从实际工作出发，具有针对性； 【势】——检查立意是否顺应发展趋势，具有前瞻性，能体现方向感。
      必须包含时代背景+具体事项+发展趋势三者的有机结合。
    source_file: 02_rules/book_principles/胡森林_公文写作底层心法.yaml
  - id: MT-003_胡森林公文写
    title: 四思立意法（高度深度角度尺度）
    importance: B
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    content_summary: 检查公文立意是否经过四个维度深化： ①高度——是否站在全局和宏观层面审视问题，具有党和国家层面或行业层面的站位； ②深度——是否挖掘到事物本质规律和深层原因，而非停留于表象； ③角度——是否具有新的切入点，避免老生常谈；
      ④尺度——表达分寸是否准确，是否把握政策边界，不超出应有范围。
    source_file: 02_rules/book_principles/胡森林_公文写作底层心法.yaml
  - id: MT-007_胡森林公文写
    title: 八种逻辑关系（段落与段落间）
    importance: B
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: 检查公文各部分之间的逻辑关系是否清晰，属于以下八种之一： ①并列——各点地位平等，可互换顺序； ②递进——各点层层深入，有先后递进关系，不可互换； ③因果——前者是后者的原因； ④条件——在某条件下才会产生某结果；
      ⑤转折——前后意思相反或对比； ⑥假设——假定某条件成立的推断； ⑦解说——后面是对前面的阐述说明； ⑧总分——前面总述，后面分述（或先分后总）。 必须包含与逻辑关系对应的连接词和结构形式。
    source_file: 02_rules/book_principles/胡森林_公文写作底层心法.yaml
  - id: MT-009_胡森林公文写
    title: 常见五种结构类型选择法
    importance: B
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: 检查所选结构类型是否与内容性质匹配： ①并列式——各部分内容是否平行地位相当，适合工作部署/经验总结； ②递进式——各部分是否层层深入，适合分析类论证类文章； ③倒金字塔式——是否结论先行再展开，适合需要快速传递核心信息的报告；
      ④总分式——是否先总述再分述，适合综合汇报类文章； ⑤自由式——是否根据内容灵活组合，适合复杂综合性文章。 不得出现结构类型与内容逻辑不匹配的情况。
    source_file: 02_rules/book_principles/胡森林_公文写作底层心法.yaml
  - id: MT-010_胡森林公文写
    title: 标题制作四种常用写法
    importance: B
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: 检查各部分标题的类型是否符合内容需要，属于以下四种之一： ①陈述式短语——仅概括该部分内容，无观点； ②观点性祈使句——带有明确指向，最常用； ③词语统领式——用同一词组开头统领各标题，形式整齐； ④自然承接式——能准确概括段落大意的句子。
      不得出现过度追求对仗工整而与内容不符、辞不达意的标题。
    source_file: 02_rules/book_principles/胡森林_公文写作底层心法.yaml
  - id: MT-012
    title: 四情三脉情况研究法
    importance: B
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    content_summary: 检查起草综合性公文前是否已研究四情三脉： 【四情】——上情（上级政策和要求）、下情（基层执行和实际困难）、 内情（本单位工作现状）、外情（同类单位做法和经验）是否均已掌握； 【三脉】——时间脉络（工作发展历程）、工作脉络（各项工作的逻辑关联）、
      逻辑脉络（问题-原因-措施的内在逻辑）是否均已梳理清楚。 避免以偏概全或遗漏关键背景。
    source_file: 02_rules/book_principles/胡森林_公文写作底层心法.yaml
  - id: MT-014_胡森林公文写
    title: 问题意识写作法（围绕问题写公文）
    importance: B
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    content_summary: 检查公文是否符合问题意识的五步要求： ①是否提出了一个新问题，有的放矢； ②是否有自己悟到的新思想，体现对问题的独到理解； ③是否有精心挑选的事例，能理论联系实践； ④是否有合适的比喻、典故或数据，深入浅出；
      ⑤是否有与惯例不同的表述或新语言，避免照搬文件。 必须包含：公文能回答的真实问题，且问题须重要而具体。
    source_file: 02_rules/book_principles/胡森林_公文写作底层心法.yaml
  - id: MT-015
    title: 运思四法（公文构思的四种思维模式）
    importance: B
    execution: agent_prompt
    applicable_types:
    - 讲话
    - 方案
    - 报告
    content_summary: 检查公文构思是否运用了与文种匹配的思维方式： ①辩证思维——讲话/分析报告是否做到"一分为二"，避免片面； ②战略思维——方案/规划是否从全局和长远角度思考，具备前瞻性； ③全局思维——重要公文是否正确处理全局与局部、未来与现实的关系；
      ④创新思维——需要出新意的文章是否打破常规，提出新见解。
    source_file: 02_rules/book_principles/胡森林_公文写作底层心法.yaml
  - id: MT-016
    title: 调查研究前序工作法
    importance: B
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    content_summary: 检查高质量公文写作前是否完成了调查研究的标准流程： ①是否精心准备了调研提纲，明确调研目的和核心问题； ②是否提前了解调研单位和相关问题背景； ③调研中是否先看现场再开座谈会； ④座谈中是否善于追问，获取深层信息；
      ⑤调研后是否认真梳理，去粗取精，将零碎材料系统化。
    source_file: 02_rules/book_principles/胡森林_公文写作底层心法.yaml
  - id: MT-017_胡森林公文写
    title: 统稿八看法（多人协作文稿质量检查）
    importance: B
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    content_summary: 检查统稿修改阶段是否完成八个维度的检查： ①检查各部分与主题的联系——是否存在"开小差"偏离主题的内容； ②检查各部分是否形成有机整体——起承转合是否顺畅，前后是否照应； ③检查各部分内容是否大体均衡——是否存在详略不一的情况；
      ④检查层次衔接配合——是否存在交叉重复，脉络是否清楚； ⑤检查主次是否分明——重点是否突出，是否存在喧宾夺主； ⑥检查标题逻辑是否严密，制作质量是否一致； ⑦检查关键词/关键数据是否前后一致，是否存在相互矛盾； ⑧检查行文习惯和风格是否统一，是否存在拼凑感。
    source_file: 02_rules/book_principles/胡森林_公文写作底层心法.yaml
  - id: MT-019
    title: 思维导图辅助构思三步法
    importance: B
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: 检查公文构思是否经历了系统化的三步流程： ①发散——是否以核心主题为中心，辐射发散，写出所有相关联的想法和素材线索； ②归类整理——是否将发散内容进行了系统化整理，归入各主要板块，明确主次和层次关系；
      ③形成提纲——是否将思维逻辑转化为文字提纲，确定一级二级标题，标注主要内容要点。
    source_file: 02_rules/book_principles/胡森林_公文写作底层心法.yaml
  - id: MT-022
    title: 论据三类型及使用原则
    importance: B
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    content_summary: 检查公文论据是否符合三种类型的使用要求： ①事实论据——是否真实、有代表性、能直接支撑观点； ②数字论据——来源是否可靠，是否标注时间，是否有纵向/横向对比； ③引用论据——引用是否准确，来源是否可查，是否断章取义。
      检查是否遵循选用原则：能用数字不得用形容词（"提高50%"优于"大幅提高"）； 事实论据须有细节，不得只有空泛概括。
    source_file: 02_rules/book_principles/胡森林_公文写作底层心法.yaml
  - id: MT-001_胡森林公文写
    title: 观点转化五途径
    importance: B
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: '检查公文观点是否来源于以下五个渠道之一：

      1. 书本——是否从理论著作、经典文献中汲取了理论支撑；

      2. 上级精神——是否将上级文件、领导讲话要求转化为本单位的具体观点；

      3. 领导意图——是否将领导的想法、思路转化为成文的观点表述；

      4. 他人智慧——是否从同行经验、调研访谈、讨论交流中提炼了观点；

      5. 实践感悟——是否从一线工作实践和个人思考中凝练了独特观点。'
    source_file: 02_rules/book_principles/胡森林_公文写作心法笔杆.yaml
  - id: MT-006_胡森林公文写
    title: 驾驭矛盾三法
    importance: B
    execution: agent_prompt
    applicable_types:
    - 讲话
    - 汇报
    - 方案
    content_summary: '检查公文处理内容矛盾和张力时是否运用了合适的方法：

      1. 上下结合——宏观论断与具体数据事实是否相印证，是否存在只高屋建瓴无细节或只有细节无论断；

      2. 刚柔相济——是否兼顾明确要求（刚）与工作空间（柔），是否过于刚硬或过于模糊；

      3. 情理交融——是否在逻辑论证的同时兼顾情感共鸣，特别是讲话稿。

      适用场景：政治性文件用上下结合，部署性文件用刚柔相济，讲话稿用情理交融。'
    source_file: 02_rules/book_principles/胡森林_公文写作心法笔杆.yaml
  - id: MT-007_胡森林公文写
    title: 开头首因策略
    importance: B
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: "检查重要场合的公文开头是否满足首因效应要求：\n1. 重要场合须特别用心开头——第一次提交工作成果、给新领导准备文稿时，\n   开头段落是否先声夺人，能否留下良好的第一印象；\n2. 开头段落是否高质量——文章第一页、第一段是否具备：\n\
      \   主题鲜明、语言精练、有吸引力（问题感或结论感）。\n不得出现开头段落一塌糊涂而后文写得好的情况。"
    source_file: 02_rules/book_principles/胡森林_公文写作心法笔杆.yaml
    see_also: CQ-011（'正确的废话'检测）为套话废话的综合规则
  - id: MT-008_胡森林公文写
    title: 刻意学习与复盘机制
    importance: B
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: "检查是否建立了刻意学习与复盘的提升机制：\n1. 刻意学习——是否有意识地钻研，带着问题学，学后即用；\n2. 深度复盘——每次写作后是否回顾哪里写得好、哪里写得差、为什么；\n   是否复盘他人优秀文稿，总结规律，提出方法论；\n\
      3. 学用结合——是否将学到的方法立即运用到下一篇文稿中，形成正向循环。"
    source_file: 02_rules/book_principles/胡森林_公文写作心法笔杆.yaml
  - id: PM-001_胡森林公文写
    title: 公文写作六个"言之"金句
    importance: B
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: '检查公文是否覆盖六个"言之"维度：

      立意→言之有方（方向是否正确）；主题→言之有核（中心是否明确）；

      结构→言之有序（逻辑是否清晰）；内容→言之有物（材料是否充实）；

      语言→言之有味（表达是否得体）；文气→言之有脉（气韵是否贯通）。'
    source_file: 02_rules/book_principles/胡森林_公文写作心法笔杆.yaml
  - id: WQ_MT_005
    title: 立纲两种方法（发散法与归纳法）
    importance: B
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 方案
    content_summary: "检查立纲方法是否与行文方向匹配：\n1. 发散法（适用下行文）——是否先确定领导意图/观点，再向外发散展开；\n   是否参照上级文件和该领导历次讲话进行发散；\n2. 归纳法（适用上行文）——是否先掌握大量材料，再从中提炼观点；\n\
      \   是否用多级综合归纳（小标题→中级标题→大标题）；\n   最终是否按因果/承接/意义轻重排序形成完整提纲。\n下行文须\"定方向→填内容\"，上行文须\"看材料→提观点\"，不得混用。"
    source_file: 02_rules/book_principles/王群_公文写作大手笔.yaml
  - id: WQ_MT_006
    title: 材料综合横纵四法
    importance: B
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    content_summary: "检查公文综合整理材料是否运用了合适的方法：\n横向综合：\n  - 堆积法——各单位情况是否各有千秋，不能千人一面；\n  - 归纳法——是否先归纳出几个观点，各观点下举2-3单位情况，脉络是否清楚；\n\
      纵向综合：\n  - 累积法——是否将一段时期情况进行数量叠加汇总；\n  - 阶段法——是否找出不同阶段的特点，将材料分类放入各阶段特点之下。\n检查观点提炼是否准确新颖，这是综合质量高低的核心。"
    source_file: 02_rules/book_principles/王群_公文写作大手笔.yaml
  - id: WQ_MT_007
    title: JK三级综合法（处理大量材料的提纲生成法）
    importance: B
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    content_summary: "检查处理大量材料时是否运用了三级综合方法：\n第一步（J卡）——是否逐一阅读每份材料，提炼1-2个最突出内容，归纳为小标题；\n第二步（Q卡）——是否将意思相近的内容码成一堆，用一个新标题概括每堆的共同规律；\n\
      第三步（K卡）——是否对Q卡进一步归纳，合并带有共同点的Q卡，产生K级大标题，\n                并按因果/意义轻重排序；若K卡仍过多是否继续合并。\n结果须形成K→Q→J的三级提纲层次，结构清晰、提炼准确。"
    source_file: 02_rules/book_principles/王群_公文写作大手笔.yaml
  - id: WQ_MT_008
    title: 层次组合四原则
    importance: B
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: '检查多层级公文结构组合是否遵循四原则：

      1. 内涵相称原则——同一层级各层次内涵是否大体相称（"辈分相等"），是否存在越级；

      2. 层级从属原则——较低层级各层次是否从属于对应上一层次，是否存在"血统不清"（内容交叉混乱）；

      3. 标准唯一原则——层次划分是否依据单一标准，同一层级是否只用横式或纵式，不得混用；

      4. 排列有序原则——横式结构是否按问题大小/意义深浅排，纵式结构是否按时间/因果/阶段排序。'
    source_file: 02_rules/book_principles/王群_公文写作大手笔.yaml
  - id: WQ_MT_012
    title: 领导意图三种受命类型
    importance: B
    execution: agent_prompt
    applicable_types:
    - 讲话
    - 报告
    content_summary: '检查代拟讲稿时是否正确识别并应对了领导意图的类型：

      1. 完全受命型——领导意图详细明确时，是否逐条完整准确体现；

      2. 有限受命型——领导给出原则框架时，是否在框架内创造性补充了具体内容，向深处挖掘；

      3. 无限受命型（意图模糊型）——领导仅指明方向时，是否全面研究，自主设计内容结构后提请审定。

      三种情形均须：听关键几句话悟出领导本意和真意，不得机械呆板。'
    source_file: 02_rules/book_principles/王群_公文写作大手笔.yaml
  - id: WQ_MT_015
    title: 工作总结不足部分三有要求
    importance: B
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    content_summary: '检查工作总结中谈问题和不足的部分是否满足"三有"要求：

      1. 有不足的具体表现——是否为具体描述而非原则性套话（如"成效尚不理想"等）；

      2. 有对主客观原因的深入分析——是否为深入分析而非泛论（如"领导水平有限"等）；

      3. 有改进不足的具体举措——是否提出了具体措施，使总结对未来工作有实际指导价值。

      同时须检查报送对象：上报须突出规律性认识和经验；下发时须多担责任少批评下面。'
    source_file: 02_rules/book_principles/王群_公文写作大手笔.yaml
  - id: WQ_MT_016
    title: 用材四原则（鉴材筛选标准）
    importance: B
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: '检查公文材料筛选是否符合四大原则：

      1. 相关性——材料与公文主旨是否关联，是否选用了"一个顶俩"的最能说明主旨的材料；

      2. 真实性——材料来源是否可靠，来源有疑问的材料是否经过核实；

      3. 典型性——材料是否有普遍意义和代表意义，是否选用了带偶然性、缺乏说服力的材料；

      4. 新颖性——材料是否新近发生，是否使用了陈旧的众所周知的情况。

      检查是否存在只取对己有利的一面、偏颇不全面的情况。'
    source_file: 02_rules/book_principles/王群_公文写作大手笔.yaml
  - id: WQ_MT_017
    title: 用材三技法（合并/角度/详略）
    importance: B
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    content_summary: '检查公文材料运用是否合理，并注意三种技法：

      1. 合并同类——是否将数个相关材料综合成一个整体，避免单摆浮搁；

      2. 调整角度——同一材料是否从最有效的角度使用，服务于当前主旨；

      3. 详略之法——是否遵循"久则论略，近则论详；略则举大，详则举小"的原则。

      必须检查以下三种错误是否存在：

      ①观点材料打架（讲一回事材料讲另一回事）；

      ②貌合神离（强行对应，拉郎配）；

      ③以偏概全（仅2个事例代替全局情况，须先有综合概述再举例）。'
    source_file: 02_rules/book_principles/王群_公文写作大手笔.yaml
  - id: WQ_MT_018
    title: 材料消化三步法（筛选→定位→编织提炼）
    importance: B
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 方案
    content_summary: "检查将原始材料消化成文是否经历了三个阶段：\n1. 筛选补充——是否按写作目的挑选有用材料，剔除陈旧/无关材料，并对不足方面进行了补充；\n2. 归纳定位——是否按写作意图将材料分类归纳，按逻辑关系排序，每类内部是否按层次排好位置；\n\
      3. 编织提炼——零散材料是否综合拼接成连贯系统材料；庞杂材料是否概括提炼后写入文章，\n              须避免过分概括变成概念化。\n特别检查：上级精神是否融会贯通后用自己的话讲出，不得大段照搬。"
    source_file: 02_rules/book_principles/王群_公文写作大手笔.yaml
  - id: WQ_SP_003
    title: 公文层次横纵两式（条款/总分/递进/因果/时序）
    importance: B
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: "检查公文段落层次的组合方式是否合理：\n横式结构：\n  - 条款式——各层次是否平行互补，犹如多枝鲜花集成一束；法规类公文是否使用；\n  - 总分式——是否有总写和分写两部分，分写各层次是否并列（可互换顺序）；\n\
      纵式结构：\n  - 递进式——各层次是否环环相扣逐层深入，顺序是否不可调换；\n  - 因果式——层次是否由原因与结果构成，是否由因到果或由果溯因；\n  - 时序式——是否按事情发生的时间先后安排。\n必须检查：同一层级是否存在横式与纵式混用的情况，若有则须修改。"
    source_file: 02_rules/book_principles/王群_公文写作大手笔.yaml
  - id: MT-002_公文高手自我
    title: 观世音菩萨五字写作心法
    importance: B
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: '检查公文写作是否具备五种核心能力：

      （1）观——是否通过深入调研，察事为先，掌握了第一手材料；

      （2）世——是否通达世事，了解社会、政策、行业动态，不脱离实际；

      （3）音——语言是否有力量，节奏感是否强，读来是否朗朗上口；

      （4）菩——思维是否清晰，是否善于分析，是否找到了问题本质；

      （5）萨——是否体现了为人民服务的情怀，是否心系群众，是否有人文关怀。'
    source_file: 02_rules/book_principles/公文高手自我修炼.yaml
  - id: MT-009_公文高手自我
    title: 练好三门功做好三件事
    importance: B
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: '检查是否具备三门功并落实了三件事：

      【三门功】

      （1）问题意识——是否时刻带着问题思考，是否有问题导向；

      （2）调查研究——是否重视第一手材料，是否存在形式主义调研；

      （3）思维训练——是否把复杂问题简单化，是否平时储备观点；

      【三件事】

      （1）善于学习——是否广泛阅读，博采众长；

      （2）勤于练笔——是否有怀疑精神，每写一稿是否反问"还能更好吗"；

      （3）乐于总结——是否及时反思总结，是否将经验提炼为规律，形成认知积累。'
    source_file: 02_rules/book_principles/公文高手自我修炼.yaml
  - id: MT-013_公文高手自我
    title: 上行公文五种沟通场景
    importance: B
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    content_summary: '检查上行公文是否正确识别并运用了对应沟通场景的技法：

      （1）建言献策场景——是否通过反映社情民意和积极建言，展现了才干和见解；

      （2）借势做大场景——是否充分利用了上级授权和平台资源；

      （3）树立权威场景——是否通过公文为执行争取了支持，解决了内部阻力；

      （4）周旋博弈场景——是否既达到了目的，又避免了不必要冲突；

      （5）提出创意场景——是否通过奏报提出了设想，推动上级形成决策。

      检查上行公文是否具备三性：针对性（针对特定受文者）、

      论断性（断=要做什么，论=为什么）、实效性（是否达到预期目的）。'
    source_file: 02_rules/book_principles/公文高手自我修炼.yaml
  - id: MT-014_公文高手自我
    title: 调研报告写作十要点
    importance: B
    execution: agent_prompt
    applicable_types:
    - 报告
    content_summary: '检查调研工作是否完成了完整执行清单：

      （1）是否精心准备了调研提纲；

      （2）是否提前了解了调研单位及调研问题的情况；

      （3）调研中是否先看现场后开座谈会；

      （4）是否认真准备了座谈会发言，让被调研方清楚调研目的和要求；

      （5）调研中是否引导气氛，善于提问，不轻易发表个人意见；

      （6）是否注意领会了调研组领导意思，必要时提出合理化建议；

      （7）是否注意自身形象，尽量未给被调研单位添麻烦；

      （8）调研结束后是否及时联系调研单位并致谢；

      （9）是否与调研中帮助的人保持联系；

      （10）调研后是否认真总结经验。

      必须检查：是否存在形式主义调研、走过场、数据造假的情…'
    source_file: 02_rules/book_principles/公文高手自我修炼.yaml
  - id: SP-003_公文高手自我
    title: 调研报告四要素写法
    importance: B
    execution: agent_prompt
    applicable_types:
    - 报告
    content_summary: '检查调研报告是否满足四个核心要求：

      （1）方向明确——是否坚持问题导向，直奔解决问题而去；

      （2）分析方法——是否全面辩证地分析，由表及里、由此及彼、去伪存真；

      　　  是否存在事实简单罗列、人云亦云、受既往定论约束的问题；

      　　  是否抓住"真"字：客观反映事物本来面貌，不夸大不缩小，不捏造不掩饰；

      （3）结构要求——是否做到：主题鲜明、重点突出、语言精练、论证严密、建议切实、措施可行；

      （4）对策措施——是否提出了有坚实基础的对策，是否在遣词造句上注意分寸，

      　　  是否坚持两分法、两点论，是否把话说过头。'
    source_file: 02_rules/book_principles/公文高手自我修炼.yaml
  - id: SP-004_公文高手自我
    title: 总结报告三特点五注意
    importance: B
    execution: agent_prompt
    applicable_types:
    - 报告
    - 汇报
    content_summary: '检查总结报告是否体现三个本质特点：

      （1）自我性——是否以第一人称叙述，是否是主体自身活动实践的产物；

      （2）概括性——是否已梳理、提炼、归纳，是否仍停留在流水账层面；

      （3）启发性——是否提出了深刻而具有普遍意义的见解，是否揭示了规律性。

      检查是否遵循写好总结的五点注意：

      （1）是否重视调查研究，是否以偏概全；

      （2）是否坚持实事求是，是否存在只写成绩不写错误；

      （3）是否重点在出经验、找规律，是否停留在表面现象；

      （4）是否发掘了亮点，是否总结了可积累和推广的经验；

      （5）是否点面结合，是否定性与定量结合，是否用数据和典型事例说明。

      不得出现以下三类…'
    source_file: 02_rules/book_principles/公文高手自我修炼.yaml
  - id: SP-006_公文高手自我
    title: 经验介绍材料四大要求
    importance: B
    execution: agent_prompt
    applicable_types:
    - 报告
    - 汇报
    content_summary: '检查经验介绍材料是否满足四大要求：

      （1）立意要新颖独到——是否发现了他人未发现的东西，是否给人启发而非照本宣科；

      （2）素材要真实充分——是否做到点面结合：

      　　  点（典型事例）+面（综合情况）是否兼顾，有点无面是否缺说服力，有面无点是否缺感染力；

      （3）结构要合理完整——每个问题是否包含三要素：

      　　  为什么（提出问题）→ 是什么（回答问题/做法）→ 怎么样（运用结果/效果）；

      （4）文字要生动形象——是否接地气、形象化，是否力求精练，是否三言两语切入正题。

      检查：是否存在"活材料写死"的情况，须突出典型性。'
    source_file: 02_rules/book_principles/公文高手自我修炼.yaml
  - id: SP-007_公文高手自我
    title: 会议纪要三核心要求
    importance: B
    execution: agent_prompt
    applicable_types:
    - 报告
    content_summary: '检查会议纪要是否满足三核心要求：

      （1）真实准确——内容是否来自会议本身，是否存在随意增减、擅自篡改；

      　　  是否出现演绎式、推理式、编造式纪要；意见不一致时是否写多数人的意见；

      （2）精练概括——是否抓中心抓要点，是否存在面面俱到、堆砌材料；

      　　  是否将口头语转化为书面语，认识性文字是否简略，结论性文字是否明确；

      （3）清楚明白——是否有明确结论，是/否/何时办/怎么办是否言之凿凿；

      　　  涉及责任划分、经费额度、完成时限是否全面准确清晰记录。

      检查时效性：一般会议是否3-5天内印发；重要紧急会议是否当天或隔天印发。'
    source_file: 02_rules/book_principles/公文高手自我修炼.yaml
  - id: SP-008_公文高手自我
    title: 工作方案合理可行三标准
    importance: B
    execution: agent_prompt
    applicable_types:
    - 方案
    content_summary: '检查工作方案是否满足合理可行的三个标准：

      （1）目标要现实合理——目标是否既不太容易也不好高骛远；

      （2）工作要求要具体可行——时间、步骤、进度、质量是否尽可能量化；

      　　  不能量化的是否有质的要求，是否明确了指标；

      （3）措施要切实可行——是否针对实际有可操作性；

      　　  是否对各项任务进行了分解落实，是否明确了责任单位和责任人，

      　　  是否明确了工作进度和工作结果的评价标准。

      检查常规要素是否按需包含：指导思想、目标任务、组织机构、实施步骤、工作要求。'
    source_file: 02_rules/book_principles/公文高手自我修炼.yaml
  - id: BG-006
    title: 平时把握领导意图七查法
    importance: B
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    content_summary: '平时动态把握领导意图的七个渠道：

      （1）查领导讲话：系统搜集梳理各内部载体（简报/内刊/工作通报/政务信息）中的领导讲话材料

      （2）查领导指示批示：收集领导批示原文，揣摩关注点和用词习惯

      （3）查领导的调度记录：平时的工作部署会/碰头会纪要等

      （4）查领导走访调研情况：陪同调研或调研后的相关材料

      （5）查领导读书关注点：领导阅读的书报、订阅的公众号、关注的热点

      （6）查领导的专业背景和工作经历：有助于预判其思维特点和语言习惯

      （7）查多研究领导相关的政务信息和上级材料：通读一年以来相关材料后"找到感觉"再动笔'
    source_file: 02_rules/book_principles/笔杆子炼成.yaml
  - id: BG-014
    title: 交稿有方——不仅要写好更要汇报好
    importance: B
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    content_summary: '写好稿子只是第一步，交稿的姿势同样重要：

      （1）主动向领导简报写作思路：若提纲有创新或与惯例不同，提前口头说明框架逻辑，引导领导形成预期

      （2）对关键段落加以说明：告知领导哪些是核心观点/亮点/需重点关注的修改点

      （3）面对修改意见保持谦卑：第一稿被修改是正常现象，关键是从领导修改的"花脸稿"中快速学习领导偏好，为下次积累个性化数据

      （4）让领导做选择题而非填空题：不清楚时提供2-3个框架方案供领导选择，而非空着来问"您觉得怎么写"'
    source_file: 02_rules/book_principles/笔杆子炼成.yaml
  - id: BG-015
    title: 写后复盘五维提炼法
    importance: B
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: '材料写完后的即时复盘是提升悟性的关键：

      （1）复盘框架：这次为什么列了这样的提纲？换一种思路会更好吗？

      （2）复盘素材：哪些素材用上了？哪些遗漏了？平时如何补上这类短板？

      （3）复盘词句：哪些表述让领导眼前一亮？哪些被删掉了？删的逻辑是什么？

      （4）复盘意图：这次是否真正吃透了领导意图？有没有偏差？下次如何更准？

      （5）复盘体例：这个文种有哪些可固化的框架规律？下次遇到同类任务如何直接迁移？


      精读→吸收→输出→复盘，形成正向循环后，写作悟性会在不知不觉中大幅提升。'
    source_file: 02_rules/book_principles/笔杆子炼成.yaml
  - id: SP-006_李忠秋结构化
    title: 演绎与归纳信息组区分
    importance: B
    execution: agent_prompt
    applicable_types:
    - 报告
    - 方案
    - 说服性写作
    content_summary: "金字塔结构中的信息组分两类：\n1. 演绎信息组——下层各项之间是\"前因后果\"的因果逻辑，可用\"因为……所以……\"连接；\n   常见形式：大前提→小前提→结论（标准式三段论）；\n   或：现象→原因→解决方案（常见式三段论）。\n\
      2. 归纳信息组——下层各项之间是\"并列\"关系，共同支撑上层结论；\n   须满足MECE原则；需选择合适的排列顺序。\n注意：演绎信息组中，三段论的\"结论\"与上层概括形成的\"结论\"是两个不同概念。"
    source_file: 02_rules/book_principles/李忠秋_结构化写作.yaml
  - id: SP-007_李忠秋结构化
    title: 现象-原因-方案须一一对应
    importance: B
    execution: agent_prompt
    applicable_types:
    - 方案
    - 报告
    - 汇报
    content_summary: '采用"现象→原因→解决方案"的层进式演绎结构时，解决方案须与原因一一对应。

      若原因列出3条，解决方案也应对应3条，不可数量错位。

      错误示例：原因列3项，解决方案提4项，读者无法判断对应关系。'
    source_file: 02_rules/book_principles/李忠秋_结构化写作.yaml
  - id: SP-008_李忠秋结构化
    title: 四种信息关系模式分类
    importance: B
    execution: agent_prompt
    applicable_types:
    - 方案
    - 汇报
    - PPT演示
    content_summary: '信息要素之间的关系可归为四种模式（共16种关系），用于形象化呈现：

      1. 流动模式：线性、流程、循环、关联——体现信息的流向与指向；

      2. 作用模式：对立、合力、平衡、阻碍——体现力量对比与相互作用；

      3. 关系模式：并列、重叠、包含、分割——体现结构与空间层次；

      4. 比较模式：成分、排序、序列、关联——体现数据间的比较关系。

      配套图示：成分→饼图；排序→条形图；序列→柱形图/折线图；关联→散点图。'
    source_file: 02_rules/book_principles/李忠秋_结构化写作.yaml
  - id: LR-002
    title: 标题字数限制16字
    importance: B
    execution: agent_prompt
    applicable_types:
    - 报告
    - 方案
    - 邮件
    - 汇报
    content_summary: '职场正式写作标题应控制在16个字以内。

      不可照搬公众号文章的长标题风格——公众号标题是特殊商业逻辑的产物，不适用于商务写作。

      标题字数过多是无效信息堆砌的表现。'
    source_file: 02_rules/book_principles/李忠秋_结构化写作.yaml
  - id: LR-004
    title: 成果描述用数字避模糊词
    importance: B
    execution: agent_prompt
    applicable_types:
    - 工作总结
    - 汇报
    - 报告
    content_summary: '描述工作成果时，务必做到清晰、明确，尽量使用数据说话。

      须避免的模糊词：加大、初步实现、有效提升、基本上、大概、加到多大、何为初步。

      错误示例：加大宣传力度，有效提升了品牌知名度。

      正确示例：新增渠道3个，品牌曝光量提升47%，新增客户超500人。

      若暂无数据，可用预期目标替代（说明"做这件事期望达到的目的是什么"）。'
    source_file: 02_rules/book_principles/李忠秋_结构化写作.yaml
  - id: LR-005
    title: 观点须含措施与预期成果
    importance: B
    execution: agent_prompt
    applicable_types:
    - 方案
    - 说服性写作
    - 汇报
    content_summary: '说服性写作中，观点（核心结论）须具备两个要素：措施（做什么）+ 成效（预期效果如何）。

      仅有措施没有成效，观点显得空洞；仅有成效没有措施，缺乏可操作性。

      错误示例：观点为"商务礼仪是门实操课程"——含糊，未体现措施和结果。

      正确示例：观点为"申请更多资源，加大通信网络建设，提升市场占有率至50%"。'
    source_file: 02_rules/book_principles/李忠秋_结构化写作.yaml
  - id: LR-006
    title: 序言SCQA各项须完整对应
    importance: B
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 方案
    - 邮件
    content_summary: '序言写作中，SCQA四要素各项信息须描述完整，且前后须逻辑衔接顺畅。

      常见错误：

      1. S、C、Q、A信息描述不完整或表述混乱；

      2. S与C之间过渡生硬；

      3. Q为提问而提问，不能引导读者思考正确方向；

      4. A与核心结论不对应（跑偏）；

      5. S描述过于简单，缺乏代入感；

      6. C冲突点不突出、不深刻；

      7. 内容隐含的逻辑经不起推敲。'
    source_file: 02_rules/book_principles/李忠秋_结构化写作.yaml
  - id: MT-002_李忠秋结构化
    title: SCQA四种顺序变体
    importance: B
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 方案
    - 邮件
    content_summary: 'SCQA四要素可按不同顺序排列，形成不同风格：

      1. 标准式（S→C→Q→A）：平稳铺陈，适合多数正式场合；

      2. 开门见山式（A→S→C）：先抛结论，适合对方已熟悉背景时；

      3. 突出忧虑式（C→S→A）：先呈冲突，适合需要引起重视时；

      4. 突出信心式（Q→S→C→A）：先抛问题，适合需展示解决能力时。

      同一问题还可分为三种结构类型：

      恢复原状型（原有稳定→被破坏→如何恢复）；

      预防隐患型（稳定状态→潜在风险→如何预防）；

      追求理想型（现有基础→不足之处→如何升级）。'
    source_file: 02_rules/book_principles/李忠秋_结构化写作.yaml
  - id: MT-006_李忠秋结构化
    title: 行动-成果表工具
    importance: B
    execution: agent_prompt
    applicable_types:
    - 工作总结
    content_summary: '梳理工作成果的基础工具，含两列：

      行动列——填写主要工作事项（"我做了什么"，即行为）；

      成果/目的列——填写对应的"成就结果"（取得了什么成效/价值）。

      使用要点：

      1. 若工作尚未完成，用预期目标代替成果；

      2. 一项行动有多个成果时，分"成果1/成果2"列出；

      3. 日常坚持记录，避免年终总结时无素材可写。

      思考指引：看完"行动"后追问自己"然后呢？"以逼出真正的成果。'
    source_file: 02_rules/book_principles/李忠秋_结构化写作.yaml
  - id: MT-007_李忠秋结构化
    title: 开放式与封闭式分类
    importance: B
    execution: agent_prompt
    applicable_types:
    - 工作总结
    - 方案
    - 报告
    content_summary: '对信息进行分类有两种方式：

      开放式分类——自行选定标准进行分类，无固定模型，但必须遵循MECE原则；适合构建个性化框架。

      封闭式分类——直接套用成熟模型（5W1H、SWOT、4P、PDCA、选育用留、ASK等），拿来主义；模型经过实践检验，更容易被对方接受。

      两者本质相通：都是建立结构化、框架性的思维方式。

      选择原则：优先考虑是否有合适的封闭式模型；没有或不适用时再开放式构建。'
    source_file: 02_rules/book_principles/李忠秋_结构化写作.yaml
  - id: MT-011_李忠秋结构化
    title: 5W2H设想读者疑问
    importance: B
    execution: agent_prompt
    applicable_types:
    - 方案
    - 说服性写作
    - 汇报
    content_summary: '运用5W2H模型从七个维度设想读者可能提出的问题，保证问题覆盖全面：

      What——是什么（对象/内容是什么）；

      Who——谁（相关人员是谁）；

      Why——为什么（原因/必要性）；

      Where——在哪里（发生地点/适用范围）；

      When——何时（时间节点/持续时间）；

      How——如何（实施方式/操作步骤）；

      How much——程度/量（范围/影响/费用/数量）。

      注：5W2H是问题引导框架，不代表具体问题本身，需结合实际设想真实疑问。'
    source_file: 02_rules/book_principles/李忠秋_结构化写作.yaml
  - id: MT-012_李忠秋结构化
    title: 演绎推理三段论应用
    importance: B
    execution: agent_prompt
    applicable_types:
    - 方案
    - 说服性写作
    - 汇报
    content_summary: '演绎推理是从一般原理推导到特殊结论（从一般到特殊），最常用形式为三段论：

      大前提：某个已知的一般性原理/规律/法则；

      小前提：当前研究的特殊情况；

      结论：由大前提对小前提推导出的判断。

      三段论成立的必要条件：

      1. 前提必须真实（大、小前提内容符合客观事实）；

      2. 推理形式有效（严格遵循逻辑规则）。

      注意：大前提须能"包含"小前提，二者不可割裂；大前提方向错误则一切后续均无效。

      写作应用：大前提描述标准/规律，小前提描述自身情况，结论即观点。'
    source_file: 02_rules/book_principles/李忠秋_结构化写作.yaml
  - id: MT-013_李忠秋结构化
    title: 归纳推理简单枚举法
    importance: B
    execution: agent_prompt
    applicable_types:
    - 方案
    - 说服性写作
    - 报告
    content_summary: '归纳推理从个别事物推导出一般结论（从特殊到一般），日常最常用的是简单枚举法：

      列举多个具有相同属性的个体，推导出该类事物的普遍规律。

      应用于写作：将多个并列信息项归纳为共同的上层结论（与信息摘要法/逻辑推论法配合）。

      注意：枚举对象越多，结论可靠性越大；枚举对象过少容易"以偏概全"。

      演绎与归纳的关系：两者相辅相成，归纳形成的结论可成为演绎的大前提；

      在复杂方案中，上层常用归纳，下层常用演绎，或交替使用。'
    source_file: 02_rules/book_principles/李忠秋_结构化写作.yaml
  - id: MT-015_李忠秋结构化
    title: 纵向框架两种构建路径
    importance: B
    execution: agent_prompt
    applicable_types:
    - 方案
    - 报告
    - 工作总结
    content_summary: "根据写作起点不同，纵向建立框架有两种路径：\n自上而下（有明确主题时）：\n  第一步 设定主题；\n  第二步 针对主题换位思考，设想对方会提哪些问题；\n  第三步 回答这些问题，形成初步框架（可配合2W1H/5W2H）。\n\
      自下而上（手头有大量素材时）：\n  第一步 罗列所有信息；\n  第二步 对信息进行分类（找共性：静态属性类或动态行动类）；\n  第三步 对信息概括形成结论（信息摘要法或逻辑推论法），逐层向上。\n两种路径可交替使用，不是截然割裂的。"
    source_file: 02_rules/book_principles/李忠秋_结构化写作.yaml
  - id: MT-016_李忠秋结构化
    title: '"结构罗盘"配得上"三步法"'
    importance: B
    execution: agent_prompt
    applicable_types:
    - 方案
    - 汇报
    - PPT演示
    content_summary: '对信息进行形象化（视觉化）呈现，分三步：

      第一步 配关系——深入探寻信息要素之间实际的逻辑关系（参考四种模式16种关系，见SP-008）；

      第二步 得图示——选择与该关系对应的图示（流程图、矩阵图、饼图、柱形图等）直观展现；

      第三步 上包装——用简化、类比、整合、引用等方式对信息进行高度提炼，使其形象易记。

      简化：一段话→一句话→一个字；类比：将关系比喻为熟悉的事物；

      整合：用词语/字母/数字/颜色统一归拢；引用：借用广告语/歌词/名言。

      四种包装方式常组合使用，"简化"往往是起点。'
    source_file: 02_rules/book_principles/李忠秋_结构化写作.yaml
  - id: PM-004
    title: 写作自检三连问
    importance: B
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    - 工作总结
    content_summary: '写作或梳理信息时的三个自检问题：

      1."然后呢？"——逼迫自己从行为上升到成果，从现象上升到结论。

      2."你到底想说什么？"（What''s your point）——检验结论是否清晰明确。

      3."如果我是对方，还可能提哪些问题？"——推动换位思考，扩大疑问覆盖面。

      适用于：写完初稿后的自查；卡壳时的思维突破；概括结论前的逼迫式追问。'
    source_file: 02_rules/book_principles/李忠秋_结构化写作.yaml
  - id: PM-005
    title: 写作失败四大根源诊断
    importance: B
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    - 工作总结
    content_summary: '读者对一篇文章/邮件/方案产生的三类负面反馈：

      不愿看——标题/开头无利益点，无吸引力；

      看不懂——结构松散，观点不清，逻辑混乱；

      记不住——缺乏分类和概括，信息零散堆砌。

      四大根源：

      1. 没有结论先行（让读者猜意图）；

      2. 缺乏分类（信息凌乱，无规律可循）；

      3. 没有概括观点（有分类但没结论，读者仍不明白）；

      4. 缺乏顺序（各类之间没有逻辑关系）。'
    source_file: 02_rules/book_principles/李忠秋_结构化写作.yaml
  - id: CQ-001
    title: 段落主题句明确性
    importance: B
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: 文档各段落是否有明确的主题句？主题句与段落内容是否吻合？
    source_file: 02_rules/content_quality/quality_rules.yaml
  - id: CQ-002
    title: 因果关系成立性
    importance: B
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: 文中的因果关系是否成立？"因此""由于"等连接词前后逻辑是否自洽？
    source_file: 02_rules/content_quality/quality_rules.yaml
