  - id: MT-021
    title: 六项基本功（公文写作六种能力）
    importance: C
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: 检查公文写作是否具备六种基础处理能力： ①扩写——是否能将简短的材料或提纲展开详述，补充细节和逻辑； ②缩写——是否能将长篇内容压缩提炼，保留核心去除冗余； ③改写——是否能在保持核心意思不变的前提下调整文体和表达方式；
      ④续写——是否能在已有内容基础上保持风格一致地延续； ⑤串写——是否能将多份不同来源的材料整合串联成统一连贯的文章； ⑥补写——是否能对文章空白处、逻辑缺口、内容不完整处进行补充完善。
    source_file: 02_rules/book_principles/胡森林_公文写作底层心法.yaml
  - id: MT-023
    title: 写作四阶段升维模型
    importance: C
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: 检查当前写作是否已超越初级阶段： ①盲人摸象阶段——是否仅关注文章外在要素拼凑； ②就事论事阶段——是否仅着眼单篇文章无法迁移经验； ③庖丁解牛阶段——是否已掌握写作规律，能以不变应万变； ④运用自如阶段——是否已把握写作本质原理，无心为文却篇篇中的。
      检查是否在"总结方法"、"寻找规律"、"抓本质"上用力，而非仅积累技巧。
    source_file: 02_rules/book_principles/胡森林_公文写作底层心法.yaml
  - id: PM-006
    title: PPT本义与制作标准
    importance: C
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 方案
    - PPT演示
    content_summary: 'PPT全称PowerPoint：先有清晰的Point（观点），再用Power（图示/形象化）增强。

      一份好的PPT最基本的要求：形成清晰明确的Point，然后让Point更有Power。

      用大段文字直接复制粘贴到PPT，违背了PPT的本意。

      形象化核心：不是配图片，而是用"配得上"三步法呈现信息之间的逻辑关系。'
    source_file: 02_rules/book_principles/李忠秋_结构化写作.yaml
STYLE:
  description: 语言风格类规则——文风简练、避免套话废话、语体适当、语气匹配等。主要由Agent 6（润色）和Agent 5执行。
  rule_count: 77
  rules:
  - id: SP-010
    title: 公文"及物"性本质（研究事不研究字）
    importance: A
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: 检查是否存在"研究字"而非"研究事"的倾向：内容不得只在文字技巧和辞藻上下功夫， 而忽视对实际工作的深入反映。 检查是否符合"及物"性原则：公文必须真实反映现实工作和客观事物， 不得出现脱离实际的花团锦簇表述，写作质量须来自对实际工作的深入研究。
    source_file: 02_rules/book_principles/胡森林_公文写作底层心法.yaml
  - id: LR-001
    title: 公文语言准确第一原则
    importance: A
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: 检查是否存在用词不精准的问题：必须选择最贴切的词，不得使用模糊词。 检查是否存在歧义表述：同一表达必须只有唯一理解方式。 检查数据/事实细节是否精确：数字、时间、职名、地名等细节须无误。 不得出现以下失准问题：概念混淆（如"汇报"和"报告"混用）、
      程度词滥用（"极大地""充分"等未经核实即使用）、数据未核实直接引用。
    source_file: 02_rules/book_principles/胡森林_公文写作底层心法.yaml
  - id: LR-002
    title: 公文语言"十个不写"规则
    importance: A
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: 检查是否存在以下十类禁止表达： ①假话——不得虚报、夸大、缩小； ②废话——不得重复啰嗦，每句须有信息量； ③套话——不得堆砌套路词汇和无意义短语； ④空话——不得空泛，须有具体内容支撑； ⑤大话——不得言过其实；
      ⑥不得体的话——语体须与场合相符； ⑦超范围的话——不得泄露不应公开的信息； ⑧未经核实的话——数据和事实须经查证； ⑨模糊话——不得出现让人产生不同理解的表述； ⑩重复的话——信息不得重复出现。
    source_file: 02_rules/book_principles/胡森林_公文写作底层心法.yaml
  - id: LR-001_胡森林公文写
    title: 务实管用第一原则
    importance: A
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: '检查公文是否符合"务实管用"的最高标准：

      - 务实——内容是否真实、具体、可操作，是否存在空洞套话；

      - 管用——对实际工作是否有指导价值，是否能解决问题、推动工作。

      必须检查：这篇文章对执行者是否有实际帮助？

      不得以语言华丽或篇幅完整为由忽视"管用"标准。'
    source_file: 02_rules/book_principles/胡森林_公文写作心法笔杆.yaml
  - id: LR-002_胡森林公文写
    title: 公文文风三弊
    importance: A
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: '检查是否存在以下三种文风弊病：

      1. 长篇大论——篇幅是否冗长，废话连篇，重要信息是否被淹没；

      2. 空洞无物——是否存在概念堆砌，缺乏事实依据，读了等于没读；

      3. 缺乏新意——是否千篇一律，套话连句，照搬照抄，没有思想。

      检查方法：删掉此段，意思有无损失？有损失→保留；无损失→删除。'
    source_file: 02_rules/book_principles/胡森林_公文写作心法笔杆.yaml
    see_also: CQ-011（'正确的废话'检测）为套话废话的综合规则；CQ-012（措施可操作性）
  - id: LR-003
    title: 公文四个实的标准
    importance: A
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: '检查是否符合务实文风的四个具体标准：

      1. 真实准确——数据、事实、引语是否真实可查，是否存在估数、夸大；

      2. 充实丰富——内容是否有足够支撑，是否空洞，是否有干货；

      3. 切实可行——措施、方案是否有可操作性，是否落地不落空；

      4. 朴实简洁——语言是否平实，是否存在卖弄或堆砌。

      在四个标准有冲突时：真实准确＞切实可行＞充实丰富＞朴实简洁。'
    source_file: 02_rules/book_principles/胡森林_公文写作心法笔杆.yaml
  - id: LR-004
    title: 说人话三要求
    importance: A
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: "检查公文语言是否符合\"说人话\"的三个层次要求：\n1. 深入浅出——是否将复杂抽象问题用简单具体的语言表达清楚，\n   不得以\"内容复杂\"为借口写艰涩文字；\n2. 短实新——句子是否精炼，内容是否实在，表达是否新鲜不落套；\n\
      3. 准确简洁生动——用词是否精准无歧义，是否去掉多余成分，是否有画面感。\n检查是否满足：能听懂、能记住、想继续读。"
    source_file: 02_rules/book_principles/胡森林_公文写作心法笔杆.yaml
  - id: LR-005
    title: 消极修辞技法
    importance: A
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: '检查是否存在以下五类可删除的冗余成分：

      1. 语义重复——如"十分非常重要"须删减为"非常重要"；

      2. 无实义虚词——多余的"的""地""了""着"须删除；

      3. 无效修饰语——修饰成分与中心词无实质区分的须删除；

      4. 过渡性废语——显而易见时"下面我来谈谈……""综上所述……"须删去；

      5. 重复交代——同一信息在文中多次出现时须保留最必要的一次。

      检查方法：此词/此句删掉后意思是否完整？完整→删；不完整→留。'
    source_file: 02_rules/book_principles/胡森林_公文写作心法笔杆.yaml
  - id: LR-012
    title: 奥卡姆原则——废话三类禁令
    importance: A
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: '检查是否存在以下三类废话，须坚决删除：

      1. 正确的废话——内容没有错，但读了没收获，如"要高度重视……"；

      2. 没用的空话——脱离实际，只说应该但不说怎么做；

      3. 好听的套话——用套路化表达替代具体思考，如年年相同的开场白。

      识别方法：把这段话换成任何一个同类文件还能用吗？能→套话，删。'
    source_file: 02_rules/book_principles/胡森林_公文写作心法笔杆.yaml
    see_also: CQ-011（'正确的废话'检测）为套话废话的综合规则；CQ-012（措施可操作性）
  - id: MT-002
    title: 领导满意四标准
    importance: A
    execution: agent_prompt
    applicable_types:
    - 讲话
    - 汇报
    content_summary: '检查为领导起草的文稿是否达到四个满意标准：

      1. 正确领会意图——是否准确理解领导想要表达什么、强调什么、忌讳什么；

      2. 升华想法——是否在领导原意基础上提炼升华，使表达更有高度、更有力度；

      3. 扮演角色——是否以领导的身份、立场、语气来写，而非以自我视角；

      4. 体现风格——是否把握并还原领导的个人表达风格、习惯用语。

      优先顺序：宁可准确朴素，不可误解意图却文字华丽。'
    source_file: 02_rules/book_principles/胡森林_公文写作心法笔杆.yaml
  - id: PM-002
    title: 短实新三字文风标准
    importance: A
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: '检查是否符合"短实新"三字文风标准：

      短——句子是否精炼，篇幅是否简洁，能短是否已短；

      实——内容是否充实，是否言之有物，是否有具体事实和数据；

      新——表达是否新鲜，观点是否有新意，是否落套路，是否炒冷饭。'
    source_file: 02_rules/book_principles/胡森林_公文写作心法笔杆.yaml
  - id: WQ_MT_002
    title: 立意三番来者法（陈言→正语→精语）
    importance: A
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: '检查公文立意是否经历了三番思考，避免停留在第一番：

      第一番——陈言：脑海最先浮现的套话陈词，必须扫去不用，不得以第一番作为最终立意；

      第二番——正语：深入思考后触及事物本质的表述，但仍停留在表层，不得满足于此；

      第三番——精语：从更高角度思考所得，发人所未发、想人所未想，须追求此层次。

      检查：立意是否已至少经过三轮思考，是否仍停留在陈词滥调层次。'
    source_file: 02_rules/book_principles/王群_公文写作大手笔.yaml
  - id: WQ_MT_011
    title: 领导讲稿主体四性要求（鲜明/生动/鼓动/通俗）
    importance: A
    execution: agent_prompt
    applicable_types:
    - 讲话
    content_summary: "检查领导讲话稿的主体部分是否体现\"四性\"：\n1. 鲜明性——主旨是否鲜明，是否抓住主线围绕一个主要问题展开；\n2. 生动性——是否恰当引用了文学形象/成语典故/名言佳句，深入浅出，用典是否贴切；\n\
      3. 鼓动性——是否注入了饱满感情，是否旗帜鲜明；\n   不得是高呼口号，须把话说到点子上、道理讲在实处，找到与听众共同点引发共鸣；\n4. 通俗性——是否将抽象道理讲得浅显通俗，是否善用身边事例阐明理论。"
    source_file: 02_rules/book_principles/王群_公文写作大手笔.yaml
    context_note: 【适用边界】本规则适用于现场宣读的领导讲话稿，强调口语化、情感感染力。正式存档公文（报告/方案）应遵循LR-002（公文语言四特点：准确/庄重/简要/平实）。
  - id: WQ_MT_014
    title: 工作总结五忌（"豆腐账"五种表现）
    importance: A
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    content_summary: "检查工作总结是否存在以下五种禁忌：\n1. 光摆工作——是否将总结写成大事记/成绩簿，是否忽视经验体会；应集中笔墨写经验体会；\n2. 套用计划——是否照搬年初计划改时态，是否忽视全年出现的新情况新做法；\n\
      3. 上下不分——上报总结是否站在领导高度提炼规律性认识；\n               下发总结是否全面列举基层事例，多做自我批评；\n4. 面面俱到——是否存在事无巨细平均用力，导致重点不突出；\n5. 老调旧腔——是否存在\"\
      领导重视\"\"层层落实\"\"健全制度\"等套话年年雷同。"
    source_file: 02_rules/book_principles/王群_公文写作大手笔.yaml
  - id: WQ_LR_002
    title: 公文语言四特点（准确/庄重/简要/平实）
    importance: A
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: "检查公文语言是否符合四个基本特点：\n1. 准确——词句内涵与表达意图是否完全一致，是否存在歧义，时间方位表述是否有严密限定；\n2. 庄重——语调是否端庄严肃，是否出现网络语言和感情色彩浓重词汇；\n\
      \   检查是否使用了规范用语（称谓语/开端语/经办语/引文语/承启语/期请语/结尾语）；\n   检查行文方向语气是否匹配：上行文是否谦虚恳切，下行文是否庄重坚决，平行文是否平和；\n3. 简要——用词是否简洁明快，是否适当用缩略语和成语，是否尽量使用短句；\n\
      4. 平实——是否如实叙述事物本来面目，是否存在艺术夸张和渲染烘托。"
    source_file: 02_rules/book_principles/王群_公文写作大手笔.yaml
    context_note: 【适用边界】本规则适用于正式存档公文（报告/方案/通知等）。领导现场讲话稿另有语言要求（见WQ_MT_011：讲稿主体四性要求：生动/鼓动/通俗）。
  - id: MT-001
    title: 写作素养金字塔：情怀>见识>文字
    importance: A
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: '检查公文写作是否体现了正确的素养层次：

      （1）文字层（术）——遣词造句、格式规范、语言技巧是否扎实；

      （2）见识层（识）——对事物的判断力、政策理解力、宏观视野是否体现；

      （3）情怀层（道）——对工作的热情、对公共事务的责任感、价值观是否彰显。

      必须检查：是否存在只在文字层打磨而缺乏见识与情怀支撑的情况，

      这是写作到达瓶颈无法突破的根本原因。'
    source_file: 02_rules/book_principles/公文高手自我修炼.yaml
  - id: MT-003
    title: 公文写作者三有三无
    importance: A
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: '检查公文写作者是否具备正确的精神气质：

      【三有】

      （1）有公心——行文是否以公共利益为出发点，是否存在谋私利的倾向；

      （2）有正气——是否传播了正能量，是否弘扬主旋律，是否出现阿谀奉承；

      （3）有热情——对公文工作是否保持激情，是否存在敷衍了事的情况。

      【三无】

      （1）无邪——是否传递了错误导向，是否存在歪风邪气之文；

      （2）无私——是否在公文中夹带了私货，是否以文谋私；

      （3）无偏——是否客观公正，是否存在偏袒失衡的情况。'
    source_file: 02_rules/book_principles/公文高手自我修炼.yaml
  - id: MT-010
    title: 公文写作成长三阶段模型
    importance: A
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: '检查当前写作是否已超越初级阶段的典型问题：

      【新手阶段问题（须避免）】

      文辞是否迂阔不接地气、言辞是否尖锐不知收敛、是否缺乏大局意识；

      【熟手阶段标准（须达到）】

      是否更接地气、更务实，是否已脱去青涩高蹈之气，经过实践历练；

      【高手阶段目标（须追求）】

      文字是否劲道有力、举重若轻，是否道术兼备。

      规律检查：写作能力瓶颈是否来自思想修为不足，须通过提升思想境界突破写作瓶颈。'
    source_file: 02_rules/book_principles/公文高手自我修炼.yaml
  - id: MT-011
    title: 道术相济内外兼修
    importance: A
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: '检查公文写作是否做到道术相济：

      （1）道（内功）——是否具备情怀修为、大局观、战略眼光、民生情怀、担当精神；

      　　  是否存在缺乏道的"花拳绣腿"表现；

      （2）术（表层）——是否掌握写作技巧、手法、格式规范、结构方法；

      　　  是否存在只练术不修道导致到达瓶颈无法突破的情况。

      检查写作水平提升路径：是否在技法纯熟的同时，思想是否变化、性情是否成长、

      对世事人情的认识是否加深。'
    source_file: 02_rules/book_principles/公文高手自我修炼.yaml
  - id: BG-008
    title: 领导文稿8分共性2分个性法则
    importance: A
    execution: agent_prompt
    applicable_types:
    - 讲话
    content_summary: '领导讲话等材料通常是8分共性、2分个性：

      - 80%是通用的（共性思维/套路/表达），可花80%的时间研究广义技法

      - 20%是个性化的（领导个人风格/关注点/文风习惯），需花20%的时间研究领导本人


      实操：研究广义技法 → 动态跟进多个不同层级领导的讲话材料（锤炼共性思维、开拓视野、增强语感）；研究个性特点 → 多收集本单位领导以前材料，从讲话/谈话/批示/书报关注中悟其文风、悟其关切。


      适用于例行类会议材料时：9分按历史惯例，1分揣摩领导个人特点。

      适用于领导根据新情况新问题召开的会议材料：切记吃透领导意图，没有吃透时不要贸然动笔。'
    source_file: 02_rules/book_principles/笔杆子炼成.yaml
  - id: LS-018
    title: '"大力大力"等动词副词重复删减'
    importance: A
    execution: code
    applicable_types:
    - 通用
    content_summary: '同一句子中连续出现相同的副词或动词（如"大力大力""继续继续""深入深入"），

      属于明显的冗余错误，应删除重复项。'
    source_file: 02_rules/language_style/language_rules.yaml
  - id: LS-027
    title: 禁止使用网络流行语
    importance: A
    execution: code
    applicable_types:
    - 通用
    content_summary: '公文中严禁出现网络流行语，包括但不限于：

      "给力""点赞""神操作""YYDS""绝绝子""破防""全网""刷屏"

      "打call""内卷""躺平""卷王""整活"等。'
    source_file: 02_rules/language_style/language_rules.yaml
  - id: LS-028
    title: 禁止使用方言俚语
    importance: A
    execution: code
    applicable_types:
    - 通用
    content_summary: '公文中不得出现地域性方言词汇和俚语，如"搞搞"（闽南语）、

      "蛮拼的"（偏口语）、"不孬"（北方方言）等。'
    source_file: 02_rules/language_style/language_rules.yaml
  - id: LS-031
    title: 禁止"颠覆性"等易产生负面联想的词语
    importance: A
    execution: code
    applicable_types:
    - 通用
    content_summary: '描述改革成就时，"颠覆性变革""颠覆式创新"等词语容易引发负面联想，

      应改用"历史性变革""根本性变革""革命性变化"等规范表述。

      此外，"革命性"在改革成就表述中需慎用，只有重大程度才可使用。'
    source_file: 02_rules/language_style/language_rules.yaml
  - id: LS-032
    title: 禁止"如无不妥""未有不可"等否定式套语
    importance: A
    execution: code
    applicable_types:
    - 通用
    content_summary: '"如无不妥，请批示""如无异议，请确认"等双重否定套语语义模糊，

      措辞软弱，在现代公文中不宜使用，应改为直接明确的表述。'
    source_file: 02_rules/language_style/language_rules.yaml
  - id: LS-036
    title: '"共同致富"→"共同富裕"'
    importance: A
    execution: code
    applicable_types:
    - 通用
    content_summary: '"共同富裕"是专有表述，不能写成"共同致富"。

      "致富"强调个体行为，"富裕"是整体状态，两者含义有根本区别。'
    source_file: 02_rules/language_style/language_rules.yaml
  - id: LS-038
    title: '"人民至上、生命第一"→"人民至上、生命至上"'
    importance: A
    execution: code
    applicable_types:
    - 通用
    content_summary: '表述抗疫或公共安全理念时，"人民至上、生命至上"是规范表述，

      "生命第一"是不规范的变体，易与其他概念混淆。'
    source_file: 02_rules/language_style/language_rules.yaml
  - id: LS-039
    title: 新发展理念顺序不得颠倒
    importance: A
    execution: code
    applicable_types:
    - 通用
    content_summary: '新发展理念的顺序为"创新、协调、绿色、开放、共享"，

      五个理念的排列顺序不得颠倒或遗漏，这是党中央确定的规范表述顺序。'
    source_file: 02_rules/language_style/language_rules.yaml
  - id: LS-040
    title: '"二十大精神"须加"党的"'
    importance: A
    execution: code
    applicable_types:
    - 通用
    content_summary: '引用党代会精神时，必须加"党的"前缀，如"党的二十大精神"，

      不能简写为"二十大精神"（省略"党的"二字）。'
    source_file: 02_rules/language_style/language_rules.yaml
  - id: LS-041
    title: '"全面从严治党"不得省略"全面"'
    importance: A
    execution: code
    applicable_types:
    - 通用
    content_summary: '"全面从严治党"中的"全面"二字不可省略，不能写成"从严治党"。

      "全面"体现的是全方位、全过程的要求，省略后含义有重大差别。'
    source_file: 02_rules/language_style/language_rules.yaml
  - id: CQ-012
    title: 措施部分可操作性
    importance: A
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    - 通知
    content_summary: 文中的工作措施是否具体可操作？是否都是模糊的方向性表述？
    source_file: 02_rules/content_quality/quality_rules.yaml
  - id: SP-012
    title: 文以载道价值观优先原则
    importance: B
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: 检查公文写作是否体现正确的价值取向：情怀（价值观）须优先于见识（视野逻辑）， 见识须优先于文字（笔法语感），不得本末倒置只追求文字华丽。 检查是否具备三项价值观要求：一片公心（胸怀全局、一心为公）、 一股正气（坚持真理、实事求是）、一腔热情（对工作有投入）。
      不得出现假公济私、因个人好恶影响判断、被不良风气侵染的表述。
    source_file: 02_rules/book_principles/胡森林_公文写作底层心法.yaml
  - id: LR-003_胡森林公文写
    title: 说人话/对象意识原则
    importance: B
    execution: agent_prompt
    applicable_types:
    - 讲话
    - 汇报
    - 报告
    content_summary: 检查是否具备明确的对象意识：语言风格须根据受众的身份、知识背景和阅读习惯选择， 不得使用晦涩艰深的表达。 检查是否符合以下四点： ①已明确受众是谁（领导/同行/基层）； ②使用对方熟悉的语言框架； ③不得卖弄术语和生僻词汇；
      ④讲话稿须口语化，便于现场理解和记忆。
    source_file: 02_rules/book_principles/胡森林_公文写作底层心法.yaml
  - id: LR-004_胡森林公文写
    title: 量体裁衣语体原则（不同文种不同语体）
    importance: B
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: 检查文种与语体是否匹配： 【汇报材料】须语气谦逊、陈述客观、偏书面体； 【领导讲话稿】须口语化、有激情、便于现场理解，有层次感，不得写成总结口吻； 【工作总结】须客观平实、有事实有数据，不得过度形容；
      【调研报告】须分析性强，有观点有论据，适当有学术感； 【方案计划】须逻辑严密，操作性强，时间节点清晰。 不得出现语体与文种不符的情况。
    source_file: 02_rules/book_principles/胡森林_公文写作底层心法.yaml
  - id: MT-018
    title: 五种公文创新路径
    importance: B
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: 检查公文是否具备以下至少一种创新元素： ①立意创新——是否提炼了与众不同但揭示本质的观点； ②框架结构创新——是否在局部或整体调整了结构，打破固定段落模式； ③阐述角度创新——同一内容是否换了新视角切入，避免老生常谈；
      ④文字表达创新——是否有令人印象深刻的表达，语言是否生动接地气； ⑤观点论断创新——是否提出了有思想价值的新见解、新论断。 不得完全照搬套路，须在保持必要重复的同时包含创新元素。
    source_file: 02_rules/book_principles/胡森林_公文写作底层心法.yaml
  - id: MT-020
    title: 文气三要素写作法（文以气胜）
    importance: B
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: 检查公文是否具备三个文气要素： ①意气——是否体现思想高度和情怀格局，文章是否充满正气和感召力； ②气势——内容是否充实（言之有物），是否适当运用短句（简洁明快）， 是否运用修辞，是否贯以真情； ③气脉——思维脉络是否连贯通畅，结构是否紧凑，语言是否流利，首尾是否一体。
    source_file: 02_rules/book_principles/胡森林_公文写作底层心法.yaml
  - id: PM-002_胡森林公文写
    title: 研究者意识三句话
    importance: B
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: 检查写作者是否保持了"研究者意识"，避免陷入形式主义： 检查是否"研究事"而非"研究字"——内容质量来自对工作实际的深入研究； 检查文章是否服务于工作目标——公文须为工作服务，工作就是为了解决问题； 检查是否偏离写作初衷——不忘"为什么出发"，防止形式大于内容。
    source_file: 02_rules/book_principles/胡森林_公文写作底层心法.yaml
  - id: LR-006
    title: 简洁文风三方法
    importance: B
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: "检查是否运用了以下三种方法实现简洁文风：\n1. 压缩句子——长句是否变为短句，复合句是否拆分为简单句，从句嵌套是否去掉；\n2. 合并同类项——相同或相近含义的表述是否已合并为一句，避免重复展开；\n\
      3. 删繁就简——冗长表述是否已提炼为核心词、关键短语，\n   能用列举（①②③）替代的冗长叙述段是否已替代。\n目标：每段删去20%的字后信息量不减。"
    source_file: 02_rules/book_principles/胡森林_公文写作心法笔杆.yaml
  - id: LR-007
    title: 公文长文成因三条
    importance: B
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: '检查文稿是否因以下三种原因而产生冗长问题：

      1. 思想认识不到位——是否误以为篇幅长等于内容丰富等于态度认真；

      2. 写作能力欠缺——是否存在铺陈堆砌，缺乏提炼概括能力；

      3. 敷衍了事——是否以篇幅填充代替深度思考，以数量掩盖质量不足。

      不得出现冗长文稿：改稿时须主动压缩篇幅10%~30%，短而精胜于长而冗。'
    source_file: 02_rules/book_principles/胡森林_公文写作心法笔杆.yaml
  - id: LR-010
    title: 理论论据三要点
    importance: B
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: "检查公文引用理论、政策、上级精神作为论据时是否符合三点：\n1. 融会——是否真正理解并消化，是否存在生搬硬套；\n2. 得体——引用场合和对象是否恰当，政治性表述是否与文件保持一致；\n3. 适度——引用是否为论证服务，是否铺天盖地堆引语，\n\
      \   引用之后是否有自己的阐释和应用。\n不得直接大段复制上级文件作为正文——这是引用，不是论证。"
    source_file: 02_rules/book_principles/胡森林_公文写作心法笔杆.yaml
  - id: MT-005
    title: 修改四境界
    importance: B
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: '检查公文修改是否达到了较高境界：

      1. 辨境——是否能辨别文章好坏，知道哪里不好（有眼光，无手段为低级）；

      2. 正境——是否能改正错误，把明显的问题纠正（能纠错但难锦上添花）；

      3. 佳境——是否能提升表达质量，不只改错，还能优化（有提升能力）；

      4. 悟境——是否能从修改中悟出规律，形成原则性认识，指导今后写作（最高境界）。

      检查当前修改处于哪个境界，下一步努力方向是什么。'
    source_file: 02_rules/book_principles/胡森林_公文写作心法笔杆.yaml
  - id: WQ_MT_013
    title: 公文被动写作适应三情形
    importance: B
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: '检查是否正确处理了认识与领导意图之间的关系：

      1. 完全一致情形——是否正常推进写作；

      2. 不完全一致情形——是否进一步领会意图，努力使二者达到一致；

      3. 很不一致情形——是否立即调整心态，站到领导高度重新思考，找出差距后再动笔。

      必须检查：是否从领导交代的话语中抓取了本意和真意，不得以自己的认识代替领导意图。'
    source_file: 02_rules/book_principles/王群_公文写作大手笔.yaml
  - id: WQ_LR_001
    title: 简洁四要求（凝/实/广/简）
    importance: B
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: '检查公文语言是否符合简洁的四个层面要求：

      1. 凝而不泛——语言是否凝练，是否存在空洞泛泛而谈；

      2. 实而不空——内容是否实在，是否虚浮空洞；

      3. 广而不滥——覆盖面是否广但不滥用词汇和例子；

      4. 简而不赘——文字是否简短，是否存在重复啰嗦，是否删去了与中心无关文字。'
    source_file: 02_rules/book_principles/王群_公文写作大手笔.yaml
  - id: WQ_LR_003
    title: 公文表达三主法（叙述/议论/说明）
    importance: B
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    content_summary: "检查公文语言表达方式是否运用恰当：\n1. 叙述（主）——是否兼顾概括叙述（反映全面情况）与具体叙述（展现典型细节），\n   叙述是否简明，是否出现文学式的详尽叙述；\n2. 议论（主）——是否少而精穿插在关键段落，是否存在全篇铺开论述；\n\
      3. 说明（主）——是否言简意赅，是否把主要情况和特点说清；\n4. 描写（辅）——描写是否仅用于调查报告/总结/简报等，法定公文是否未使用描写；\n5. 抒情（辅）——抒情是否仅用于在公开场合宣读的重要文件，是否做到庄重内敛\"\
      冷抒情\"。"
    source_file: 02_rules/book_principles/王群_公文写作大手笔.yaml
  - id: WQ_LR_004
    title: 开头三要求与四种冗长表现
    importance: B
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: '检查公文开头是否符合三条原则：

      1. 开门见山——是否直接点明主题，是否存在绕弯子或空话套语；

      2. 紧扣全文——开头是否能提示全篇内容，与文章主体是否紧密相连；

      3. 概括凝练——是否用最少的文字概括了最核心的内容。

      检查是否存在以下四种冗长开头（须避免）：

      ①大段交代背景缘由拖沓冗长；

      ②大量引用上级文件精神才进入正文；

      ③大篇幅表决心表态度；

      ④将正文内容在开头先提一遍（先声明后重复）。'
    source_file: 02_rules/book_principles/王群_公文写作大手笔.yaml
  - id: WQ_LR_006
    title: 领导讲稿开头五法
    importance: B
    execution: agent_prompt
    applicable_types:
    - 讲话
    content_summary: '检查领导讲话稿开头是否运用了合适的方法，属于以下五种之一：

      1. 开门见山——一两句直接点明讲话内容或会议主题，是否庄重简洁，是否迅速控制场面；

      2. 概括说明——是否用几句话概括讲话缘由和要点，引起听众注意和期待；

      3. 设问启发——是否在开头提出发人深省的问题，自问自答，突出主旨；

      4. 介绍背景——是否简要介绍了多数听众尚不了解的背景材料；

      5. 曲转入题——是否先讲几句"题外话"自然吸引注意力，再话锋一转进入正题。

      不得出现讲话稿开头拖沓冗长、迟迟不进入主题的情况。'
    source_file: 02_rules/book_principles/王群_公文写作大手笔.yaml
    context_note: 【适用边界】本规则适用于现场宣读的领导讲话稿，强调口语化、情感感染力。正式存档公文（报告/方案）应遵循LR-002（公文语言四特点：准确/庄重/简要/平实）。
  - id: MT-012
    title: 写作充电站：以写促学
    importance: B
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: '检查写作是否同时发挥了提升综合能力的作用：

      （1）观察能力——写作是否锻炼了细察周围的感知力；

      （2）思考能力——写作是否促使深入分析，避免浅层浮想；

      （3）分析能力——是否将现象提炼为规律，是否锻炼了逻辑分析；

      （4）判断能力——取舍材料、权衡立意是否培养了决断力；

      （5）办事能力——是否通过写作加深了对工作机理的理解；

      （6）管理能力——写作中的综合协调、统筹兼顾思维是否迁移到了管理实践。'
    source_file: 02_rules/book_principles/公文高手自我修炼.yaml
  - id: BG-023
    title: 公文常用"性"字词组汇编
    importance: B
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: '聚焦工作特点、着力增强工作的……性（常用于"为什么干"和总体要求部分）：


      必要性 | 长期性 | 创造性 | 复杂性 | 方向性 | 兜底性 | 鼓动性 | 高效性 | 紧迫性 | 计划性 | 艰巨性 | 坚定性 | 积极性 | 精准性 | 基础性 | 可行性 | 民族性 | 普惠性 | 前瞻性 | 全局性
      | 思想性 | 时代性 | 实效性 | 时效性 | 系统性 | 现实性 | 原则性 | 预见性 | 有效性 | 引领性 | 政治性 | 战略性 | 重要性 | 主动性 | 针对性 | 指导性 | 自觉性 | 战斗性


      常用句式：聚焦××，着力增强工作的××性、××性、××性。'
    source_file: 02_rules/book_principles/笔杆子炼成.yaml
  - id: BG-024
    title: 公文常用"感"字词组汇编
    importance: B
    execution: agent_prompt
    applicable_types:
    - 讲话
    - 报告
    content_summary: '牢记××理念，着力提高人民群众××感、××感、××感：


      获得感 | 满足感 | 幸福感 | 安全感 | 喜悦感 | 胜利感 | 自豪感 | 归属感 | 成就感 | 紧迫感 | 忧患感 | 使命感 | 方向感 | 责任感 | 危机感 | 压力感 | 认同感 | 敬畏感 | 参与感 | 荣誉感
      | 神圣感 | 崇敬感


      常用于以下场合：强调民生工作时用"获得感/幸福感/安全感"；党建教育时用"使命感/责任感/紧迫感"；廉政建设时用"敬畏感/危机感"。'
    source_file: 02_rules/book_principles/笔杆子炼成.yaml
  - id: BG-025
    title: 总结帽段两类高质量表达——量上取胜与质上取胜
    importance: B
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    content_summary: '工作总结帽段最能抓眼球的两类开门见山写法：


      量上取胜（数据说话）：

      - 截至×月底，共办理××事项×万余件，其中网上办件×万件

      - 累计收缴××亿元，发放贷款××亿元，实现增值收益××亿元

      - 完成××项目××个，交易额××亿元，节约财政性资金××亿元

      - ××项重点攻坚任务全部完成


      质上取胜（荣誉排名）：

      - 获得主要领导肯定性批示×次

      - ××给××部门记集体一/二/三等功

      - ××工作获得全国第一/先进/优秀

      - 在全国率先推出××做法，获国务院/省政府肯定推广


      建议：帽段同时采用"量+质"两种方式，既有厚度又有高度。'
    source_file: 02_rules/book_principles/笔杆子炼成.yaml
  - id: LS-014
    title: '"进行了+动词"冗余结构简化'
    importance: B
    execution: code
    applicable_types:
    - 通用
    content_summary: '"进行了讨论/研究/检查/整改/部署"等"进行了+动词名词"结构冗余，

      可直接用动词表达："讨论了/研究了/检查了/整改了/部署了"。'
    source_file: 02_rules/language_style/language_rules.yaml
  - id: LS-015
    title: '"给予了支持"→"给予支持"'
    importance: B
    execution: code
    applicable_types:
    - 通用
    content_summary: '"给予了支持/给予了帮助/给予了指导"中的"了"字冗余，

      公文中"给予"通常不加"了"，直接用"给予支持"即可。'
    source_file: 02_rules/language_style/language_rules.yaml
  - id: LS-016
    title: '"作出了重要指示"→"作出重要指示"'
    importance: B
    execution: code
    applicable_types:
    - 通用
    content_summary: '固定搭配"作出重要指示/批示/部署"后不加"了"，

      这是公文规范用法，加"了"显得不规范。'
    source_file: 02_rules/language_style/language_rules.yaml
  - id: LS-017
    title: 重复叠加的程度副词删减
    importance: B
    execution: code
    applicable_types:
    - 通用
    content_summary: '"非常十分重要""极为非常关键""十分非常紧迫"等双重程度副词叠加属于冗余，

      应删除其中一个，保留语气更强的即可。'
    source_file: 02_rules/language_style/language_rules.yaml
  - id: LS-019
    title: 正文段落内容重复检测
    importance: B
    execution: code
    applicable_types:
    - 通用
    content_summary: '同一份材料中，不同段落出现高度相似的表述（意思重复），

      会使材料显得臃肿、逻辑混乱。典型表现：第二部分与第三部分

      内容高度重叠，或开头总述后各分项重复叙述相同内容。'
    source_file: 02_rules/language_style/language_rules.yaml
  - id: LS-020
    title: '"充分认识……的重要性/必要性"套话检测'
    importance: B
    execution: code
    applicable_types:
    - 通用
    content_summary: '"充分认识……的重要性""深刻认识……的必要性"等句式作为引导语，

      如果后续正文并未展开深度分析，则属于虚头巴脑的套话冗余。'
    source_file: 02_rules/language_style/language_rules.yaml
    see_also: CQ-011（'正确的废话'检测）为套话废话的综合规则；CQ-012（措施可操作性）
  - id: LS-021
    title: 排比句各项须同层级概念
    importance: B
    execution: code
    applicable_types:
    - 通用
    content_summary: '排比句中的各项要素必须属于同一概念层级，不能将上位概念与下位概念

      并列排列。如"党建工作、基层治理、支部建设"中，"支部建设"属于"党建工作"

      的下位概念，不能并列。'
    source_file: 02_rules/language_style/language_rules.yaml
  - id: LS-022
    title: 排比句结构须平行对称
    importance: B
    execution: code
    applicable_types:
    - 通用
    content_summary: '排比各项应使用相同的句法结构，不能"动宾结构"与"主谓结构"混用。

      如"加强党建、提升服务能力、领导班子团结"结构不平行

      （前两项动宾，最后一项主谓）。'
    source_file: 02_rules/language_style/language_rules.yaml
  - id: LS-023
    title: 递进式排比须体现层层深入
    importance: B
    execution: code
    applicable_types:
    - 通用
    content_summary: '使用"不仅……而且……更是……"或"从……到……再到……"的递进排比时，

      各项必须体现层次的深入或范围的扩大，不能是同等程度的并列关系。'
    source_file: 02_rules/language_style/language_rules.yaml
  - id: LS-024
    title: 四字格词组应语义明确、搭配恰当
    importance: B
    execution: code
    applicable_types:
    - 通用
    content_summary: '公文中使用四字格词组要语义明确，不能生造晦涩词汇。

      "动力引擎""定盘星""压舱石""牛鼻子""主战场"等有固定用法的比喻性四字格

      须用在合适的语境。不能将"压舱石"用于轻量级工作，不能将"牛鼻子"泛化使用。'
    source_file: 02_rules/language_style/language_rules.yaml
  - id: LS-025
    title: 四字格使用不宜过度堆砌
    importance: B
    execution: code
    applicable_types:
    - 通用
    content_summary: '公文中四字格词组可以增强文采和节奏感，但过度堆砌会导致内容空泛、

      形式大于内容。通常同一段落中连续出现5个以上四字格时，

      应检查是否每个四字格都有实质内容支撑。'
    source_file: 02_rules/language_style/language_rules.yaml
  - id: LS-026
    title: 标题使用四字格对仗要求
    importance: B
    execution: code
    applicable_types:
    - 通用
    content_summary: '层级标题使用四字格时，同级各标题应在字数和结构上保持一致，

      体现对仗美感。不能同级标题有的四字格、有的七八个字，参差不齐。'
    source_file: 02_rules/language_style/language_rules.yaml
  - id: LS-029
    title: 禁止过于绝对化的表述
    importance: B
    execution: code
    applicable_types:
    - 通用
    content_summary: '"一定会""肯定能""绝对没有问题""必然实现"等过于绝对的表述

      在公文中应避免，宜改为"有信心""将努力""力争""力求"等留有余地的表述。'
    source_file: 02_rules/language_style/language_rules.yaml
  - id: LS-030
    title: 禁止情绪化主观表述
    importance: B
    execution: code
    applicable_types:
    - 通用
    content_summary: '"非常感动""特别激动""深受鼓舞"等情绪化过于外露的表述

      在正式公文（通知、报告、方案等）中应避免；

      在讲话稿中可适度使用，但不宜过于频繁。'
    source_file: 02_rules/language_style/language_rules.yaml
  - id: LS-033
    title: 禁止在公文中使用"我个人认为"
    importance: B
    execution: code
    applicable_types:
    - 通用
    content_summary: '"我个人认为""本人觉得"等强调"个人"的表述在公文中不妥，

      公文代表机关立场，不宜强调个人观点。

      讲话稿中可保留"我认为"，但不宜加"个人"。'
    source_file: 02_rules/language_style/language_rules.yaml
  - id: LS-042
    title: 工作报告结尾语模板化问题
    importance: B
    execution: code
    applicable_types:
    - 通用
    content_summary: '"以上汇报如有不当之处，请批评指正"等模板化结尾语过于陈套，

      在汇报类材料中应根据实际情况使用更具体的结尾语，

      或使用"以上汇报，请审阅""以上意见，供参考"等简洁表述。'
    source_file: 02_rules/language_style/language_rules.yaml
  - id: CQ-008
    title: '"高度重视"类套话检测'
    importance: B
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    - 通知
    content_summary: 文中是否频繁使用'高度重视''充分认识''深刻认识'等套话，且后续无实质内容？
    source_file: 02_rules/content_quality/quality_rules.yaml
    see_also: CQ-011（'正确的废话'检测）为套话废话的综合规则；CQ-012（措施可操作性）
  - id: CQ-009
    title: 千篇一律开头检测
    importance: B
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    content_summary: 文章开头是否使用了毫无针对性的套话开头，如'在新形势下''众所周知''近年来……在……领导下'？
    source_file: 02_rules/content_quality/quality_rules.yaml
  - id: CQ-010
    title: 公式化结尾检测
    importance: B
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: 文章结尾是否使用了无差别的套话结尾，可以套用于任何同类材料？
    source_file: 02_rules/content_quality/quality_rules.yaml
  - id: CQ-011
    title: '"正确的废话"检测'
    importance: B
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    content_summary: 文中是否存在大量正确但无信息量的套话，虽然正确却没有针对性？
    source_file: 02_rules/content_quality/quality_rules.yaml
    see_also: CQ-011（'正确的废话'检测）为套话废话的综合规则；CQ-012（措施可操作性）
  - id: CQ-013
    title: 面面俱到但无深度问题
    importance: B
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    content_summary: 文章是否面面俱到地提到了各个方面，但每个方面都只是蜻蜓点水，缺乏深度分析？
    source_file: 02_rules/content_quality/quality_rules.yaml
  - id: CQ-014
    title: 机械化过渡语检测
    importance: B
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: 文中是否频繁使用套路化、无实质信息的过渡语？
    source_file: 02_rules/content_quality/quality_rules.yaml
  - id: MT-024
    title: 公文四境界进阶法（叙事→辅政→鼎新→立言）
    importance: C
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: 检查公文是否至少达到"以文辅政"的境界： ①以文叙事——是否能真实客观记述客观事物过程； ②以文辅政——是否能准确表达决策层意图，为政务活动提供文字支撑； ③以文鼎新——是否提出了新理念、新思路、新举措；
      ④以文立言——是否提出了具有历史价值和深远启迪的思想观点。 每篇文章至少须追求"以文辅政"的层次，有条件时力争"以文鼎新"。
    source_file: 02_rules/book_principles/胡森林_公文写作底层心法.yaml
  - id: PM-003
    title: 公文创新辩证法（永远的重复·持续的创新）
    importance: C
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: 检查公文是否在遵循规范的同时包含创新元素： 不得完全套用模板而无创新，须做到"永远的重复，持续的创新"； 检查是否出现年年相同的套路化表述，应做到"套路是相对的、暂时的，创新是绝对的、永恒的"； 模仿借鉴时须向高层次迈进：不得停留在抄字层次，应追求抄意、抄气的境界。
    source_file: 02_rules/book_principles/胡森林_公文写作底层心法.yaml
  - id: PM-004
    title: 文字工作者三大机会
    importance: C
    execution: agent_prompt
    applicable_types:
    - 讲话
    content_summary: 检查面向文字工作者的讲话材料是否涵盖三个激励维度： ①发展机会——是否提及好材料让人脱颖而出、进入领导视野的价值； ②锻炼机会——是否提及写材料锻炼逻辑思维、分析判断、思想高度等综合素质； ③学习机会——是否提及参会跟研、阅读文件、接受领导指点的学习价值。
    source_file: 02_rules/book_principles/胡森林_公文写作底层心法.yaml
  - id: PM-005
    title: 文气与价值观名句集
    importance: C
    execution: agent_prompt
    applicable_types:
    - 讲话
    - 报告
    content_summary: 检查引用的经典表述是否准确，可选用以下名句： "从喷泉里出来的都是水，从血管里流出的都是血。"（鲁迅，强调价值观决定文章品格）； "铁肩担道义，妙手著文章。"（李大钊，写作者的使命）； "文章千古事，得失寸心知。"（杜甫，文章是传之久远的事业）；
      "行于所当行，止于所不可不止。"（苏轼，写作的最高境界）； "不谋全局者，不足谋一域；不谋万世者，不足谋一时。"（陈澹然，全局思维）。 不得错误引用或张冠李戴。
    source_file: 02_rules/book_principles/胡森林_公文写作底层心法.yaml
  - id: PM-003_胡森林公文写
    title: 公文写作三重修炼境界
    importance: C
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: '检查公文写作是否体现了三重修炼境界的进阶追求：

      修炼——是否掌握了方法和技能，提升了职场写作能力；

      修养——是否具备分析判断、洞察、运筹等综合素质；

      修为——是否达到笃定自信、宠辱不惊的写作心理状态。'
    source_file: 02_rules/book_principles/胡森林_公文写作心法笔杆.yaml
GENRE:
  description: 文种规范类规则——各文种特有的结构要求、禁止事项、适用场景。主要由Agent 1（意图识别）和Agent 3（起草）参考。
  rule_count: 5
  rules:
  - id: SP-001
    title: 文种选择决策规则（请示/报告/通知/函）
    importance: A
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 方案
    content_summary: 检查是否正确选用文种：需要上级批准才能执行的事项必须使用【请示】而非报告， 结尾须含"请批示/请审批"；向上级汇报工作情况只陈述不含请求事项时须使用【报告】， 结尾用"请阅示/特此报告"；向下级布置工作须使用【通知】；
      与不相隶属机关协商询问须使用【函】。 不得将请示与报告混用：请示需要批复，报告只需知晓，二者性质不可互换。
    source_file: 02_rules/book_principles/胡森林_公文写作底层心法.yaml
  - id: SP-002
    title: 请示与报告的六大本质区别
    importance: A
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    content_summary: 检查是否混淆请示与报告： ①请示为呈请批准性质，报告为陈述告知性质，不得互换； ②请示内容须一文一事，报告可涉多事； ③请示结尾须含请求批准语，报告结尾为告知收阅语； ④请示必须获得批复，报告无需批复；
      ⑤请示须事前行文，报告为事后或事中行文； ⑥不得在请示中夹带报告事项，不得在报告中夹带请求批准事项。
    source_file: 02_rules/book_principles/胡森林_公文写作底层心法.yaml
  - id: SP-001_胡森林公文写
    title: 公文五定特征
    importance: B
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: '检查是否符合公文的五个法定性特征：

      1. 检查法定作者——发文机关是否为依法成立并能以自身名义行使职权的机关或组织；

      2. 检查既定程序——公文的起草、审核、签发、印制是否遵循规定程序；

      3. 检查法定效力——是否具备其他文体不具备的强制性约束力；

      4. 检查固定格式——是否符合国家标准规定的格式要求；

      5. 检查特定功能——是否以传递公务信息、处理公务事项为核心功能。

      起草公文前须先确认文种的"五定"属性，确保文稿合规合法合程序。'
    source_file: 02_rules/book_principles/胡森林_公文写作心法笔杆.yaml
  - id: WQ_SP_002
    title: 领导讲稿三类型（政论型/意见型/礼仪型）
    importance: B
    execution: agent_prompt
    applicable_types:
    - 讲话
    content_summary: "检查领导讲话稿类型判断是否正确，并验证写作要求是否与类型匹配：\n1. 政论型讲话稿——用于大型会议/重大问题，语言是否庄重书面化，篇幅是否有充分论证；\n2. 意见型讲话稿——用于一般工作会议或座谈会，是否语言通俗口语化，结构是否较灵活；\n\
      3. 礼仪型讲话稿——用于剪彩/开幕式/欢迎会等礼仪活动，是否有祝贺性内容，\n   语言是否热烈，是否适当运用感情色彩词汇。\n不得将不同类型的讲稿写作要求混用。"
    source_file: 02_rules/book_principles/王群_公文写作大手笔.yaml
  - id: MT-009
    title: 循序渐进写作学习路径
    importance: C
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: "检查写作学习是否遵循由易到难的三条递进路径：\n路径一（文体复杂度）：通知→公告→大事记→工作意见→工作规划→工作汇报，是否按序推进；\n路径二（规范化程度）：是否先从规范化强易借鉴的办法/规定/条例入手，\n\
      \                       再迁移到综合性强的领导讲话/调查报告/经验材料；\n路径三（内容熟悉度）：是否先写自己熟悉的业务领域，再迁移至其他领域。\n不得一开始就尝试最难的文体或陌生领域，避免无话可说、挫伤信心。"
    source_file: 02_rules/book_principles/胡森林_公文写作心法笔杆.yaml
