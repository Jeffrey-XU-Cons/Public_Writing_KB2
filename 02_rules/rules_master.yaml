FORMAT:
  description: 格式合规类规则——针对公文格式、标点、编号、行文方向等可自动检测的规范问题。主要由Agent 4（格式审核）code节点执行。
  rule_count: 28
  rules:
  - id: LR-001
    title: 公文校核四原则
    importance: A
    execution: code
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: '检查公文校核是否遵循四原则：

      （1）逢文必校——不管篇幅长短，是否一概认真校核，是否因文短内容简单而放松；

      （2）每字必核——是否一个标点一个标点地校，一个字一个字地核；

      　　  人名、地名、时间、数字、引文是否特别注意准确规矩严谨；

      （3）急文稳校——急件是否沉住气稳住劲，是否因为急就放松了校核；

      （4）校写分离——起草和校核是否由不同的人进行；

      　　  是否出现起草人自校导致"视而不见"的问题。'
    source_file: 02_rules/book_principles/公文高手自我修炼.yaml
  - id: FC-001
    title: 上行文禁止使用下行文语气
    importance: A
    execution: code
    applicable_types:
    - 请示
    - 报告
    - 汇报
    content_summary: '上行文（向上级机关行文）不得使用命令、要求、部署类语气，

      应使用"请"字句或商请式表述。上行文包括请示、报告、意见（向上报送时）。'
    source_file: 02_rules/format_compliance/format_rules.yaml
  - id: FC-002
    title: 下行文禁止使用请示性语言
    importance: A
    execution: code
    applicable_types:
    - 通知
    - 决定
    - 批复
    - 方案
    content_summary: '下行文（向下级机关或所属部门行文）不得出现"请批示""请审批""请审阅"

      等请示性语言，下行文应使用"通知""要求""部署"等主动语气。'
    source_file: 02_rules/format_compliance/format_rules.yaml
  - id: FC-003
    title: 平行文应使用商洽式语气
    importance: A
    execution: code
    applicable_types:
    - 函
    content_summary: '平行文（向同级机关或不相隶属机关行文）应使用商洽、协作式语气，

      不得使用命令口吻，也不得使用卑谦的请示口吻。函是最常见的平行文文种。'
    source_file: 02_rules/format_compliance/format_rules.yaml
  - id: FC-004
    title: 文号格式三要素完整性
    importance: A
    execution: code
    applicable_types:
    - 通知
    - 请示
    - 报告
    - 决定
    - 批复
    - 函
    content_summary: '正式公文文号由"机关代字+年份+顺序号"三部分组成。

      年份用六角括号〔〕括注，不得使用圆括号（）或方括号[]；

      年份必须写全四位数字；顺序号不编虚位（如"1"不写成"001"）。'
    source_file: 02_rules/format_compliance/format_rules.yaml
  - id: FC-005
    title: 联合行文文号规范
    importance: A
    execution: code
    applicable_types:
    - 通知
    - 意见
    - 方案
    content_summary: '两个以上机关联合行文时，文号只标注主办机关的文号，

      不得出现多个文号并列。'
    source_file: 02_rules/format_compliance/format_rules.yaml
  - id: FC-006
    title: 公文标题三要素完整性
    importance: A
    execution: code
    applicable_types:
    - 通知
    - 请示
    - 报告
    - 决定
    - 批复
    - 意见
    - 方案
    content_summary: '正式公文标题一般由"发文机关+事由+文种"三部分组成。

      报告、请示、通知等正式公文标题不得缺少文种要素。

      讲话稿、汇报材料等非正式公文标题可灵活处理。'
    source_file: 02_rules/format_compliance/format_rules.yaml
  - id: FC-007
    title: 标题中不得使用标点符号
    importance: A
    execution: code
    applicable_types:
    - 通知
    - 请示
    - 报告
    - 决定
    - 批复
    - 意见
    - 方案
    content_summary: '公文标题中除书名号《》外，一般不使用标点符号。

      逗号、句号、顿号、感叹号等均不得出现在公文标题中。'
    source_file: 02_rules/format_compliance/format_rules.yaml
  - id: FC-009
    title: 落款机关名称与文号机关名称一致性
    importance: A
    execution: code
    applicable_types:
    - 通知
    - 请示
    - 报告
    - 决定
    - 批复
    content_summary: '公文落款处的发文机关名称必须与文号中的机关代字所代表的机关名称一致，

      不得使用简称（法定简称除外），不得与文号机关不符。'
    source_file: 02_rules/format_compliance/format_rules.yaml
  - id: FC-010
    title: 联合行文落款机关顺序规范
    importance: A
    execution: code
    applicable_types:
    - 通知
    - 意见
    - 方案
    - 决定
    content_summary: '联合行文落款时，各联合机关应按照级别高低或惯例顺序排列，

      党委机关排在政府机关前，上级机关排在下级机关前。'
    source_file: 02_rules/format_compliance/format_rules.yaml
  - id: FC-011
    title: 请示文须有明确请求事项
    importance: A
    execution: agent_prompt
    applicable_types:
    - 请示
    content_summary: '请示必须有明确的请示事项，即具体请求批准、批复或指示的内容。

      请示事项要具体，不得以"请批示"代替具体请求内容。

      一件请示只能写一个主要请求事项（一文一事原则）。'
    source_file: 02_rules/format_compliance/format_rules.yaml
  - id: FC-012
    title: 报告不得夹带请示事项
    importance: A
    execution: agent_prompt
    applicable_types:
    - 报告
    content_summary: '报告是向上级汇报工作、反映情况的文种，不得在报告中夹带请示事项，

      不得出现"请批示""请审批""请拨付"等请示性请求。

      如需请示，应单独行文。'
    source_file: 02_rules/format_compliance/format_rules.yaml
  - id: FC-014
    title: 讲话稿结构完整性
    importance: A
    execution: agent_prompt
    applicable_types:
    - 讲话
    content_summary: '领导讲话稿应包含：开场（点明会议主题/感谢/定调）、

      主体（分点论述，一般2-4个层次）、

      结尾（提要求/表态/号召）三大部分。

      结构应头尾呼应，不得虎头蛇尾或仅有结论无论据。'
    source_file: 02_rules/format_compliance/format_rules.yaml
  - id: FC-016
    title: 附件序号与附件标题一致性
    importance: A
    execution: code
    applicable_types:
    - 通知
    - 报告
    - 方案
    - 请示
    content_summary: '正文中提及的附件序号必须与附件说明处的序号完全对应，

      不得出现正文提及"附件3"但附件说明只列到"附件2"的情况，

      反之亦然。附件名称也须前后保持一致。'
    source_file: 02_rules/format_compliance/format_rules.yaml
  - id: FC-019
    title: 重要政治表述不得简化缩写
    importance: A
    execution: code
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    - 通知
    - 决定
    content_summary: '党的重要理论、路线、方针、政策表述必须字字准确、不得任意简化。

      如"高质量发展"不得写成"高质发展"或"高品质发展"；

      "习近平新时代中国特色社会主义思想"不得随意缩写；

      "全面深化改革"不得写成"全面改革"。'
    source_file: 02_rules/format_compliance/format_rules.yaml
  - id: FC-021
    title: 会议及文件名称准确引用
    importance: A
    execution: code
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: '引用上级会议名称、文件名称须准确，不得张冠李戴、混淆年份或简化名称。

      党代会、全国两会等重大会议名称须使用规范全称。'
    source_file: 02_rules/format_compliance/format_rules.yaml
  - id: WQ_LR_005
    title: 标题四戒
    importance: B
    execution: code
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: '检查公文标题是否违反以下四戒：

      1. 戒不准确——标题与正文内容是否相符，是否存在名不副实、表述有偏差；

      2. 戒不具体——标题是否过于笼统模糊，是否缺乏实质信息量；

      3. 戒不精炼——标题是否过长，是否可简缩而未简缩，是否包含不必要成分；

      4. 戒不规范——是否符合公文标题格式要求，结构是否残缺，文种位置是否不当。

      注意：简报标题另有三要——时新（报道最新动态）、具体（有具体数字和事实）、

      形象（文字生动让人有画面感）。'
    source_file: 02_rules/book_principles/王群_公文写作大手笔.yaml
  - id: LR-003
    title: 标点符号九类常见错误
    importance: B
    execution: code
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: '检查公文标点符号是否存在以下九类常见错误：

      （1）并列书名号/引号之间是否加了顿号 → 须去掉顿号，直接并列；

      　　  错：《A》、《B》、《C》 → 正：《A》《B》《C》

      （2）是否存在同一形式括号套用 → 外层须改用方括号 [ ]；

      　　  错：（各镇（街道）） → 正：[各镇（街道）]

      （3）阿拉伯数字次序语是否用顿号 → 须改用下角点（圆心点）；

      　　  错：1、督促…… → 正：1.督促……；带括号时后面是否加了任何标点（须删除）；

      （4）图表说明文字末尾是否用了句号 → 须去掉句号；

      （5）发文年号是否用了圆括号 → 须改用六角括号〔〕；…'
    source_file: 02_rules/book_principles/公文高手自我修炼.yaml
  - id: FC-008
    title: 标题事由表述准确性
    importance: B
    execution: agent_prompt
    applicable_types:
    - 通知
    - 请示
    - 报告
    - 决定
    - 批复
    - 意见
    - 方案
    content_summary: '公文标题中的事由应当概括准确、简洁明了，

      不得使用过于笼统的表述（如"若干问题""有关工作"），

      也不得使用口语化表述。'
    source_file: 02_rules/format_compliance/format_rules.yaml
  - id: FC-013
    title: 通知正文结构完整性
    importance: B
    execution: agent_prompt
    applicable_types:
    - 通知
    content_summary: '通知正文应包含：发文缘由（依据/背景）、通知事项（具体要求）、

      执行要求（时限/责任单位）三个基本要素。

      转发性通知还须包含转发说明和执行要求。'
    source_file: 02_rules/format_compliance/format_rules.yaml
  - id: FC-015
    title: 方案正文六要素完整性
    importance: B
    execution: agent_prompt
    applicable_types:
    - 方案
    content_summary: '工作方案/实施方案正文应包含：背景目的、工作目标、

      主要任务（工作措施）、组织领导（职责分工）、

      时间节点（工作步骤）、保障措施六个基本要素。

      缺少任何一项均应提示补充。'
    source_file: 02_rules/format_compliance/format_rules.yaml
  - id: FC-017
    title: 附件另起页排版规范
    importance: B
    execution: code
    applicable_types:
    - 通知
    - 报告
    - 方案
    - 请示
    content_summary: '附件应另起一页排版，附件首页左上角应标注"附件X："字样，

      不得将附件与公文正文连排在同一页末尾。'
    source_file: 02_rules/format_compliance/format_rules.yaml
  - id: FC-018
    title: 首页不排版面页码
    importance: B
    execution: code
    applicable_types:
    - 通知
    - 请示
    - 报告
    - 决定
    - 批复
    content_summary: '公文首页不得排印版面页码（页码标注从第二页开始，或全文单页时不排页码）。

      内部材料（汇报、讲话稿等非正式公文）页码规则可按单位惯例执行。'
    source_file: 02_rules/format_compliance/format_rules.yaml
  - id: FC-020
    title: 领导职务称谓规范
    importance: B
    execution: code
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 通知
    content_summary: '文中提及领导职务时须使用规范全称，不得使用非标准简称。

      第一次出现时须写全称，同一文中再次出现可使用规范简称。

      "书记"前须带单位名称，不得单独称"书记"（第一次出现时）。'
    source_file: 02_rules/format_compliance/format_rules.yaml
  - id: FC-022
    title: 标题层级逻辑一致性
    importance: B
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    - 通知
    content_summary: '正文层级划分应逻辑清晰，层级使用应前后一致。

      同一级别的标题应使用相同的序号格式；

      不得跳级使用（如从"一、"直接跳到"（1）"）；

      不得在同一层级中混用不同序号格式（如"一"与"1."并用）。'
    source_file: 02_rules/format_compliance/format_rules.yaml
  - id: FC-023
    title: 结构头重脚轻问题检测
    importance: B
    execution: code
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    content_summary: '公文结构应当详略得当，重心分配合理。

      常见问题：成绩总结篇幅过长（占全文60%以上）而下步打算仅一句话；

      或问题分析过于简短（一带而过）而措施部署过于详细（比例失衡）。'
    source_file: 02_rules/format_compliance/format_rules.yaml
  - id: FC-024
    title: 正文逻辑关系自洽性
    importance: B
    execution: agent_prompt
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: '正文中的因果关系、并列关系、递进关系须符合逻辑。

      常见错误：因果关系倒置、并列项目不在同一层级、

      论点与论据不对应、总结句与详述内容不一致。'
    source_file: 02_rules/format_compliance/format_rules.yaml
  - id: FC-025
    title: 极端表述使用规范
    importance: B
    execution: code
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: '"最""第一""唯一""全市最""全省率先"等极端或排他性表述须慎用，

      使用时须有充分依据支撑，不得随意堆砌以示工作成效。'
    source_file: 02_rules/format_compliance/format_rules.yaml
TERM:
  description: 术语规范类规则——口语词汇替换为公文规范表述，禁用词识别，术语统一。主要由Agent 5（术语校对）code节点执行。
  rule_count: 82
  rules:
  - id: LR-002
    title: 五类重点校核错误
    importance: A
    execution: code
    applicable_types:
    - 汇报
    - 报告
    - 讲话
    - 方案
    content_summary: '检查公文是否存在以下五类重点错误：

      （1）政治性差错——党和国家文件的标准表述是否慎之又慎，是否出现政治性错误；

      （2）错别字——是否存在同音错别字，特别检查以下常见错误：

      　　  发轫（误：发韧）、杂糅（误：杂揉）、沧桑（误：苍桑）、

      　　  宣泄（误：渲泄）、抑或（误：亦或）、挖墙脚（误：挖墙角）、原动力（误：源动力）；

      （3）成语错用——公文成语是否准确使用，特别检查以下易错成语：

      　　  炙手可热（贬义，是否误用于褒义）、望其项背（是否只用否定形式）、

      　　  一蹴而就（含贬义，是否误当中性词）、首当其冲（是否误作"首先"用）；

      （4）标点符号错…'
    source_file: 02_rules/book_principles/公文高手自我修炼.yaml
  - id: LS-001
    title: 禁用"搞"字口语用法
    importance: A
    execution: code
    applicable_types:
    - 通用
    content_summary: '"搞"是典型的口语动词，在公文中应根据语义替换为"做好""推进""开展"

      "落实""推动"等规范表述。"搞好"→"做好"，"搞清楚"→"明确/理清"，

      "搞活动"→"开展活动"。'
    source_file: 02_rules/language_style/language_rules.yaml
  - id: LS-002
    title: 禁用"弄"字口语用法
    importance: A
    execution: code
    applicable_types:
    - 通用
    content_summary: '"弄"在公文中通常为口语化表达，应替换为具体的规范动词。

      "弄清楚"→"查明/厘清"，"弄好"→"做好/办好"，"弄明白"→"搞清/明确"。'
    source_file: 02_rules/language_style/language_rules.yaml
  - id: LS-006
    title: '"出问题"→"出现问题/发生问题"'
    importance: A
    execution: code
    applicable_types:
    - 通用
    content_summary: '"出问题"是典型口语，公文中应使用"出现问题""存在问题""产生问题"

