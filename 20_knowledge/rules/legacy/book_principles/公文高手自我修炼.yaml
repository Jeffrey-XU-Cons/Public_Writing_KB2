# 《公文高手的自我修炼》知识条目
# 版本A（胡森林）：案例篇，以曾国藩30道奏折为案例分析公文写作成长规律
# 版本B（魏治）：包含两书合并——"晚清第一奏折里的写作秘籍" + "大手笔是怎样炼成的"
# 主版本：版本B（魏治）——理论体系更完整，有系统方法论
# 版本A补充：成长三阶段模型、道术相济理念、以写促学等

# 总计：25条 | MT×14 | SP×8 | LR×3

# =========================================
# MT 方法论类（来源：魏治《大手笔是怎样炼成的》）
# =========================================

- id: MT-001
  type: methodology
  title: "写作素养金字塔：情怀>见识>文字"
  rule_type: STYLE
  execution: agent_prompt
  content: |
    检查公文写作是否体现了正确的素养层次：
    （1）文字层（术）——遣词造句、格式规范、语言技巧是否扎实；
    （2）见识层（识）——对事物的判断力、政策理解力、宏观视野是否体现；
    （3）情怀层（道）——对工作的热情、对公共事务的责任感、价值观是否彰显。
    必须检查：是否存在只在文字层打磨而缺乏见识与情怀支撑的情况，
    这是写作到达瓶颈无法突破的根本原因。
  applicable_types: ["汇报", "报告", "讲话", "方案"]
  importance: A
  source: "魏治《大手笔是怎样炼成的》第一章 入门心法"
  usage: prompt_supplement

- id: MT-002
  type: methodology
  title: "观世音菩萨五字写作心法"
  rule_type: LOGIC
  execution: agent_prompt
  content: |
    检查公文写作是否具备五种核心能力：
    （1）观——是否通过深入调研，察事为先，掌握了第一手材料；
    （2）世——是否通达世事，了解社会、政策、行业动态，不脱离实际；
    （3）音——语言是否有力量，节奏感是否强，读来是否朗朗上口；
    （4）菩——思维是否清晰，是否善于分析，是否找到了问题本质；
    （5）萨——是否体现了为人民服务的情怀，是否心系群众，是否有人文关怀。
  applicable_types: ["汇报", "报告", "讲话", "方案"]
  importance: B
  source: "魏治《大手笔是怎样炼成的》第一章 入门心法"
  usage: prompt_supplement

- id: MT-003
  type: methodology
  title: "公文写作者三有三无"
  rule_type: STYLE
  execution: agent_prompt
  content: |
    检查公文写作者是否具备正确的精神气质：
    【三有】
    （1）有公心——行文是否以公共利益为出发点，是否存在谋私利的倾向；
    （2）有正气——是否传播了正能量，是否弘扬主旋律，是否出现阿谀奉承；
    （3）有热情——对公文工作是否保持激情，是否存在敷衍了事的情况。
    【三无】
    （1）无邪——是否传递了错误导向，是否存在歪风邪气之文；
    （2）无私——是否在公文中夹带了私货，是否以文谋私；
    （3）无偏——是否客观公正，是否存在偏袒失衡的情况。
  applicable_types: ["汇报", "报告", "讲话", "方案"]
  importance: A
  source: "魏治《大手笔是怎样炼成的》第一章 入门心法"
  usage: prompt_supplement

- id: MT-004
  type: methodology
  title: "破题时事势三字经"
  rule_type: LOGIC
  execution: agent_prompt
  content: |
    检查公文立意（破题）是否具备三个维度：
    （1）时——是否体现了时代背景、当前形势、党的最新路线方针政策；
    　　  是否弄清楚了时代要求，本单位本行业有何新变化；
    （2）事——是否全方位把事情吃透，是否研究了"事"而非只研究"字"；
    　　  是否涵盖哲学层（理论高度）→逻辑层（因果推断）→心理层（靶向思维）三个维度；
    （3）势——是否顺应事物发展的趋势和方向，是否违背了发展规律。
    立意宜高不宜平，必须紧扣时、事、势，才能让文章有理论高度、论述深度、独特角度。
  applicable_types: ["讲话", "汇报", "报告", "方案"]
  importance: A
  source: "魏治《大手笔是怎样炼成的》第三章 登堂入室"
  usage: prompt_supplement

- id: MT-005
  type: methodology
  title: "立意四思法：高度深度角度尺度"
  rule_type: LOGIC
  execution: agent_prompt
  content: |
    检查公文立意是否经过"四思"检验：
    （1）首思高度——是否从理论、政策层面审视，是否在全局中定位，站位是否足够高；
    　　  是否存在就事论事、未能跳出自身层面的问题；
    （2）再思深度——是否深入独到，是否能揭示事物本质和规律，是否具有哲理性理论性；
    （3）三思角度——是否找到最能说明问题本质的切入角度，是否求"新"不落俗套；
    　　  求新是否未"跑题"，是否清楚主要矛盾；
    （4）四思尺度——分寸是否适度，材料多寡、详写略写、藏锋露锋是否把握恰当。
  applicable_types: ["讲话", "汇报", "报告", "方案"]
  importance: A
  source: "魏治《大手笔是怎样炼成的》第三章 登堂入室"
  usage: prompt_supplement

- id: MT-006
  type: methodology
  title: "四步成文法：领悟构思布局炼字"
  rule_type: LOGIC
  execution: agent_prompt
  content: |
    检查从接到写作任务到完稿是否经历了四个核心步骤：
    （1）领悟（虚己应物）——是否清空成见，是否深入理解了任务要求，
    　　  领悟力是否兼顾颖悟（举一反三）和通达（通晓世事）；
    （2）构思（神与物游）——是否让思维充分展开，是否已形成写作思路，
    　　  是否过于急于落笔而未充分构思；
    （3）布局（胸有丘壑）——动笔前结构框架是否已清晰，是否仍在边写边想结构；
    （4）炼字（语意两工）——是否同时精炼了语言和意义两个维度，
    　　  炼字是否仅停留于词汇替换而未炼逻辑、炼意思。
  applicable_types: ["汇报", "报告", "讲话", "方案"]
  importance: A
  source: "魏治《大手笔是怎样炼成的》第四章 进阶攻略"
  usage: prompt_supplement

- id: MT-007
  type: methodology
  title: "为文三悟：悟上级悟领导悟听众"
  rule_type: LOGIC
  execution: agent_prompt
  content: |
    检查写作前是否深度领悟了三个层次：
    （1）悟上级精神——是否学懂弄通党和国家最新路线方针政策，文稿是否与上级精神高度契合；
    （2）悟领导意图——是否透彻理解了出题领导的想法，是否做到：
    　　  ①扩展（领导想说的帮助展开充实）；
    　　  ②挖掘（领导没想到的帮助深化发现）；
    　　  ③完善（领导说不全面的帮助补充平衡）；
    （3）悟听众心理——是否了解文稿受众，是否进行了靶向思维换位思考；
    　　  是否思考了：受众是谁，有何特点，什么观点才能引起共鸣。
  applicable_types: ["讲话", "汇报", "报告", "方案"]
  importance: A
  source: "魏治《大手笔是怎样炼成的》第四章 进阶攻略"
  usage: prompt_supplement

- id: MT-008
  type: methodology
  title: "功夫在诗外：学好三门课"
  rule_type: LOGIC
  execution: agent_prompt
  content: |
    检查公文写作功力是否在三门基础课上有所体现：
    （1）哲学——是否解决了"怎么看"的认识论问题，立意是否具有理论高度；
    （2）逻辑学——是否解决了"怎么办"的方法论问题，
    　　  是否遵循逻辑推理规律（归纳/演绎/类比），是否存在逻辑错误；
    （3）心理学——是否解决了"为谁写"的对象论问题，
    　　  是否了解受众心理，是否做到顺情入机，动言中务。
  applicable_types: ["汇报", "报告", "讲话", "方案"]
  importance: A
  source: "魏治《大手笔是怎样炼成的》第五章 终极要诀"
  usage: prompt_supplement

- id: MT-009
  type: methodology
  title: "练好三门功做好三件事"
  rule_type: LOGIC
  execution: agent_prompt
  content: |
    检查是否具备三门功并落实了三件事：
    【三门功】
    （1）问题意识——是否时刻带着问题思考，是否有问题导向；
    （2）调查研究——是否重视第一手材料，是否存在形式主义调研；
    （3）思维训练——是否把复杂问题简单化，是否平时储备观点；
    【三件事】
    （1）善于学习——是否广泛阅读，博采众长；
    （2）勤于练笔——是否有怀疑精神，每写一稿是否反问"还能更好吗"；
    （3）乐于总结——是否及时反思总结，是否将经验提炼为规律，形成认知积累。
  applicable_types: ["汇报", "报告", "讲话", "方案"]
  importance: B
  source: "魏治《大手笔是怎样炼成的》第五章 终极要诀"
  usage: prompt_supplement

# =========================================
# MT 方法论类（来源：胡森林案例篇）
# =========================================

- id: MT-010
  type: methodology
  title: "公文写作成长三阶段模型"
  rule_type: STYLE
  execution: agent_prompt
  content: |
    检查当前写作是否已超越初级阶段的典型问题：
    【新手阶段问题（须避免）】
    文辞是否迂阔不接地气、言辞是否尖锐不知收敛、是否缺乏大局意识；
    【熟手阶段标准（须达到）】
    是否更接地气、更务实，是否已脱去青涩高蹈之气，经过实践历练；
    【高手阶段目标（须追求）】
    文字是否劲道有力、举重若轻，是否道术兼备。
    规律检查：写作能力瓶颈是否来自思想修为不足，须通过提升思想境界突破写作瓶颈。
  applicable_types: ["汇报", "报告", "讲话", "方案"]
  importance: A
  source: "胡森林《公文高手的自我修养（案例篇）》上篇"
  usage: prompt_supplement

- id: MT-011
  type: methodology
  title: "道术相济内外兼修"
  rule_type: STYLE
  execution: agent_prompt
  content: |
    检查公文写作是否做到道术相济：
    （1）道（内功）——是否具备情怀修为、大局观、战略眼光、民生情怀、担当精神；
    　　  是否存在缺乏道的"花拳绣腿"表现；
    （2）术（表层）——是否掌握写作技巧、手法、格式规范、结构方法；
    　　  是否存在只练术不修道导致到达瓶颈无法突破的情况。
    检查写作水平提升路径：是否在技法纯熟的同时，思想是否变化、性情是否成长、
    对世事人情的认识是否加深。
  applicable_types: ["汇报", "报告", "讲话", "方案"]
  importance: A
  source: "胡森林《公文高手的自我修养（案例篇）》引言"
  usage: prompt_supplement

- id: MT-012
  type: methodology
  title: "写作充电站：以写促学"
  rule_type: STYLE
  execution: agent_prompt
  content: |
    检查写作是否同时发挥了提升综合能力的作用：
    （1）观察能力——写作是否锻炼了细察周围的感知力；
    （2）思考能力——写作是否促使深入分析，避免浅层浮想；
    （3）分析能力——是否将现象提炼为规律，是否锻炼了逻辑分析；
    （4）判断能力——取舍材料、权衡立意是否培养了决断力；
    （5）办事能力——是否通过写作加深了对工作机理的理解；
    （6）管理能力——写作中的综合协调、统筹兼顾思维是否迁移到了管理实践。
  applicable_types: ["汇报", "报告", "讲话", "方案"]
  importance: B
  source: "胡森林《公文高手的自我修养（案例篇）》引言"
  usage: prompt_supplement

- id: MT-013
  type: methodology
  title: "上行公文五种沟通场景"
  rule_type: LOGIC
  execution: agent_prompt
  content: |
    检查上行公文是否正确识别并运用了对应沟通场景的技法：
    （1）建言献策场景——是否通过反映社情民意和积极建言，展现了才干和见解；
    （2）借势做大场景——是否充分利用了上级授权和平台资源；
    （3）树立权威场景——是否通过公文为执行争取了支持，解决了内部阻力；
    （4）周旋博弈场景——是否既达到了目的，又避免了不必要冲突；
    （5）提出创意场景——是否通过奏报提出了设想，推动上级形成决策。
    检查上行公文是否具备三性：针对性（针对特定受文者）、
    论断性（断=要做什么，论=为什么）、实效性（是否达到预期目的）。
  applicable_types: ["汇报", "报告"]
  importance: B
  source: "胡森林《公文高手的自我修养（案例篇）》引言"
  usage: prompt_supplement

- id: MT-014
  type: methodology
  title: "调研报告写作十要点"
  rule_type: LOGIC
  execution: agent_prompt
  content: |
    检查调研工作是否完成了完整执行清单：
    （1）是否精心准备了调研提纲；
    （2）是否提前了解了调研单位及调研问题的情况；
    （3）调研中是否先看现场后开座谈会；
    （4）是否认真准备了座谈会发言，让被调研方清楚调研目的和要求；
    （5）调研中是否引导气氛，善于提问，不轻易发表个人意见；
    （6）是否注意领会了调研组领导意思，必要时提出合理化建议；
    （7）是否注意自身形象，尽量未给被调研单位添麻烦；
    （8）调研结束后是否及时联系调研单位并致谢；
    （9）是否与调研中帮助的人保持联系；
    （10）调研后是否认真总结经验。
    必须检查：是否存在形式主义调研、走过场、数据造假的情况。
    写作核心须抓住一个"真"字：是否全面、客观、公正地反映了客观事物本来面貌。
  applicable_types: ["报告"]
  importance: B
  source: "魏治《大手笔是怎样炼成的》第二章"
  usage: prompt_supplement

# =========================================
# SP 结构原则类
# =========================================

- id: SP-001
  type: structure_principle
  title: "讲话稿六宜六忌框架"
  rule_type: LOGIC
  execution: agent_prompt
  content: |
    检查公文（以讲话稿为核心）是否满足六宜六忌的要求：
    （1）立意宜高，忌平——是否具有理论高度和全局视野，是否存在站位低平的问题；
    （2）主题宜明，忌杂——主题是否鲜明集中，是否存在多主题并立相互干扰；
    （3）结构宜紧，忌散——各部分是否紧密围绕主题，层次是否清晰，逻辑是否严密；
    （4）内容宜实，忌空——是否用事实、数据说话，是否存在空喊口号、虚化套话；
    （5）语言宜活，忌陈——语言是否鲜活，表达方式是否多样，是否陈词滥调；
    （6）文气宜通，忌断——行文是否流畅，前后衔接是否自然，读来是否一气呵成。
  applicable_types: ["讲话", "汇报", "报告", "方案"]
  importance: A
  source: "魏治《大手笔是怎样炼成的》第三章 登堂入室"
  usage: rule_engine

- id: SP-002
  type: structure_principle
  title: "工作报告五大写作难点"
  rule_type: LOGIC
  execution: agent_prompt
  content: |
    检查工作报告是否妥善处理了五个核心难点：
    （1）提炼主题难——主题是否突出了当前工作重点，是否有针对性和指导性，是否能解决突出问题；
    （2）布局结构难——谋篇布局是否充分，提纲是否含主要观点和素材而非干巴巴一句话；
    　　  是否做到了越是鸿篇巨制越大道至简，逻辑结构是否清晰简明；
    （3）表达切实准确难——是否切实准确不体现个人风格，是否兼顾了当前与长远；
    （4）平衡全面与重点难——是否做到全面不失重点、重点不忽视全面；
    　　  是否重点讲了中央部署和领导群众关心的热点难点；
    （5）持续创新难——是否实现了"永远的重复，持续的创新"，
    　　  是否有新思想、新论断、新提法、新举措。
  applicable_types: ["报告"]
  importance: A
  source: "魏治《大手笔是怎样炼成的》第二章"
  usage: rule_engine

- id: SP-003
  type: structure_principle
  title: "调研报告四要素写法"
  rule_type: LOGIC
  execution: agent_prompt
  content: |
    检查调研报告是否满足四个核心要求：
    （1）方向明确——是否坚持问题导向，直奔解决问题而去；
    （2）分析方法——是否全面辩证地分析，由表及里、由此及彼、去伪存真；
    　　  是否存在事实简单罗列、人云亦云、受既往定论约束的问题；
    　　  是否抓住"真"字：客观反映事物本来面貌，不夸大不缩小，不捏造不掩饰；
    （3）结构要求——是否做到：主题鲜明、重点突出、语言精练、论证严密、建议切实、措施可行；
    （4）对策措施——是否提出了有坚实基础的对策，是否在遣词造句上注意分寸，
    　　  是否坚持两分法、两点论，是否把话说过头。
  applicable_types: ["报告"]
  importance: B
  source: "魏治《大手笔是怎样炼成的》第二章"
  usage: rule_engine

- id: SP-004
  type: structure_principle
  title: "总结报告三特点五注意"
  rule_type: LOGIC
  execution: agent_prompt
  content: |
    检查总结报告是否体现三个本质特点：
    （1）自我性——是否以第一人称叙述，是否是主体自身活动实践的产物；
    （2）概括性——是否已梳理、提炼、归纳，是否仍停留在流水账层面；
    （3）启发性——是否提出了深刻而具有普遍意义的见解，是否揭示了规律性。
    检查是否遵循写好总结的五点注意：
    （1）是否重视调查研究，是否以偏概全；
    （2）是否坚持实事求是，是否存在只写成绩不写错误；
    （3）是否重点在出经验、找规律，是否停留在表面现象；
    （4）是否发掘了亮点，是否总结了可积累和推广的经验；
    （5）是否点面结合，是否定性与定量结合，是否用数据和典型事例说明。
    不得出现以下三类常见问题：罗列工作写成流水账；报喜不报忧；虚话套话太多。
  applicable_types: ["报告", "汇报"]
  importance: B
  source: "魏治《大手笔是怎样炼成的》第二章"
  usage: rule_engine

- id: SP-005
  type: structure_principle
  title: "公文三大本质属性"
  rule_type: LOGIC
  execution: agent_prompt
  content: |
    检查公文是否体现三大本质属性：
    （1）实效性——是否以解决实际问题为目的，是否能达到预期目标；
    　　  检查公文发出后是否会达到预期目的，这是最重要的评价尺度；
    （2）论断性——是否将论述（论）和决定（断）有机结合；
    　　  断=要办什么事（结论）；论=办这事的理由（前提）；
    　　  上行文是否侧重于"论"（充分的理由和说服力）；
    　　  下行文是否侧重于"断"（权威性）；
    （3）针对性——是否有明确的受文对象，是否针对特定受众；
    　　  是否了解受文者是谁，是否揣摩其心理，是否有的放矢；
    　　  是否做到顺情入机，动言中务（顺着受文者感情心理，触及工作关键）。
  applicable_types: ["汇报", "报告", "讲话", "方案"]
  importance: A
  source: "魏治《晚清第一奏折里的写作秘籍》"
  usage: rule_engine

- id: SP-006
  type: structure_principle
  title: "经验介绍材料四大要求"
  rule_type: LOGIC
  execution: agent_prompt
  content: |
    检查经验介绍材料是否满足四大要求：
    （1）立意要新颖独到——是否发现了他人未发现的东西，是否给人启发而非照本宣科；
    （2）素材要真实充分——是否做到点面结合：
    　　  点（典型事例）+面（综合情况）是否兼顾，有点无面是否缺说服力，有面无点是否缺感染力；
    （3）结构要合理完整——每个问题是否包含三要素：
    　　  为什么（提出问题）→ 是什么（回答问题/做法）→ 怎么样（运用结果/效果）；
    （4）文字要生动形象——是否接地气、形象化，是否力求精练，是否三言两语切入正题。
    检查：是否存在"活材料写死"的情况，须突出典型性。
  applicable_types: ["报告", "汇报"]
  importance: B
  source: "魏治《大手笔是怎样炼成的》第二章"
  usage: rule_engine

- id: SP-007
  type: structure_principle
  title: "会议纪要三核心要求"
  rule_type: LOGIC
  execution: agent_prompt
  content: |
    检查会议纪要是否满足三核心要求：
    （1）真实准确——内容是否来自会议本身，是否存在随意增减、擅自篡改；
    　　  是否出现演绎式、推理式、编造式纪要；意见不一致时是否写多数人的意见；
    （2）精练概括——是否抓中心抓要点，是否存在面面俱到、堆砌材料；
    　　  是否将口头语转化为书面语，认识性文字是否简略，结论性文字是否明确；
    （3）清楚明白——是否有明确结论，是/否/何时办/怎么办是否言之凿凿；
    　　  涉及责任划分、经费额度、完成时限是否全面准确清晰记录。
    检查时效性：一般会议是否3-5天内印发；重要紧急会议是否当天或隔天印发。
  applicable_types: ["报告"]
  importance: B
  source: "魏治《大手笔是怎样炼成的》第二章"
  usage: rule_engine

- id: SP-008
  type: structure_principle
  title: "工作方案合理可行三标准"
  rule_type: LOGIC
  execution: agent_prompt
  content: |
    检查工作方案是否满足合理可行的三个标准：
    （1）目标要现实合理——目标是否既不太容易也不好高骛远；
    （2）工作要求要具体可行——时间、步骤、进度、质量是否尽可能量化；
    　　  不能量化的是否有质的要求，是否明确了指标；
    （3）措施要切实可行——是否针对实际有可操作性；
    　　  是否对各项任务进行了分解落实，是否明确了责任单位和责任人，
    　　  是否明确了工作进度和工作结果的评价标准。
    检查常规要素是否按需包含：指导思想、目标任务、组织机构、实施步骤、工作要求。
  applicable_types: ["方案"]
  importance: B
  source: "魏治《大手笔是怎样炼成的》第二章"
  usage: rule_engine

