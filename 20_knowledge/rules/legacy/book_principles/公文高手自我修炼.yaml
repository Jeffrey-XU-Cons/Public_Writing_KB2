- id: LR-001
  type: language_rule
  title: "公文校核四原则"
  rule_type: FORMAT
  execution: code
  content: |
    检查公文校核是否遵循四原则：
    （1）逢文必校——不管篇幅长短，是否一概认真校核，是否因文短内容简单而放松；
    （2）每字必核——是否一个标点一个标点地校，一个字一个字地核；
    　　  人名、地名、时间、数字、引文是否特别注意准确规矩严谨；
    （3）急文稳校——急件是否沉住气稳住劲，是否因为急就放松了校核；
    （4）校写分离——起草和校核是否由不同的人进行；
    　　  是否出现起草人自校导致"视而不见"的问题。
  applicable_types: ["汇报", "报告", "讲话", "方案"]
  importance: A
  source: "魏治《大手笔是怎样炼成的》为文须谨慎"
  usage: rule_engine

- id: LR-002
  type: language_rule
  title: "五类重点校核错误"
  rule_type: TERM
  execution: code
  content: |
    检查公文是否存在以下五类重点错误：
    （1）政治性差错——党和国家文件的标准表述是否慎之又慎，是否出现政治性错误；
    （2）错别字——是否存在同音错别字，特别检查以下常见错误：
    　　  发轫（误：发韧）、杂糅（误：杂揉）、沧桑（误：苍桑）、
    　　  宣泄（误：渲泄）、抑或（误：亦或）、挖墙脚（误：挖墙角）、原动力（误：源动力）；
    （3）成语错用——公文成语是否准确使用，特别检查以下易错成语：
    　　  炙手可热（贬义，是否误用于褒义）、望其项背（是否只用否定形式）、
    　　  一蹴而就（含贬义，是否误当中性词）、首当其冲（是否误作"首先"用）；
    （4）标点符号错误——是否存在以下错误：
    　　  并列书名号/引号之间加顿号、六角括号未规范使用、二级标题换行加句号等；
    （5）禁用词和慎用词——是否参照新华社禁用词（第一批及修订版）进行检查。
  applicable_types: ["汇报", "报告", "讲话", "方案"]
  importance: A
  source: "魏治《大手笔是怎样炼成的》为文须谨慎"
  usage: rule_engine

- id: LR-003
  type: language_rule
  title: "标点符号九类常见错误"
  rule_type: FORMAT
  execution: code
  content: |
    检查公文标点符号是否存在以下九类常见错误：
    （1）并列书名号/引号之间是否加了顿号 → 须去掉顿号，直接并列；
    　　  错：《A》、《B》、《C》 → 正：《A》《B》《C》
    （2）是否存在同一形式括号套用 → 外层须改用方括号 [ ]；
    　　  错：（各镇（街道）） → 正：[各镇（街道）]
    （3）阿拉伯数字次序语是否用顿号 → 须改用下角点（圆心点）；
    　　  错：1、督促…… → 正：1.督促……；带括号时后面是否加了任何标点（须删除）；
    （4）图表说明文字末尾是否用了句号 → 须去掉句号；
    （5）发文年号是否用了圆括号 → 须改用六角括号〔〕；
    　　  错：×发[2013]3号 → 正：×发〔2013〕3号
    （6）书名号内并列是否用了顿号 → 须改用空格；
    （7）附件名称后是否加了标点 → 附件名称后不得使用任何标点符号；
    （8）二级标题换行是否加了句号 → 二级标题换行时不得用句号；用句号则不换行；
    （9）日期事件是否标引了整个短语 → 只须标引其中的日期数字。
  applicable_types: ["汇报", "报告", "讲话", "方案"]
  importance: B
  source: "魏治《大手笔是怎样炼成的》为文须谨慎"
  usage: rule_engine
