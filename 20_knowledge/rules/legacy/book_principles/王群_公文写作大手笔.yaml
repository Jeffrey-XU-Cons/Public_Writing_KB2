# 王群《公文写作大手笔·批》知识条目
# Task 4 - 重点: MT方法论类条目，高层级公文立意与领导讲话写作
# 已对照胡森林底层心法/笔杆、新编常用公文写作 进行去重
# 条目总数: 27（MT×18, LR×6, SP×3）

- id: WQ_MT_001
  type: MT
  title: 写作高手三种能力论（认识/公务处理/文字表述）
  rule_type: LOGIC
  execution: agent_prompt
  content: |
    检查公文写作能力是否在三个层次上均有体现：
    1. 认识能力（第一位）——是否具备对事物的分析概括能力，是否体现了思想深度；
       检查是否存在"意不逮物"问题：写不出往往不是文字表述力不行，而是认识能力不足；
    2. 公务处理能力——是否熟悉行政管理和机关工作程序，是否能抓住工作轻重主次；
    3. 文字表述能力——是否将正确认识准确完美地表达出来，是否符合公文规则格式方法技巧。
    三者排序：认识能力 > 公务处理能力 > 文字表述能力，不得本末倒置只追求文字技巧。
  applicable_types: ["汇报", "报告", "讲话", "方案"]
  importance: A
  source: 王群《公文写作大手笔》Ch.40
  usage: prompt_supplement

- id: WQ_MT_002
  type: MT
  title: 立意三番来者法（陈言→正语→精语）
  rule_type: STYLE
  execution: agent_prompt
  content: |
    检查公文立意是否经历了三番思考，避免停留在第一番：
    第一番——陈言：脑海最先浮现的套话陈词，必须扫去不用，不得以第一番作为最终立意；
    第二番——正语：深入思考后触及事物本质的表述，但仍停留在表层，不得满足于此；
    第三番——精语：从更高角度思考所得，发人所未发、想人所未想，须追求此层次。
    检查：立意是否已至少经过三轮思考，是否仍停留在陈词滥调层次。
  applicable_types: ["汇报", "报告", "讲话", "方案"]
  importance: A
  source: 王群《公文写作大手笔》Ch.9/Ch.40
  usage: prompt_supplement

- id: WQ_MT_003
  type: MT
  title: 立意能力提升三法（高·新·尖）
  rule_type: LOGIC
  execution: agent_prompt
  content: |
    检查公文立意是否满足高、新、尖三个维度：
    1. 挖本质（高）——是否从材料中跳出来，站在领导机关高度观察问题；
       是否先深思再落笔，把平凡问题概括升华，挖掘本质；
    2. 找新角度（新）——是否运用了新视角切入，从相反方向或不同侧面立意；
       是否避免"千佛一面"，选择最有意义的侧面；
    3. 集中突出（尖）——是否只围绕一个核心问题展开，是否做到重点突出、主旨集中。
  applicable_types: ["汇报", "报告", "讲话", "方案"]
  importance: A
  source: 王群《公文写作大手笔》Ch.40
  usage: prompt_supplement

- id: WQ_MT_004
  type: MT
  title: 立纲四种基本结构形态
  rule_type: LOGIC
  execution: agent_prompt
  content: |
    检查公文结构形态是否与文种和内容匹配，属于以下四种之一：
    1. 总分式——各分项须为并列关系，不可有包容从属；意见/通知/决定/领导讲话最常用；
    2. 递进式（因果式）——各段间是否为因果或进层关系，各段顺序是否不可调换；工作部署/经验总结常用；
    3. 承接式（时序式）——是否按事物发展先后顺序排列；信息/简报/会议纪要常用；
    4. 单层式（一段式）——内容是否单一，是否为简短文书如任免通知。
    不得出现结构形态与内容逻辑不符的情况。
  applicable_types: ["汇报", "报告", "讲话", "方案"]
  importance: A
  source: 王群《公文写作大手笔》Ch.40
  usage: rule_engine

- id: WQ_MT_005
  type: MT
  title: 立纲两种方法（发散法与归纳法）
  rule_type: LOGIC
  execution: agent_prompt
  content: |
    检查立纲方法是否与行文方向匹配：
    1. 发散法（适用下行文）——是否先确定领导意图/观点，再向外发散展开；
       是否参照上级文件和该领导历次讲话进行发散；
    2. 归纳法（适用上行文）——是否先掌握大量材料，再从中提炼观点；
       是否用多级综合归纳（小标题→中级标题→大标题）；
       最终是否按因果/承接/意义轻重排序形成完整提纲。
    下行文须"定方向→填内容"，上行文须"看材料→提观点"，不得混用。
  applicable_types: ["汇报", "报告", "方案"]
  importance: B
  source: 王群《公文写作大手笔》Ch.40
  usage: prompt_supplement

- id: WQ_MT_006
  type: MT
  title: 材料综合横纵四法
  rule_type: LOGIC
  execution: agent_prompt
  content: |
    检查公文综合整理材料是否运用了合适的方法：
    横向综合：
      - 堆积法——各单位情况是否各有千秋，不能千人一面；
      - 归纳法——是否先归纳出几个观点，各观点下举2-3单位情况，脉络是否清楚；
    纵向综合：
      - 累积法——是否将一段时期情况进行数量叠加汇总；
      - 阶段法——是否找出不同阶段的特点，将材料分类放入各阶段特点之下。
    检查观点提炼是否准确新颖，这是综合质量高低的核心。
  applicable_types: ["汇报", "报告"]
  importance: B
  source: 王群《公文写作大手笔》Ch.14
  usage: prompt_supplement

- id: WQ_MT_007
  type: MT
  title: JK三级综合法（处理大量材料的提纲生成法）
  rule_type: LOGIC
  execution: agent_prompt
  content: |
    检查处理大量材料时是否运用了三级综合方法：
    第一步（J卡）——是否逐一阅读每份材料，提炼1-2个最突出内容，归纳为小标题；
    第二步（Q卡）——是否将意思相近的内容码成一堆，用一个新标题概括每堆的共同规律；
    第三步（K卡）——是否对Q卡进一步归纳，合并带有共同点的Q卡，产生K级大标题，
                    并按因果/意义轻重排序；若K卡仍过多是否继续合并。
    结果须形成K→Q→J的三级提纲层次，结构清晰、提炼准确。
  applicable_types: ["汇报", "报告"]
  importance: B
  source: 王群《公文写作大手笔》Ch.14
  usage: prompt_supplement

- id: WQ_MT_008
  type: MT
  title: 层次组合四原则
  rule_type: LOGIC
  execution: agent_prompt
  content: |
    检查多层级公文结构组合是否遵循四原则：
    1. 内涵相称原则——同一层级各层次内涵是否大体相称（"辈分相等"），是否存在越级；
    2. 层级从属原则——较低层级各层次是否从属于对应上一层次，是否存在"血统不清"（内容交叉混乱）；
    3. 标准唯一原则——层次划分是否依据单一标准，同一层级是否只用横式或纵式，不得混用；
    4. 排列有序原则——横式结构是否按问题大小/意义深浅排，纵式结构是否按时间/因果/阶段排序。
  applicable_types: ["汇报", "报告", "讲话", "方案"]
  importance: B
  source: 王群《公文写作大手笔》Ch.16
  usage: rule_engine

- id: WQ_MT_009
  type: MT
  title: 领导讲稿起草五步准备法
  rule_type: LOGIC
  execution: agent_prompt
  content: |
    检查领导讲稿起草前是否完成了五项准备：
    1. 把握领导意图——是否弄清精神实质，是否做到两个融贯通（与上级精神融贯+与领导一贯思想融贯）；
    2. 摸清领导特点——是否了解领导职务性质/性格类型/文化修养/年龄特点/讲话风格；
    3. 弄清讲话对象——是否明确了与听众的上下平关系，是否了解听众基本情况和切身关切；
    4. 弄清讲话场合——是否判断了场合类型（开幕式/中间报告/闭幕式）及对应要求；
    5. 确定讲稿提纲——提纲是否详细到大小标题和每层次中心意思，把握不大时是否准备了2-3套方案。
  applicable_types: ["讲话"]
  importance: A
  source: 王群《公文写作大手笔》Ch.34
  usage: prompt_supplement

- id: WQ_MT_010
  type: MT
  title: 领导意图融会贯通两要求
  rule_type: LOGIC
  execution: agent_prompt
  content: |
    检查起草领导讲稿时是否做到了两个融贯通：
    1. 与上级方针政策融贯——领导意图是否与上级指示精神一致，是否保证政策连续性；
    2. 与该领导一贯思想融贯——是否掌握了该领导的思维方式和历次讲话/批示精神，
       使讲稿延续其一贯主张，保证前后一致性。
    同时须检查：是否发扬独立思考，将领导原则性意见化为系统深刻的见解，而非机械呆板执行。
  applicable_types: ["讲话", "报告"]
  importance: A
  source: 王群《公文写作大手笔》Ch.34
  usage: prompt_supplement

- id: WQ_MT_011
  type: MT
  title: 领导讲稿主体四性要求（鲜明/生动/鼓动/通俗）
  rule_type: STYLE
  execution: agent_prompt
  content: |
    检查领导讲话稿的主体部分是否体现"四性"：
    1. 鲜明性——主旨是否鲜明，是否抓住主线围绕一个主要问题展开；
    2. 生动性——是否恰当引用了文学形象/成语典故/名言佳句，深入浅出，用典是否贴切；
    3. 鼓动性——是否注入了饱满感情，是否旗帜鲜明；
       不得是高呼口号，须把话说到点子上、道理讲在实处，找到与听众共同点引发共鸣；
    4. 通俗性——是否将抽象道理讲得浅显通俗，是否善用身边事例阐明理论。
  applicable_types: ["讲话"]
  importance: A
  source: 王群《公文写作大手笔》Ch.34
  usage: prompt_supplement

- id: WQ_MT_012
  type: MT
  title: 领导意图三种受命类型
  rule_type: LOGIC
  execution: agent_prompt
  content: |
    检查代拟讲稿时是否正确识别并应对了领导意图的类型：
    1. 完全受命型——领导意图详细明确时，是否逐条完整准确体现；
    2. 有限受命型——领导给出原则框架时，是否在框架内创造性补充了具体内容，向深处挖掘；
    3. 无限受命型（意图模糊型）——领导仅指明方向时，是否全面研究，自主设计内容结构后提请审定。
    三种情形均须：听关键几句话悟出领导本意和真意，不得机械呆板。
  applicable_types: ["讲话", "报告"]
  importance: B
  source: 王群《公文写作大手笔》Ch.21/Ch.34
  usage: prompt_supplement

- id: WQ_MT_013
  type: MT
  title: 公文被动写作适应三情形
  rule_type: STYLE
  execution: agent_prompt
  content: |
    检查是否正确处理了认识与领导意图之间的关系：
    1. 完全一致情形——是否正常推进写作；
    2. 不完全一致情形——是否进一步领会意图，努力使二者达到一致；
    3. 很不一致情形——是否立即调整心态，站到领导高度重新思考，找出差距后再动笔。
    必须检查：是否从领导交代的话语中抓取了本意和真意，不得以自己的认识代替领导意图。
  applicable_types: ["汇报", "报告", "讲话", "方案"]
  importance: B
  source: 王群《公文写作大手笔》Ch.40
  usage: prompt_supplement

- id: WQ_MT_014
  type: MT
  title: 工作总结五忌（"豆腐账"五种表现）
  rule_type: STYLE
  execution: agent_prompt
  content: |
    检查工作总结是否存在以下五种禁忌：
    1. 光摆工作——是否将总结写成大事记/成绩簿，是否忽视经验体会；应集中笔墨写经验体会；
    2. 套用计划——是否照搬年初计划改时态，是否忽视全年出现的新情况新做法；
    3. 上下不分——上报总结是否站在领导高度提炼规律性认识；
                   下发总结是否全面列举基层事例，多做自我批评；
    4. 面面俱到——是否存在事无巨细平均用力，导致重点不突出；
    5. 老调旧腔——是否存在"领导重视""层层落实""健全制度"等套话年年雷同。
  applicable_types: ["汇报", "报告"]
  importance: A
  source: 王群《公文写作大手笔》Ch.31
  usage: prompt_supplement

- id: WQ_MT_015
  type: MT
  title: 工作总结不足部分三有要求
  rule_type: LOGIC
  execution: agent_prompt
  content: |
    检查工作总结中谈问题和不足的部分是否满足"三有"要求：
    1. 有不足的具体表现——是否为具体描述而非原则性套话（如"成效尚不理想"等）；
    2. 有对主客观原因的深入分析——是否为深入分析而非泛论（如"领导水平有限"等）；
    3. 有改进不足的具体举措——是否提出了具体措施，使总结对未来工作有实际指导价值。
    同时须检查报送对象：上报须突出规律性认识和经验；下发时须多担责任少批评下面。
  applicable_types: ["汇报", "报告"]
  importance: B
  source: 王群《公文写作大手笔》Ch.31
  usage: prompt_supplement

- id: WQ_MT_016
  type: MT
  title: 用材四原则（鉴材筛选标准）
  rule_type: LOGIC
  execution: agent_prompt
  content: |
    检查公文材料筛选是否符合四大原则：
    1. 相关性——材料与公文主旨是否关联，是否选用了"一个顶俩"的最能说明主旨的材料；
    2. 真实性——材料来源是否可靠，来源有疑问的材料是否经过核实；
    3. 典型性——材料是否有普遍意义和代表意义，是否选用了带偶然性、缺乏说服力的材料；
    4. 新颖性——材料是否新近发生，是否使用了陈旧的众所周知的情况。
    检查是否存在只取对己有利的一面、偏颇不全面的情况。
  applicable_types: ["汇报", "报告", "讲话", "方案"]
  importance: B
  source: 王群《公文写作大手笔》Ch.12/Ch.40
  usage: prompt_supplement

- id: WQ_MT_017
  type: MT
  title: 用材三技法（合并/角度/详略）
  rule_type: LOGIC
  execution: agent_prompt
  content: |
    检查公文材料运用是否合理，并注意三种技法：
    1. 合并同类——是否将数个相关材料综合成一个整体，避免单摆浮搁；
    2. 调整角度——同一材料是否从最有效的角度使用，服务于当前主旨；
    3. 详略之法——是否遵循"久则论略，近则论详；略则举大，详则举小"的原则。
    必须检查以下三种错误是否存在：
    ①观点材料打架（讲一回事材料讲另一回事）；
    ②貌合神离（强行对应，拉郎配）；
    ③以偏概全（仅2个事例代替全局情况，须先有综合概述再举例）。
  applicable_types: ["汇报", "报告", "讲话"]
  importance: B
  source: 王群《公文写作大手笔》Ch.40
  usage: prompt_supplement

- id: WQ_MT_018
  type: MT
  title: 材料消化三步法（筛选→定位→编织提炼）
  rule_type: LOGIC
  execution: agent_prompt
  content: |
    检查将原始材料消化成文是否经历了三个阶段：
    1. 筛选补充——是否按写作目的挑选有用材料，剔除陈旧/无关材料，并对不足方面进行了补充；
    2. 归纳定位——是否按写作意图将材料分类归纳，按逻辑关系排序，每类内部是否按层次排好位置；
    3. 编织提炼——零散材料是否综合拼接成连贯系统材料；庞杂材料是否概括提炼后写入文章，
                  须避免过分概括变成概念化。
    特别检查：上级精神是否融会贯通后用自己的话讲出，不得大段照搬。
  applicable_types: ["汇报", "报告", "方案"]
  importance: B
  source: 王群《公文写作大手笔》Ch.43
  usage: prompt_supplement

# ─── LR 语言规则类 ───────────────────────────────────────────

- id: WQ_LR_001
  type: LR
  title: 简洁四要求（凝/实/广/简）
  rule_type: STYLE
  execution: agent_prompt
  content: |
    检查公文语言是否符合简洁的四个层面要求：
    1. 凝而不泛——语言是否凝练，是否存在空洞泛泛而谈；
    2. 实而不空——内容是否实在，是否虚浮空洞；
    3. 广而不滥——覆盖面是否广但不滥用词汇和例子；
    4. 简而不赘——文字是否简短，是否存在重复啰嗦，是否删去了与中心无关文字。
  applicable_types: ["汇报", "报告", "讲话", "方案"]
  importance: B
  source: 王群《公文写作大手笔》Ch.1
  usage: rule_engine

- id: WQ_LR_002
  type: LR
  title: 公文语言四特点（准确/庄重/简要/平实）
  rule_type: STYLE
  execution: agent_prompt
  content: |
    检查公文语言是否符合四个基本特点：
    1. 准确——词句内涵与表达意图是否完全一致，是否存在歧义，时间方位表述是否有严密限定；
    2. 庄重——语调是否端庄严肃，是否出现网络语言和感情色彩浓重词汇；
       检查是否使用了规范用语（称谓语/开端语/经办语/引文语/承启语/期请语/结尾语）；
       检查行文方向语气是否匹配：上行文是否谦虚恳切，下行文是否庄重坚决，平行文是否平和；
    3. 简要——用词是否简洁明快，是否适当用缩略语和成语，是否尽量使用短句；
    4. 平实——是否如实叙述事物本来面目，是否存在艺术夸张和渲染烘托。
  applicable_types: ["汇报", "报告", "讲话", "方案"]
  importance: A
  source: 王群《公文写作大手笔》Ch.18
  usage: rule_engine

- id: WQ_LR_003
  type: LR
  title: 公文表达三主法（叙述/议论/说明）
  rule_type: STYLE
  execution: agent_prompt
  content: |
    检查公文语言表达方式是否运用恰当：
    1. 叙述（主）——是否兼顾概括叙述（反映全面情况）与具体叙述（展现典型细节），
       叙述是否简明，是否出现文学式的详尽叙述；
    2. 议论（主）——是否少而精穿插在关键段落，是否存在全篇铺开论述；
    3. 说明（主）——是否言简意赅，是否把主要情况和特点说清；
    4. 描写（辅）——描写是否仅用于调查报告/总结/简报等，法定公文是否未使用描写；
    5. 抒情（辅）——抒情是否仅用于在公开场合宣读的重要文件，是否做到庄重内敛"冷抒情"。
  applicable_types: ["汇报", "报告", "讲话"]
  importance: B
  source: 王群《公文写作大手笔》Ch.18
  usage: rule_engine

- id: WQ_LR_004
  type: LR
  title: 开头三要求与四种冗长表现
  rule_type: STYLE
  execution: agent_prompt
  content: |
    检查公文开头是否符合三条原则：
    1. 开门见山——是否直接点明主题，是否存在绕弯子或空话套语；
    2. 紧扣全文——开头是否能提示全篇内容，与文章主体是否紧密相连；
    3. 概括凝练——是否用最少的文字概括了最核心的内容。
    检查是否存在以下四种冗长开头（须避免）：
    ①大段交代背景缘由拖沓冗长；
    ②大量引用上级文件精神才进入正文；
    ③大篇幅表决心表态度；
    ④将正文内容在开头先提一遍（先声明后重复）。
  applicable_types: ["汇报", "报告", "讲话", "方案"]
  importance: B
  source: 王群《公文写作大手笔》Ch.22
  usage: rule_engine

- id: WQ_LR_005
  type: LR
  title: 标题四戒
  rule_type: FORMAT
  execution: code
  content: |
    检查公文标题是否违反以下四戒：
    1. 戒不准确——标题与正文内容是否相符，是否存在名不副实、表述有偏差；
    2. 戒不具体——标题是否过于笼统模糊，是否缺乏实质信息量；
    3. 戒不精炼——标题是否过长，是否可简缩而未简缩，是否包含不必要成分；
    4. 戒不规范——是否符合公文标题格式要求，结构是否残缺，文种位置是否不当。
    注意：简报标题另有三要——时新（报道最新动态）、具体（有具体数字和事实）、
    形象（文字生动让人有画面感）。
  applicable_types: ["汇报", "报告", "讲话", "方案"]
  importance: B
  source: 王群《公文写作大手笔》Ch.23/Ch.24
  usage: rule_engine

- id: WQ_LR_006
  type: LR
  title: 领导讲稿开头五法
  rule_type: STYLE
  execution: agent_prompt
  content: |
    检查领导讲话稿开头是否运用了合适的方法，属于以下五种之一：
    1. 开门见山——一两句直接点明讲话内容或会议主题，是否庄重简洁，是否迅速控制场面；
    2. 概括说明——是否用几句话概括讲话缘由和要点，引起听众注意和期待；
    3. 设问启发——是否在开头提出发人深省的问题，自问自答，突出主旨；
    4. 介绍背景——是否简要介绍了多数听众尚不了解的背景材料；
    5. 曲转入题——是否先讲几句"题外话"自然吸引注意力，再话锋一转进入正题。
    不得出现讲话稿开头拖沓冗长、迟迟不进入主题的情况。
  applicable_types: ["讲话"]
  importance: B
  source: 王群《公文写作大手笔》Ch.34
  usage: rule_engine

# ─── SP 结构原则类 ───────────────────────────────────────────

- id: WQ_SP_001
  type: SP
  title: 公文主旨定义（行文用意和目的）
  rule_type: LOGIC
  execution: agent_prompt
  content: |
    检查公文主旨是否明确为"行文用意和目的"：
    即这篇公文为什么而写，要达到什么目标，对收文者产生什么效果。
    检查主旨是否统帅全文：一切材料、结构、语言是否均服从行文用意和目的。
    必须检查：主旨是否单一（一文一旨），是否存在与主旨无关的材料被保留；
    检查主旨的出发点是否来自：领导的决策意图 + 实际工作中亟待解决的问题。
  applicable_types: ["汇报", "报告", "讲话", "方案"]
  importance: A
  source: 王群《公文写作大手笔》Ch.7
  usage: rule_engine

- id: WQ_SP_002
  type: SP
  title: 领导讲稿三类型（政论型/意见型/礼仪型）
  rule_type: GENRE
  execution: agent_prompt
  content: |
    检查领导讲话稿类型判断是否正确，并验证写作要求是否与类型匹配：
    1. 政论型讲话稿——用于大型会议/重大问题，语言是否庄重书面化，篇幅是否有充分论证；
    2. 意见型讲话稿——用于一般工作会议或座谈会，是否语言通俗口语化，结构是否较灵活；
    3. 礼仪型讲话稿——用于剪彩/开幕式/欢迎会等礼仪活动，是否有祝贺性内容，
       语言是否热烈，是否适当运用感情色彩词汇。
    不得将不同类型的讲稿写作要求混用。
  applicable_types: ["讲话"]
  importance: B
  source: 王群《公文写作大手笔》Ch.34
  usage: rule_engine

- id: WQ_SP_003
  type: SP
  title: 公文层次横纵两式（条款/总分/递进/因果/时序）
  rule_type: LOGIC
  execution: agent_prompt
  content: |
    检查公文段落层次的组合方式是否合理：
    横式结构：
      - 条款式——各层次是否平行互补，犹如多枝鲜花集成一束；法规类公文是否使用；
      - 总分式——是否有总写和分写两部分，分写各层次是否并列（可互换顺序）；
    纵式结构：
      - 递进式——各层次是否环环相扣逐层深入，顺序是否不可调换；
      - 因果式——层次是否由原因与结果构成，是否由因到果或由果溯因；
      - 时序式——是否按事情发生的时间先后安排。
    必须检查：同一层级是否存在横式与纵式混用的情况，若有则须修改。
  applicable_types: ["汇报", "报告", "讲话", "方案"]
  importance: B
  source: 王群《公文写作大手笔》Ch.16
  usage: rule_engine
