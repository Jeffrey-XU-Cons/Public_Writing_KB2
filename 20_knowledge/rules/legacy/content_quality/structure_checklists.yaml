# 四文种结构完整性检查清单
# 说明：根据公文写作规范直接生成，覆盖6个核心场景
# 生成日期：2026-03-15

meta:
  version: "1.0"
  total_scenarios: 6
  source: "公文写作规范 + AI写材料手册实践经验"

structure_checklists:

  # ===== 场景1：汇报 =====

  - doc_type: "汇报"
    scenario: "工作汇报（向上级或领导口头/书面通报工作进展）"
    required_sections:
      - name: "开头：说明汇报目的和背景"
        required: true
        check_question: "开头是否清晰说明了本次汇报的目的、背景或会议场合？"
        notes: "可以是会议主题引入、工作背景铺垫，或领导关注事项引入"

      - name: "主要工作/做法"
        required: true
        check_question: "是否按条目或分类列出了主要工作内容或具体做法？"
        notes: "一般分2-4个方面，每个方面有具体举措，避免笼统"

      - name: "成效或进展说明"
        required: true
        check_question: "是否说明了工作的主要成效、进展情况或阶段性成果？"
        notes: "成效表述须有数据或具体事例支撑，避免空泛表述"

      - name: "存在问题或困难"
        required: false
        check_question: "是否如实反映了当前存在的主要问题或困难（如有）？"
        notes: "不强制，视汇报性质而定；若有重大问题必须如实汇报"

      - name: "下步打算"
        required: true
        check_question: "是否提出了具体可操作的下一步工作安排？"
        notes: "下步打算须具体（责任人、时间节点、目标），不能只写'继续努力'"

    forbidden_elements:
      - "不得出现'请批示''请审批''请给予支持''请拨付'等请示性语言"
      - "不得出现代替领导做决策的表述"
      - "不得出现超出本单位职权范围的承诺"
      - "汇报与报告有区别：汇报侧重进展通报，正式报告侧重分析总结"

    closing_formula: "以上汇报，请审阅。"
    notes: |
      汇报（口头或书面通报）与正式报告不同：
      汇报语气更直接、结构可以简洁；
      正式报告需要更完整的分析论证。

  # ===== 场景2：报告（调研报告） =====

  - doc_type: "调研报告"
    scenario: "专题调研报告（就某一问题开展调查研究后形成的分析性报告）"
    required_sections:
      - name: "调研背景与目的"
        required: true
        check_question: "是否说明了开展调研的背景、目的和调研方式？"
        notes: "简要说明调研时间、范围、方式（座谈/问卷/实地走访等）"

      - name: "基本情况"
        required: true
        check_question: "是否客观描述了调研对象的基本情况？"
        notes: "用数据和事实说话，描述现状，不加主观评价"

      - name: "主要做法与成效"
        required: true
        check_question: "是否梳理了调研对象的主要做法和取得的成效？"
        notes: "总结经验和亮点，须有具体案例支撑，不能空泛"

      - name: "存在问题及原因分析"
        required: true
        check_question: "是否深入分析了存在的主要问题及其深层原因？"
        notes: "问题分析须透彻：从现象到本质，从表层到深层；不回避矛盾"

      - name: "对策建议"
        required: true
        check_question: "是否提出了有针对性、可操作的对策建议？"
        notes: "建议须具体可行，针对问题而来，有操作路径"

    forbidden_elements:
      - "不得出现'请批示''请审批'等请示性结语"
      - "不得出现无事实支撑的主观判断"
      - "不得将调研发现说成'问题全面解决'（回避矛盾）"
      - "对策建议不得过于笼统，不能只写'加强管理''提高重视'"

    closing_formula: "以上调研报告，供参考。"
    notes: |
      调研报告最重要的是客观中立：
      既要记录成绩，更要揭示问题；
      问题分析要透彻，不能走过场；
      建议要有针对性，不能千篇一律。

  # ===== 场景3：报告（工作报告） =====

  - doc_type: "工作报告"
    scenario: "工作报告（向上级汇报一定时期内工作完成情况的综合性报告）"
    required_sections:
      - name: "工作概况/总体情况"
        required: true
        check_question: "是否有1-2句话概括了本期工作的总体情况？"
        notes: "总括句要有概括性，能反映工作的整体面貌和主要特点"

      - name: "主要工作成效（分类展示）"
        required: true
        check_question: "是否按类别（或工作重点）分项展示了主要工作成效？"
        notes: "一般分3-5个方面，每个方面有具体数据或案例支撑，突出亮点"

      - name: "特色做法或创新经验"
        required: false
        check_question: "是否提炼了本期工作中的特色做法或创新之处？"
        notes: "年度总结类工作报告宜包含，日常工作报告可省略"

      - name: "存在的主要问题"
        required: true
        check_question: "是否实事求是地反映了当前工作中存在的主要问题？"
        notes: "不能避重就轻，要有针对本期工作的具体问题，不能流于形式"

      - name: "下步工作打算"
        required: true
        check_question: "是否提出了下一阶段工作的明确目标和具体措施？"
        notes: "下步打算须可量化、可检验，有时间节点和责任分工"

    forbidden_elements:
      - "不得出现'请批示''请审批''请拨付专项资金'等请示事项"
      - "不得将下步打算写成空洞表态（'继续努力''不断提升'）"
      - "不得在成效部分刻意回避问题（成效占比不宜超过全文60%）"
      - "不得未经核实使用模糊数据（'显著提升'无具体数字）"

    closing_formula: "以上报告，请审阅。"
    notes: |
      工作报告与调研报告的核心区别：
      工作报告侧重回顾工作过程和成效；
      调研报告侧重对某一问题的深入分析；
      两者均不得夹带请示事项。

  # ===== 场景4：讲话（工作会议讲话） =====

  - doc_type: "工作会议讲话"
    scenario: "工作会议讲话（在年度/季度/专项工作会议上的领导讲话）"
    required_sections:
      - name: "开场：点明会议目的与定调"
        required: true
        check_question: "开场是否说明了召开本次会议的目的？是否对工作整体定调？"
        notes: "交代背景、说明意义、提振信心，100-200字为宜，不宜过长"

      - name: "工作回顾：肯定成绩、分析形势"
        required: true
        check_question: "是否对过去一段时间的工作进行了客观评价？"
        notes: "肯定成绩要有具体亮点，分析形势要结合上级要求和当前实际"

      - name: "存在问题：保持清醒"
        required: false
        check_question: "是否指出了当前工作中存在的主要问题（如有）？"
        notes: "全面部署会议宜包含，表彰类会议可省略"

      - name: "工作部署：明确重点任务（分项）"
        required: true
        check_question: "是否按条目明确了下阶段的重点工作任务？"
        notes: "一般3-5项，每项有具体要求和工作目标，不能只说方向不说措施"

      - name: "要求与号召"
        required: true
        check_question: "结尾是否提出了具体要求、压实了责任并发出号召？"
        notes: "要有落实工作的具体要求（纪律、时限、保障等），不能只是口号"

    forbidden_elements:
      - "不得出现'请批示''请审批'等请示性语言"
      - "不得只讲方向不讲措施，只提要求不明责任主体"
      - "不得堆砌四字格套话而无实质内容（'高度重视、扎实推进、确保实效'）"
      - "不得将讲话写成单纯的工作汇报（讲话须有指导性和布置性）"

    closing_formula: "谢谢大家！"
    notes: |
      工作会议讲话三要素：高度（政治站位）+深度（分析到位）+力度（要求明确）。
      各部分比例参考：开场5-10%，工作回顾15-20%，
      问题分析10-15%，工作部署45-50%，要求号召10-15%。

  # ===== 场景5：讲话（动员/表彰讲话） =====

  - doc_type: "动员/表彰讲话"
    scenario: "动员或表彰类讲话（在重大任务部署会、先进表彰会、开学/开工动员会等场合）"
    required_sections:
      - name: "开场：烘托氛围、点明场合"
        required: true
        check_question: "开场是否营造了会议氛围？是否点明了本次会议的特殊意义？"
        notes: "动员类须营造紧迫感；表彰类须营造荣誉感；120字以内"

      - name: "充分肯定成绩（表彰类必须）"
        required: false
        check_question: "表彰类讲话是否充分肯定了受表彰对象的贡献？"
        notes: "须有具体事迹或数据支撑，不能只是笼统夸奖"

      - name: "阐明意义：说明任务的重要性（动员类）"
        required: true
        check_question: "动员类讲话是否深入阐明了即将开展任务的重要性和紧迫性？"
        notes: "从战略高度说明为什么要做，激发参与积极性"

      - name: "传达要求：提出具体要求"
        required: true
        check_question: "是否提出了具体的工作要求或行动指引？"
        notes: "要求须明确可操作，不能只是口号"

      - name: "情感收束：激励号召"
        required: true
        check_question: "结尾是否有感情充沛的号召，形成情感共鸣？"
        notes: "表彰类须让受表彰者感受荣誉；动员类须让参会者感受使命感"

    forbidden_elements:
      - "不得出现冗长的数据堆砌（表彰讲话重情感，非数据报告）"
      - "不得出现过于官方化的'官样文章'，缺乏人情味"
      - "动员讲话不得缺少紧迫感（无法激发行动意愿）"
      - "表彰讲话不得只提名字不讲贡献（无法体现荣誉感）"

    closing_formula: "谢谢大家！（或：向先进个人和单位致敬！）"
    notes: |
      动员讲话三要素：为什么做（重要性）+怎么做（具体部署）+做不好怎样（约束）。
      表彰讲话三要素：表彰肯定（充分）+总结经验（到位）+鼓励号召（有力）。

  # ===== 场景6：方案（实施方案/工作方案） =====

  - doc_type: "实施方案/工作方案"
    scenario: "实施方案或工作方案（就某项工作或任务进行系统谋划和部署的方案性文件）"
    required_sections:
      - name: "工作背景/总体要求（含目的意义）"
        required: true
        check_question: "是否说明了制定方案的背景、依据和总体目标？"
        notes: "引用上级文件依据、说明工作目标；不宜过长，200字以内"

      - name: "工作目标（含量化指标）"
        required: true
        check_question: "是否设定了明确的工作目标，包括定量指标？"
        notes: "目标须可量化（如'年底前完成X项任务''覆盖率达到XX%'）"

      - name: "主要任务/工作措施（分条列项）"
        required: true
        check_question: "是否按条目列出了具体的工作任务和落实措施？"
        notes: "每条任务有责任单位、时间节点、量化要求，具体可操作"

      - name: "组织领导/职责分工"
        required: true
        check_question: "是否明确了方案的组织架构和各单位的职责分工？"
        notes: "须明确牵头单位、配合单位和各自的具体职责"

      - name: "实施步骤/时间节点"
        required: true
        check_question: "是否将工作任务分阶段，明确了每阶段的时间节点和要求？"
        notes: "一般分启动、推进、总结三个阶段，每阶段有明确节点"

      - name: "保障措施"
        required: true
        check_question: "是否从资金、人员、制度等方面提出了保障措施？"
        notes: "保障措施须切实可行，不能只是'加强领导''强化保障'等套话"

    forbidden_elements:
      - "不得缺少量化目标（只有定性目标没有定量指标）"
      - "不得缺少责任分工（有任务无主体）"
      - "不得缺少时间节点（只有任务没有时限）"
      - "保障措施不得全部是套话（'高度重视''加强协调'等）"
      - "不得将指导意见写成实施方案（方案须有可操作的步骤）"

    closing_formula: "（方案一般无固定结尾语，以正文最后一项要求结束）"
    notes: |
      方案六要素：目的/背景、目标指标、工作任务、职责分工、时间节点、保障措施。
      缺少任何一项均需补充完善。
      方案最大的问题是"假大空"：有目标无指标，有任务无主体，有要求无节点。
