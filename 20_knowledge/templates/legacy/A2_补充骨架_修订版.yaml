# A2 补充骨架 - 工作会议讲话 + 工作报告
# 版本：v1.0
# 创建日期：2026-03-29
# 配合文件：A2_审核草稿_11种文体骨架.yaml（其中已含工作汇报、专题汇报、经验材料、工作计划、实施方案、管理制度、会议纪要 7 种）
# 本文件补齐：工作会议讲话、工作报告 2 种
# 引用依据：
#   - skills/skill_framework.md「二、不同文种的框架模板」中「工作会议讲话框架（三段式）」「工作报告框架」
#   - 实战范文：现场会讲话/2018 行业 企管会 领导讲话；工作总结/2020年全市烟草工作报告（付生华）
#   - 烟草行业讲话稿与工作报告高频结构特征

---
doc_type: "工作会议讲话"
usage_scene: "公司/中心/部门主要负责同志在年度工作会、专项工作推进会、半年度总结会等大型会议上发表的主旨讲话，承担总结成绩、分析形势、部署任务三重功能。区别于工作报告：讲话稿主体是领导个人发声、议程结构（'我讲三点意见'），更口语化、有现场感；工作报告主体是单位党委/班子的正式书面成果。"
word_count_range: "3000-8000"
structure_skeleton:
  - section: "标题（含主标题、副标题、时间、署名）"
    required: true
    rule: "主标题用'动词+工作领域+目标定性'格式（如'全面加强精益管理 助推行业高质量发展'），不超过22字；副标题写明会议名称（'——在XXXX年XX工作会议上的讲话'）；下方空一行后注明日期和讲话人。禁止以名词短语作主标题。"
  - section: "开场议程说明"
    required: true
    rule: "开篇说明会议任务（'这次会议的主要任务是……'），简述上半场或前序议程（'刚才，XX同志传达了……'），最后引出本次讲话议程（'下面，围绕XX工作，我讲X点意见'）；总长不超过200字。禁止以背景介绍开篇。"
  - section: "第一部分：工作总体情况（成绩+问题）"
    required: true
    rule: "一级标题用'年份+工作领域+总体情况'格式（如'2018年行业精益管理工作的总体情况'）。先一段总体定性（含核心数据），再分3-6个并列条目展开成效（每条用'（一）促进了……'或'（一）坚持……，有力推动……'格式领起，含具体数据），最后用一段过渡句承接到不足（'在充分肯定成绩的同时，我们也清醒地认识到……'），列举1-3项主要问题，不展开分析。"
  - section: "第二部分：典型经验或形势认识"
    required: true
    rule: "一级标题用'深入总结/深入认识+主题'格式（典型经验类）或'准确把握形势/深刻认识意义+主题'格式（形势分析类）。典型经验类按'主单位经验+若干配套单位简述+经验启示'结构展开；形势分析类按'上级精神→行业形势→本单位现状'层层递进。每个分论点须有具体事例或数据支撑。"
  - section: "第三部分：下一阶段工作安排"
    required: true
    rule: "一级标题用'年份+工作领域+总体要求'格式（如'2019年行业精益管理的工作安排'）。开篇用一段说明指导思想和总体要求（含1-2句上级精神引用 + 量化目标 + 工作主线），随后按'（一）/（二）/（三）'分3-6项重点工作，每项以'动词+工作方向+成效判断'领起，正文用'一要/二要/三要'或'第一/第二/第三'分述，每项含具体举措、责任主体、时间节点或量化目标。"
  - section: "结尾动员段"
    required: false
    rule: "如需鼓动性收尾，用150-250字独立段落，须呼应开场主题词，避免通用号召语（'让我们携手共进''开拓创新'等）。简短讲话可省略，由第三部分末尾的部署语自然收尾。"
constraints:
  - "全文主语视角必须是'我'或'我们'（领导个人或班子立场），不得使用'各部门要''各单位必须'等指令性第三人称视角作为主体语态——这是讲话稿与下行文通知的关键区别。"
  - "讲话稿须保留'现场感'语言特征：可使用'同志们''刚才''今天''下面'等提顿词；不得改写为完全书面化的报告体。"
  - "每个分板块（第一部分的（一）（二）（三），第三部分的（一）（二）（三））之间不得论点重复——成效条目用'六个促进/六个突出'等并列动名词领起，部署条目用'坚持/突出/聚焦+不同重点'领起，避免出现两条都讲'加强管理'。"
  - "数据须有对比基准（同比/环比/超额完成目标/在全行业排名）；不得使用'大幅提升''显著改善'等无数字的程度副词。"
  - "引用上级精神时严格遵守烟草行业政治表述顺序：习近平新时代中国特色社会主义思想 → 党的XX大精神 → 中央经济工作会议 → 全国烟草工作会议 → 省委省政府要求 → 国家局党组部署，不得倒置。"
  - "下一阶段工作部署的每一项重点工作，必须同时包含'做什么（措施）'和'做到什么程度（量化目标或时间节点）'，纯方向性表述（'进一步加强''继续深化'）须替换为可验证表述。"
  - "禁用：'拨冗莅临''诚意所在''深度参与'等文艺化表述；'用一句话概括''简而言之'等引导语；'这正是……的根本原因'类总结句。"
quality_checklist:
  - "检查第一部分的分板块条目数是否与开篇定性句的数字一致（如开篇说'主要成效体现在六个促进'，下面必须有6个'（一）促进了……'）。"
  - "检查第三部分每项重点工作是否含量化目标或时间节点；纯定性表述（如'要进一步加强党的建设'）须补充'到XXXX年实现XX指标'类落点。"
  - "检查全文是否每段都有'本单位/本系统的不可替换信息'（如具体单位名+具体做法+具体数字）——通过'可移植性测试'：若把单位名和数字换成任意其他单位仍然成立，则该段为套话，须重写。"
  - "检查标题与正文首句的呼应关系：每个一级/二级标题的核心词，必须出现在其下正文的首句中。"
  - "检查篇幅分配：第一部分（成绩+问题）占40%-50%，第二部分（经验/形势）占15%-25%，第三部分（部署）占30%-40%；问题段不得超过第一部分篇幅的15%。"

---
doc_type: "工作报告"
usage_scene: "单位党委/班子在年度工作会、职代会等正式会议上提交的书面工作报告，承担向上级党组、向干部职工系统报告年度工作完成情况、提出下年度工作部署的功能。区别于工作会议讲话：工作报告是单位整体意志的书面成果，第一段会明确写'我代表XX党委作工作报告'，主体语态客观陈述，不含讲话稿式的现场互动语言。"
word_count_range: "4000-10000"
structure_skeleton:
  - section: "标题（含主标题、副标题、时间、署名）"
    required: true
    rule: "上方可有'保密提示'等会务提示行；主标题可分上下两行（上行写工作主题定性如'坚持发展新定位 厚植发展新优势'，下行写动员性结语如'全力以赴开创全市烟草高质量发展新局面'），总字数不超过35字；副标题为'——在XXXX年XX工作会议上的报告'；下方注明日期和报告人。"
  - section: "称谓与议程说明"
    required: true
    rule: "首行称谓'同志们：'；首段说明会议任务（含指导思想引用：'以习近平新时代中国特色社会主义思想为指导，深入学习贯彻……'），简述前序议程，最后用'下面，我代表XX党委（党组）作工作报告'引出主体。总长200-300字。"
  - section: "第一部分：上一年度工作回顾"
    required: true
    rule: "一级标题用'判断短语+主题陈述'格式（如'苦干实干、狠抓落实，2019年工作有力有效'），不得用'一、工作回顾'这类纯名词标题。开篇一段总体定性（含3-5个核心经济指标：营业收入/税利/上缴税收等，须有同比对比），随后用'回顾一年来的工作，主要呈现以下几个特点：'引出4-8个分板块，每个板块以'（一）+判断短语+工作领域+成效定性'领起，板块内用'一是/二是/三是/四是'分3-5条具体成效（每条含数据）。最后一段过渡到问题部分（'在肯定成绩的同时……'），列举3-5项突出问题。"
  - section: "第二部分：形势分析与战略定位"
    required: true
    rule: "一级标题用'判断短语+战略主题'格式（如'凝心聚智、善作善成，全面厚植高质量发展新优势'）。先一段总体形势判断（须引用上级最新精神 + 本单位面临的具体挑战），随后用'（一）必须始终坚持XX'格式列3-6项必须坚持的战略原则或工作方针，每项内部用'一要/二要/三要'分述。本部分不展开具体年度任务，重在'立意+定调'。"
  - section: "第三部分：本年度工作部署"
    required: true
    rule: "一级标题用'判断短语+年份+工作目标'格式（如'锐意进取、全力以赴，扎实推动2020年工作实现新发展'）。开篇用一段说明指导思想、总体要求和工作主线，紧接着用一段列明本年度'主要预期指标'（核心经济指标 + 业务指标，含具体数字），随后用'（一）聚焦XX、XX、XX，全力以赴推动XX取得新XX'格式列3-8项重点工作，每项内部用'一要/二要/三要'分3-4条具体举措，每条含措施+时间节点+量化目标。"
  - section: "结尾动员段"
    required: false
    rule: "如需，可在第三部分后追加一段150-300字的整体动员段，须呼应主标题，避免通用号召。多数工作报告由第三部分末项部署自然收尾，可不单独列结尾段。"
constraints:
  - "称谓必须是'同志们：'，不得使用'各位领导、各位同事'等通用问候——工作报告是党委/班子对内的正式陈述，称谓有规范要求。"
  - "第一段必须包含'以XXX为指导'的指导思想引用，且引用顺序严格遵守：习近平新时代中国特色社会主义思想 → 党的XX大及全会精神 → 全国烟草工作会议 → 全省（区/市）烟草工作会议 → 本单位上年度部署，不得倒置。"
  - "第一部分回顾必须以'总体定性句+核心指标数据'开篇，禁止以'XXXX年以来，我们……'类背景铺垫开篇；核心指标须含至少3项可量化数据。"
  - "各分板块小标题须用'判断短语+工作领域+成效定性'结构（如'强基础、固根本，党的建设坚强有力'），三段动宾结构对仗，禁止用'党建工作''烟叶工作'等纯名词短语。"
  - "本年度工作部署的每一项'聚焦XX、XX、XX'句中，三个聚焦点必须是同层级的关注维度（如'政治性、组织力、融合度'是党建工作的三个维度），不得出现'党建、烟叶、安全'这类跨业务并列。"
  - "数据规则：报告中每一处数据须有对比基准；重要指标须含全省/全行业排名或行业平均值对比；不得使用'实现了较大增长'这类无数字表述。"
  - "问题部分须客观直陈（'高质量发展的危机感、使命感和责任感不够强'）；不得用'下一步我们要努力'等模糊收束，也不得用'仅供领导参考'等不当语态。"
  - "禁用：'年年讲、月月提、天天抓'类年度套话；'高度重视、层层落实'等可移植套话；'极个别同志'等回避性措辞；'打好攻坚战'若无对应具体战役则须删除。"
quality_checklist:
  - "检查第一部分各分板块（一）（二）……的数量是否与开篇'主要呈现以下X个特点'声明的数字一致；不一致则修正声明数字或补齐分板块。"
  - "检查每个分板块的'一是/二是/三是'条目是否都含本年度具体数据；纯回顾性表述（如'继续巩固了党建工作基础'）须补充对应数据或删除。"
  - "检查第二部分的'必须始终坚持'各项是否真正属于战略层面的方针（不是具体任务）；若某项含具体年度量化目标，应移入第三部分。"
  - "检查第三部分'聚焦XX、XX、XX'结构中，三个聚焦点是否同层级、不重叠、能覆盖该板块工作的核心维度。"
  - "检查全文核心指标的统计口径前后一致——开篇主要指标与各分板块内提到的同一指标，数字、时间范围、口径范围必须完全相同。"
  - "检查篇幅分配：第一部分（回顾）占35%-50%，第二部分（形势定位）占15%-20%，第三部分（年度部署）占35%-45%；问题段占第一部分篇幅的5%-15%。"
  - "检查标题层级一致性：全文一级标题为'一、二、三、'，二级标题为'（一）（二）（三）'，三级标题为'一是二是三是'或'1.2.3.'，不得跨级或混用。"
  - "检查第二部分的'必须始终坚持'与第三部分的'聚焦'之间的对应关系——第二部分提出的战略原则，是否在第三部分的年度部署中都有相应的落地举措。"
