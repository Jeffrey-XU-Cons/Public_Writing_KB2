# 烟草行业十五五规划术语库
# 说明：覆盖国家"十五五"规划政策关键词和行业"十五五"规划核心术语
# 规划周期：2026-2030年
# 生成日期：2026-03-15
# 条目数：88条（TT-P15-001 ~ TT-P15-088）

meta:
  version: '"1.0"'
  category: p15_term
  total_entries: 88
  plan_period: '"2026-2030"'
  domains:
    - name: "国家十五五规划核心概念"
      id_range: '"TT-P15-001 ~ TT-P15-042"'
      count: 42
    - name: "行业十五五规划核心术语"
      id_range: '"TT-P15-043 ~ TT-P15-088"'
      count: 46
  format_note: '"每条含 id/category/domain/term/definition/context/example/policy_source/notes 字段"'
  background: |
    国家"十五五"规划（第十五个五年规划）覆盖2026-2030年，是中国基本实现
    社会主义现代化目标的关键五年。行业须将"十五五"规划与国家规划高度对接，
    在材料写作中准确使用规划语言和政策表述。

# ===== 国家十五五规划核心概念 =====

p15_terms:

  - id: TT-P15-001
    category: p15_term
    domain: 国家十五五规划
    term: 新质生产力
    definition: 以科技创新为主导，以数字化、智能化、绿色化为特征，代表先进生产力发展方向的生产力新形态，是高质量发展的核心驱动力。
    context: '习近平2023年提出的重大理论创新，"十五五"时期培育新质生产力是经济工作的重大战略任务。'
    example: '"加快培育行业新质生产力，以科技创新推动烟草制造业高端化智能化绿色化转型"'
    policy_source: 习近平关于新质生产力的重要论述（2023年）
    notes: '新质生产力是"十五五"材料写作中频率最高的核心词之一，须准确理解其内涵'

  - id: TT-P15-002
    category: p15_term
    domain: 国家十五五规划
    term: 科技自立自强
    definition: 将核心关键技术掌握在自己手中，不依赖外部技术封锁和出口管制，建设具有全球竞争力的自主科技创新体系的战略目标。
    context: '应对中美科技竞争背景下，国家科技战略的核心表述，"十五五"时期攻关任务极为紧迫。'
    example: '"坚持科技自立自强，持续攻关行业关键核心技术，摆脱卡脖子技术制约"'
    policy_source: '党的二十大报告及"十五五"规划科技战略'
    notes: '表述须与"自主创新""核心技术"等词配套使用，强调自主性'

  - id: TT-P15-003
    category: p15_term
    domain: 国家十五五规划
    term: 现代化产业体系
    definition: 以实体经济为根基，以先进制造业为主体，现代服务业和现代农业协同支撑，各产业深度融合的高质量产业体系。
    context: '"十五五"时期产业发展的整体目标框架。'
    example: '"推动烟草产业融入现代化产业体系建设，加快实现产业高端化转型"'
    policy_source: 党的二十大报告
    notes: 在行业语境中，现代化产业体系强调全产业链的现代化升级

  - id: TT-P15-004
    category: p15_term
    domain: 国家十五五规划
    term: 新型工业化
    definition: 以信息化、数字化、智能化深度赋能制造业为核心特征，追求质量效益、科技含量、可持续发展的工业发展新模式。
    context: '"十五五"时期制造业转型的核心政策框架，行业须全面推进新型工业化。'
    example: '"全面推进新型工业化，加快卷烟制造业向高端化、智能化、绿色化升级"'
    policy_source: 党的二十大报告
    notes: '"新型工业化"已替代"信息化带动工业化"，成为制造业转型的核心政策语言'

  - id: TT-P15-005
    category: p15_term
    domain: 国家十五五规划
    term: 数字中国
    definition: 以数字技术全面赋能国家治理体系现代化、经济社会发展和人民生活品质提升的国家战略，核心是推进数字基础设施建设和数字经济发展。
    context: '"十五五"时期国家信息化战略的顶层表述，行业须对接数字中国建设要求。'
    example: '"主动融入数字中国建设，推动行业数字化转型迈上新台阶"'
    policy_source: 习近平关于网络强国、数字中国的重要论述
    notes: 数字中国是数字化转型的政治定性，须在战略性叙述中引用

  - id: TT-P15-006
    category: p15_term
    domain: 国家十五五规划
    term: 人工智能
    abbreviation: AI
    definition: '模拟人类思维和学习能力的计算机技术，包括机器学习、深度学习、自然语言处理等，是"十五五"时期产业变革的核心技术驱动力。'
    context: 行业在制造、物流、营销等领域推进AI应用的重要方向。
    example: '"积极推进人工智能技术在烟草制造质量检测和营销分析中的规模化应用"'
    policy_source: 国家人工智能发展规划
    notes: AI应用须结合行业具体场景，不能停留于概念表述

  - id: TT-P15-007
    category: p15_term
    domain: 国家十五五规划
    term: 数据要素
    definition: 数据作为新型生产要素，通过数据确权、流通交易、价值挖掘，推动数字经济发展和企业数字化转型的政策框架。
    context: '"十五五"时期经济体制改革的重要组成部分，行业须推进数据资产化。'
    example: '"深化数据要素在行业管理中的应用，以数据驱动实现精准化管理和科学决策"'
    policy_source: 中共中央、国务院《关于构建数据基础制度更好发挥数据要素作用的意见》（2022年）
    notes: 数据要素须在数据安全和合规框架内开发利用

  - id: TT-P15-008
    category: p15_term
    domain: 国家十五五规划
    term: 绿色低碳发展
    definition: 将绿色低碳作为经济发展的内生特征，通过能源结构调整、产业升级和碳市场建设，实现经济发展与碳排放脱钩的发展模式。
    context: '双碳政策目标下"十五五"时期经济转型的核心导向。'
    example: '"全面贯彻绿色低碳发展理念，制定行业碳达峰路线图，持续降低行业碳排放强度"'
    policy_source: '国家双碳政策及"十五五"规划绿色发展目标'
    notes: 绿色低碳须与具体的量化减排目标相结合

  - id: TT-P15-009
    category: p15_term
    domain: 国家十五五规划
    term: 乡村全面振兴
    definition: 在脱贫攻坚成果基础上，推动乡村产业、人才、文化、生态、组织全面振兴，实现农业农村现代化的国家战略。
    context: 行业烟叶基地建设和烟农增收工作的政策依托。
    example: '"深化行业服务乡村全面振兴工作，持续提升烟农生产效益和生活水平"'
    policy_source: 党的二十大报告及中央一号文件
    notes: '"乡村全面振兴"已替代"脱贫攻坚"成为三农政策核心语汇'

  - id: TT-P15-010
    category: p15_term
    domain: 国家十五五规划
    term: 统筹发展与安全
    definition: 将发展与安全作为同等重要的国家治理目标，在追求高质量发展的同时，切实维护国家安全（政治、经济、信息、供应链等领域安全）。
    context: '"十五五"时期国家治理的基本方略，行业须将安全发展放在突出位置。'
    example: '"牢固树立统筹发展与安全理念，切实维护行业税利增长和专卖制度的整体安全"'
    policy_source: '习近平总体国家安全观及"十五五"规划'
    notes: '"统筹发展与安全"是重要的政治语言，须准确把握其使用场景'

  - id: TT-P15-011
    category: p15_term
    domain: 国家十五五规划
    term: 产业链供应链韧性
    definition: '产业链和供应链在面对外部冲击（贸易制裁、自然灾害、疫情等）时保持稳定运转和快速恢复的能力，是"十五五"产业政策的核心目标之一。'
    context: 应对复杂国际形势，维护产业安全的重要政策概念。
    example: '"加强行业产业链供应链韧性建设，提升关键原辅材料国产化保障能力"'
    policy_source: 党的二十大报告及工业发展政策
    notes: 供应链韧性在烟草行业主要体现在烟叶原料和关键设备的自主保障能力

  - id: TT-P15-012
    category: p15_term
    domain: 国家十五五规划
    term: 全国统一大市场
    definition: 推动建立规则统一、竞争有序、监管高效的全国性统一大市场，消除地方保护和市场分割，促进商品要素资源在全国畅通流通。
    context: 行业打破地方保护、维护市场统一秩序的政策依据。
    example: '"以全国统一大市场建设为契机，进一步破除行业内地方保护壁垒"'
    policy_source: 中共中央、国务院《关于加快建设全国统一大市场的意见》（2022年）
    notes: 全国统一大市场对烟草行业既是外部要求，也是行业自身治理需求

  - id: TT-P15-013
    category: p15_term
    domain: 国家十五五规划
    term: 战略性新兴产业
    definition: 以重大技术突破和重大发展需求为基础，对经济社会未来发展具有重大引领带动作用的产业，包括新能源、新材料、生物技术、新一代信息技术等。
    context: 行业在新型烟草领域布局的政策框架依托。
    example: '"加强与战略性新兴产业的技术合作，为新型烟草制品研发引入更多前沿技术要素"'
    policy_source: 国家战略性新兴产业相关政策
    notes: 烟草行业可借助与新兴产业的交叉创新，加快技术升级

  - id: TT-P15-014
    category: p15_term
    domain: 国家十五五规划
    term: 未来产业
    definition: 由前沿技术驱动、尚处于孕育期或初步形成期、代表未来10-20年产业发展方向的新兴产业，如量子信息、脑科学、6G等。
    context: 行业技术创新前瞻布局的宏观政策背景。
    example: '"关注未来产业技术发展趋势，提前布局与烟草科技创新的交叉融合领域"'
    policy_source: '"十五五"规划前瞻性产业政策'
    notes: 未来产业对烟草行业的直接影响主要在材料科学、人工智能等交叉领域

  - id: TT-P15-015
    category: p15_term
    domain: 国家十五五规划
    term: 教育强国
    definition: 到2035年将中国建成教育强国的战略目标，以高质量教育培养高素质人才，为现代化建设提供人才支撑。
    context: 行业人才强企战略的上位政策背景。
    example: '"响应教育强国战略，加强产学研合作，培养烟草行业急需的高端技术人才"'
    policy_source: 习近平关于教育强国的重要论述
    notes: 教育强国为行业引才育才提供了更好的外部环境

  - id: TT-P15-016
    category: p15_term
    domain: 国家十五五规划
    term: 人才强国
    definition: 将人才作为第一资源，推动人才规模、质量、结构与实现社会主义现代化相适应的国家战略。
    context: 行业人才强企战略直接对接的国家战略框架。
    example: '"全面落实人才强国战略，不断强化行业科技人才和高技能人才队伍建设"'
    policy_source: 党的二十大报告
    notes: 人才强国与科技自立自强战略高度关联，须协同表述

  - id: TT-P15-017
    category: p15_term
    domain: 国家十五五规划
    term: 共同富裕
    definition: '全体人民共同参与和共同享有改革发展成果，实现物质精神双重富裕的社会主义本质要求，"十五五"时期须取得实质性进展。'
    context: 行业解决好员工共享发展成果问题的政治导向。
    example: '"将共同富裕理念融入行业发展目标，更好保障员工合法权益和合理收入增长"'
    policy_source: 习近平关于共同富裕的重要论述
    notes: 共同富裕在行业语境中主要体现在员工收益分配和烟农增收两个维度

  - id: TT-P15-018
    category: p15_term
    domain: 国家十五五规划
    term: 中国式现代化
    definition: 人口规模巨大、全体人民共同富裕、物质文明与精神文明相协调、人与自然和谐共生、走和平发展道路的现代化道路。
    context: '"十五五"时期各行各业的总体政治坐标，须在规划导言中引用。'
    example: '"立足中国式现代化建设全局，推动行业在新的历史起点上实现高质量发展"'
    policy_source: 党的二十大报告
    notes: 中国式现代化是新时代最核心的政治语言之一，须高度重视

  - id: TT-P15-019
    category: p15_term
    domain: 国家十五五规划
    term: 高水平对外开放
    definition: 在新的国际形势下推进制度型开放，扩大市场准入，保护知识产权，构建与国际规则接轨的开放型经济体制。
    context: 行业国际化战略和走出去布局的政策框架。
    example: '"在高水平对外开放格局下，加大中国烟草卷烟产品国际市场开拓力度"'
    policy_source: 党的二十大报告
    notes: 高水平对外开放对烟草行业的含义主要是扩大出口和国际技术合作

  - id: TT-P15-020
    category: p15_term
    domain: 国家十五五规划
    term: 基础研究
    definition: 以揭示自然规律、获取新知识为目的，不以特定应用为直接目标的科学研究活动，是科技创新的根本源泉。
    context: 科技自立自强战略的基础性投入领域。
    example: '"加大基础研究投入，深化烟草生物学、化学基础领域的科学研究"'
    policy_source: 国家基础研究政策
    notes: 行业基础研究须与应用研究和产品开发形成清晰的层次结构

  - id: TT-P15-021
    category: p15_term
    domain: 国家十五五规划
    term: 专精特新
    definition: 专业化、精细化、特色化、新颖化的中小企业发展路径和认定标准，代表工业企业高质量发展的重要方向。
    context: 行业供应链企业（如烟机制造、辅材供应）发展的政策导向。
    example: '"支持行业配套企业走专精特新发展道路，提升专业配套能力和技术水平"'
    policy_source: 工信部专精特新政策体系
    notes: 专精特新主要是对中小企业的政策激励，烟草大型企业另有其适用标准

  - id: TT-P15-022
    category: p15_term
    domain: 国家十五五规划
    term: 安全发展
    definition: 将安全生产、食品安全、网络安全、供应链安全等各类安全保障作为发展的前提条件，实现高质量发展与高水平安全良性互动。
    context: '"十五五"时期统筹发展与安全的重要操作层面政策概念。'
    example: '"坚持安全发展理念，将安全生产作为行业发展的底线性要求"'
    policy_source: '国家安全生产政策及"十五五"规划'
    notes: 安全发展须覆盖生产安全、信息安全、市场安全等多个维度

  - id: TT-P15-023
    category: p15_term
    domain: 国家十五五规划
    term: 制造业高质量发展
    definition: 以提升制造业技术含量、品质水平、品牌价值和可持续性为目标，推动中国由制造大国向制造强国转型的战略方向。
    context: 行业工业企业发展的直接政策框架。
    example: '"坚定走制造业高质量发展道路，以高端品牌和智能制造支撑行业持续发展"'
    policy_source: 国家制造业高质量发展政策体系
    notes: 制造业高质量发展须有量化指标体现，如产品品质、品牌价值、研发投入等

  - id: TT-P15-024
    category: p15_term
    domain: 国家十五五规划
    term: 碳达峰碳中和目标
    abbreviation: 双碳目标
    definition: '中国承诺于2030年前实现碳排放达峰、2060年前实现碳中和的气候目标，是"十五五"期间推进碳达峰行动的关键时期。'
    context: 行业绿色低碳战略的硬约束性政策目标。
    example: '"制定行业碳达峰行动方案，确保在2030年前实现行业碳排放达峰"'
    policy_source: '习近平2020年气候雄心峰会及《碳达峰碳中和"1+N"政策体系》'
    notes: '"十五五"时期是碳达峰的关键攻坚期，行业须有具体减碳路径'

  - id: TT-P15-025
    category: p15_term
    domain: 国家十五五规划
    term: 工业互联网
    definition: 以工业设备互联、数据集成分析、平台赋能应用为核心的数字化制造基础设施，是智能制造的重要支撑体系。
    context: 行业智能制造建设的核心技术基础之一。
    example: '"深化工业互联网在烟草制造领域的应用，构建设备互联、数据互通的智慧工厂体系"'
    policy_source: 国家工业互联网发展政策
    notes: 工业互联网须与行业MES系统和企业ERP深度集成

  - id: TT-P15-026
    category: p15_term
    domain: 国家十五五规划
    term: 网络强国
    definition: 以加快建设高速、泛在、安全的网络基础设施和提升网络技术创新能力为核心，全面提升中国网络竞争力的国家战略。
    context: 行业数字化转型和信息安全建设的宏观政策背景。
    example: '"落实网络强国战略要求，切实加强行业信息安全防护能力建设"'
    policy_source: 习近平关于网络强国的重要论述
    notes: 网络强国战略对行业的直接要求是信息安全和数据安全

  - id: TT-P15-027
    category: p15_term
    domain: 国家十五五规划
    term: 国有经济布局优化
    definition: 推动国有资本向重要行业、关键领域和重点基础设施集中，有效发挥国有经济的主导作用的改革方向。
    context: 行业作为重要国有经济领域，须在此框架下定位自身发展。
    example: '"顺应国有经济布局优化方向，持续提升烟草国有资本的质量和效益"'
    policy_source: '国有企业改革三年行动及"十五五"规划'
    notes: 烟草是国有经济重要组成部分，须积极彰显国有经济优势

  - id: TT-P15-028
    category: p15_term
    domain: 国家十五五规划
    term: 扩大内需
    definition: 以扩大居民消费需求和增加有效投资为核心，推动内需持续稳定增长，减少对外需的依赖，构建强大国内市场。
    context: 行业稳定国内卷烟市场的宏观政策背景。
    example: '"立足扩大内需战略，保持国内卷烟市场平稳运行，维护行业税利稳定增长"'
    policy_source: 国家扩大内需战略规划（2022-2035年）
    notes: 扩大内需对烟草行业更多是宏观背景，行业自身须防范市场萎缩风险

  - id: TT-P15-029
    category: p15_term
    domain: 国家十五五规划
    term: 城乡融合发展
    definition: 打破城乡二元结构，推动城乡要素平等交换双向流动，促进城乡基本公共服务均等化的发展目标。
    context: 行业烟叶产区乡村振兴工作的政策背景。
    example: '"深化行业参与城乡融合发展工作，以烟草产业带动烟区乡村经济发展"'
    policy_source: 党的二十大报告
    notes: 城乡融合是行业烟叶基地建设和烟农服务工作的重要政策背景

  - id: TT-P15-030
    category: p15_term
    domain: 国家十五五规划
    term: 深化改革开放
    definition: 在新的历史起点上，围绕体制机制创新和扩大对外开放，推动改革和开放的广度、深度持续扩大。
    context: '"十五五"时期的改革总基调，行业各项改革须在此框架下推进。'
    example: '"坚定不移深化改革开放，推动行业管理体制和运行机制持续创新完善"'
    policy_source: '党的二十大报告及"十五五"规划改革部署'
    notes: 深化改革开放是所有行业五年规划的必须要素

  - id: TT-P15-031
    category: p15_term
    domain: 国家十五五规划
    term: 创新链产业链资金链人才链
    abbreviation: 四链融合
    definition: 推动科技创新链、产业发展链、资金支持链、人才培养链深度融合、协同发展的政策框架，以四链融合推动产业创新效率提升。
    context: '"十五五"时期科技产业政策的重要操作性框架。'
    example: '"推动四链深度融合，以人才和资金双重保障支撑行业科技创新能力建设"'
    policy_source: 习近平关于创新链产业链等四链融合的重要论述
    notes: 四链融合强调的是科技-产业-资金-人才的系统性协同

  - id: TT-P15-032
    category: p15_term
    domain: 国家十五五规划
    term: 新能源
    definition: '以风能、太阳能、氢能等清洁可再生能源为代表的能源新形态，"十五五"时期在工业领域加快推广应用。'
    context: 行业绿色低碳转型的能源结构调整方向。
    example: '"加快推进工厂能源结构调整，逐步提升新能源使用比例，降低化石能源消耗"'
    policy_source: 国家新能源发展规划
    notes: 新能源在烟草行业主要应用于工厂用电和物流配送

  - id: TT-P15-033
    category: p15_term
    domain: 国家十五五规划
    term: 民营经济促进
    definition: 保护和激励民营企业发展、优化营商环境、消除隐性壁垒，推动民营经济健康发展的政策方向。
    context: 烟草行业供应链中民营配套企业的发展政策背景。
    example: '"优化行业采购环境，依法保护民营供应商合法权益，打造公平竞争的采购市场"'
    policy_source: 中共中央、国务院《关于促进民营经济发展壮大的意见》（2023年）
    notes: 烟草核心业务仍是国有经济，但供应链中有大量民营企业需要依法保护

  - id: TT-P15-034
    category: p15_term
    domain: 国家十五五规划
    term: 生物技术
    definition: 以基因工程、蛋白质工程为代表的现代生物技术，在烟草领域可用于烟草品种改良和提取分离生物活性物质。
    context: 行业原料育种和减害研究的前沿技术方向。
    example: '"加强生物技术在烟草育种和原料改良中的应用研究，支撑特色优质烟叶开发"'
    policy_source: 国家生物经济发展规划
    notes: 烟草生物技术研究须遵守基因安全监管法规

  - id: TT-P15-035
    category: p15_term
    domain: 国家十五五规划
    term: 全球治理
    definition: 中国积极参与和推动国际组织、多边机制、国际规则体系建设，在全球事务中发挥更大作用的外交政策方向。
    context: 行业参与国际控烟公约和国际烟草合作的宏观政策背景。
    example: '"积极参与烟草控制国际治理，在FCTC框架下建设性地参与国际规则制定"'
    policy_source: 习近平关于构建人类命运共同体的重要论述
    notes: 全球治理参与对行业意味着在控烟公约和国际标准制定中争取更多话语权

  - id: TT-P15-036
    category: p15_term
    domain: 国家十五五规划
    term: 营商环境优化
    definition: 通过行政审批改革、信用体系建设、法治保障强化，持续降低市场主体制度性交易成本，打造市场化、法治化、国际化营商环境。
    context: 行业专卖行政服务优化和许可证管理改革的政策导向。
    example: '"深化营商环境优化，持续压减许可证办理时限，提升行政服务便利化水平"'
    policy_source: 国务院关于优化营商环境的系列政策
    notes: 营商环境优化是行政体制改革的综合评估维度，须有量化指标体现

  - id: TT-P15-037
    category: p15_term
    domain: 国家十五五规划
    term: 质量强国
    definition: 以提升中国产品和服务质量为核心，推动中国从制造大国向质量强国转变的战略目标。
    context: 行业高品质卷烟品牌建设的政策框架依托。
    example: '"响应质量强国战略，以高品质中国烟草产品彰显中国制造品质形象"'
    policy_source: 《质量强国建设纲要》（2023年）
    notes: 质量强国对行业的要求是持续提升卷烟产品品质和品牌竞争力

  - id: TT-P15-038
    category: p15_term
    domain: 国家十五五规划
    term: 品牌强国
    definition: 培育具有全球竞争力的中国品牌，提升中国品牌的国际知名度和美誉度，推动中国从品牌大国向品牌强国转变。
    context: 行业卷烟品牌国际化战略的政策框架支撑。
    example: '"以品牌强国战略为引领，持续提升重点卷烟品牌的国内外影响力"'
    policy_source: 品牌强国战略相关政策
    notes: 品牌强国战略对行业的含义是培育高价值品牌，降低对低端规模的依赖

  - id: TT-P15-039
    category: p15_term
    domain: 国家十五五规划
    term: 知识产权强国
    definition: 建立健全知识产权创造、保护、运用体系，提升中国知识产权的质量、价值和国际竞争力的国家战略。
    context: 行业技术创新知识产权保护和国际布局的政策背景。
    example: '"落实知识产权强国战略，加大核心技术专利的申请和保护力度"'
    policy_source: 《知识产权强国建设纲要（2021-2035年）》
    notes: 知识产权强国要求行业提升专利质量，推进国际专利布局

  - id: TT-P15-040
    category: p15_term
    domain: 国家十五五规划
    term: 社会主义现代化强国
    definition: '2035年基本实现社会主义现代化、本世纪中叶建成富强民主文明和谐美丽的社会主义现代化强国的"两步走"战略目标。'
    context: '"十五五"规划的最宏观政治坐标，须在规划导言和战略部分引用。'
    example: '"以建设社会主义现代化强国目标为引领，推动行业在新征程上开创高质量发展新局面"'
    policy_source: 党的二十大报告
    notes: 社会主义现代化强国是所有行业五年规划开篇的必须政治语言

  - id: TT-P15-041
    category: p15_term
    domain: 国家十五五规划
    term: 党的二十届三中全会精神
    definition: '党的二十届三中全会（2024年）关于进一步全面深化改革的重要决定和精神，为"十五五"规划制定提供了改革方向指引。'
    context: '"十五五"规划编制的重要政治依据。'
    example: '"深入贯彻党的二十届三中全会精神，以全面深化改革推动行业高质量发展"'
    policy_source: 党的二十届三中全会《关于进一步全面深化改革 推进中国式现代化的决定》
    notes: 引用三中全会精神须与行业具体改革任务紧密结合，不能空泛

  - id: TT-P15-042
    category: p15_term
    domain: 国家十五五规划
    term: 高质量充分就业
    definition: 在保障充分就业数量的同时，提升就业质量（薪酬水平、工作条件、职业发展）的就业政策目标，是共同富裕的重要基础。
    context: 行业在员工队伍建设和人员安置方面的政策导向。
    example: '"切实维护员工就业权益，推动实现员工高质量充分就业和合理收入增长"'
    policy_source: '党的二十大报告及"十五五"就业政策'
    notes: 在企业联合重组等涉及人员调整的工作中，须特别关注充分就业目标

# ===== 行业十五五规划核心术语 =====

  - id: TT-P15-043
    category: p15_term
    domain: 行业十五五规划
    term: 行业高质量发展新阶段
    definition: '烟草行业在"十四五"发展基础上，"十五五"时期进入以质量效益为核心、创新驱动为主导的高质量发展新阶段的战略定位。'
    context: '行业"十五五"规划的总体战略定位。'
    example: '"深刻把握行业高质量发展新阶段的战略机遇，推动行业在更高起点上实现新突破"'
    policy_source: '行业"十五五"规划及工作会议定调'
    notes: '"新阶段"的定性须与"十四五"发展成就和"十五五"面临形势有机衔接'

  - id: TT-P15-044
    category: p15_term
    domain: 行业十五五规划
    term: 做强做优主攻方向
    definition: '"十五五"时期行业发展的核心战略取向，即集中力量提升品牌竞争力、科技实力和管理水平，实现行业从规模扩张向质量提升的根本转变。'
    context: 行业五年规划的核心战略导向表述。
    example: '"坚定不移沿着做强做优主攻方向前进，以高质量发展成效回应国家和社会期待"'
    policy_source: '行业"十四五"规划延续并深化为"十五五"核心导向'
    notes: 做强做优是行业发展理念转变的核心，须贯穿规划各项任务

  - id: TT-P15-045
    category: p15_term
    domain: 行业十五五规划
    term: 税利稳定增长
    definition: '全行业"十五五"时期税利总额保持持续稳定增长的核心目标，是行业对国家财政贡献的量化承诺。'
    context: '行业"十五五"规划的第一目标，具有高度政治重要性。'
    example: '"确保行业税利稳定增长，为国家财政大局稳定贡献行业力量"'
    policy_source: '行业"十五五"规划目标指标'
    notes: 税利目标须结合宏观经济形势和行业发展趋势合理确定，避免虚高

  - id: TT-P15-046
    category: p15_term
    domain: 行业十五五规划
    term: 品牌竞争力跃升
    definition: '"十五五"时期通过品牌整合、品质提升、结构优化，实现重点卷烟品牌市场竞争力显著增强、品牌价值大幅提升的战略目标。'
    context: '行业品牌战略的"十五五"阶段性目标。'
    example: '"推动重点品牌竞争力跃升，力争培育若干具有国际知名度的中国烟草品牌"'
    policy_source: '行业"十五五"规划品牌发展目标'
    notes: 品牌竞争力须有市场份额、品牌价值等量化指标支撑

  - id: TT-P15-047
    category: p15_term
    domain: 行业十五五规划
    term: 科技创新能力大幅提升
    definition: '"十五五"期间通过加大研发投入、完善创新体系、突破关键技术，实现行业整体科技创新实力显著增强的阶段性目标。'
    context: '行业科技强烟战略的"十五五"量化目标。'
    example: '"推动行业科技创新能力大幅提升，研发投入强度和专利质量达到新高度"'
    policy_source: '行业"十五五"规划科技目标'
    notes: 科技创新能力须有研发投入、专利数量、成果转化等量化指标支撑

  - id: TT-P15-048
    category: p15_term
    domain: 行业十五五规划
    term: 数字化转型深度推进
    definition: '"十五五"时期在"十四五"信息化建设基础上，深入推进制造、营销、管理等核心业务领域数字化升级的战略任务。'
    context: 行业管理现代化和提效降本的重要战略举措。
    example: '"深度推进数字化转型，着力破解数据孤岛问题，构建全行业数据共享底座"'
    policy_source: '行业"十五五"规划数字化目标'
    notes: '深度推进须体现出从"建系统"向"用数据"的质的跃升'

  - id: TT-P15-049
    category: p15_term
    domain: 行业十五五规划
    term: 智能制造升级
    definition: '"十五五"期间将行业智能制造推进到更高水平，实现制造过程深度自动化、智能化，达到行业智能制造成熟度更高等级。'
    context: '工业企业制造转型的"十五五"阶段性目标。'
    example: '"加快推进智能制造升级，到十五五末期关键工序自动化率达到XX%以上"'
    policy_source: '行业"十五五"规划制造目标'
    notes: 智能制造升级须与产品品质提升和生产效率提高的结果挂钩

  - id: TT-P15-050
    category: p15_term
    domain: 行业十五五规划
    term: 绿色低碳转型
    definition: '"十五五"期间行业在能源结构、制造工艺、物流方式等方面推进绿色转型，实现碳排放强度持续下降的战略任务。'
    context: '双碳目标下行业"十五五"绿色发展的核心任务。'
    example: '"加快推进行业绿色低碳转型，制定并落实行业碳达峰行动方案"'
    policy_source: '行业"十五五"规划绿色发展目标'
    notes: 须设定量化减碳目标，并分解到各企业和主要业务环节

  - id: TT-P15-051
    category: p15_term
    domain: 行业十五五规划
    term: 国际市场拓展
    definition: '"十五五"期间通过加大中国卷烟出口、提升国际品牌知名度、完善海外营销网络，实现行业国际化水平明显提升的目标。'
    context: '行业走出去战略的"十五五"阶段性目标。'
    example: '"持续推进国际市场拓展，中国卷烟出口量和品牌影响力实现新突破"'
    policy_source: '行业"十五五"规划国际化目标'
    notes: 国际市场拓展须重视合规经营，遵守目的地国家法规

  - id: TT-P15-052
    category: p15_term
    domain: 行业十五五规划
    term: 新型烟草战略布局
    definition: '"十五五"期间加大对电子烟、加热不燃烧烟草等新型烟草制品的研发投入和市场布局，把握新型烟草发展机遇的战略部署。'
    context: 行业应对产品形态变革的主动战略布局。
    example: '"加快新型烟草战略布局，在新型烟草技术和市场领域取得实质性突破"'
    policy_source: '行业"十五五"规划新型烟草目标'
    notes: 新型烟草布局须在现行法规框架内推进，同时关注监管政策走向

  - id: TT-P15-053
    category: p15_term
    domain: 行业十五五规划
    term: 原料战略保障
    definition: '"十五五"期间围绕优质烟叶资源保护、产地基地建设和多元化供应布局，提升行业原料供应安全水平的战略举措。'
    context: 行业供应链韧性建设的重要维度。
    example: '"实施原料战略保障工程，确保重点品牌配方原料长期稳定供应"'
    policy_source: '行业"十五五"规划原料保障目标'
    notes: 原料战略保障须与特色优质烟叶资源保护和现代烟草农业发展相结合

  - id: TT-P15-054
    category: p15_term
    domain: 行业十五五规划
    term: 管理现代化
    definition: '"十五五"期间通过完善管理体系、推进数字化管理工具应用、提升管理成熟度，实现行业管理水平向现代化跃升的战略目标。'
    context: 行业软实力建设和综合竞争力提升的重要方向。
    example: '"深入推进管理现代化，各主要能力域成熟度等级整体提升，达到优化级以上"'
    policy_source: '行业"十五五"规划管理目标'
    notes: 管理现代化须有管理成熟度评价结果等量化指标支撑

  - id: TT-P15-055
    category: p15_term
    domain: 行业十五五规划
    term: 人才强企工程
    definition: '"十五五"期间通过实施高端科技人才引进计划、高技能工匠培育计划、经营管理人才培训计划，打造适应高质量发展需要的人才队伍。'
    context: '行业"十五五"规划人才目标的实施载体。'
    example: '"全面推进人才强企工程，为行业高质量发展提供充足的人才支撑"'
    policy_source: '行业"十五五"规划人才目标'
    notes: 人才强企工程须有具体的人才引进、培养、激励措施

  - id: TT-P15-056
    category: p15_term
    domain: 行业十五五规划
    term: 专卖制度完善
    definition: '"十五五"期间在坚持专卖制度基本框架的前提下，通过行政效率提升、监管方式创新、市场监管数字化等手段，提升专卖制度有效性。'
    context: 行业法制建设和行政管理改革的重要方向。
    example: '"深化专卖制度完善，探索运用大数据技术提升市场监管精准性和效率"'
    policy_source: '行业"十五五"规划法制建设目标'
    notes: 完善专卖制度须在《烟草专卖法》框架内推进，不得改变核心制度设计

  - id: TT-P15-057
    category: p15_term
    domain: 行业十五五规划
    term: 工商深度协同
    definition: '"十五五"期间进一步打破工商信息壁垒，建立更高水平的工业-商业协同机制，实现品牌培育、市场保障、物流配送的全链条协同。'
    context: 行业内部体制机制创新的重要方向。
    example: '"深化工商协同机制创新，建立数字化支撑的工商一体化管理平台"'
    policy_source: '行业"十五五"规划体制机制创新目标'
    notes: 深度协同须打通工商数据系统，实现信息实时共享

  - id: TT-P15-058
    category: p15_term
    domain: 行业十五五规划
    term: 品牌结构优化
    definition: '"十五五"期间通过淘汰低端品规、扩大中高端产品占比、提升品牌价值，实现卷烟品牌结构向高端化持续迈进的战略目标。'
    context: 行业增收增效的核心路径。
    example: '"持续推进品牌结构优化，到十五五末中高端品规占比大幅提升"'
    policy_source: '行业"十五五"规划品牌结构目标'
    notes: 结构优化须同步推进产品品质提升，防止有名无实的结构升级

  - id: TT-P15-059
    category: p15_term
    domain: 行业十五五规划
    term: 廉洁行业建设
    definition: '"十五五"期间持续推进党风廉政建设，构建"不敢腐、不能腐、不想腐"的廉洁生态，营造清正廉洁的行业文化环境。'
    context: 全面从严治党在行业的深化落实目标。
    example: '"深化廉洁行业建设，推动廉洁文化深入渗透行业各单位、各层级"'
    policy_source: '行业"十五五"规划党建目标'
    notes: 廉洁行业建设须与业务制度改革相结合，从根本上压缩腐败空间

  - id: TT-P15-060
    category: p15_term
    domain: 行业十五五规划
    term: 行业安全稳定
    definition: '"十五五"期间维护烟草专卖市场秩序稳定、保障行业税利持续增长、防范各类安全风险的总体目标。'
    context: 统筹发展与安全要求在行业的具体体现。
    example: '"把保持行业安全稳定作为一切工作的前提，筑牢行业发展的安全底线"'
    policy_source: '行业"十五五"规划安全目标'
    notes: 行业安全涵盖市场安全、信息安全、生产安全、政治安全多个维度

  - id: TT-P15-061
    category: p15_term
    domain: 行业十五五规划
    term: 市场秩序长效治理
    definition: '"十五五"期间从制度建设、数字化监管、社会共治三个维度，建立打击非法烟草经营的长效机制。'
    context: 行业专卖执法管理的系统化提升目标。
    example: '"推进市场秩序长效治理，以数字技术赋能专卖执法，建立全链条管控体系"'
    policy_source: '行业"十五五"规划市场监管目标'
    notes: 长效治理强调系统性和可持续性，而非运动式整治

  - id: TT-P15-062
    category: p15_term
    domain: 行业十五五规划
    term: 行业集中度持续提升
    definition: '"十五五"期间通过品牌整合、产能优化、重点企业做大做强，推动全国卷烟生产、销售向优势品牌和优势企业进一步集中。'
    context: 行业提升规模效益和品牌竞争力的重要战略手段。
    example: '"推动行业集中度持续提升，形成若干具有强大市场竞争力的卷烟品牌航母"'
    policy_source: '行业"十五五"规划产业集中度目标'
    notes: 集中度提升须以市场化方式推进，防止行政强制淘汰带来的负面效应

  - id: TT-P15-063
    category: p15_term
    domain: 行业十五五规划
    term: 减害降焦深化研究
    definition: '"十五五"期间深化卷烟减害降焦技术研究，进一步降低卷烟有害成分释放量，积极履行烟草控制国际义务。'
    context: 行业社会责任和科技创新的结合点。
    example: '"持续深化减害降焦研究，争取在关键有害物减量技术上取得突破性进展"'
    policy_source: '行业"十五五"规划减害目标'
    notes: 减害降焦研究成果须经权威机构验证，防止夸大宣传

  - id: TT-P15-064
    category: p15_term
    domain: 行业十五五规划
    term: 现代流通体系建设
    definition: '"十五五"期间深化商业公司物流现代化改造，建设高效、智慧、绿色的卷烟现代流通体系，提升渠道服务能力和运营效率。'
    context: '商业企业发展的"十五五"战略目标。'
    example: '"加快推进现代流通体系建设，打造与行业高质量发展相适应的卷烟流通服务能力"'
    policy_source: '行业"十五五"规划流通目标'
    notes: 现代流通体系须包含实体物流基础设施和数字化管理能力两个维度

  - id: TT-P15-065
    category: p15_term
    domain: 行业十五五规划
    term: 服务烟农能力提升
    definition: '"十五五"期间改善烟叶种植技术服务、生产基础设施和收益保障，持续提升行业服务烟农的能力和水平。'
    context: 行业助力乡村振兴和履行社会责任的重要具体目标。
    example: '"全面提升服务烟农能力，探索建立烟农收益与行业发展的更紧密共享机制"'
    policy_source: '行业"十五五"规划三农服务目标'
    notes: 服务烟农须与提升烟叶质量、保障原料供应形成双赢局面

  - id: TT-P15-066
    category: p15_term
    domain: 行业十五五规划
    term: 行业治理体系现代化
    definition: '"十五五"期间以治理能力和治理体系现代化为目标，推进行业管理制度完善、监督机制健全、执行能力提升的系统性治理升级。'
    context: 行业管理与国家治理体系和治理能力现代化目标对接。
    example: '"加快推进行业治理体系现代化，以高水平治理能力支撑行业持续健康发展"'
    policy_source: '行业"十五五"规划治理目标'
    notes: 治理体系现代化须与具体的制度建设和能力提升措施相结合

  - id: TT-P15-067
    category: p15_term
    domain: 行业十五五规划
    term: 行业文化软实力
    definition: '"十五五"期间系统建设行业精神文化、企业文化、品牌文化，提升行业整体文化软实力和社会形象的战略任务。'
    context: 行业可持续发展的软实力建设维度。
    example: '"大力提升行业文化软实力，以积极正向的行业形象争取更广泛的社会理解和支持"'
    policy_source: '行业"十五五"规划文化建设目标'
    notes: 文化软实力建设须与控烟履约和社会责任履行相协调

  - id: TT-P15-068
    category: p15_term
    domain: 行业十五五规划
    term: 零售终端服务升级
    definition: '"十五五"期间推进卷烟零售终端服务从标准化向数字化、个性化升级，提升零售客户经营效益和客户满意度的战略目标。'
    context: 商业企业渠道竞争力提升的重要具体目标。
    example: '"推进零售终端服务升级，以数字化工具赋能零售客户，提升终端经营能力"'
    policy_source: '行业"十五五"规划渠道服务目标'
    notes: 终端服务升级须充分利用移动互联网和数字化工具

  - id: TT-P15-069
    category: p15_term
    domain: 行业十五五规划
    term: 烟草专卖法修订
    definition: '"十五五"期间推进《烟草专卖法》修订，使其更好适应行业改革发展需要和法治建设要求的立法工作。'
    context: 行业法制建设的重要立法任务。
    example: '"积极推进烟草专卖法修订，为行业改革发展提供更完善的法律保障"'
    policy_source: '行业"十五五"规划法制建设任务'
    notes: 专卖法修订须广泛征求意见，充分论证，确保修订后制度更加完善

  - id: TT-P15-070
    category: p15_term
    domain: 行业十五五规划
    term: 产品品质战略提升
    definition: '"十五五"期间以消费者需求为导向，系统推进卷烟产品的原料质量、工艺水平和感官品质全面提升的战略工程。'
    context: 品牌竞争力提升的核心基础。
    example: '"实施产品品质战略提升工程，将重点品牌核心品规感官质量提升至行业领先水平"'
    policy_source: '行业"十五五"规划品质提升目标'
    notes: 品质提升须有感官评价分值、理化指标等客观量化标准支撑

  - id: TT-P15-071
    category: p15_term
    domain: 行业十五五规划
    term: 碳达峰行动计划
    definition: 行业贯彻落实国家碳达峰碳中和目标，针对生产制造、物流运输、办公用能等主要排放领域制定的2030年前碳排放达峰实施方案。
    context: 行业落实双碳目标的核心行动文件。
    example: '"制定并落实行业碳达峰行动计划，确保各主要排放领域按时实现达峰"'
    policy_source: 国家碳达峰政策及行业碳达峰实施方案
    notes: 碳达峰行动须分解到企业和主要生产环节，形成可监测可考核的目标体系

  - id: TT-P15-072
    category: p15_term
    domain: 行业十五五规划
    term: 行业科技创新平台
    definition: '"十五五"期间加快国家级、行业级技术创新平台建设，打造引领行业科技进步的高水平创新基础设施体系。'
    context: 行业创新体系建设的重要硬件支撑。
    example: '"加大行业科技创新平台建设力度，提升平台的开放共享水平和科研产出能力"'
    policy_source: '行业"十五五"规划科技基础设施目标'
    notes: 创新平台须有明确的研究方向定位和开放运行机制

  - id: TT-P15-073
    category: p15_term
    domain: 行业十五五规划
    term: 关键核心技术攻关
    definition: '"十五五"期间组织实施的、针对行业技术短板的重大科技攻关项目群，重点突破制约品牌竞争力的关键共性技术难题。'
    context: 科技自立自强战略在行业的核心实施举措。
    example: '"推进关键核心技术攻关，在感官品质调控、智能制造控制等领域实现技术突破"'
    policy_source: '行业"十五五"规划重大科技项目'
    notes: '关键核心技术攻关须聚焦真正"卡脖子"的技术，防止分散投入'

  - id: TT-P15-074
    category: p15_term
    domain: 行业十五五规划
    term: 行业数据治理
    definition: '"十五五"期间建立健全行业数据标准、数据安全、数据共享的治理体系，充分释放行业数据要素价值的系统性工程。'
    context: 行业数字化转型的数据基础建设目标。
    example: '"构建行业统一数据治理体系，推动工商两端核心数据的标准化和共享化"'
    policy_source: '行业"十五五"规划数字化目标'
    notes: 数据治理须先建立统一的数据标准，再推进平台共享

  - id: TT-P15-075
    category: p15_term
    domain: 行业十五五规划
    term: 工匠精神培育
    definition: '"十五五"期间在全行业弘扬精益求精、追求卓越的工匠精神，培育一批高技能工匠人才，提升行业制造质量文化底蕴。'
    context: 行业人才建设和质量文化培育的重要方向。
    example: '"大力培育行业工匠精神，以精益求精的匠心品质推动产品质量持续提升"'
    policy_source: 国家工匠精神培育政策及行业人才目标
    notes: 工匠精神须通过技能竞赛、工匠人才认定等机制具体落实

  - id: TT-P15-076
    category: p15_term
    domain: 行业十五五规划
    term: 市场化改革探索
    definition: '"十五五"期间在专卖制度框架内，在若干领域探索引入更多市场化竞争机制，提升资源配置效率的改革尝试。'
    context: 行业体制机制创新的审慎推进方向。
    example: '"审慎推进市场化改革探索，在法律允许范围内稳步扩大企业市场化自主权"'
    policy_source: '行业"十五五"规划改革任务'
    notes: 市场化改革须严格在专卖法律框架内进行，不得突破制度红线

  - id: TT-P15-077
    category: p15_term
    domain: 行业十五五规划
    term: 行业国际话语权
    definition: '"十五五"期间通过积极参与国际烟草标准制定、控烟公约履约和国际行业组织事务，提升中国烟草在国际烟草领域的影响力和话语权。'
    context: 行业国际化战略的软实力维度。
    example: '"积极参与国际烟草标准和公约规则的制定修订，逐步提升中国烟草国际话语权"'
    policy_source: '行业"十五五"规划国际化目标'
    notes: 国际话语权提升须与中国卷烟产品质量的国际认可相结合

  - id: TT-P15-078
    category: p15_term
    domain: 行业十五五规划
    term: 节能减排目标
    definition: '行业"十五五"期间确定的单位产品能耗降低、污染物排放减少等量化环境目标，是行业绿色低碳发展的硬性约束指标。'
    context: 行业绿色发展战略的约束性指标体系。
    example: '"严格落实节能减排目标，全行业单箱卷烟综合能耗年均下降率不低于X%"'
    policy_source: '行业"十五五"规划绿色指标'
    notes: 节能减排目标须科学合理，既有挑战性又可通过努力实现

  - id: TT-P15-079
    category: p15_term
    domain: 行业十五五规划
    term: 行业标准化建设
    definition: '"十五五"期间系统完善行业技术标准、管理标准和服务标准体系，推动行业各领域工作规范化、精细化的基础性工程。'
    context: 行业管理现代化的重要基础建设任务。
    example: '"加快推进行业标准化建设，形成覆盖各主要业务领域的完善标准体系"'
    policy_source: '行业"十五五"规划标准化目标'
    notes: 标准化建设须与国家标准、行业标准、企业标准三级体系协同推进

  - id: TT-P15-080
    category: p15_term
    domain: 行业十五五规划
    term: 高素质干部队伍建设
    definition: '"十五五"期间通过完善干部选拔培养、考核激励、教育培训机制，建设适应高质量发展需要的高素质行业领导干部队伍。'
    context: 党的建设和人才战略在干部队伍层面的具体目标。
    example: '"持续加强高素质干部队伍建设，着力培养懂政治、懂专业、会经营的复合型领导人才"'
    policy_source: '行业"十五五"规划干部队伍目标'
    notes: 干部队伍建设须把政治素质放在首位，同时注重专业能力提升

  - id: TT-P15-081
    category: p15_term
    domain: 行业十五五规划
    term: 行业网络安全防护
    definition: '"十五五"期间系统加强行业关键信息基础设施保护、数据安全管理和网络攻防能力建设的安全工程。'
    context: 数字化转型背景下行业安全管理的重要新兴领域。
    example: '"全面加强行业网络安全防护，建立行业级网络安全态势感知和应急响应体系"'
    policy_source: '国家网络安全政策及行业"十五五"规划安全目标'
    notes: 网络安全是专卖管理信息系统的重要保障，须建立专职安全管理能力

  - id: TT-P15-082
    category: p15_term
    domain: 行业十五五规划
    term: 行业党史学习教育常态化
    definition: 将党史、行业史教育纳入常态化党员教育培训，传承行业发展历史经验，坚定行业广大干部职工的历史自信和奋斗信心。
    context: 行业党建工作的常态化教育目标。
    example: '"建立党史学习教育长效机制，以史为鉴、以史明志，激励全行业砥砺前行"'
    policy_source: 行业党建工作部署
    notes: 党史学习须与当前实际工作紧密结合，防止停留在形式和空话

  - id: TT-P15-083
    category: p15_term
    domain: 行业十五五规划
    term: 卷烟消费税政策应对
    definition: '"十五五"期间密切跟踪国家卷烟消费税政策动向，提前研究应对策略，确保行业税利在可能的税政调整情况下保持稳定的工作准备。'
    context: 控烟政策和税收政策对行业的潜在重大影响。
    example: '"加强卷烟消费税政策研究，做好政策调整情景下的行业发展应对预案"'
    policy_source: '行业"十五五"规划政策研究任务'
    notes: 消费税政策研究须保持高度敏感，与财政部、国家税务总局保持政策沟通

  - id: TT-P15-084
    category: p15_term
    domain: 行业十五五规划
    term: 优化行业布局
    definition: '"十五五"期间通过企业重组整合、产能优化调整、市场划分合理化等手段，推动全行业在区域布局和企业规模上进一步优化。'
    context: 行业供给侧结构性改革的空间维度。
    example: '"统筹推进行业布局优化，引导产能向优势品牌、优势区域集中"'
    policy_source: '行业"十五五"规划布局优化目标'
    notes: 布局优化须兼顾效率提升和地方就业稳定，防止引发社会稳定问题

  - id: TT-P15-085
    category: p15_term
    domain: 行业十五五规划
    term: 行业ESG建设
    full_form: 环境（Environmental）、社会（Social）、治理（Governance）
    definition: '"十五五"期间烟草行业借鉴国际ESG框架，在环境责任、社会责任、公司治理三个维度建立更系统的信息披露和管理体系。'
    context: 行业融入国际社会责任管理体系的探索性方向。
    example: '"探索建立行业ESG信息披露体系，以规范透明的管理提升行业国际形象"'
    policy_source: 国际ESG标准及证监会ESG披露规定
    notes: 烟草行业ESG建设须处理好控烟与产业发展的矛盾，找准适合的披露框架

  - id: TT-P15-086
    category: p15_term
    domain: 行业十五五规划
    term: 行业科技奖励体系
    definition: '"十五五"期间完善行业科技成果评价和奖励机制，激励科技人员积极创新，形成行业重视科技、褒奖创新的良好生态。'
    context: 科技激励机制建设的重要内容。
    example: '"完善行业科技奖励体系，加大对基础研究和原始创新的奖励力度"'
    policy_source: '行业"十五五"规划科技激励政策'
    notes: 科技奖励须注重奖励真正有价值的创新，防止科技奖项泛化

  - id: TT-P15-087
    category: p15_term
    domain: 行业十五五规划
    term: 新型城镇化支撑
    definition: 行业在支持产烟区新型城镇化建设方面，通过基础设施配套投入和产业带动，服务国家新型城镇化战略的具体行动。
    context: 行业服务国家发展战略的社会责任维度。
    example: '"发挥行业在烟区的经济带动作用，为当地新型城镇化建设提供产业支撑"'
    policy_source: 国家新型城镇化政策及行业社会责任目标
    notes: 支撑城镇化须与促进烟农增收和现代烟草农业建设相结合

  - id: TT-P15-088
    category: p15_term
    domain: 行业十五五规划
    term: 行业发展评价指标体系
    definition: '"十五五"期间建立健全的、覆盖税利贡献、品牌竞争力、科技创新、绿色发展、管理水平等维度的行业高质量发展综合评价指标体系。'
    context: 行业规划落实和绩效考核的量化基础。
    example: '"建立科学完善的行业发展评价指标体系，以高质量指标引导高质量发展行动"'
    policy_source: '行业"十五五"规划绩效评价机制'
    notes: 评价指标体系须平衡定量指标与定性评估，确保全面客观反映发展质量
