  version: '"1.0"'
  category: policy_term
  total_entries: 62
  domains:
    - name: "行业战略方针类"
      id_range: '"TT-POL-001 ~ TT-POL-018"'
      count: 18
    - name: "行业改革类"
      id_range: '"TT-POL-019 ~ TT-POL-032"'
      count: 14
    - name: "产业发展类"
      id_range: '"TT-POL-033 ~ TT-POL-048"'
      count: 16
    - name: "管理体系类"
      id_range: '"TT-POL-049 ~ TT-POL-062"'
      count: 14
  format_note: '"每条含 id/category/domain/term/definition/context/example/policy_source/notes 字段"'

# ===== 行业战略方针类 =====

policy_terms:

  - id: TT-POL-001
    category: policy_term
    domain: 行业战略方针
    term: 统一领导、垂直管理、专卖专营
    definition: 烟草行业管理体制的核心表述，即由国家烟草专卖局对全行业实施统一领导，通过垂直管理体系统一部署，对烟草生产、流通实行国家专卖制度。
    context: 行业管理体制和法律制度的根本性描述，出现在所有行业法规政策文件中。
    example: '"坚持统一领导、垂直管理、专卖专营的行业管理体制不动摇"'
    policy_source: 《中华人民共和国烟草专卖法》
    notes: 这是烟草行业最核心的政策语言，在讲话和公文中须准确引用

  - id: TT-POL-002
    category: policy_term
    domain: 行业战略方针
    term: 两个维护
    definition: 维护国家利益（税收、产业安全）和维护消费者利益，是烟草专卖制度的双重目标，也是行业一切工作的出发点和落脚点。
    context: 行业重要讲话和政策文件中的核心价值表述。
    example: '"始终坚持两个维护，正确处理国家利益、消费者利益和企业利益的关系"'
    policy_source: 行业政策文件惯用表述
    notes: '须注意与党政语境中"两个维护"（维护习近平总书记地位、维护党中央权威）在使用场景上的区分'

  - id: TT-POL-003
    category: policy_term
    domain: 行业战略方针
    term: 做强做优
    definition: 烟草行业发展战略方向，即不追求单纯的规模扩张，而是着力提升核心竞争力、品牌价值和盈利能力，实现高质量发展。
    context: 行业转型发展的战略指引，十四五规划核心方向。
    example: '"把握做强做优主攻方向，聚焦提质增效推动行业高质量发展"'
    policy_source: '行业"十四五"规划'
    notes: '"做强做优"已替代早期"做大做强"的提法，体现发展理念转变'

  - id: TT-POL-004
    category: policy_term
    domain: 行业战略方针
    term: 品牌驱动战略
    definition: 以卷烟品牌建设为核心，通过提升品牌价值、扩大品牌市场份额来驱动行业高质量发展的战略取向。
    context: 工业企业发展战略的核心，指导生产、研发、营销等各项工作。
    example: '"全面落实品牌驱动战略，集中资源培育若干具有全国竞争力的大品牌"'
    policy_source: '行业"十四五"规划及工业企业发展战略'
    notes: 品牌驱动须以技术创新和品质提升为基础支撑

  - id: TT-POL-005
    category: policy_term
    domain: 行业战略方针
    term: 科技创新驱动
    definition: 将科技创新作为引领行业发展的核心动力，通过突破关键技术、完善创新体系，推动行业从要素驱动向创新驱动转变。
    context: 行业发展战略的核心要素，与国家创新驱动发展战略高度对接。
    example: '"坚持科技创新驱动，加快实现行业关键核心技术自主可控"'
    policy_source: 行业科技创新政策
    notes: '"创新驱动"是十八大以来国家发展战略的核心词，行业须在此框架下表述'

  - id: TT-POL-006
    category: policy_term
    domain: 行业战略方针
    term: 高质量发展
    definition: 坚持质量第一、效益优先，通过质量变革、效率变革、动力变革，推动行业经济发展方式从规模增长向质量效益提升转变。
    context: 习近平新时代中国特色社会主义经济思想在行业的具体体现。
    example: '"把推动高质量发展作为行业发展的根本要求，贯穿各项工作始终"'
    policy_source: 党的十九大报告及行业发展规划
    notes: 高质量发展是新发展阶段的核心主题词，须贯穿各类行业公文

  - id: TT-POL-007
    category: policy_term
    domain: 行业战略方针
    term: 走出去战略
    definition: 鼓励和支持有条件的烟草工业企业开拓国际市场，通过产品出口、技术输出、品牌推广等方式，逐步提升行业国际竞争力。
    context: 行业国际化发展的战略方向，面临国际烟草巨头竞争压力。
    example: '"深入实施走出去战略，积极扩大卷烟出口规模，提升中国烟草国际影响力"'
    policy_source: 行业国际化发展政策
    notes: 出口须遵守目的地国家法规和WTO规则

  - id: TT-POL-008
    category: policy_term
    domain: 行业战略方针
    term: 三个转变
    definition: 推动中国制造向中国创造转变、中国速度向中国质量转变、中国产品向中国品牌转变，是国家战略在烟草行业的具体落地要求。
    context: 制造业转型升级政策在行业中的体现。
    example: '"推动实现三个转变，以中国烟草品牌的卓越表现服务国家品牌战略"'
    policy_source: 习近平关于制造业发展的重要讲话精神
    notes: 三个转变出自习近平2014年讲话，引用时须准确

  - id: TT-POL-009
    category: policy_term
    domain: 行业战略方针
    term: 控烟履约
    definition: 中国政府作为《烟草控制框架公约》（FCTC）缔约方，依据公约要求在国内推进控烟措施（包装警示、公共场所禁烟、广告限制等）的政策行动。
    context: 行业政策与国际公约要求的结合点，也是行业面临的外部政策压力。
    example: '"积极履行控烟义务，认真落实《烟草控制框架公约》相关要求"'
    policy_source: 《烟草控制框架公约》（2005年中国批准加入）
    notes: 控烟履约与行业发展存在一定张力，须在政策文件中把握表述分寸

  - id: TT-POL-010
    category: policy_term
    domain: 行业战略方针
    term: 社会责任
    definition: 烟草行业在依法纳税、维护市场秩序、推进控烟、服务三农等方面对国家和社会承担的责任，是行业合法性的重要支撑。
    context: 行业公关传播和工作报告的常规内容。
    example: '"切实履行烟草企业社会责任，主动回应社会关切"'
    policy_source: 行业社会责任报告及相关政策
    notes: 烟草行业社会责任须在强调纳税贡献的同时，如实表述控烟工作

  - id: TT-POL-011
    category: policy_term
    domain: 行业战略方针
    term: 数字化转型
    definition: 利用大数据、云计算、人工智能、物联网等数字技术，对行业生产、流通、管理和服务各环节进行系统性变革和能力升级。
    context: '行业"十四五"和"十五五"规划的核心任务之一。'
    example: '"加快推进数字化转型，以数字化赋能行业管理现代化"'
    policy_source: '行业"十四五"规划'
    notes: 数字化转型是全国各行业共性战略，须结合烟草行业特点表述

  - id: TT-POL-012
    category: policy_term
    domain: 行业战略方针
    term: 绿色低碳发展
    definition: 在行业生产经营全链条推进节能减排、降碳、循环利用，实现行业发展与生态环境保护相协调的发展理念和目标。
    context: 双碳政策背景下行业发展的战略约束和方向。
    example: '"坚定走绿色低碳发展道路，加快推动行业能源结构和生产方式绿色转型"'
    policy_source: 国家碳达峰碳中和政策及行业绿色发展规划
    notes: 绿色低碳发展须有量化目标，不能停留于口号表述

  - id: TT-POL-013
    category: policy_term
    domain: 行业战略方针
    term: 全国一盘棋
    definition: 在国家烟草专卖局统一领导下，各省市局公司、工业企业协调配合，统筹全局，避免各自为政、恶性竞争的行业协作理念。
    context: 强调行业整体利益、规避地方保护主义的常用语。
    example: '"树牢全国一盘棋意识，严格执行行业统一政策，维护行业整体利益"'
    policy_source: 行业党委讲话及政策文件常用表述
    notes: '使用"全国一盘棋"时通常针对地方保护、窜货等问题'

  - id: TT-POL-014
    category: policy_term
    domain: 行业战略方针
    term: 烟草专卖制度
    definition: 以《烟草专卖法》为法律依据，国家对烟草制品的生产、流通、销售及进出口实行国家专营、统一管理的经济制度。
    context: 行业存在的法律基础，所有政策制定和行业工作的根本依据。
    example: '"坚定维护和完善烟草专卖制度，这是行业生存发展的根基"'
    policy_source: 《中华人民共和国烟草专卖法》（1991年施行）
    notes: '须注意与"统一领导、垂直管理"一并表述时的逻辑关系'

  - id: TT-POL-015
    category: policy_term
    domain: 行业战略方针
    term: 卷烟上水平
    definition: 2009年行业提出的品牌整合和品质提升战略目标，要求行业在品牌规模、产品质量、科技水平、管理能力等方面实现整体跃升。
    context: 行业品牌发展和管理提升的重要政策导向，已深入行业发展理念。
    example: '"持续推进卷烟上水平战略，推动重点品牌产品结构持续优化"'
    policy_source: 国家烟草专卖局2009年提出
    notes: '"卷烟上水平"是行业自身战略口号，非国家层面政策文件语言'

  - id: TT-POL-016
    category: policy_term
    domain: 行业战略方针
    term: 现代烟草农业
    definition: 以科学化种植、机械化作业、信息化管理为特征，推动烟草种植业从传统粗放模式向现代农业转变的发展方向。
    context: 原料保障战略和助农政策的结合点。
    example: '"深入推进现代烟草农业建设，持续提升烟叶综合生产能力"'
    policy_source: 行业烟叶发展政策
    notes: 现代烟草农业与乡村振兴政策协同推进

  - id: TT-POL-017
    category: policy_term
    domain: 行业战略方针
    term: 三农服务
    definition: 烟草行业在原料基地建设、农业技术推广、烟农收入保障等方面服务农业农村农民的政策导向和工作举措。
    context: 烟草行业履行社会责任、服务国家战略的重要体现。
    example: '"深化三农服务工作，持续提升烟农种植效益和生活水平"'
    policy_source: 国家三农政策及行业烟叶工作政策
    notes: 三农服务是烟草行业重要的合法性来源之一

  - id: TT-POL-018
    category: policy_term
    domain: 行业战略方针
    term: 稳中求进
    definition: 在保持行业发展大局稳定的前提下，在关键领域积极推进改革创新，争取高质量发展新突破的总体工作基调。
    context: 行业年度工作会议和五年规划中的常用战略基调表述。
    example: '"坚持稳中求进工作总基调，确保行业发展大局稳定、质效持续提升"'
    policy_source: 国家宏观政策基调及行业年度工作会议要求
    notes: '"稳中求进"是国家宏观政策常用语，行业使用时须体现行业特色内涵'

# ===== 行业改革类 =====

  - id: TT-POL-019
    category: policy_term
    domain: 行业改革
    term: 工商分开
    definition: 将烟草行业中工业企业（卷烟生产）与商业企业（烟草批发流通）分别运营，各自独立核算、明晰责权的体制安排。
    context: 行业内部体制改革的重要成果，已基本完成。
    example: '"深化工商分开改革成果，进一步理顺工商职能边界和利益关系"'
    policy_source: 国家烟草专卖局改革部署（2003年前后推进）
    notes: 工商分开后仍需通过工商协同机制保障市场效率

  - id: TT-POL-020
    category: policy_term
    domain: 行业改革
    term: 工商协同
    definition: 工业企业和商业公司在市场信息共享、订单计划协同、品牌联合推广等方面建立的协作机制，以提升整体市场竞争效率。
    context: 工商分开后填补协调空白的重要机制创新。
    example: '"深化工商协同机制，实现工业产能与商业市场需求的精准匹配"'
    policy_source: 行业工商关系管理政策
    notes: 工商协同是行业特有概念，须准确理解其在专卖体制下的含义

  - id: TT-POL-021
    category: policy_term
    domain: 行业改革
    term: 企业联合重组
    definition: 通过行政主导或市场方式，将多家工业企业合并整合为规模更大、竞争力更强的企业集团，以提高行业集中度。
    context: 行业品牌整合和规模效益提升的重要手段。
    example: '"有序推进工业企业联合重组，优化行业产能布局"'
    policy_source: 行业品牌整合和企业重组政策
    notes: 重组须依法依规进行，涉及人员安置、资产评估等复杂程序

  - id: TT-POL-022
    category: policy_term
    domain: 行业改革
    term: 政企分开
    definition: 将政府烟草专卖行政管理职能与烟草企业经营职能相分离，实现管办分开，提高行政监管效能和企业市场竞争能力。
    context: 行业管理体制改革的方向性要求，与国有企业改革政策相关。
    example: '"深化政企分开改革，切实理清行政主管部门与国有企业的职能边界"'
    policy_source: 国有企业改革政策及行业管理体制改革部署
    notes: 政企分开在烟草行业推进较为缓慢，局公司合一体制仍为主体

  - id: TT-POL-023
    category: policy_term
    domain: 行业改革
    term: 市场化改革
    definition: 在烟草专卖制度框架内，引入更多市场竞争机制，赋予企业更多自主权，提升资源配置效率的改革方向。
    context: 行业与市场化改革大背景的接轨点，须在专卖制度约束下推进。
    example: '"在维护专卖制度的前提下，有序推进行业市场化改革进程"'
    policy_source: 国有企业市场化改革政策
    notes: 烟草行业市场化改革须在法律许可框架内进行，不能突破专卖底线

  - id: TT-POL-024
    category: policy_term
    domain: 行业改革
    term: 三项制度改革
    definition: 对国有烟草企业推行的劳动用工制度、人事制度和薪酬分配制度改革，以增强企业活力和吸引留用人才能力。
    context: 国有企业改革政策在行业的落地实践。
    example: '"深化三项制度改革，建立健全以业绩为导向的薪酬激励机制"'
    policy_source: 国务院国有企业三项制度改革部署
    notes: 三项制度改革是国企改革的常规内容，须结合行业特点推进

  - id: TT-POL-025
    category: policy_term
    domain: 行业改革
    term: 混合所有制改革
    definition: 在条件许可的非核心业务领域，引入非国有资本参股，实现不同所有制资本融合的国企改革方式。在烟草行业推进极为有限。
    context: 国有企业改革政策，在烟草行业因专卖制度限制，适用范围极窄。
    example: '"审慎推进混合所有制改革探索，严格限定在非专卖核心业务领域"'
    policy_source: 国务院关于国有企业改革的指导意见
    notes: 烟草专卖核心业务不得引入非国有资本，须特别注意政策边界

  - id: TT-POL-026
    category: policy_term
    domain: 行业改革
    term: 内控体系建设
    definition: 建立健全覆盖决策、执行、监督各环节的内部控制制度体系，防范经营风险和廉洁风险的系统性管理工程。
    context: 行业规范管理和反腐倡廉建设的重要内容。
    example: '"持续完善内控体系建设，确保各项权力在制度笼子里运行"'
    policy_source: 财政部《企业内部控制基本规范》及行业内控建设要求
    notes: 内控体系须覆盖采购、销售、资金、人事等高风险业务领域

  - id: TT-POL-027
    category: policy_term
    domain: 行业改革
    term: 纪检监察体制改革
    definition: 深化党对烟草行业的纪律检查和国家监察工作，推进纪检监察派驻全覆盖，强化对权力的监督制约。
    context: 全面从严治党在烟草行业的重要举措。
    example: '"深化纪检监察体制改革，实现派驻纪检监察机构全覆盖"'
    policy_source: 党中央纪检监察体制改革部署
    notes: 纪检监察改革是政治性很强的话题，表述须严格符合党政语言规范

  - id: TT-POL-028
    category: policy_term
    domain: 行业改革
    term: 国有资产管理
    definition: 对烟草行业国有资产（含实物资产和无形资产）依法进行监督管理、保值增值、处置审批的制度体系。
    context: 规范企业资产经营行为，防止国有资产流失。
    example: '"依法加强国有资产管理，确保国有资产安全完整和保值增值"'
    policy_source: 《企业国有资产法》及国资委相关规定
    notes: 重大资产处置须经授权主体审批，程序合规是底线要求

  - id: TT-POL-029
    category: policy_term
    domain: 行业改革
    term: 管理提升
    definition: 通过对标先进、系统诊断和持续改进，提升行业企业在战略管理、运营管理、风险管控等方面能力水平的系统性工程。
    context: 行业年度管理工作的重要议题，与管理成熟度评价密切关联。
    example: '"深化管理提升行动，推动全系统管理能力再上新台阶"'
    policy_source: 行业管理提升相关政策文件
    notes: 管理提升须有量化目标和评价机制，不能停留于倡导层面

  - id: TT-POL-030
    category: policy_term
    domain: 行业改革
    term: 降本增效
    definition: 通过优化资源配置、改善运营效率、压缩非必要费用，在保证质量的前提下降低成本、提升效益的系统性工作。
    context: 行业提升竞争力和可持续发展能力的重要手段。
    example: '"深入推进降本增效，实现全年降本目标超额完成"'
    policy_source: 行业年度工作部署
    notes: 须区分降本（有利于长期发展）和短视削减（损害长期能力）的不同做法

  - id: TT-POL-031
    category: policy_term
    domain: 行业改革
    term: 人才强企战略
    definition: 将人才作为第一资源，通过引进、培养、激励等手段打造高素质人才队伍，以人才优势支撑企业高质量发展的战略选择。
    context: 行业企业发展战略的重要组成部分，与科技创新战略高度关联。
    example: '"全面实施人才强企战略，大力培育科技领军人才和高技能工匠人才"'
    policy_source: 国家人才强国战略及行业人才发展规划
    notes: 人才强企须与薪酬激励机制改革同步推进

  - id: TT-POL-032
    category: policy_term
    domain: 行业改革
    term: 放管服改革
    definition: 简政放权、放管结合、优化服务的行政审批制度改革，减少对企业和市场主体不必要的行政干预，优化营商环境。
    context: 国家政府职能转变要求在行业行政管理领域的落实。
    example: '"深化放管服改革，持续压减许可证办理时限，提升专卖行政服务效能"'
    policy_source: 国务院关于深化放管服改革优化营商环境的部署
    notes: 放管服在烟草行业须在专卖法规框架内推进，不能放弃必要监管职能

# ===== 产业发展类 =====

  - id: TT-POL-033
    category: policy_term
    domain: 产业发展
    term: 税利总额
    definition: 烟草行业全年缴纳国家税收与上缴利润之和，是衡量行业对国家财政贡献的核心指标，也是行业发展成效的综合体现。
    context: 行业工作报告和绩效考核的首要指标，高度政治敏感。
    example: '"全行业实现税利总额XXXX亿元，连续XX年稳居全国工业行业前列"'
    policy_source: 行业年度经济运行统计
    notes: 税利总额是行业最核心的量化指标，须严格核实数据准确性

  - id: TT-POL-034
    category: policy_term
    domain: 产业发展
    term: 卷烟产销量
    definition: 全行业年度卷烟生产箱数和销售箱数，是行业规模体量的基础性指标，受国家计划管控，不可超计划生产。
    context: 行业经济运行的基础数据，与税利挂钩。
    example: '"全国卷烟产销量保持平稳，实现计划内有序生产和市场均衡供应"'
    policy_source: 行业年度经济运行统计
    notes: 产销量须与国家下达的年度计划一致，超计划为违规行为

  - id: TT-POL-035
    category: policy_term
    domain: 产业发展
    term: 产业链现代化
    definition: 推动烟草产业链（烟叶种植→原料加工→卷烟制造→品牌营销→物流配送）向高端化、智能化、绿色化方向升级，增强产业链韧性和竞争力。
    context: 制造强国战略和供给侧结构性改革在行业的体现。
    example: '"统筹推进产业链现代化，打通从原料到市场的全链条质量管控体系"'
    policy_source: 国家制造业高质量发展政策及行业发展规划
    notes: 产业链现代化须协同推进，不能仅聚焦制造环节

  - id: TT-POL-036
    category: policy_term
    domain: 产业发展
    term: 进口烟管理
    definition: 对境外卷烟进口实施的许可审批、进口计划管控、质量检验和市场监管制度，维护国内烟草市场秩序和国家利益。
    context: 专卖制度对外的重要组成部分。
    example: '"严格进口烟管理，依法查处走私进口卷烟违法行为"'
    policy_source: 《烟草专卖法》及进出口管理相关法规
    notes: 进口卷烟须经国家烟草专卖局审批，并由专卖部门统一进口

  - id: TT-POL-037
    category: policy_term
    domain: 产业发展
    term: 供给侧结构性改革
    definition: 在卷烟市场，通过淘汰落后产能、优化品牌结构、提升产品品质，改善供给质量以更好匹配消费需求的改革举措。
    context: 国家供给侧改革政策在行业的落地，与品牌整合、结构优化高度关联。
    example: '"深化供给侧结构性改革，持续压减低端品规，扩大中高端产品供给"'
    policy_source: 党中央关于推进供给侧结构性改革的部署
    notes: '"供给侧结构性改革"是习近平重要经济思想的核心概念，使用须准确'

  - id: TT-POL-038
    category: policy_term
    domain: 产业发展
    term: 碳达峰碳中和
    abbreviation: 双碳
    definition: 国家提出的2030年前实现碳排放达峰、2060年前实现碳中和的目标，烟草行业须制定并落实相应的碳减排路径和措施。
    context: 行业绿色发展的重要外部政策约束，须制定行业专项行动方案。
    example: '"积极稳妥推进双碳目标落实，制定行业碳达峰实施方案并推动落地"'
    policy_source: 习近平2020年气候雄心峰会讲话及国家双碳政策体系
    notes: 须结合行业能源结构和排放特点，制定切实可行的减碳路径

  - id: TT-POL-039
    category: policy_term
    domain: 产业发展
    term: 行业经济运行分析
    definition: 对行业产、销、库存、价格、税利等核心经济指标进行定期汇总分析，为行业决策和政策制定提供数据依据的管理工作。
    context: 行业管理的基础性信息工作，定期向上级报告。
    example: '"建立健全行业经济运行监测分析体系，提升数据分析的及时性和准确性"'
    policy_source: 行业统计和经济运行管理相关规定
    notes: 经济运行数据属于行业敏感信息，须按规定权限管理和报送

  - id: TT-POL-040
    category: policy_term
    domain: 产业发展
    term: 产能利用率
    definition: 实际卷烟产量与核定生产能力之比，反映行业产能的有效利用程度，是产能布局和结构调整的重要参考指标。
    context: 产能规划和企业结构调整的重要依据。
    example: '"合理布局产能，推动全行业产能利用率保持在合理区间"'
    policy_source: 行业产能管理相关政策
    notes: 产能利用率过低意味着资源浪费，过高则影响灵活调度能力

  - id: TT-POL-041
    category: policy_term
    domain: 产业发展
    term: 烟草产业扶贫
    definition: 通过在贫困地区发展烟叶基地、提供技术服务和就业机会，帮助贫困烟农增收脱贫的扶贫方式（现已转入巩固脱贫攻坚成果阶段）。
    context: 行业履行社会责任和助力国家扶贫政策的重要工作。
    example: '"持续巩固烟草产业扶贫成果，深化与定点帮扶村的结对帮扶"'
    policy_source: 国家脱贫攻坚政策及行业扶贫工作部署
    notes: '2021年起已从"脱贫攻坚"转入"巩固拓展脱贫攻坚成果"阶段，表述须随政策更新'

  - id: TT-POL-042
    category: policy_term
    domain: 产业发展
    term: 生产计划管理
    definition: 国家烟草专卖局对全国卷烟生产总量、各企业分品牌产量实行年度计划审批和执行监督的管理制度。
    context: 专卖制度和行业宏观管控的核心工具之一。
    example: '"严格执行国家下达的卷烟生产计划，杜绝超计划生产行为"'
    policy_source: 《烟草专卖法》及行业生产管理办法
    notes: 超计划生产是严重违规行为，须在政策文件中明确禁止性表述

  - id: TT-POL-043
    category: policy_term
    domain: 产业发展
    term: 中国烟草
    definition: 中国烟草总公司及其下属单位的统称，代表中国烟草行业的市场主体。在国际场合也作为中国烟草产业的整体品牌使用。
    context: 对外宣传和国际交流中的行业整体形象标识。
    example: '"提升中国烟草品牌国际影响力，在全球烟草市场展示中国烟草实力"'
    policy_source: 行业对外宣传口径
    notes: '需区分作为企业法人的"中国烟草总公司"与泛指整个行业的"中国烟草"'

  - id: TT-POL-044
    category: policy_term
    domain: 产业发展
    term: 烟草税收
    definition: 烟草行业依法缴纳的各类税收，包括增值税、消费税、所得税等，是行业对国家财政的主要贡献形式。
    context: 行业存在合法性和社会贡献的重要依据。
    example: '"行业税收连续稳定增长，为国家财政收入提供了重要支撑"'
    policy_source: 税法及行业财务管理相关规定
    notes: 烟草消费税是调节消费行为和筹集财政收入的重要政策工具

  - id: TT-POL-045
    category: policy_term
    domain: 产业发展
    term: 创新驱动发展战略
    definition: 国家层面以科技创新为核心驱动力的发展战略，烟草行业在此框架下推进技术研发、品牌创新和管理创新。
    context: 国家创新政策在行业的传导和落实。
    example: '"全面落实创新驱动发展战略，加大研发投入，加快科技成果转化应用"'
    policy_source: 党的十八大报告及国家创新驱动发展战略纲要
    notes: '"创新驱动发展战略"是党和国家战略，引用须注意准确性和权威性'

  - id: TT-POL-046
    category: policy_term
    domain: 产业发展
    term: 新发展格局
    definition: 以国内大循环为主体、国内国际双循环相互促进的新发展格局，烟草行业须在此战略背景下统筹国内市场稳定和国际业务拓展。
    context: 行业工作布局须对接国家战略框架的重要表述。
    example: '"主动融入新发展格局，统筹推进国内市场稳定和国际市场拓展"'
    policy_source: 习近平2020年提出，党的十九届五中全会确立
    notes: '"新发展格局"是习近平重要经济思想的核心概念，须准确引用'

  - id: TT-POL-047
    category: policy_term
    domain: 产业发展
    term: 制造强国战略
    definition: 国家推动制造业向高端化、智能化、绿色化转型的战略，烟草行业须在此框架下推进智能制造和高质量发展。
    context: 行业智能制造战略的上位政策依据。
    example: '"加快推进智能制造，积极践行制造强国战略要求"'
    policy_source: 国务院《中国制造2025》战略
    notes: 《中国制造2025》是制造强国战略的具体行动纲领

  - id: TT-POL-048
    category: policy_term
    domain: 产业发展
    term: 行业整体利益
    definition: 全国烟草系统作为整体，在税利贡献、品牌竞争力、市场稳定等方面的综合利益，须高于地方局部利益。
    context: 纠正地方保护主义、推动行业协同的重要政策概念。
    example: '"强化大局意识，切实维护行业整体利益，抵制地方保护主义倾向"'
    policy_source: 行业政策文件及局领导讲话
    notes: '"行业整体利益"常与批评地方保护、窜货等问题联系使用'

# ===== 管理体系类 =====

  - id: TT-POL-049
    category: policy_term
    domain: 管理体系
    term: 全面从严治党
    definition: 党中央推进党的建设新的伟大工程的总方略，在烟草行业体现为加强党的领导、严明党纪、强化廉洁建设等系统性工作。
    context: 行业政治建设和党风廉政建设的总要求，须贯穿全部工作。
    example: '"深入推进全面从严治党，以高质量党建引领行业高质量发展"'
    policy_source: 习近平关于全面从严治党的重要论述
    notes: 全面从严治党是政治性强的核心表述，必须准确引用，不可删改

  - id: TT-POL-050
    category: policy_term
    domain: 管理体系
    term: 党委领导下的厂长（经理）负责制
    definition: 企业党委（党组）发挥领导核心作用，厂长（经理）依法行使经营管理权的国有企业领导体制。
    context: 国有烟草企业公司治理的基本制度安排。
    example: '"健全党委领导下的厂长负责制，确保党的领导有效嵌入公司治理结构"'
    policy_source: 国有企业公司治理准则及党章相关规定
    notes: 须区分党委职责（把方向、管大局）和经营班子职责（具体经营管理）

  - id: TT-POL-051
    category: policy_term
    domain: 管理体系
    term: 三重一大
    definition: 重大决策、重大项目安排、重要人事任免、大额资金使用等事项，须经集体决策的决策制度，是防止个人专权、规范权力运行的基本要求。
    context: 国有企业内部决策合规的核心制度要求。
    example: '"严格执行三重一大决策制度，防止个人或少数人专断决策"'
    policy_source: 中办国办《关于进一步推进三重一大决策制度的意见》
    notes: 违反三重一大是审计和纪检审查的重点关注事项

  - id: TT-POL-052
    category: policy_term
    domain: 管理体系
    term: 廉洁风险防控
    definition: 识别行业权力运行中的廉洁风险点，通过制度约束、流程再造、监督检查等手段，防范腐败和违规行为的系统性风险管理工作。
    context: 党风廉政建设和内控管理的重要组成部分。
    example: '"深化廉洁风险防控体系建设，重点强化采购、营销、基建等高风险领域管控"'
    policy_source: 行业党风廉政建设工作部署
    notes: 廉洁风险防控须与业务流程深度融合，不能流于形式

  - id: TT-POL-053
    category: policy_term
    domain: 管理体系
    term: 绩效考核
    definition: 按照既定目标和标准，对各单位工作完成情况进行定期评价和结果运用的管理制度，是推动目标落实的重要抓手。
    context: 行业日常管理和激励约束机制的核心工具。
    example: '"完善绩效考核体系，强化考核结果与干部使用、薪酬分配的挂钩"'
    policy_source: 行业绩效管理相关制度文件
    notes: 绩效考核指标须具有可量化、可核实的特点，避免模糊考核

  - id: TT-POL-054
    category: policy_term
    domain: 管理体系
    term: 合规管理
    definition: 企业建立的确保经营活动符合法律法规、行业规定和内部制度要求的管理体系，包括合规识别、评估、培训和监督。
    context: 规范经营管理的重要基础性制度。
    example: '"全面加强合规管理，将合规要求嵌入业务流程各关键节点"'
    policy_source: 国家合规管理相关政策及行业合规建设要求
    notes: 合规管理须与业务流程深度融合，避免成为孤立的合规文件体系

  - id: TT-POL-055
    category: policy_term
    domain: 管理体系
    term: 审计监督
    definition: 内部审计机构或外部审计机构，对企业财务收支、资产管理、重大项目、重大决策执行等开展的独立审查评价活动。
    context: 行业监督体系的重要组成部分，与纪检监察协同发挥作用。
    example: '"强化审计监督，开展重点领域专项审计，推动问题整改落实"'
    policy_source: 《审计法》及国有企业内部审计相关规定
    notes: 烟草行业既有国家审计署审计，也有行业内部审计，须区分

  - id: TT-POL-056
    category: policy_term
    domain: 管理体系
    term: 风险管理
    definition: 识别、评估和应对企业经营中政策风险、市场风险、运营风险、廉洁风险等各类风险的系统性管理工作。
    context: 现代企业治理的重要组成部分，在行业管理成熟度评价中有专项考察。
    example: '"健全全面风险管理体系，提升企业风险识别和应对能力"'
    policy_source: 国有企业全面风险管理指引
    notes: 全面风险管理须覆盖战略、财务、运营、法律四大风险类别

  - id: TT-POL-057
    category: policy_term
    domain: 管理体系
    term: 信息化建设
    definition: 利用信息技术对行业生产、经营、管理各环节进行数字化改造，建设统一的信息平台和数据共享机制的系统性工程。
    context: 行业管理现代化的重要基础，数字化转型的前提。
    example: '"持续深化信息化建设，推动核心业务系统互联互通"'
    policy_source: 行业信息化规划及两化融合政策
    notes: 行业有统一的信息化建设规范，各单位须遵循行业顶层设计

  - id: TT-POL-058
    category: policy_term
    domain: 管理体系
    term: 年度工作目标
    definition: 国家烟草专卖局或各省局公司年初确定的、须在年底前完成的各项工作目标指标，是全年工作的总纲领和考核依据。
    context: 行业年度工作部署和过程管理的核心载体。
    example: '"圆满完成年度工作目标，全面超额完成税利、产销量等核心指标"'
    policy_source: 行业年度工作会议文件
    notes: 年度目标须与上级要求高度衔接，自行下调目标须报批

  - id: TT-POL-059
    category: policy_term
    domain: 管理体系
    term: 专项整治
    definition: 针对特定领域的突出问题，集中力量在一定时期内开展的专项检查和整改行动，以快速解决重点难点问题。
    context: 行业日常监管和问题整改的常规工作方式。
    example: '"开展非法卷烟专项整治行动，严厉打击走私贩私违法犯罪行为"'
    policy_source: 行业专项工作部署
    notes: 专项整治须与常态化监管相结合，防止问题反弹

  - id: TT-POL-060
    category: policy_term
    domain: 管理体系
    term: 巡视巡察
    definition: 上级党委对下级党组织开展的政治监督形式，检查党的路线方针政策执行情况、党风廉政建设情况等。
    context: 党的监督体系的重要组成部分，在行业内部定期开展。
    example: '"认真做好巡视整改工作，逐项落实巡视组反馈意见"'
    policy_source: 《中国共产党巡视工作条例》
    notes: 巡视巡察整改是政治性任务，须高度重视、认真落实

  - id: TT-POL-061
    category: policy_term
    domain: 管理体系
    term: 目标责任制
    definition: 将年度工作目标分解落实到各部门、各岗位，通过签订责任书等方式明确责任主体，并与绩效考核挂钩的管理机制。
    context: 推动目标落地、强化责任担当的基础性管理制度。
    example: '"完善目标责任制管理，确保各项工作任务件件有人抓、事事有落实"'
    policy_source: 行业管理制度相关文件
    notes: 目标责任制须有量化指标、明确考核时间节点和考核方式

  - id: TT-POL-062
    category: policy_term
    domain: 管理体系
    term: 依法治企
    definition: 以法律、规章、合同等制度规范约束企业经营行为，推动企业管理法制化、规范化的理念和工作取向。
    context: 国有企业规范治理的重要原则。
    example: '"深入推进依法治企，不断完善企业规章制度体系建设"'
    policy_source: 国家推进依法治国战略及国有企业法治建设要求
    notes: 依法治企须建立完善的制度体系，并确保制度得到有效执行
