  # ===== 领导讲话结束语完整段落 =====

  - id: OC-050
    category: 讲话结束语
    content: '发展是靠苦干、实干干出来的。今年全市改革发展的任务艰巨繁重，面临的挑战非常严峻，要求我们把"目标"刻在心上、把"执行"视为铁律、把"担当"作为自觉，铁肩担责、奋发竞进，拿出逢山开路的冲劲、闯劲和拼劲，不松气、不泄气，憋足一口气，聚焦聚神聚力把各项工作抓实、抓好。'
    usage_note: 工作部署会结束语，三把+三劲结构
    applicable_types: [讲话]
    applicable_position: 结尾
    applicable_direction: 下行文
    formality_level: 正式
    source: 文稿结尾篇·四、领导讲话结尾

  - id: OC-051
    category: 讲话结束语
    content: '同志们，使命召唤落实、责任系于实干，一分布置、九分落实。让我们在市委的坚强领导下，以求实务实落实的优良作风干事创业，以"钉钉子"的精神推进改革发展的各项工作，确保完成全年各项目标任务。'
    usage_note: 简洁结束语，强调落实，适用于年度工作会
    applicable_types: [讲话]
    applicable_position: 结尾
    applicable_direction: 下行文
    formality_level: 正式
    source: 文稿结尾篇·四、领导讲话结尾

  - id: OC-052
    category: 讲话结束语
    content: '同志们，越是时间紧、任务重、压力大，越要统筹协调、突出重点、精准推进。以"钉钉子"精神抓落实，以"啃硬骨头"精神抓攻坚，以锲而不舍精神抓协调，以一丝不苟精神抓管理。坚定信心、迎难而上，做到目标不变，速度不减，力度不降，奋力完成全年重点工作任务。'
    usage_note: 四精神抓工作结束语，适用于年中工作会
    applicable_types: [讲话]
    applicable_position: 结尾
    applicable_direction: 下行文
    formality_level: 正式
    source: 文稿结尾篇·四、领导讲话结尾

  - id: OC-053
    category: 讲话结束语
    content: '同志们，喊破嗓子，不如做出样子，上下同欲者胜。面对艰巨复杂的工作任务，各地、各有关部门要做到"稳"有举措、"进"有标尺，振奋精神、心无旁骛、真抓实干，多出实招、硬招、新招，确保年底全面"交账"。'
    usage_note: 年终前攻坚结束语，强调落实交账
    applicable_types: [讲话]
    applicable_position: 结尾
    applicable_direction: 下行文
    formality_level: 正式
    source: 文稿结尾篇·四、领导讲话结尾

  - id: OC-054
    category: 讲话结束语
    content: 同志们，风劲潮涌，自当扬帆破浪；任重道远，更需策马加鞭！让我们以这次会议为契机，统一思想、坚定信心、振奋精神、扎实工作，让一切有益于富民强市的新鲜思想充分涌现，让一切有志于建功立业的能人志士充分施展，让一切有利于加快发展的生产要素充分活跃，全面完成今年各项任务。
    usage_note: 三让+发展要素结束语，适用于综合性大会
    applicable_types: [讲话]
    applicable_position: 结尾
    applicable_direction: 通用
    formality_level: 正式
    source: 文稿结尾篇·四、领导讲话结尾

  - id: OC-055
    category: 讲话结束语
    content: 同志们，方向已经明确，任务贵在落实。实现既定的奋斗目标，我们必须要有虎口夺食的拼劲、重锤钉钉的狠劲、拧准螺丝的巧劲、蚂蚁啃骨的韧劲，直面各种矛盾和问题，逐级分解任务，层层压实责任，确保圆满完成全年目标。
    usage_note: 四劲结束语，适用于任务攻坚类会议
    applicable_types: [讲话]
    applicable_position: 结尾
    applicable_direction: 下行文
    formality_level: 正式
    source: 文稿结尾篇·四、领导讲话结尾

  - id: OC-056
    category: 讲话结束语
    content: 同志们，攻坚的冲锋号已经吹响，让我们树立必胜的信心、大胜的决心、全胜的雄心，始终保持干事的激情，始终保持创业的热情，始终保持攻坚的豪情，只争朝夕、紧张快干、克难奋进，全力冲刺年度目标任务！
    usage_note: 三心三情结束语，适用于年中下半年冲刺动员
    applicable_types: [讲话]
    applicable_position: 结尾
    applicable_direction: 通用
    formality_level: 正式
    source: 文稿结尾篇·四、领导讲话结尾

  - id: OC-057
    category: 讲话结束语
    content: 同志们，新的目标激励我们承前启后、继往开来；新的征程需要我们开拓进取、拼搏奋进。让我们以更饱满的热情、更昂扬的斗志、更务实的作风，创造无愧于党、无愧于人民、无愧于时代的新业绩，共同谱写加快建设的新篇章！
    usage_note: 三更+三无愧结束语，适用于年度工作会
    applicable_types: [讲话]
    applicable_position: 结尾
    applicable_direction: 通用
    formality_level: 正式
    source: 文稿结尾篇·四、领导讲话结尾

  - id: OC-058
    category: 讲话结束语
    content: '同志们，推动**新一轮发展，使命光荣，责任重大。全市上下要勇于担当，奋发有为，以百倍的信心、百倍的努力、百倍的干劲，推动**新一轮大发展大跨越，在推进"两个率先"的征程上创出新的辉煌业绩。'
