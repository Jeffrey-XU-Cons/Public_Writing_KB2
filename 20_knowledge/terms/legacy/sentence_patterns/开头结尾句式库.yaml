  - id: OC-061
    category: 讲话结束语
    content: 空谈误国，实干兴邦。只有真抓才能攻坚克难，只有实干才能梦想成真。经济特区要坚定舍我其谁的信念、勇当尖兵的决心，保持爬坡过坎的压力感、奋勇向前的使命感、干事创业的责任感，积极培育崇尚实干的环境，务实求变、务实求新、务实求进，为实干者撑腰，为干事者鼓劲。
