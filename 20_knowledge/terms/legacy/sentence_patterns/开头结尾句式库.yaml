entries:
  # ===== 文稿开头结构实例 =====

  - id: OC-001
    category: 文稿开头结构
    structure: 形势概括+概念定义+总的政策思路
    content: 被旱魃重创的西南大地禾苗干枯，土焦石裂，滴水成金，既让百姓揪心，也暴露出我国农田水利基础设施建设长年存在的问题，凸显了提高水资源保障能力的重要性。水资源保障能力，包括工程保障、生产生活保障和环境保障能力等，对稳定农业生产和实现可持续发展具有重要意义。
    usage_note: 形势描述→概念界定→政策引出，适用于政策报告或调研报告开篇
    applicable_types: [报告, 方案]
    applicable_position: 开头
    applicable_direction: 上行文
    formality_level: 正式
    source: 文稿开头篇·实例1

  - id: OC-002
    category: 文稿开头结构
    structure: 当前形势+引申分析+指导思想
    content: 在党中央的大力倡导下，全党抓文风建设取得很大成绩。改革开放30多年来，党的优良文风逐渐得到恢复。当前，在一些党政机关文件、领导干部讲话和理论文章，文风上存在的问题仍然很突出，主要表现为长、空、假。文风不是小事。
    usage_note: 成绩+问题+定性，适用于作风建设类报告或讲话开篇
    applicable_types: [讲话, 报告]
    applicable_position: 开头
    applicable_direction: 通用
    formality_level: 正式
    source: 文稿开头篇·实例2

  - id: OC-003
    category: 文稿开头结构
    structure: 权威观点+明确意义+发展方向
    content: '"忧民之忧者，民亦忧其忧；乐民之乐者，民亦乐其乐。"领导干部在不同的系统、不同的岗位上工作，都有一个共同的追求，就是全心全意为人民服务；都有一个共同的目标，就是让人民满意。'
    usage_note: 引用古语→共同目标→要求，适用于民生工作或党建类讲话开篇
    applicable_types: [讲话]
    applicable_position: 开头
    applicable_direction: 通用
    formality_level: 正式
    source: 文稿开头篇·实例3

  - id: OC-004
    category: 文稿开头结构
    structure: 提出问题+说明意义+指导思想
    content: 面对社会转型期群体事件频发、政府需要处理的复杂问题增多的趋势，能否对百姓出真心、动真情、讲真话，成为测量责任政府、服务政府建设水平和领导干部素质能力的一根标尺。实践证明，坚持群众路线、做好群众工作，这是妥善处理涉及群众利益和社会矛盾的复杂问题的关键所在。
    usage_note: 问题引入→意义阐明→工作思路，适用于群众工作类报告开篇
    applicable_types: [报告, 讲话]
    applicable_position: 开头
    applicable_direction: 通用
    formality_level: 正式
    source: 文稿开头篇·实例4

  - id: OC-005
    category: 文稿开头结构
    structure: 引用名言+面临问题+工作思路
    content: '李斯在名篇《谏逐客书》中指出："却客而不纳，疏士而不用，是使国无富利之实，而秦无强大之名也。"城市的繁荣发展离不开农民工，离不开外来的新市民，但一些城市却通过设置种种政策限制，对外来人员下了逐客令。'
    usage_note: 历史名言引入→类比现实问题→工作方向，适用于人才政策类报告
    applicable_types: [报告]
    applicable_position: 开头
    applicable_direction: 通用
    formality_level: 正式
    source: 文稿开头篇·实例5

  - id: OC-006
    category: 文稿开头结构
    structure: 现象描述+原因分析
    content: '近年来，外资企业非正常撤离成为我国经济生活中一个引人注目的现象。过去五年有206家韩资企业从山东非正常撤离。这些企业落地却未生根，像候鸟一样在中国各地"飞"来"飞"去，显示出部分外资的投机性。"候鸟现象"折射的深层问题是：招商引资工作中的深层次矛盾。'
    usage_note: 现象描述→数据佐证→原因深析，适用于经济调研报告开篇
    applicable_types: [报告]
    applicable_position: 开头
    applicable_direction: 上行文
    formality_level: 正式
    source: 文稿开头篇·实例8

  - id: OC-007
    category: 文稿开头结构
    structure: 意义+面临问题+工作思路
    content: 发展，是科学发展观的第一要义，是人民群众的迫切要求，是各级政府的首要任务。但现实中一些地区不顾环境影响和人民呼声，谋求片面发展和短期效益，搞焚林而田、竭泽而渔，给当地生态环境造成了毁灭性的破坏，这是违背科学发展观要求的。
    usage_note: 意义定位→问题描述→引出思路，适用于生态发展类报告开篇
    applicable_types: [报告, 讲话]
    applicable_position: 开头
    applicable_direction: 通用
    formality_level: 正式
    source: 文稿开头篇·实例9

  - id: OC-008
    category: 文稿开头结构
    structure: 重要作用+实例意义+工作思路
    content: 预算公开一小步，政治文明一大步。四川白庙乡公开财政支出的举措，给各级政府预算公开立下了一个具有参照意义的标杆。要顺天应时，顺应社会舆论的呼声和政府改革的规律，以预算信息的进一步公开作为提升财政信息透明度的最佳切入点和突破口。
    usage_note: 典型案例引入→意义提炼→工作方向，适用于财政政务公开类报告
    applicable_types: [报告]
    applicable_position: 开头
    applicable_direction: 通用
    formality_level: 正式
    source: 文稿开头篇·实例10

  # ===== 结尾词语词句（300词汇集）=====

  - id: OC-009
    category: 结尾词语词句
    sub_category: 奋进类
    content: 爬坡过坎、滚石上山、凝聚力量、谱写华章、斗志昂扬、奋力迈进、重塑辉煌、再铸伟业、只争朝夕、豪迈干劲、众志成城、强大合力、不忘初心、牢记使命、蓄势待发、永不懈怠、凝心聚力、锐意进取、埋头苦干、同心同德、积极作为、奋力赶超、抢抓机遇、开拓进取
    usage_note: 领导讲话结束语通用激励词汇，选取若干组合使用
    applicable_types: [讲话]
    applicable_position: 结尾
    applicable_direction: 通用
    formality_level: 正式
    source: 文稿结尾篇·300个用于领导讲话稿结束语的词句

  - id: OC-010
    category: 结尾词语词句
    sub_category: 担当类
    content: 主动作为、砥砺奋进、蓝图绘就、扬帆破浪、重任在肩、策马加鞭、排难而进、再接再厉、抓铁有痕、踏石留印、一往无前、锐意拼搏、开拓奋进、使命在肩、责任重大、勤勉尽责、夙兴夜寐、不负重托、不辱使命、蓬勃向上、奋发有为、披荆斩棘、勇往直前、砥砺前行
    usage_note: 结尾担当责任类词汇
    applicable_types: [讲话, 汇报]
    applicable_position: 结尾
    applicable_direction: 通用
    formality_level: 正式
    source: 文稿结尾篇·300个用于领导讲话稿结束语的词句

  - id: OC-011
    category: 结尾词语词句
    sub_category: 攻坚类
    content: 坚定信心、乘势而上、勇于变革、勇于创新、永不僵化、永不停滞、功崇惟志、业广惟勤、勠力同心、令人鼓舞、催人奋进、守望相助、团结奋斗、砥砺前行、撸起袖子、扑下身子、和衷共济、务实拼搏、满怀激情、乘势而上、中流击水、闯关夺隘、重振雄风、再创辉煌
    usage_note: 攻坚克难类结尾词汇
    applicable_types: [讲话]
    applicable_position: 结尾
    applicable_direction: 通用
    formality_level: 正式
    source: 文稿结尾篇·300个用于领导讲话稿结束语的词句

  - id: OC-012
    category: 结尾词语词句
    sub_category: 落实类
    content: 精准出击、招招致敌、善始善终、善做善成、不妥协、不畏缩、不服输、抓重点、抓要害、抓关键、展望新蓝图、开启新征程、谋求新发展、实现新跨越、不驰于空想、不骛于虚声
    usage_note: 强调落实执行的结尾词汇
    applicable_types: [讲话, 方案]
    applicable_position: 结尾
    applicable_direction: 通用
    formality_level: 正式
    source: 文稿结尾篇·300个用于领导讲话稿结束语的词句

  # ===== 结尾金句（精选）=====

  - id: OC-013
    category: 结尾金句
    content: 不忘初心、牢记使命，勇挑时代赋予的重任，不负人民寄予的厚望，以永不懈怠的精神状态和一往无前的奋斗姿态。
    applicable_types: [讲话]
    applicable_position: 结尾
    applicable_direction: 通用
    formality_level: 正式
    source: 文稿结尾篇·金句

  - id: OC-014
    category: 结尾金句
    content: 新思想引领新征程，新时代呼唤新作为！
    applicable_types: [讲话]
    applicable_position: 结尾
    applicable_direction: 通用
    formality_level: 正式
    source: 文稿结尾篇·金句

  - id: OC-015
    category: 结尾金句
    content: 新时代开启新征程，新使命呼唤新作为。
    applicable_types: [讲话]
    applicable_position: 结尾
    applicable_direction: 通用
    formality_level: 正式
    source: 文稿结尾篇·金句

  - id: OC-016
    category: 结尾金句
    content: 蓝图绘就，正当扬帆破浪；重任在肩，更须策马加鞭。
    applicable_types: [讲话]
    applicable_position: 结尾
    applicable_direction: 通用
    formality_level: 正式
    source: 文稿结尾篇·金句

  - id: OC-017
    category: 结尾金句
    content: 使命重在担当，实干铸就未来。
    applicable_types: [讲话]
    applicable_position: 结尾
    applicable_direction: 通用
    formality_level: 正式
    source: 文稿结尾篇·金句

  - id: OC-018
    category: 结尾金句
    content: 路虽远行则将至，事虽难做则必成。
    applicable_types: [讲话]
    applicable_position: 结尾
    applicable_direction: 通用
    formality_level: 正式
    source: 文稿结尾篇·金句

  - id: OC-019
    category: 结尾金句
    content: 只有干出来的精彩，没有等出来的辉煌；只有一步一步干在实处，才能昂首阔步走在前列。
    applicable_types: [讲话]
    applicable_position: 结尾
    applicable_direction: 通用
    formality_level: 正式
    source: 文稿结尾篇·金句

  - id: OC-020
    category: 结尾金句
    content: 历史只会眷顾坚定者、奋进者、搏击者，而不会等待犹豫者、懈怠者、畏难者。
    applicable_types: [讲话]
    applicable_position: 结尾
    applicable_direction: 通用
    formality_level: 正式
    source: 文稿结尾篇·金句

  - id: OC-021
    category: 结尾金句
    content: 进入新时代、实现新目标，政府使命在肩、责任重大，唯有勤勉尽责、夙兴夜寐，才能不负重托、不辱使命。
    applicable_types: [讲话, 报告]
    applicable_position: 结尾
    applicable_direction: 通用
    formality_level: 正式
    source: 文稿结尾篇·金句

  - id: OC-022
    category: 结尾金句
    content: 不忘初心，方得始终。以开拓进取、争先创优的锐气，攻坚克难、奋勇争先的豪气，蓬勃向上、奋发有为的朝气，披荆斩棘、勇往直前的士气，奋力夺取全面胜利！
    applicable_types: [讲话]
    applicable_position: 结尾
    applicable_direction: 通用
    formality_level: 正式
    source: 文稿结尾篇·金句

  - id: OC-023
    category: 结尾金句
    content: 征程万里风正劲，重任千钧再奋蹄。新时代绘织新蓝图，新征程吹响新号角。
    applicable_types: [讲话]
    applicable_position: 结尾
    applicable_direction: 通用
    formality_level: 正式
    source: 文稿结尾篇·金句

  - id: OC-024
    category: 结尾金句
    content: 不忘初心，鞭策我们永不懈怠；牢记使命，激励我们一往无前。
    applicable_types: [讲话]
    applicable_position: 结尾
    applicable_direction: 通用
    formality_level: 正式
    source: 文稿结尾篇·金句

  - id: OC-025
    category: 结尾金句
    content: '以"功成不必在我"的为民情怀，"舍我其谁"的使命担当。'
    applicable_types: [讲话]
    applicable_position: 结尾
    applicable_direction: 通用
    formality_level: 正式
    source: 文稿结尾篇·金句

  - id: OC-026
    category: 结尾金句
    content: 踏上新征程，我们信心满怀；展望新未来，我们豪情澎湃。
    applicable_types: [讲话]
    applicable_position: 结尾
    applicable_direction: 通用
    formality_level: 较正式
    source: 文稿结尾篇·金句

  - id: OC-027
    category: 结尾金句
    content: 回首过去，成就令人鼓舞；展望未来，蓝图催人奋进。新时代孕育新希望，新征程承载新梦想。
    applicable_types: [讲话, 汇报]
    applicable_position: 结尾
    applicable_direction: 通用
    formality_level: 正式
    source: 文稿结尾篇·金句

  - id: OC-028
    category: 结尾金句
    content: 雄心不与岁月老，激情常伴事业新。
    applicable_types: [讲话]
    applicable_position: 结尾
    applicable_direction: 通用
    formality_level: 较正式
    source: 文稿结尾篇·金句

  - id: OC-029
    category: 结尾金句
    content: 以本色不变得始终的初心、咬定青山不放松的决心、长风破浪会有时的信心！
    applicable_types: [讲话]
    applicable_position: 结尾
    applicable_direction: 通用
    formality_level: 正式
    source: 文稿结尾篇·金句

  - id: OC-030
    category: 结尾金句
    content: 以蓬勃向上、克难求进的精神状态，以只争朝夕、全力跨越的豪迈干劲，以披荆斩棘、雷厉风行的顽强作风。
    applicable_types: [讲话]
    applicable_position: 结尾
    applicable_direction: 通用
    formality_level: 正式
    source: 文稿结尾篇·金句

  - id: OC-031
    category: 结尾金句
    content: 使命呼唤担当，奋斗铸就辉煌！
    applicable_types: [讲话]
    applicable_position: 结尾
    applicable_direction: 通用
    formality_level: 正式
    source: 文稿结尾篇·金句

  - id: OC-032
    category: 结尾金句
    content: 百舸争流，奋楫者先；千帆竞发，勇进者胜。
    applicable_types: [讲话]
    applicable_position: 结尾
    applicable_direction: 通用
    formality_level: 正式
    source: 文稿结尾篇·金句

  - id: OC-033
    category: 结尾金句
    content: 集众智可定良策，合众力必兴伟业。
    applicable_types: [讲话]
    applicable_position: 结尾
    applicable_direction: 通用
    formality_level: 正式
    source: 文稿结尾篇·金句

  - id: OC-034
    category: 结尾金句
    content: 节点决定起点，开局关系全局。干事创业，精气神最宝贵；战胜困难，信心态度最关键。
    applicable_types: [讲话]
    applicable_position: 结尾
    applicable_direction: 通用
    formality_level: 正式
    source: 文稿结尾篇·金句

  - id: OC-035
    category: 结尾金句
    content: 心中有梦想，行动才会有力量。
    applicable_types: [讲话]
    applicable_position: 结尾
    applicable_direction: 通用
    formality_level: 较正式
    source: 文稿结尾篇·金句

  - id: OC-036
    category: 结尾金句
    content: 蓝图已经绘就，前景无限光明；号角催人奋进，责任重于泰山。
    applicable_types: [讲话]
    applicable_position: 结尾
    applicable_direction: 通用
    formality_level: 正式
    source: 文稿结尾篇·金句

  - id: OC-037
    category: 结尾金句
    content: '一年之计在于春，全年工作看开局。"开局就是决战、起步就是冲刺"。'
    usage_note: 年初第一次会议结尾常用
    applicable_types: [讲话]
    applicable_position: 结尾
    applicable_direction: 通用
    formality_level: 较正式
    source: 文稿结尾篇·金句

  - id: OC-038
    category: 结尾金句
    content: 喊破嗓子，不如做出样子，上下同欲者胜。
    applicable_types: [讲话]
    applicable_position: 结尾
    applicable_direction: 通用
    formality_level: 较正式
    source: 文稿结尾篇·金句

  - id: OC-039
    category: 结尾金句
    content: 千忙万忙，不抓落实就是瞎忙；千招万招，不抓落实就是没招；千条万条，不抓落实就是白条。
    usage_note: 强调落实的三段式金句
    applicable_types: [讲话]
    applicable_position: 结尾
    applicable_direction: 通用
    formality_level: 较正式
    source: 文稿结尾篇·金句

  - id: OC-040
    category: 结尾金句
    content: 大争之世，非优即汰；崛起之时，不进则退。
    applicable_types: [讲话]
    applicable_position: 结尾
    applicable_direction: 通用
    formality_level: 正式
    source: 文稿结尾篇·金句

  - id: OC-041
    category: 结尾金句
    content: 发展未有穷期，我们任重道远。
    applicable_types: [讲话]
    applicable_position: 结尾
    applicable_direction: 通用
