    source: 文稿结尾篇·四、领导讲话结尾

  - id: OC-059
    category: 讲话结束语
    content: '同志们，让我们拿出"而今迈步从头越"的豪情，激扬"事事当争第一流"的斗志，振奋"不待扬鞭自奋蹄"的精神，同心协力，拼搏攻坚，共同谱写建设新时代的崭新篇章！'
