  - id: OC-060
    category: 讲话结束语
    content: '"凡事成之，必在干之"。让我们顺应时代潮流，不负群众所托，以时不我待的干劲、静水流深的稳劲、久久为功的韧劲，全身心地投入到工作中，为加快推动经济社会转型发展、绿色发展、创新发展多做贡献、再立新功！'
