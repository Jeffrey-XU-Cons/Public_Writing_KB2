  - id: OC-076
    category: 年终总结诗词
    sub_category: 实用套句
    content: '明年总的工作思路是："三个不变"：坚持全面冲刺年度任务目标不变；狠抓招商引资和项目建设的力度不变；保持干事创业的昂扬精气神不变。"三个转变"：真正转到有转型与创新含金量的发展上来；真正转到自觉践行主题年活动上来；真正转到全面从严治党的更高要求上来。'
