sentence_patterns:

# ===== 一、万能收尾/过渡句式 =====

  - id: SP-001
    category: 万能收尾句
    template: '"不断提升（提高）【XX】水平。"'
    usage_note: 万能收尾句，适合段落或全文结尾
    example: '"不断提升干部队伍专业化、职业化水平。"'
    applicable_types: '["汇报", "报告", "讲话", "方案"]'
    applicable_position: 结尾
    applicable_direction: 通用
    formality_level: 正式
    source: 公文写作词句应用大全_句式与固定结构篇

  - id: SP-002
    category: 万能收尾句
    template: '"确保【XX】落到实处（落实到位）。"'
    usage_note: 常作收尾句，强调落实
    example: '"确保中央大政方针和省、市决策部署不折不扣落到实处。"'
    applicable_types: '["汇报", "报告", "讲话", "方案"]'
    applicable_position: 结尾
    applicable_direction: 通用
    formality_level: 正式
    source: 公文写作词句应用大全_句式与固定结构篇

  - id: SP-003
    category: 万能收尾句
    template: '"以【XX工作】的具体成果体现（检验）【XX】的实际成效。"'
    usage_note: 常作一段话的收尾句，将成果与检验挂钩
    example: '"以工作的具体成果体现（检验）学习贯彻的实际成效。"'
    applicable_types: '["汇报", "报告", "讲话"]'
    applicable_position: 结尾
    applicable_direction: 通用
    formality_level: 正式
    source: 公文写作词句应用大全_句式与固定结构篇

  - id: SP-004
    category: 承接过渡句
    template: '"借（乘）【XX】的东风，全面掀起【XX】新高潮。"'
    usage_note: 借势过渡句，承接某一政策或机遇导入工作部署
    example: '"要借G20杭州峰会东风，全面掀起城市建设新高潮。"'
    applicable_types: '["讲话", "方案"]'
    applicable_position: 正文
    applicable_direction: 通用
    formality_level: 正式
    source: 公文写作词句应用大全_句式与固定结构篇

  - id: SP-005
    category: 总结开头句
    template: '"面对【困难/问题/挑战】，我们坚持【方针/原则】，取得了【成绩】。"'
    usage_note: 常作工作总结的开头段，先讲形势再讲成绩
    example: '"面对世界经济复苏乏力、局部冲突和动荡频发、全球性问题加剧的外部环境，面对我国经济发展进入新常态等一系列深刻变化，我们坚持稳中求进工作总基调，迎难而上，开拓进取，取得了改革开放和社会主义现代化建设的历史性成就。"'
    applicable_types: '["汇报", "报告", "讲话"]'
    applicable_position: 开头
    applicable_direction: 通用
    formality_level: 正式
    source: 公文写作词句应用大全_句式与固定结构篇

  - id: SP-006
    category: 排比列举句
    template: '"从【A】到【B】，从【C】到【D】，【总结句】。"'
    usage_note: 常用于举例说明，列举典型人物或事迹
    example: '"从焦裕禄到孔繁森，从杨善洲到廖俊波，这一个个模范人物如同一座座灯塔，为我们照亮了以心许民的前行方向。"'
    applicable_types: '["汇报", "报告", "讲话"]'
    applicable_position: 正文
    applicable_direction: 通用
    formality_level: 正式
    source: 公文写作词句应用大全_句式与固定结构篇

  - id: SP-007
    category: 并列总结句
    template: '"【动词】的是【A】，【动词】的是【B】，【动词】的是【C】。"'
    usage_note: 并列结构，用于情感化总结，体现多维收获
    example: '"收获的是友谊，感悟的是思想，品味的是成长。"'
    applicable_types: '["汇报", "报告", "讲话"]'
    applicable_position: 结尾
    applicable_direction: 通用
    formality_level: 较正式
    source: 公文写作词句应用大全_句式与固定结构篇

  - id: SP-008
    category: 会议开场句
    template: '"今天的会议，既是一个【XX】大会、【XX】大会，也是一个【XX】大会、【XX】大会。"'
    usage_note: 常用于领导讲话开场白，定性会议功能
    example: '"经县委、县政府研究，决定今天召开XX大会，这既是一个总结大会、表彰大会，也是一个动员大会、誓师大会。"'
    applicable_types: '["讲话"]'
    applicable_position: 开头
    applicable_direction: 下行文
    formality_level: 正式
    source: 公文写作词句应用大全_句式与固定结构篇

  - id: SP-009
    category: 强调意义句
    template: '"要坚持把【XX】工作作为【说明意义】的【先导/重点/民心/龙头】工程来抓。"'
    usage_note: 常用于强调某项工作的重要地位
    example: '"要坚持把交通设施建设作为缓解交通拥堵、推动城市发展的先导工程来抓。"'
    applicable_types: '["讲话", "方案"]'
    applicable_position: 正文
    applicable_direction: 下行文
    formality_level: 正式
    source: 公文写作词句应用大全_句式与固定结构篇

  - id: SP-010
    category: 借势推进句
    template: '"以【XX】为契机（突破口/切入点），（切实）做好【XX】工作，推动【XX】再上新台阶。"'
    usage_note: 借势推进句，将某一事件/机遇转化为工作动力
    example: '"要以环保督察组督察我县为契机，切实做好环境保护各项工作，推动生态文明建设水平再上新台阶。"'
    applicable_types: '["讲话", "方案"]'
    applicable_position: 正文
    applicable_direction: 通用
    formality_level: 正式
    source: 公文写作词句应用大全_句式与固定结构篇

  - id: SP-011
    category: 承接过渡句
    template: '"在看到进展和成绩（充分肯定成绩）的同时，我们也要清醒认识到……"'
    usage_note: 从成绩到问题的标准过渡句
    example: '"在看到进展和成绩的同时，我们也要清醒认识到，当前工作中还存在这样和那样的问题。"'
    applicable_types: '["汇报", "报告", "讲话"]'
    applicable_position: 正文
    applicable_direction: 通用
    formality_level: 正式
    source: 公文写作词句应用大全_句式与固定结构篇

  - id: SP-012
    category: 承接过渡句
    template: '"在充分肯定成绩的同时，也要清醒认识到，我们的工作与【XX期待/要求】相比还存在【XX】差距。"'
    usage_note: 从成绩到问题的过渡变体，语气更具体
    example: '"在充分肯定成绩的同时，也要清醒认识到，我们的工作与群众期待相比还存在不小差距。"'
    applicable_types: '["汇报", "报告", "讲话"]'
    applicable_position: 正文
    applicable_direction: 通用
    formality_level: 正式
    source: 公文写作词句应用大全_句式与固定结构篇

  - id: SP-013
    category: 强调必要性句
    template: '"只有【A】，才能【B】。"'
    usage_note: 强调某项工作必要性的经典句式
    example: '"只有把基础设施建设水平搞上去，才能吸引更多客商投资兴业。"'
    applicable_types: '["汇报", "报告", "讲话", "方案"]'
    applicable_position: 正文
    applicable_direction: 通用
    formality_level: 正式
    source: 公文写作词句应用大全_句式与固定结构篇

  - id: SP-014
    category: 强调必要性句
    template: '"只有坚持和发扬【XX精神】，【具体行动】，才能将【XX任务】真正落到实处。"'
    usage_note: 只有/才能句式的强调变体
    example: '"只有坚持和发扬''钉钉子''精神，一锤接着一锤敲，才能将改革的各项任务真正落到实处。"'
    applicable_types: '["讲话", "方案"]'
    applicable_position: 正文
    applicable_direction: 通用
    formality_level: 正式
    source: 公文写作词句应用大全_句式与固定结构篇

  - id: SP-015
    category: 战略定位句
    template: '"把【XX】作为【工作全局】的关键一招。"'
    usage_note: 突出某项工作战略地位的定位句式
    example: '"坚持把改革开放作为推动经济社会发展的关键一招。"'
    applicable_types: '["讲话", "方案", "报告"]'
    applicable_position: 正文
    applicable_direction: 通用
    formality_level: 正式
    source: 公文写作词句应用大全_句式与固定结构篇

# ===== 二、用于反映问题和不足的句式 =====

  - id: SP-016
    category: 问题分析句式
    template: '"从【角度】上看：重【A】，轻【B】；"'
    usage_note: 从不同维度分析问题的标准句式，可多条并列
    example: '"从认识上看：重硬件，轻软件；从着眼点上看：重显露的问题，轻潜在的问题；"'
    applicable_types: '["汇报", "报告", "讲话"]'
    applicable_position: 正文
    applicable_direction: 通用
    formality_level: 正式
    source: 公文写作词句应用大全_句式与固定结构篇

  - id: SP-017
    category: 问题分析句式
    template: '"重【A】、轻【B】；重【C】、轻【D】。"'
    usage_note: 对照式问题揭示句式，用于工作不足分析
    example: '"重物质、轻精神；重形式、轻内容；重讲评、轻落实；重检查、轻效果。"'
    applicable_types: '["汇报", "报告", "讲话"]'
    applicable_position: 正文
    applicable_direction: 通用
    formality_level: 正式
    source: 公文写作词句应用大全_句式与固定结构篇

  - id: SP-018
    category: 问题分析句式
    template: '"重结果、轻过程；重个别人、轻身边人。"'
    usage_note: 重/轻对照句式变体
    example: '"重结果、轻过程；重要求、轻细化；重两头、轻中间。"'
    applicable_types: '["汇报", "报告", "讲话"]'
    applicable_position: 正文
    applicable_direction: 通用
    formality_level: 正式
    source: 公文写作词句应用大全_句式与固定结构篇

  - id: SP-019
    category: 问题分析句式
    template: '"【A】多、【B】少；【C】多、【D】少。"'
    usage_note: 多少对照式，揭示工作部署和落实之间的差距
    example: '"一般号召多、具体指导较少；部署任务较多、跟踪问效较少；下发文电较多、督促检查较少。"'
    applicable_types: '["汇报", "报告", "讲话"]'
    applicable_position: 正文
    applicable_direction: 通用
    formality_level: 正式
    source: 公文写作词句应用大全_句式与固定结构篇

  - id: SP-020
    category: 问题分析句式
    template: '"【A】抬头，【B】淡化；【C】抬头，【D】淡化。"'
    usage_note: 用于揭示风气和意识方面的问题倾向
    example: '"个人主义思想抬头，宗旨意识淡化；享乐主义抬头，艰苦奋斗意识淡化。"'
    applicable_types: '["报告", "讲话"]'
    applicable_position: 正文
    applicable_direction: 通用
    formality_level: 正式
    source: 公文写作词句应用大全_句式与固定结构篇

  - id: SP-021
    category: 问题分析句式
    template: '"工作标准不高；创新意识不强；工作作风不够实。"'
    usage_note: '"不…"句式，直接列举工作缺点'
    example: '"工作标准不高；创新意识不强；工作作风不够实；思想作风不够牢。"'
    applicable_types: '["汇报", "报告", "讲话"]'
    applicable_position: 正文
    applicable_direction: 通用
    formality_level: 正式
    source: 公文写作词句应用大全_句式与固定结构篇

  - id: SP-022
    category: 问题分析句式
    template: '"【A】不够坚决，【B】不够明确，【C】不到位。"'
    usage_note: '问题"不"字句式，用于具体工作问题列举'
    example: '"执行上级命令指示不够坚决，训练目标不够明确，安全意识较差，工作缺乏科学性和实效性。"'
    applicable_types: '["汇报", "报告"]'
    applicable_position: 正文
    applicable_direction: 通用
    formality_level: 正式
    source: 公文写作词句应用大全_句式与固定结构篇

  - id: SP-023
    category: 成绩总结句式
    template: '"干（做/改）出了【A】，干（做/改）出了【B】，干（做/改）出了【C】。"'
    usage_note: 用于成绩总结或评价，动词可替换
    example: '"干出了经济发展的新气象，干出了城市建设的新风貌，干出了干部队伍的新作风。"'
    applicable_types: '["汇报", "报告", "讲话"]'
    applicable_position: 正文
    applicable_direction: 通用
    formality_level: 正式
    source: 公文写作词句应用大全_句式与固定结构篇

  - id: SP-024
    category: 成绩总结句式
    template: '"改出了【A】，改出了【B】，改出了【C】。"'
    usage_note: 干出了/改出了句式变体，用于改革成效总结
    example: '"改出了领导班子的凝聚力，改出了干部队伍的执行力，改出了攻坚克难的战斗力。"'
    applicable_types: '["汇报", "报告", "讲话"]'
    applicable_position: 正文
    applicable_direction: 通用
    formality_level: 正式
    source: 公文写作词句应用大全_句式与固定结构篇

  - id: SP-025
    category: 成绩总结句式
    template: '"换届换出了【A】，换出了【B】，换出了【C】。"'
    usage_note: 换届/某一举措成效的总结句式变体
    example: '"换届换出了新气象，换出了新干劲，换出了新风貌。"'
    applicable_types: '["报告", "讲话"]'
    applicable_position: 结尾
    applicable_direction: 通用
    formality_level: 正式
    source: 公文写作词句应用大全_句式与固定结构篇

  - id: SP-026
    category: 部署工作句式
    template: '"要强化【工作主题】，【具体措施A】，【具体措施B】，努力把【XX】打造成为【目标定位】。"'
    usage_note: 领导讲话部署工作段落的标准结构：起始句+中间句+收尾句
    example: '"要强化品牌塑造，大力推动南京产品、南京服务向南京品牌转变，以更优的供给为引领、更强的企业为支撑、更好的服务为保障，努力把''南京品牌''打造成为高品质、高质量的代名词。"'
    applicable_types: '["讲话"]'
    applicable_position: 正文
    applicable_direction: 下行文
    formality_level: 正式
    source: 公文写作词句应用大全_句式与固定结构篇

  - id: SP-027
    category: 部署工作句式
    template: '"要【小标题/核心任务】，【起始句，引出全段】，【中间措施句】，【收尾句，强调成效或目标】。"'
    usage_note: 部署工作段落三段式结构：起始句+中间句+收尾句
    example: '"要强化标准引领，牢牢抓住标准化改革试点契机，实施标准化战略，坚持自我''提标''、全力''创标''、强化''用标''，切实以标准引领质量、以质量引领发展。"'
    applicable_types: '["讲话", "方案"]'
    applicable_position: 正文
    applicable_direction: 下行文
    formality_level: 正式
    source: 公文写作词句应用大全_句式与固定结构篇

  - id: SP-028
    category: 问题分析句式
    template: '"工作指导思想不端正；对【XX】不重视；对【XX】帮教、控制、防范不得力；对【XX】认识不充分；对【XX】考虑不周到。"'
    usage_note: 五不教训句式，用于剖析深层原因
    example: '"工作指导思想不端正；对管理、教育薄弱的地方不重视；对个别重点人帮教、控制、防范不得力；对危险情况认识不充分；对内部关系考虑不周到。"'
    applicable_types: '["报告"]'
    applicable_position: 正文
    applicable_direction: 上行文
    formality_level: 正式
    source: 公文写作词句应用大全_句式与固定结构篇

  - id: SP-029
    category: 问题分析句式
    template: '"重【A】，轻【B】；重【C】，轻【D】；重【E】，轻【F】；重【G】，轻【H】。"'
    usage_note: 重/轻句式四组并列版，用于全面揭示工作偏差
    example: '"重管理、轻教育；重整顿、轻经常；重两头、轻中间；重经验、轻创新。"'
    applicable_types: '["汇报", "报告", "讲话"]'
    applicable_position: 正文
    applicable_direction: 通用
    formality_level: 正式
    source: 公文写作词句应用大全_句式与固定结构篇

  - id: SP-030
    category: 问题分析句式
    template: '"一般号召多、具体指导较少；部署任务较多、跟踪问效较少；下发文电较多、督促检查较少；表面了解较多、成果转化较少。"'
    usage_note: 工作管理不足的多/少对照完整版，可按需删减
    example: '"一般号召多、具体指导较少；部署任务较多、跟踪问效较少。"'
    applicable_types: '["汇报", "报告", "讲话"]'
    applicable_position: 正文
    applicable_direction: 通用
    formality_level: 正式
    source: 公文写作词句应用大全_句式与固定结构篇

  - id: SP-031
    category: 问题分析句式
    template: '"能力素质与现实任务要求不相适应。"'
    usage_note: 能力与任务差距的标准表达，可单独成句也可与其他句式组合
