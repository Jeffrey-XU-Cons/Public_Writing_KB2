  ## 使用指南

  ### 快速查询

  **按文种查找**：
  - 通知文件 → COU-105 通知用语 + COU-005 结尾表述
  - 报告材料 → COU-102 问题分析 + COU-103 成绩表述
  - 讲话稿件 → COU-101 开头用语 + COU-104 措施建议
  - 方案文件 → COU-104 措施建议 + TT-503 战略术语

  **按工作阶段**：
  - 背景说明 → COU-101 开头用语
  - 问题分析 → COU-102 问题表述 + MM 搭配规范
  - 工作成绩 → COU-103 成绩表述
  - 工作措施 → COU-104 措施建议
  - 结尾收束 → COU-005 结尾表述

  **质量检查清单**：
  1. ☐ 检查是否使用了PW禁用词
  2. ☐ 检查MM搭配是否规范
  3. ☐ 避免CP中的套话
  4. ☐ 使用TT中的规范术语
  5. ☐ 需要时参考COU优化表述

