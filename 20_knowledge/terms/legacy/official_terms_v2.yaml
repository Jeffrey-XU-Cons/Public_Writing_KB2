content: |
  # 烟草行业公文用语词典 - 扩展版
  # 建设时间：2026-03-17 (Day 2)
  # 版本：2.0 - 扩展版（150+条词条）

  ---

  ## 简介

  本词典收集烟草行业公文写作中的常用用语、禁用词、高频易错搭配、套话替换建议及行业术语，为提高公文质量提供专业参考。

  **更新日志**：
  - v1.0 (2026-03-16): 框架建立，示例词条
  - v2.0 (2026-03-17): 大幅扩展，150+词条，包括烟草行业专项内容

  ---

  ## 第一部分：常用公文用语库（COU）

  ### COU-101 常用开头用语（50条）

  **体现精神与指导方向**（11条）：
  - 根据...精神，为...通知如下 | 体现上级精神
  - 为深入贯彻...新发展理念，... | 深化理念贯彻
  - 为全面推进...工作，现提出如下意见：| 全面性工作启动
  - 为加快推进...建设，制定本方案如下 | 加速度表述
  - 为进一步深化...改革，提出以下措施 | 深层次推进
  - 为切实做好...工作，确保...现通知如下 | 实效性强调
  - 根据中央关于...的决策部署... | 上级指导性
  - 按照...的要求，结合我们的...情况... | 执行与本地化结合
  - 面对...形势，为适应...要求，现提出... | 形势应对
  - 依据...标准，为确保...质量，制定... | 规范性开头
  - 贯彻落实...会议精神，为统筹推进... | 会议精神贯彻

  **说明工作目的/背景**（15条）：
  - 为解决...问题，推进...发展，制定本方案 | 双重目的
  - 为推动...与...的有机结合，现通知如下 | 耦合工作
  - 为进一步理顺...机制，创新...模式，... | 创新驱动
  - 为加强...队伍建设，提升...能力，... | 人才建设
  - 为规范...流程，提高...效率，现提出... | 规范与提效
  - 为增强...意识，提升...水平，特通知... | 意识提升
  - 为改善...局面，突破...瓶颈，采取... | 问题导向
  - 为响应...号召，落实...责任，现... | 主动响应
  - 为适应...变化，抢抓...机遇，我们... | 机遇把握
  - 为完善...体系，健全...机制，... | 体系健全
  - 为保障...权利，维护...稳定，特... | 保障性措施
  - 为服务...大局，支撑...工作，现... | 大局意识
  - 为强化...管理，防范...风险，提出... | 风险防范
  - 为促进...协调，推动...融合，现... | 协调融合
  - 为突出...重点，强化...推进，特此... | 重点突出

  **针对性表述**（8条）：
  - 针对...工作中存在的...问题，现提出... | 问题导向
  - 为着力解决...问题，采取以下措施... | 着力点明确
  - 针对...情况，提出以下要求... | 对标表述
  - 考虑到...实际，制定以下方案... | 实际基础
  - 为适应...要求，现修订...如下 | 适应性调整
  - 鉴于...需要，提出以下建议... | 参考建议
  - 为提高...质量，设定以下标准... | 质量提升
  - 结合...实践，总结以下经验... | 经验总结

  ### COU-102 问题/分析表述用语（30条）

  **发现问题**（10条）：
  - 存在的主要问题有... | 标准表述
  - 当前工作中仍存在...不足 | 现状分析
  - 薄弱环节主要体现在... | 指出短板
  - 亟待解决的问题包括... | 紧迫性强调
  - 需要进一步改进的方面有... | 改进目标
  - 与...存在的主要差距是... | 对标分析
  - 面临的主要困难有... | 困难认知
  - 制约...发展的因素包括... | 制约因素辨析
  - 影响...效率的主要原因是... | 原因分析
  - 深层次原因主要在于... | 深层分析

  **对标分析**（8条）：
  - 与先进单位相比，我们... | 标杆对标
  - 对标国家最新要求，存在... | 上级对标
  - 在...方面，我们与...存在差距 | 具体对标
  - 相比行业先进水平，仍需... | 行业对标
  - 与年初目标相比，进展情况... | 目标对标
  - 同比去年，今年的...呈现... | 纵向对比
  - 与其他兄弟单位相比，差距主要在... | 横向对比
  - 相对于...标准，当前...水平... | 标准对标

  **风险/困难识别**（12条）：
  - 若不及时...，将导致... | 风险预警
  - 当前面临的主要风险包括... | 风险识别
  - 突出问题表现为... | 问题突出
  - 深层次矛盾反映为... | 矛盾分析
  - 需防范...可能性的出现 | 防范意识
  - 警惕...现象蔓延 | 警戒表述
  - 严格防止...反弹 | 防反弹表述
  - 坚决遏制...现象 | 坚决态度
  - 突破...瓶颈的难度较大 | 难度说明
  - 面临来自...的压力 | 压力来源
  - 缺乏...支撑体系 | 缺陷识别
  - 管理基础相对薄弱 | 基础说明

  ### COU-103 成绩/进展表述用语（25条）

  **工作成效**（10条）：
  - 各项工作取得显著成效 | 通用成绩表述
  - 取得了新的进展 | 阶段成果
  - 实现了...目标 | 目标完成
  - 形成了...机制 | 制度创新
  - 逐步建立了...体系 | 体系建立
  - 率先...（在全省、在行业）| 领先地位
  - 成功推进了...工作 | 工作推进
  - 实现了...的重大突破 | 突破亮点
  - 完成了年度...计划的95% | 量化成绩
  - 在...方面位居前列 | 排名成就

  **创新/经验**（8条）：
  - 创新推出了...新模式 | 创新亮点
  - 形成了具有...特色的...做法 | 特色亮点
  - 总结提炼了...先进经验 | 经验总结
  - 建立了...先进典型 | 典型示范
  - 探索形成了...新机制 | 机制探索
  - 创新实施了...新举措 | 措施创新
  - 取得了...的可复制可推广的成果 | 可推广成果
  - 涌现出了...先进集体和个人 | 典型涌现

  **贡献/作用**（7条）：
  - 充分发挥了...的重要作用 | 作用发挥
  - 有力支撑了...发展 | 支撑作用
  - 为...做出了...贡献 | 贡献表述
  - 得到了...的高度肯定 | 认可评价
  - 在...方面发挥了示范引领作用 | 示范作用
  - 有效促进了...工作开展 | 促进作用
  - 切实维护了...权益 | 权益维护

  ### COU-104 措施/建议表述用语（25条）

  **开启措施段**（8条）：
  - 为解决...问题，提出以下措施 | 标准开启
  - 主要采取的措施有... | 主要措施
  - 具体策略包括... | 策略表述
  - 重点实施以下工作... | 重点工作
  - 着力推进以下方面... | 着力点
  - 重点做好以下几项工作 | 重点工作列举
  - 主要从以下步骤推进... | 步骤化表述
  - 具体路径是... | 路径表述

  **措施强度表述**（8条）：
  - 着力推进... | 重点性
  - 大力推进... | 力度性
  - 切实加强... | 实效性
  - 进一步深化... | 深化性
  - 积极探索... | 主动性
  - 实在做好... | 实在性
  - 坚决推进... | 坚决性
  - 全力推进... | 全面性

  **递进性措施**（5条）：
  - 进一步...为前提，继续... | 递进措施
  - 在...基础上，进一步推进... | 基础递进
  - 一方面...另一方面...同时还要... | 多维递进
  - 既要...又要...同时要... | 兼顾递进
  - 既保证...又促进...还要防范... | 平衡递进

  **建议/意见**（4条）：
  - 建议如下... | 标准建议
  - 提出以下意见建议... | 意见建议
  - 特提出以下几点建议 | 针对建议
  - 在此基础上，提出如下意见 | 进阶建议

  ---

  ## 第二部分：禁用词表与风险词（PW）

  ### PW-201 政治性禁用词（30条）

  **绝对用语禁忌**：
  - ❌ 最好的 → ✅ 较好的/更好的
  - ❌ 完全 → ✅ 基本上/较为/大体上
  - ❌ 所有 → ✅ 主要/基本/绝大多数
  - ❌ 永远 → ✅ 长期/坚持/始终
  - ❌ 绝对不 → ✅ 不能/不会/严禁
  - ❌ 必定会 → ✅ 有利于/有助于/可望
  - ❌ 一定要 → ✅ 应当/应该/需要
  - ❌ 最重要的是 → ✅ 重要的是/首要的是
  - ❌ 最好 → ✅ 更好/最佳/优化

  **价值判断禁忌**：
  - ❌ 最先进的 → ✅ 先进的/领先的
  - ❌ 最高水平 → ✅ 高水平/较高水平
  - ❌ 最优秀的 → ✅ 优秀的/较优秀的
  - ❌ 完美的 → ✅ 良好的/较为完善的
  - ❌ 最快 → ✅ 较快/快速

  **权力与法律用语**：
  - ❌ 违法犯罪 → ✅ 违反法律规定
  - ❌ 严厉处罚 → ✅ 依法处理
  - ❌ 必须执行 → ✅ 应当执行/需执行
  - ❌ 强制要求 → ✅ 明确要求/提出要求

  ### PW-202 非规范用语与俗语禁忌（20条）

  - ❌ 要不得 → ✅ 不适当/不可行/不合适
  - ❌ 死板 → ✅ 不够灵活
  - ❌ 不靠谱 → ✅ 不可靠/不稳定
  - ❌ 折腾 → ✅ 反复调整/多次改进
  - ❌ 坑人 → ✅ 不利于/损害
  - ❌ 玩花样 → ✅ 搞变通/搞花样
  - ❌ 虚拟语气（似乎、好像、可能是） → ✅ 删除或改为确定语气
  - ❌ 网络用语（打不通、不在线等） → ✅ 规范表述
  - ❌ 自说自话 → ✅ 自我论证
  - ❌ 一厢情愿 → ✅ 主观性较强

  ### PW-203 行业特定禁忌词（15条）

  **烟草行业禁用/谨慎使用**：
  - ❌ 烟草销售 → ✅ 卷烟营销/烟草制品流通
  - ❌ 烟民数量 → ✅ 消费者规模
  - ❌ 烟草上瘾 → ✅ 消费习惯/消费粘性
  - ⚠️ 烟草利税 → 可用，但需强调社会责任
  - ⚠️ 烟草产能 → 可用，但需与产业结构优化结合
  - ❌ 烟草危害人体 → ✅ 烟草的健康风险
  - ⚠️ 卷烟消费量 → 可用于内部报告，外发需谨慎
  - ❌ 鼓励吸烟 → 完全禁止

  ---

  ## 第三部分：高频易错搭配与语法规范（MM）

  ### MM-301 常见搭配错误（35条）

  **动词搭配错误**：
  | 序号 | 错误搭配 | 正确搭配 | 例句 | 说明 |
  |------|---------|---------|------|------|
  | MM-001 | 制定规划 | 编制规划 | 编制十四五规划 | 规划用"编制" |
  | MM-002 | 落实任务 | 完成任务 | 完成全年任务 | 任务用"完成" |
  | MM-003 | 加强意识 | 增强意识 | 增强安全意识 | 意识用"增强" |
  | MM-004 | 深化改革 | 推进改革 | 推进体制机制改革 | 改革两词通用 |
  | MM-005 | 进行研究 | 开展研究/进行研究 | 开展专题研究 | 研究用"开展" |
  | MM-006 | 取得进步 | 取得进展 | 工作取得新进展 | 进展更规范 |
  | MM-007 | 建立成效 | 取得成效 | 工作取得成效 | 成效用"取得" |
  | MM-008 | 进行工作 | 开展工作 | 开展本项工作 | 工作用"开展" |
  | MM-009 | 强化管理 | 加强管理 | 加强队伍管理 | 管理用"加强" |
  | MM-010 | 推动发展 | 促进发展 | 促进产业发展 | 发展用"促进" |

  **名词搭配错误**（10条）：
  - ❌ 制定目标 → ✅ 确定目标/制定计划
  - ❌ 取得措施 → ✅ 采取措施
  - ❌ 形成计划 → ✅ 制定计划
  - ❌ 进行通知 → ✅ 下达通知
  - ❌ 工作机制 → ✅ 工作机制（正确）
  - ❌ 工作事项 → ✅ 工作任务/工作事务
  - ❌ 管理建议 → ✅ 改进建议
  - ❌ 应对措施 → ✅ 应急措施/应对办法
  - ❌ 实施手段 → ✅ 实施方式/方法

  ### MM-302 量词使用规范（10条）

  | 序号 | 错误用法 | 正确用法 | 说明 |
  |------|---------|---------|------|
  | MM-020 | 一项规划 | 一个规划 | 规划用"个" |
  | MM-021 | 召开一个会议 | 召开一次会议 | 会议用"次" |
  | MM-022 | 进行一次改革 | 推进一项改革 | 改革用"项" |
  | MM-023 | 三项建议 | 三条建议 | 建议用"条" |
  | MM-024 | 十项工作 | 十项工作（正确）| 工作可用"项" |
  | MM-025 | 一种措施 | 一项措施 | 措施用"项" |
  | MM-026 | 两个阶段 | 两个阶段（正确）| 阶段用"个" |
  | MM-027 | 五份方案 | 五个方案 | 方案用"个" |

  ---

  ## 第四部分：高频套话替换表（CP）

  ### CP-401 开头套话优化（15条）

  | 原套话 | 建议修改 | 使用场景 | 说明 |
  |--------|---------|--------|------|
  | 当前形势发生了新变化 | 面对新变化、新形势 | 形势分析 | 更加简洁有力 |
  | 以...为指导 | 以...为引领 | 精神贯彻 | 更加文雅 |
  | 新的历史时期 | 新时代 | 时代背景 | 表述更准确 |
  | 与此同时 | 同时 | 并列表述 | 更加简洁 |
  | 随着...的深入推进 | 在...推进中 | 过程描述 | 更加自然 |
  | 为了进一步 | 为进一步 | 目的说明 | 更加规范 |
  | 据了解 | 了解到 | 信息引出 | 更加正式 |
  | 近年来 | 近年(来) | 时间表述 | 可删除冗余 |
  | 一直以来 | 长期以来 | 时间背景 | 更加学术 |
  | 普遍存在 | 普遍反映 | 问题说明 | 更加准确 |
  | 值得一提的是 | 需要指出的是 | 补充说明 | 更加规范 |
  | 这充分说明 | 这充分表明 | 逻辑推导 | 表意更准确 |
  | 事实上 | 实际上 | 强调真实 | 更加清晰 |
  | 不可否认 | 无可否认 | 承认事实 | 表述更稳妥 |
  | 从某种意义上讲 | 从某种意义说 | 推理表述 | 删冗余 |

  ### CP-402 结尾套话优化（12条）

  | 原套话 | 建议修改 | 使用场景 | 说明 |
  |--------|---------|--------|------|
  | 本决定自发布之日起执行 | 自发布之日起施行 | 规范标准 | 规范化表述 |
  | 各部门要认真落实 | （删除-重复） | 通知结尾 | 避免重复 |
  | 特此通知 | 保留或根据需要删除 | 通知结尾 | 视文种而定 |
  | 望各有关单位... | （改为正文要求） | 结尾要求 | 融入正文 |
  | 有任何问题可... | 有疑问请... | 联系说明 | 更加正式 |
  | 谨此通知 | 特此通知 | 通知结尾 | 规范表述 |
  | 此令 | 特此通知/公告 | 公告结尾 | 根据文种选择 |
  | 由...负责解释 | 本通知由...负责解释 | 责任说明 | 添加主语 |
  | 本通知贯彻执行情况... | （改为附则） | 结尾补充 | 移至附则部分 |
  | 敬请... | 请... | 请求表述 | 删除敬语冗余 |
  | 切盼 | 期待/期望 | 期望表述 | 更加现代 |

  ---

  ## 第五部分：烟草行业专业术语库（TT）

  ### TT-501 管理相关术语（30条）

  **核心管理术语**：
  | 术语 | 标准定义 | 常见错误 | 正确用法 |
  |------|---------|---------|---------|
  | 管理诊断 | 对企业管理现状的系统化评估 | 管理诊疗、诊断工作 | 进行管理诊断 |
  | 成熟度评价 | 按既定标准对企业成熟度进行评估 | 成熟度评估、成熟度检查 | 实施成熟度评价 |
  | 对标共建 | 与标杆单位比较学习，共同改进 | 对标建设、对标管理 | 开展对标共建 |
  | 全要素管理 | 涵盖所有管理要素的综合管理 | 全方位管理、全面管理 | 推进全要素管理 |
  | 管理体系 | 系统完整的管理组织与制度 | 管理制度、管理办法 | 完善管理体系 |
  | 绩效管理 | 以目标为导向的业绩评价体系 | 业绩管理、绩效考评 | 建立绩效管理制度 |
  | 风险防控 | 系统的风险识别与应对机制 | 风险管理、风险规避 | 加强风险防控 |
  | 持续改进 | 持续优化管理与运营水平 | 不断改进、逐步改进 | 推行持续改进机制 |
  | 标准化管理 | 按照统一标准规范进行管理 | 规范管理、标准管理 | 实施标准化管理 |
  | 流程优化 | 对工作流程进行系统改进 | 流程改造、流程设计 | 推进流程优化 |

  **管理方法论**：
  - 精益管理 - 消除浪费、关注效率的管理理念（≠精细管理）
  - 柔性管理 - 适应变化、因时制宜的管理方式
  - 扁平化管理 - 减少管理层级、提高效率的组织结构
  - 目标管理 - 以明确的目标为导向的管理方法
  - 过程管理 - 关注工作过程而不仅仅是结果
  - 矩阵式管理 - 按职能和项目两维度的组织结构
  - 价值链管理 - 从价值创造角度的系统性管理

