# 石头哥《公文写作标题结构》标题模式词典
# Task 5 - PM（phrase_material）类，category: title_pattern
# 按9种类型提炼核心结构公式，每种类型保留最有代表性的子模式
# 条目总数: 32

# ═══════════════════════════════════════════════════════════
# 一、比喻类（用熟悉事物比喻抽象观点，突出特征，最常见的做亮标题法）
# ═══════════════════════════════════════════════════════════

- id: PM-T-001
  type: phrase_material
  category: title_pattern
  title: 比喻类·动宾引号式（单比喻）
  pattern: '"动词+名词+「比喻词」（引号强调比喻对象）"'
  examples:
    - "举好发展「指挥棒」"
    - "用足提升「工具箱」"
    - "打好反腐「组合拳」"
    - "筑牢制度「防火墙」"
  applicable_level: '"一级标题/二级标题/通用"'
  applicable_types: '["讲话", "方案", "汇报", "报告"]'
  notes: '"比喻词用引号标注，与动宾搭配自然；比喻词要选与主题意象相关的词汇"'
  source: '"石头哥《公文写作标题结构》第一编"'
  usage: dictionary

- id: PM-T-002
  type: phrase_material
  category: title_pattern
  title: 比喻类·这个/这条+引号式
  pattern: '"动词+名词+这个/这条/这项+「比喻词」"'
  examples:
    - "抓住思想政治建设这条「生命线」"
    - "突出选人用人导向这个「指挥棒」"
    - "走好人才优先发展这个「先手棋」"
  applicable_level: '"大标题/一级标题"'
  applicable_types: '["讲话", "汇报", "报告"]'
  notes: '"用"这个/这条"强调单一重点，适合强调某项核心工作"'
  source: '"石头哥《公文写作标题结构》第一编"'
  usage: dictionary

- id: PM-T-003
  type: phrase_material
  category: title_pattern
  title: 比喻类·亮出/排出+引号+动宾并列式
  pattern: '"亮出/排出/列出+「名词（路线图/任务单等）」，在「A」与「B」上+下真功/出真招/出实绩"'
  examples:
    - "列出整改「任务单」，在「集中纠」与「常态治」上下真功"
    - "排出整改「课程表」，在「当下改」与「长久立」上出真招"
    - "亮出整改「路线图」，在「补短板」与「开新局」上出实绩"
  applicable_level: '"二级标题/通用"'
  applicable_types: '["讲话", "方案", "汇报"]'
  notes: '"前半句比喻工具/手段，后半句点出两个工作侧重点；适合整改/部署类"'
  source: '"石头哥《公文写作标题结构》第一编"'
  usage: dictionary

- id: PM-T-004
  type: phrase_material
  category: title_pattern
  title: 比喻类·动词+修饰语+引号四并列式
  pattern: '"（动词+修饰词，）动词+「比喻词」×4条并列（各比喻词体现不同侧面）"'
  examples:
    - "务实作风，打造「宽肩膀」/ 增强本领，练就「硬拳头」/ 正向激励，用好「助推器」/ 反向约束，挥好「铁鞭子」"
    - "校准思想的「定盘星」/ 掌握方法的「金钥匙」/ 锚定前列的「总航标」/ 筑牢政治的「压舱石」"
  applicable_level: '"二级标题"'
  applicable_types: '["讲话", "方案", "汇报", "报告"]'
  notes: '"四个比喻词各表一个侧面，共同构成完整体系；比喻词需差异化选取"'
  source: '"石头哥《公文写作标题结构》第一编"'
  usage: dictionary

- id: PM-T-005
  type: phrase_material
  category: title_pattern
  title: 比喻类·比喻+动词动词拟人式（动物/形象）
  pattern: '"当一只「拟人化比喻词」，以X的态度+动词+结果"'
  examples:
    - "当一只「上山虎」，以敢为人先的态度刀刃向内、揭短亮丑"
    - "当一只「修行虎」，以平和谦逊的态度正确对待、虚心接受"
    - "要保持甘为淡泊名利、爱岗敬业的「老黄牛」心态"
    - "要保持勇于创新、奋发进取的「拓荒牛」心态"
  applicable_level: '"二级标题"'
  applicable_types: '["讲话", "汇报"]'
  notes: '"用动物形象比喻干部精神状态，生动感强；多用于党建/干部培训类讲话"'
  source: '"石头哥《公文写作标题结构》第一编"'
  usage: dictionary

# ═══════════════════════════════════════════════════════════
# 二、数字类（总结概括性强，权威通俗，能吸引眼球）
# ═══════════════════════════════════════════════════════════

- id: PM-T-006
  type: phrase_material
  category: title_pattern
  title: 数字类·数字成语串联式
  pattern: '"做到/实现+「一/二/三/四+有意义的成语」（每条对应一个工作要求）"'
  examples:
    - "推进制度建设要「一以贯之」/ 要「二话不说」/ 要「三日之别」/ 要「四海皆准」"
    - "坚持「五湖四海」选人才/ 坚持「六六大顺」促发展"
  applicable_level: '"二级标题"'
  applicable_types: '["讲话", "方案", "汇报"]'
  notes: '"利用含数字的成语制造视觉节奏感；注意成语含义须与工作内容契合"'
  source: '"石头哥《公文写作标题结构》第一编"'
  usage: dictionary

- id: PM-T-007
  type: phrase_material
  category: title_pattern
  title: 数字类·做到「X个X」+比喻引号式
  pattern: '"做到「X个关键词」，动词+「比喻词」（数字+工作要点+形象概括）"'
  examples:
    - "做到「三个突出」，种好「责任田」"
    - "实施「三大工程」，唱响「主旋律」"
    - "注重「三项引领」，凝聚「正能量」"
    - "强化「三重保障」，筑牢「压舱石」"
  applicable_level: '"大标题/一级标题/二级标题"'
  applicable_types: '["讲话", "方案", "汇报", "报告"]'
  notes: '"前半数字总括，后半比喻升华；是数字类与比喻类的基础组合"'
  source: '"石头哥《公文写作标题结构》第一编"'
  usage: dictionary

- id: PM-T-008
  type: phrase_material
  category: title_pattern
  title: 数字类·递增数字并举式（两面/三维/四级/五措）
  pattern: '"数字（递增）+量词+并X（兼修/并重/联动/举），动词+名词"'
  examples:
    - "两面兼修，激活工作源头 / 三维并重，夯实工作基础 / 四级联动，充实工作队伍 / 五措并举，推动工作提升"
    - "两手同抓，守住发展底线 / 三措并施，激活发展动能 / 四方合力，打好攻坚战役"
  applicable_level: '"二级标题"'
  applicable_types: '["讲话", "方案", "汇报"]'
  notes: '"数字从小到大递进，体现工作层次感；常配括号注释每个数字代表什么"'
  source: '"石头哥《公文写作标题结构》第一编"'
  usage: dictionary

- id: PM-T-009
  type: phrase_material
  category: title_pattern
  title: 数字类·聚焦「一X」构建「三X」实施「四X」梯进式
  pattern: '"聚焦「一核」+构建「三X模式」+实施「四X」+推行「五X机制」（数字梯进，层层深入）"'
  examples:
    - "聚焦「一核引领」，推动组织引领贯穿全过程 / 构建「三邻模式」，推动深入各方面 / 实施「四翼共治」，推动对接精准细 / 推行「五步机制」，推动融合规范化"
    - "抓实「一个统领」/ 强化「两项保障」/ 突出「三个重点」/ 做好「四项工作」"
  applicable_level: '"大标题（覆盖全篇）/一级标题"'
  applicable_types: '["讲话", "方案", "汇报"]'
  notes: '"数字递增展现工作的系统性和层次性；适合系统部署类、汇报类材料"'
  source: '"石头哥《公文写作标题结构》第一编"'
  usage: dictionary

- id: PM-T-010
  type: phrase_material
  category: title_pattern
  title: 数字类·前期/启动/深化分步落实式
  pattern: '"前/启/深化+X+落实「X个X」（按工作阶段配合数字要求）"'
  examples:
    - "前期准备工作做到「三个到位」（排查整顿到位，任期审计到位，人选把关到位）"
    - "启动实施落实「四个有力」（安排部署有力，宣传发动有力，组织实施有力，严明纪律有力）"
  applicable_level: '"二级标题"'
  applicable_types: '["方案", "汇报"]'
  notes: '"配合括号注释内容；多用于工作方案部署、专项行动总结"'
  source: '"石头哥《公文写作标题结构》第一编"'
  usage: dictionary

# ═══════════════════════════════════════════════════════════
# 三、重复类（核心词语重复使用，强调醒目，引起注意）
# ═══════════════════════════════════════════════════════════

- id: PM-T-011
  type: phrase_material
  category: title_pattern
  title: 重复类·相同句式开头排比式
  pattern: '"重复相同开头词/句式×3-4，后接不同内容（造成整齐的形式感和强调感）"'
  examples:
    - "一次宣誓，那是一生「绝对忠诚」的信仰 / 一次宣誓，那是一生「为民服务」的信念 / 一次宣誓，那是一生「奋斗终身」的信心"
    - "强化阵地建设，提升新就业群体「安全感」/ 强化服务到位，提升...「幸福感」/ 强化融入治理，提升...「归属感」"
  applicable_level: '"二级标题"'
  applicable_types: '["讲话", "汇报", "报告"]'
  notes: '"每条句式完全相同，只变换核心词；重复词须有强调价值，内容须有递进或并列关系"'
  source: '"石头哥《公文写作标题结构》第一编"'
  usage: dictionary

- id: PM-T-012
  type: phrase_material
  category: title_pattern
  title: 重复类·坚持「X为X」标准+选用「X」的Y式
  pattern: '"坚持「X为X」标准，选用「特征A、特征B」的+目标对象"'
  examples:
    - "坚持「政治为先」标准，选用「信仰坚定、信念如磐」的年轻干部"
    - "坚持「能力为基」标准，选用「人岗相适、素质过硬」的年轻干部"
    - "坚持「实干为核」标准，选用「敢于斗争、勇于担当」的年轻干部"
  applicable_level: '"二级标题"'
  applicable_types: '["讲话", "方案"]'
  notes: '"常用于干部选拔、人才培养主题；「X为X」结构固定，替换内容即可"'
  source: '"石头哥《公文写作标题结构》第一编"'
  usage: dictionary

- id: PM-T-013
  type: phrase_material
  category: title_pattern
  title: 重复类·聚焦「关键词」，让XX「动词」起来式
  pattern: '"聚焦「主题关键词」，让+对象+「单字动词」起来"'
  examples:
    - "聚焦「航标」，让XX「强」起来"
    - "聚焦「诚信」，让XX「严」起来"
    - "聚焦「民生」，让XX「暖」起来"
    - "聚焦「开放」，让XX「活」起来"
  applicable_level: '"二级标题"'
  applicable_types: '["讲话", "汇报"]'
  notes: '"聚焦重复，让+单字动词结构简洁有力；适合党建、民生、治理类主题"'
  source: '"石头哥《公文写作标题结构》第一编"'
  usage: dictionary

- id: PM-T-014
  type: phrase_material
  category: title_pattern
  title: 重复类·从「特别能X」中感悟X之路式
  pattern: '"从「特别能+动词」中感悟+名词+之路"'
  examples:
    - "从「特别能吃苦」中感悟扎根之路"
    - "从「特别能战斗」中感悟奋斗之路"
    - "从「特别能奉献」中感悟为民之路"
    - "从「特别能攻关」中感悟创新之路"
  applicable_level: '"二级标题"'
  applicable_types: '["讲话", "汇报"]'
  notes: '"引用航天精神/英模精神等固定表述；「特别能」三字重复强调，路的比喻有延伸感"'
  source: '"石头哥《公文写作标题结构》第一编"'
  usage: dictionary

# ═══════════════════════════════════════════════════════════
# 四、引用类（引用名言/古诗词/流行语，高端接地气兼备）
# ═══════════════════════════════════════════════════════════

- id: PM-T-015
  type: phrase_material
  category: title_pattern
  title: 引用类·从X学习中汲取「古诗/名言」的「X之力」式
  pattern: '"从+来源+中汲取「引用语」的「X之力/X之气/X之魂」"'
  examples:
    - "从党史学习中汲取「留取丹心照汗青」的「爱国之力」"
    - "从党史学习中汲取「越是艰险越向前」的「斗争之力」"
    - "从党史学习中汲取「上下同欲者胜」的「团结之力」"
  applicable_level: '"二级标题"'
  applicable_types: '["讲话", "汇报"]'
  notes: '"引用语须放引号，「X之力/X之气」提炼引用的核心精神；常用于党建/主题教育"'
  source: '"石头哥《公文写作标题结构》第一编"'
  usage: dictionary

- id: PM-T-016
  type: phrase_material
  category: title_pattern
  title: 引用类·「古诗句」，动词+X+形容词/方向式
  pattern: '"「古诗词（四字/七言等）」，动词+名词+名词，形容词+动词"'
  examples:
    - "「沧海横流显砥柱，万山磅礴看主峰」，坚定理想信念、提高党性修养，始终奋进向前"
    - "「些小吾曹州县吏，一枝一叶总关情」，站稳群众立场、厚植家国情怀，始终与民同心"
  applicable_level: '"大标题/一级标题"'
  applicable_types: '["讲话"]'
  notes: '"古诗句作为标题起句，后接行动要求；诗句须与主题高度契合；适合重要场合讲话"'
  source: '"石头哥《公文写作标题结构》第一编"'
  usage: dictionary

- id: PM-T-017
  type: phrase_material
  category: title_pattern
  title: 引用类·在X中涵养「古诗句」的X「底气/意志/本领」式
  pattern: '"在+锻炼场景+中+涵养/坚定/增强+「引用语」的+斗争「底气/意志/本领」"'
  examples:
    - "在思想淬炼中涵养「为有牺牲多壮志，敢教日月换新天」的斗争「底气」"
    - "在政治历练中坚定「黄沙百战穿金甲，不破楼兰终不还」的斗争「意志」"
    - "在实践锻炼中增强「孩儿立志出乡关，学不成名誓不还」的斗争「本领」"
  applicable_level: '"二级标题"'
  applicable_types: '["讲话", "汇报"]'
  notes: '"「在X中」+「引用+提炼」三段式；底气/意志/本领三词形成递进；适合干部成长类"'
  source: '"石头哥《公文写作标题结构》第一编"'
  usage: dictionary

# ═══════════════════════════════════════════════════════════
# 五、对称类（结构对仗，字数相同，朗朗上口，最能体现形式美）
# ═══════════════════════════════════════════════════════════

- id: PM-T-018
  type: phrase_material
  category: title_pattern
  title: 对称类·动宾+动宾简单对仗式
  pattern: '"动词+名词，动词+名词（字数相同，词性对应，意思并列或因果）"'
  examples:
    - "加强道德建设，共筑和谐家园"
    - "坚持绿色发展，破解转型困局"
    - "继承读书传统，建设书香社会"
  applicable_level: '"大标题/一级标题"'
  applicable_types: '["讲话", "汇报", "报告"]'
  notes: '"最基础的对称式；前半写做法/方法，后半写目标/效果；字数4-8字为宜"'
  source: '"石头哥《公文写作标题结构》第一编"'
  usage: dictionary

- id: PM-T-019
  type: phrase_material
  category: title_pattern
  title: 对称类·「引号词A」对「引号词B」双比喻对称式
  pattern: '"动词「比喻词A（引号）」，动词「比喻词B（引号）」（两比喻形成对称）"'
  examples:
    - "抓拍「特写照」，刻画「立体相」"
    - "捕捉「潜台词」，听得「弦外音」"
    - "挥好多元共治「指挥棒」，构建基层治理「新格局」"
    - "建好引贤聚才「蓄能池」，激活基层治理「内生力」"
  applicable_level: '"二级标题"'
  applicable_types: '["讲话", "方案", "汇报"]'
  notes: '"两个引号比喻词须意象相关或构成对比；前半措施，后半效果"'
  source: '"石头哥《公文写作标题结构》第一编"'
  usage: dictionary

- id: PM-T-020
  type: phrase_material
  category: title_pattern
  title: 对称类·用好「X」之笔，绘好X「线/图」式
  pattern: '"用好「X功能」之笔，绘好+领域+「线型比喻（主线/实线/曲线/长线）」"'
  examples:
    - "用好「理论铸魂」之笔，绘好思想政治「主线」"
    - "用好「固本强基」之笔，绘好基层组织「实线」"
    - "用好「开放创新」之笔，绘好自我革新「曲线」"
    - "用好「头雁领航」之笔，绘好干部队伍「专线」"
    - "用好「提质强能」之笔，绘好人才工作「长线」"
  applicable_level: '"二级标题"'
  applicable_types: '["讲话", "方案"]'
  notes: '"「之笔」+「线」的意象组合有文采；各条的线型须差异化，体现不同侧重"'
  source: '"石头哥《公文写作标题结构》第一编"'
  usage: dictionary

# ═══════════════════════════════════════════════════════════
# 六、谐音类（利用谐音造成表面与深层双重含义，活泼诙谐）
# ═══════════════════════════════════════════════════════════

- id: PM-T-021
  type: phrase_material
  category: title_pattern
  title: 谐音类·「谐音词1」还是「谐音词2」，检验X式
  pattern: '"「谐音词A」还是「谐音词B」，检验/衡量/体现+X（形式相近音不同，形成对比）"'
  examples:
    - "「将就」还是「讲究」，检验党性成色"
    - "「将就」还是「讲究」，衡量为民情怀"
    - "「将就」还是「讲究」，体现担当意识"
  applicable_level: '"大标题/一级标题/二级标题"'
  applicable_types: '["汇报", "讲话"]'
  notes: '"谐音须精准且意义对立；只适用于书面材料，不适用于讲话稿（听众无法辨识）"'
  source: '"石头哥《公文写作标题结构》第一编"'
  usage: dictionary

- id: PM-T-022
  type: phrase_material
  category: title_pattern
  title: 谐音类·选出能「谐音字」的X，既能X也能X式
  pattern: '"选出能「谐音核心字」的+目标，既能+具体功能A+也能+具体功能B，做到+结果"'
  examples:
    - "选出能「筛」的头雁，既能筛人也能筛事，做到好共事、不出事"
    - "选出能「赛」的头雁，既能赛态度也能赛水平，做到勤干事、会干事"
    - "选出能「晒」的头雁，既能晒承诺也能晒成果，做到想干事、干成事"
  applicable_level: '"二级标题"'
  applicable_types: '["汇报", "报告"]'
  notes: '"筛/赛/晒谐音形成系列，每条结构完全一致；只适用于书面，不适用于口头讲话"'
  source: '"石头哥《公文写作标题结构》第一编"'
  usage: dictionary

- id: PM-T-023
  type: phrase_material
  category: title_pattern
  title: 谐音类·同字谐音镶嵌系列式
  pattern: '"将同一谐音字镶嵌在不同词语位置中，形成一组标题（同字不同义）"'
  examples:
    - "创新先「声」夺人 / 布局有「声」有色 / 发展风「声」水起 / 影响「声」价倍增（声谐「生」）"
    - "以党章为镜培育「党心」/ 规范「党行」/ 牢记「党姓」/ 塑造「党形」（心/行/姓/形谐音）"
  applicable_level: '"二级标题"'
  applicable_types: '["汇报", "报告"]'
  notes: '"谐音字须能镶嵌到成语或固定词组中；只适用于书面材料"'
  source: '"石头哥《公文写作标题结构》第一编"'
  usage: dictionary

# ═══════════════════════════════════════════════════════════
# 七、复合类（集多种修辞于一体，组合运用比喻+引用+数字等）
# ═══════════════════════════════════════════════════════════

- id: PM-T-024
  type: phrase_material
  category: title_pattern
  title: 复合类·以「古诗句」的X，动词X的「比喻词」式
  pattern: '"以「引用古诗」的+精神品质，动词/校准/锚定+X的「比喻词（引号）」"'
  examples:
    - "以「咬定青山不放松」的信念，校准砥砺前行的「航向标」"
    - "以「千磨万击还坚劲」的作风，弘扬艰苦奋斗的「传家宝」"
    - "拧紧理想信念的「总开关」，提振「革命理想高于天」的坚定意志"
  applicable_level: '"二级标题"'
  applicable_types: '["讲话", "汇报"]'
  notes: '"引用+比喻复合使用；以...的（品质），动词+（比喻）；文采强但需功底"'
  source: '"石头哥《公文写作标题结构》第一编"'
  usage: dictionary

- id: PM-T-025
  type: phrase_material
  category: title_pattern
  title: 复合类·愿你+动词「古诗句」+的X，将X变成X式
  pattern: '"愿你+动词「引用古诗句」的+精神名词，将+一种状态+变成/长成+升华状态"'
  examples:
    - "愿你秉承「先天下之忧而忧，后天下之乐而乐」的热忱初心，将纯真长成忠诚的模样"
    - "愿你淬炼「黄沙百战穿金甲，不破楼兰终不还」的坚韧意志，将勇气化成自信的翅膀"
  applicable_level: '"大标题/一级标题"'
  applicable_types: '["讲话"]'
  notes: '"多用于毕业典礼、上任寄语、欢送会等仪式讲话；语气温情，情感色彩浓"'
  source: '"石头哥《公文写作标题结构》第一编"'
  usage: dictionary

# ═══════════════════════════════════════════════════════════
# 八、提问类（以疑问形式引起关注，突出"是什么/为什么/怎么办"）
# ═══════════════════════════════════════════════════════════

- id: PM-T-026
  type: phrase_material
  category: title_pattern
  title: 提问类·问一问，面对「X」，Y够不够式
  pattern: '"问一问，面对「形势/任务/群众需求」，+要求+够不够？"'
  examples:
    - "问一问，面对「两个大局」的交织激荡，高点站位、高位谋划的格局胸怀够不够？"
    - "问一问，面对机遇叠加的「时」与「势」，扛旗争先、比学赶超的进取意识够不够？"
    - "问一问，面对人民群众日益增长的美好生活需求，一心为公、执政为民的情怀够不够？"
  applicable_level: '"二级标题"'
  applicable_types: '["讲话", "汇报"]'
  notes: '"「问一问」重复强调自我审视，适合教育整顿/专题组织生活会/批评与自我批评"'
  source: '"石头哥《公文写作标题结构》第一编"'
  usage: dictionary

- id: PM-T-027
  type: phrase_material
  category: title_pattern
  title: 提问类·X「为什么/怎么干/和谁干」式三问式
  pattern: '"对象+「为什么」？→说明意义 / 对象+「怎么干」？→说明方法 / 对象+「和谁干」？→说明依靠"'
  examples:
    - "驻村「为什么」？要站稳政治立场，争做头脑清醒的「明白人」"
    - "驻村「怎么干」？要扛起时代重任，争做干事创业的「带头人」"
    - "驻村「和谁干」？要以百姓心为心，争做心系群众的「贴心人」"
  applicable_level: '"大标题/一级标题"'
  applicable_types: '["讲话", "方案"]'
  notes: '"三问涵盖方向/方法/主体，适合对重要工作的系统部署；回答中可内嵌比喻"'
  source: '"石头哥《公文写作标题结构》第一编"'
  usage: dictionary

- id: PM-T-028
  type: phrase_material
  category: title_pattern
  title: 提问类·问「A」还是「B」两元对比提问式
  pattern: '"问「消极状态」还是「积极状态」？（逼迫做出选择，突出对比）"'
  examples:
    - "问「只奔前程」还是「胸怀大业」？"
    - "问「遇难则退」还是「迎难而上」？"
    - "问「纸上谈兵」还是「真抓实干」？"
  applicable_level: '"二级标题"'
  applicable_types: '["讲话", "汇报"]'
  notes: '"二元对立式提问，激发听众自我反思；适合批评与自我批评、主题教育类"'
  source: '"石头哥《公文写作标题结构》第一编"'
  usage: dictionary

# ═══════════════════════════════════════════════════════════
# 九、单字类（突出一个字，干脆简洁，常用于总结成果/措施/经验）
# ═══════════════════════════════════════════════════════════

- id: PM-T-029
  type: phrase_material
  category: title_pattern
  title: 单字类·X上/面+动词了「单字」式
  pattern: '"X维度（思想/精神/工作/组织）+上/面+动词了/加了/补了+「单字（引号）」"'
  examples:
    - "思想上充了「电」/ 精神上补了「钙」/ 工作上加了「油」"
    - "能力上有了「底」/ 作风上打了「结」/ 纪律上念了「经」"
  applicable_level: '"二级标题"'
  applicable_types: '["讲话", "汇报"]'
  notes: '"单字须与维度搭配自然（充电/补钙/加油均为日常语）；常括注单字说明"'
  source: '"石头哥《公文写作标题结构》第一编"'
  usage: dictionary

- id: PM-T-030
  type: phrase_material
  category: title_pattern
  title: 单字类·动词「单字」，动词+名词「效应/格局/态势」式
  pattern: '"动词+「单字动词（引号）」，动词+名词/对象+「效应/格局/格局」"'
  examples:
    - "一片赤诚「引」，构建人才「洼地效应」"
    - "千方百计「育」，厚植人才「森林效应」"
    - "着眼需求「用」，释放人才「乘数效应」"
  applicable_level: '"二级标题"'
  applicable_types: '["讲话", "方案", "汇报"]'
  notes: '"「引/育/用」等单字须能形成系列；后半段效应类词语需有内涵"'
  source: '"石头哥《公文写作标题结构》第一编"'
  usage: dictionary

- id: PM-T-031
  type: phrase_material
  category: title_pattern
  title: 单字类·从X看，「单字」的态势/动能+动词式
  pattern: '"从+视角（主要指标/发展势头/经济结构）+看，「单字」的+名词（态势/动能/格局）+在+动词"'
  examples:
    - "从主要指标看，「稳」的态势在持续"
    - "从发展势头看，「新」的动能在增长"
    - "从经济结构看，「进」的力度在加大"
    - "从发展质量看，「好」的因素在累积"
  applicable_level: '"二级标题"'
  applicable_types: '["汇报", "报告"]'
  notes: '"适合经济工作类汇报；单字须高度概括对应视角的核心特征（稳/新/进/好）"'
  source: '"石头哥《公文写作标题结构》第一编"'
  usage: dictionary

- id: PM-T-032
  type: phrase_material
  category: title_pattern
  title: 单字类·在「单字」的一线+增强+X能力式
  pattern: '"在「单字修饰语（急/难/险/重）」的+场景+增强/提升+X能力/品质"'
  examples:
    - "在「急」的一线增强应变能力"
    - "在「难」的一线增强协调能力"
    - "在「险」的一线增强驾驭能力"
    - "在「重」的一线增强执行能力"
  applicable_level: '"二级标题"'
  applicable_types: '["讲话", "方案"]'
  notes: '"急/难/险/重四字是经典组合；适合干部磨砺、实践历练类主题"'
  source: '"石头哥《公文写作标题结构》第一编"'
  usage: dictionary
