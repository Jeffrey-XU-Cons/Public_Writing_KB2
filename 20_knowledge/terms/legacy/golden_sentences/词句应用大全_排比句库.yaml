  - id: GS-087
    category: 廉洁自律类排比句
    content: 从人生角度讲，一步很短，一生很长，走错一步，影响一生；从廉洁方面讲，防一念之差、一时糊涂、一着不慎，保一路清醒、一世廉洁、一生平安。
