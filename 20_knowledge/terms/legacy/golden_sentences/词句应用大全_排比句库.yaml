    applicable_position: 正文
    applicable_direction: 通用
    formality_level: 正式
    source: 二十、精神有关排比句大全

  # ===== 二十一、学习有关排比句 =====

  - id: GS-076
    category: 学习类排比句
    content: 学习是文明传承之途，学习是人生成长之梯，学习是政党巩固之基，学习是国家兴盛之要。
    usage_note: 四学习定义，适用于学习教育开篇
    applicable_types: [讲话]
    applicable_position: 开头
