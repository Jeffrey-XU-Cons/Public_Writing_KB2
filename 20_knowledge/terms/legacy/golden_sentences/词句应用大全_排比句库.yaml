  # ===== 二十四、党性修养有关排比句 =====

  - id: GS-089
    category: 党性修养类排比句
    content: 在知行合一中砥砺党性修养，增添学识的成色；在格物致知中坚定理想信念，擦亮学识的底色；在学以致用中贡献智慧力量，展现学识的本色。
