  # ===== 二十二、斗争有关排比句 =====

  - id: GS-080
    category: 斗争类排比句
    content: 新时代伟大斗争精神，是"为有牺牲多壮志，敢教日月换新天"的坚定信念；是"踏平坎坷成大道，斗罢艰险又出发"的顽强意志；是"花繁柳密拨得开，风狂雨急立得定"的高强本领。
    usage_note: 三斗争精神+诗句，适用于斗争精神弘扬类讲话
    applicable_types: [讲话]
    applicable_position: 正文
    applicable_direction: 通用
    formality_level: 正式
    source: 二十二、斗争有关排比句大全

  - id: GS-081
    category: 斗争类排比句
    content: "敢于斗争"讲的是斗争态度，"善于斗争"讲的是斗争方法，"骨头要硬"讲的是斗争精神，"见微知著"讲的是斗争本领。
    usage_note: 四斗争要素，适用于斗争精神教育类讲话
    applicable_types: [讲话]
    applicable_position: 正文
    applicable_direction: 通用
    formality_level: 正式
    source: 二十二、斗争有关排比句大全

  - id: GS-082
    category: 斗争类排比句
    content: 中国革命的胜利是靠斗争打出来的，中国建设的业绩是靠斗争干出来的，中国改革的成就是靠斗争闯出来的。
    usage_note: 三历史斗争论，适用于历史教育类讲话
    applicable_types: [讲话]
    applicable_position: 正文
    applicable_direction: 通用
    formality_level: 正式
    source: 二十二、斗争有关排比句大全

  - id: GS-083
    category: 斗争类排比句
    content: 强化思想淬炼、提升斗争志气，强化政治历练、增强斗争底气，强化实践锻炼、保持斗争锐气。
