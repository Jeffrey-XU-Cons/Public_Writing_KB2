    formality_level: 正式
    source: 二十二、斗争有关排比句大全

  - id: GS-084
    category: 斗争类排比句
    content: 发扬斗争精神，坚守斗争立场，坚定斗争意志，把握斗争规律，讲求斗争艺术，增强斗争本领。
