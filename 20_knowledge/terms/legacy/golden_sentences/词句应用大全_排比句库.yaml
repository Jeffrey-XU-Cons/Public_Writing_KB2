  # ===== 一、能力有关排比句 =====

  - id: GS-001
    category: 能力类排比句
    content: 在"急"的一线增强应变能力，在"难"的一线增强协调能力，在"险"的一线增强驾驭能力，在"重"的一线增强执行能力。
    usage_note: 四维能力培养，适用于干部能力建设类讲话
    applicable_types: [讲话]
    applicable_position: 正文
    applicable_direction: 通用
    formality_level: 正式
    source: 一、能力有关排比句大全

  - id: GS-002
    category: 能力类排比句
    content: 增强履行使命任务的能力，增强思考谋划工作的能力，增强推动创新发展的能力。
    usage_note: 三增强能力句式，适用于年度部署讲话
    applicable_types: [讲话, 方案]
    applicable_position: 正文
    applicable_direction: 通用
    formality_level: 正式
    source: 一、能力有关排比句大全

  - id: GS-003
    category: 能力类排比句
    content: 建强治理"指挥部"，提升组织力；锻造治理"主力军"，提升战斗力；构筑治理"共同体"，提升凝聚力。
    usage_note: 三力提升，适用于基层治理类讲话或报告
    applicable_types: [讲话, 报告]
    applicable_position: 正文
    applicable_direction: 通用
    formality_level: 正式
    source: 一、能力有关排比句大全

  - id: GS-004
    category: 能力类排比句
    content: 聚焦学习实践，推动综合素质提升；聚焦主业创新，驱动服务能力提升；聚焦作风建设，带动组工形象提升。
    usage_note: 三聚焦推动提升，适用于组工部门或机关建设类讲话
    applicable_types: [讲话]
    applicable_position: 正文
    applicable_direction: 通用
    formality_level: 正式
    source: 一、能力有关排比句大全

  - id: GS-005
    category: 能力类排比句
    content: 理想信念笃信力是"灵魂支柱"，全局大势把控力是"灯塔坐标"，是非原则鉴别力是"基准标尺"，纪律规矩执行力是"底线方寸"，责任担当驱动力是"成事之要"。
    usage_note: 五力五喻，适用于全面能力培养类讲话
    applicable_types: [讲话]
    applicable_position: 正文
    applicable_direction: 通用
    formality_level: 正式
    source: 一、能力有关排比句大全

  - id: GS-006
    category: 能力类排比句
    content: 聚焦基层干部狠抓落实能力，如何当好改革创新的"领头雁"；聚焦处理矛盾能力，如何当好依法办事、化解纷争的"金钥匙"；聚焦带领群众能力，如何当好体察民情、引领发展的"大脚掌"。
    usage_note: 三聚焦+角色喻，适用于基层干部培训讲话
    applicable_types: [讲话]
    applicable_position: 正文
    applicable_direction: 通用
    formality_level: 正式
    source: 一、能力有关排比句大全

  # ===== 二、制度有关排比句 =====

  - id: GS-007
    category: 制度类排比句
    content: 做到思考筹划工作坚持以制度为指导，组织指导工作坚持以制度为依据，解决实际问题坚持以制度为武器，检查衡量工作坚持以制度为尺度。
    usage_note: 四以制度为句式，适用于制度建设类讲话
    applicable_types: [讲话]
    applicable_position: 正文
    applicable_direction: 通用
    formality_level: 正式
    source: 二、制度有关排比句大全

  - id: GS-008
    category: 制度类排比句
    content: 把严格执行制度作为一种原则来坚持，把严格执行制度作为一种责任来履行，把严格执行制度作为一种素质来培育。
    usage_note: 三把句式，适用于制度执行类讲话
    applicable_types: [讲话]
    applicable_position: 正文
    applicable_direction: 通用
    formality_level: 正式
    source: 二、制度有关排比句大全

  - id: GS-009
    category: 制度类排比句
    content: 纲举目张，制度设置越来越科学；公开公正，制度运行越来越透明；监督问责，制度落实越来越有力。
    usage_note: 三方面制度成效，适用于制度建设总结类汇报
    applicable_types: [汇报, 报告]
    applicable_position: 正文
    applicable_direction: 通用
    formality_level: 正式
    source: 二、制度有关排比句大全

  - id: GS-010
    category: 制度类排比句
    content: 精于思，争当制度学习的表率；诚于心，争当制度维护的表率；笃于行，争当制度执行的表率。
    usage_note: 三表率句式，适用于干部表率示范类讲话
    applicable_types: [讲话]
    applicable_position: 正文
    applicable_direction: 通用
    formality_level: 正式
    source: 二、制度有关排比句大全

  - id: GS-011
    category: 制度类排比句
    content: 制度是规律的总结，违反制度就是违背规律，就要受到客观规律的惩罚；制度是法规的体现，违反制度就是违背法规，就要受到法规的惩处。
    usage_note: 制度重要性论证，适用于制度教育类讲话
    applicable_types: [讲话]
    applicable_position: 正文
    applicable_direction: 通用
    formality_level: 正式
    source: 二、制度有关排比句大全

  # ===== 三、规矩有关排比句 =====

  - id: GS-012
    category: 规矩类排比句
    content: 守规矩最重要的是信念过硬，守规矩最根本的是政治过硬，守规矩最关键的是责任过硬，守规矩最迫切的是能力过硬，守规矩最核心的是作风过硬。
    usage_note: 五最+过硬结构，适用于规矩纪律类讲话
    applicable_types: [讲话]
    applicable_position: 正文
    applicable_direction: 通用
    formality_level: 正式
    source: 三、规矩有关排比句大全

  - id: GS-013
    category: 规矩类排比句
    content: 立规在前，事事有规矩；落细落小，处处见规矩；一视同仁，人人讲规矩；敬终如始，时时守规矩。
    usage_note: 四维度规矩要求，适用于纪律教育讲话
    applicable_types: [讲话]
    applicable_position: 正文
    applicable_direction: 通用
    formality_level: 正式
    source: 三、规矩有关排比句大全

  - id: GS-014
    category: 规矩类排比句
    content: 严明规矩要有抓早抓小的决心，严明规矩要有铁面执纪的态度，严明规矩要有较真碰硬的魄力。
    usage_note: 三要有句式，适用于纪律严明类讲话
    applicable_types: [讲话]
    applicable_position: 正文
    applicable_direction: 通用
    formality_level: 正式
    source: 三、规矩有关排比句大全

  - id: GS-015
    category: 规矩类排比句
    content: 守规矩就是要以自重铸品德，守规矩就是要以自省管小节，守规矩就是要以自警慎言行，守规矩就是要以自励操节守。
    usage_note: 四自修炼，适用于党性修养类讲话
    applicable_types: [讲话]
    applicable_position: 正文
    applicable_direction: 通用
    formality_level: 正式
    source: 三、规矩有关排比句大全

  - id: GS-016
    category: 规矩类排比句
    content: 将讲规矩转化为为民的情怀，将讲规矩转化为担当的行动，将讲规矩转化为清廉的本色，将讲规矩转化为斗争精神。
    usage_note: 四转化句式，适用于规矩教育实践类讲话
    applicable_types: [讲话]
    applicable_position: 正文
    applicable_direction: 通用
    formality_level: 正式
    source: 三、规矩有关排比句大全

  # ===== 六、纪律有关排比句 =====

  - id: GS-017
    category: 纪律类排比句
    content: 严守政治纪律的明白人，严守组织纪律的老实人，严守廉政纪律的清白人，严守群众纪律的贴心人。
    usage_note: 四纪律四角色，适用于党员干部纪律教育
    applicable_types: [讲话]
    applicable_position: 正文
    applicable_direction: 通用
    formality_level: 正式
    source: 六、纪律有关排比句大全

  - id: GS-018
    category: 纪律类排比句
    content: 把"讲规矩"作为政治生命的"紧箍咒""护身符"，把"有纪律"作为干事创业的"生命线""安全带"。
    usage_note: 两把比喻句，适用于规矩纪律讲话
    applicable_types: [讲话]
    applicable_position: 正文
    applicable_direction: 通用
    formality_level: 正式
    source: 六、纪律有关排比句大全

  - id: GS-019
    category: 纪律类排比句
    content: 铁一般纪律，首先"铁"在政治上；铁一般纪律，重点"铁"在攻坚上；铁一般纪律，关键"铁"在执行上。
    usage_note: 三铁递进，适用于纪律作风建设讲话
    applicable_types: [讲话]
    applicable_position: 正文
    applicable_direction: 通用
    formality_level: 正式
    source: 六、纪律有关排比句大全

  - id: GS-020
    category: 纪律类排比句
    content: 维护纪律要守住公与私的"警戒线"，维护纪律要守住是与非的"高压线"，维护纪律要守住情和法的"分界线"。
    usage_note: 三线比喻，适用于纪律廉洁类讲话
    applicable_types: [讲话]
    applicable_position: 正文
    applicable_direction: 通用
    formality_level: 正式
    source: 六、纪律有关排比句大全

  - id: GS-021
    category: 纪律类排比句
    content: 从政治上认清纪律的重大意义，从理论上把握纪律的丰富内涵，从信仰上强化纪律的实践自觉。
    usage_note: 三维度认识纪律，适用于纪律教育开篇
    applicable_types: [讲话]
    applicable_position: 正文
    applicable_direction: 通用
    formality_level: 正式
    source: 六、纪律有关排比句大全

  - id: GS-022
    category: 纪律类排比句
    content: 坚持深化认识抓教育，让纪律教育摆位到位；坚持设身处地抓教育，让纪律教育见人见事；坚持结合渗透抓教育，让纪律教育入心入脑。
    usage_note: 三坚持抓教育，适用于纪律教育部署
    applicable_types: [讲话, 方案]
    applicable_position: 正文
    applicable_direction: 通用
    formality_level: 正式
    source: 六、纪律有关排比句大全

  # ===== 七、人民有关排比句 =====

  - id: GS-023
    category: 人民类排比句
    content: 摆正态度，做人民的"贴心人"；散发热度，做人民的"暖心人"；发扬风度，做人民的"真心人"。
    usage_note: 三心人角色，适用于为民服务类讲话
    applicable_types: [讲话]
    applicable_position: 正文
    applicable_direction: 通用
    formality_level: 正式
    source: 七、人民有关排比句大全

  - id: GS-024
    category: 人民类排比句
    content: 要"心"系人民，有为民的情怀；要"师"从人民，学为民的方法；要"身"入人民，做为民的实事。
    usage_note: 心师身三字起，适用于群众工作类讲话
    applicable_types: [讲话]
    applicable_position: 正文
    applicable_direction: 通用
    formality_level: 正式
    source: 七、人民有关排比句大全

  - id: GS-025
    category: 人民类排比句
    content: 亲民的举措定一条是一条、条条算数；利民的实事做一件成一件、件件落实；为民的承诺说一项是一项、项项兑现。
    usage_note: 三叠加强调句式，适用于联系群众类讲话
    applicable_types: [讲话]
    applicable_position: 正文
    applicable_direction: 通用
    formality_level: 较正式
    source: 七、人民有关排比句大全

  - id: GS-026
    category: 人民类排比句
    content: 把为民服务体现到一言一行上，把为民服务熔铸在一岗一哨里，把为民服务落实在一职一位中。
    usage_note: 三把+落实句式，适用于为民宗旨类讲话
    applicable_types: [讲话]
    applicable_position: 正文
    applicable_direction: 通用
    formality_level: 正式
    source: 七、人民有关排比句大全

  - id: GS-027
    category: 人民类排比句
    content: 为人民服务，要做蹄疾深耕的"拓荒牛"；为人民服务，要做埋头苦干的"老黄牛"；为人民服务，要做甘于奉献的"孺子牛"。
    usage_note: 三牛比喻，适用于奉献精神类讲话结尾
    applicable_types: [讲话]
    applicable_position: 结尾
    applicable_direction: 通用
    formality_level: 正式
    source: 七、人民有关排比句大全

  - id: GS-028
    category: 人民类排比句
    content: 以人民为中心是中国共产党人的理想信念之基，以人民为中心是中国共产党人的根本政治立场，以人民为中心是中国共产党人的力量源头活水。
    usage_note: 三以人民为中心，适用于党建政治类讲话
    applicable_types: [讲话]
    applicable_position: 正文
    applicable_direction: 通用
    formality_level: 正式
    source: 七、人民有关排比句大全

  # ===== 八、清廉有关排比句 =====

  - id: GS-029
    category: 清廉类排比句
    content: 勤廉家风是人生成功的"奠基石"，勤廉家风是社会和谐的"黏合剂"，勤廉家风是抵御贪腐的"防火墙"。
    usage_note: 三喻廉政家风，适用于廉政文化建设讲话
    applicable_types: [讲话]
    applicable_position: 正文
    applicable_direction: 通用
    formality_level: 正式
    source: 八、清廉有关排比句大全

  - id: GS-030
    category: 清廉类排比句
    content: 破一次规矩，就会留一个污点；搞一次特殊，就会减一分威信；谋一次私利，就会失一片人心。
    usage_note: 三破三失递进，适用于廉政警示类讲话
    applicable_types: [讲话]
    applicable_position: 正文
    applicable_direction: 通用
    formality_level: 正式
    source: 八、清廉有关排比句大全

  - id: GS-031
    category: 清廉类排比句
    content: 贪婪，是腐败的温床，是走向腐败的通行证；自律，是廉洁的沃土，是廉洁从政的安全阀。
    usage_note: 对比式廉政警示，适用于廉政教育讲话
    applicable_types: [讲话]
    applicable_position: 正文
    applicable_direction: 通用
    formality_level: 正式
    source: 八、清廉有关排比句大全

  - id: GS-032
    category: 清廉类排比句
    content: 面对"微腐败"绝不能掉以轻心，遇到"潜规则"绝不能随波逐流，碰上"人情礼"绝不能欣然笑纳。
    usage_note: 三绝不能句式，适用于反腐倡廉警示教育
    applicable_types: [讲话]
    applicable_position: 正文
    applicable_direction: 通用
    formality_level: 正式
    source: 八、清廉有关排比句大全

  - id: GS-033
    category: 清廉类排比句
    content: 坚守一个志向：做清官，决不当贪官；牢记一句警训：手莫伸，伸手必被捉。
    usage_note: 廉洁誓言式，适用于廉政教育开篇
    applicable_types: [讲话]
    applicable_position: 开头
    applicable_direction: 通用
    formality_level: 正式
    source: 八、清廉有关排比句大全

  # ===== 十、干部有关排比句 =====

  - id: GS-034
    category: 干部类排比句
    content: 为敢于"当先锋"的干部"鼓劲"，为敢于"吃螃蟹"的干部"兜底"，为敢于"挑重担"的干部"撑腰"。
    usage_note: 三为敢于干部句式，适用于担当激励类讲话
    applicable_types: [讲话]
    applicable_position: 正文
    applicable_direction: 通用
    formality_level: 正式
    source: 十、干部有关排比句大全

  - id: GS-035
    category: 干部类排比句
    content: 严格政治标准，拧紧选拔任用"总开关"；突出政治忠诚，守好干部培养"生命线"；考准政治表现，画好干部德才"精准像"；压实政治规矩，拉紧干部监督"高压线"。
    usage_note: 四严格+比喻词，适用于组织人事类讲话
    applicable_types: [讲话]
    applicable_position: 正文
    applicable_direction: 通用
    formality_level: 正式
    source: 十、干部有关排比句大全

  - id: GS-036
    category: 干部类排比句
    content: 打造实践"赛马场"，把敢担当、善作为的干部磨炼出来；用好考核"指挥棒"，把敢担当、善作为的干部识别出来；树起选拔"风向标"，把敢担当、善作为的干部使用起来。
    usage_note: 三把干部使用句式，适用于干部工作类讲话
    applicable_types: [讲话]
    applicable_position: 正文
    applicable_direction: 通用
    formality_level: 正式
    source: 十、干部有关排比句大全

  - id: GS-037
    category: 干部类排比句
    content: 鲜明导向引领，充分激发干部"内驱力"；注重依事择人，着力提升选任"匹配度"；突出严管厚爱，大力提振干部"精气神"。
    usage_note: 三维干部工作句式，适用于组工讲话
    applicable_types: [讲话]
    applicable_position: 正文
    applicable_direction: 通用
    formality_level: 正式
    source: 十、干部有关排比句大全

