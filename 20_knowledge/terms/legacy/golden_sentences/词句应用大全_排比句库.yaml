  - id: GS-078
    category: 学习类排比句
    content: 学习坚守初心、对党忠诚的政治品格，学习淡泊名利、甘于奉献的精神品质，学习恪尽职守、担当使命的务实作风，学习清廉自守、克己奉公的高尚情操。
    usage_note: 四学习楷模品质，适用于向先进典型学习类讲话
    applicable_types: [讲话]
    applicable_position: 正文
    applicable_direction: 通用
    formality_level: 正式
    source: 二十一、学习有关排比句大全

  - id: GS-079
    category: 学习类排比句
    content: 聚焦教育主题，明确学习专题；聚焦研读原文，强化学习思考；聚焦思想交流，深化学习研讨；聚焦初心使命，丰富学习载体。
