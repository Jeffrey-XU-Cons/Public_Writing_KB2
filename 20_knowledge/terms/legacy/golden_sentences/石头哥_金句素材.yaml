  # ============ 民生主题 ============

  - id: GS-001
    type: PM
    category: golden_sentence
    topic: 民生
    title: 人视水见形，视民知治不
    quote: '"人视水见形，视民知治不。"'
    source: '"西汉·司马迁《史记·殷本纪》"'
    meaning: '"在水中可以看到自己的影像，通过观察百姓生活状况就知道国家治理得好不好。比喻以民为镜察治道。"'
    usage_tips: '"适用于强调民本思想、察民情、问民需的场合，可置于段首引题，引出对民生工作的论述。"'
    usage_scene:
      - 开头引题
      - 论述支撑
    applicable_types: '["汇报", "报告", "讲话"]'
    importance: B
    usage: dictionary
    book: 石头哥_公文写作进阶速查

  - id: GS-002
    type: PM
    category: golden_sentence
    topic: 民生
    title: 防民之口，甚于防川
    quote: '"防民之口，甚于防川。"'
    source: '"周·召公《国语·周语上》"'
    meaning: '"阻塞百姓的口，比堵塞河川还危险。告诫统治者必须重视民意，绝不能压制民声。"'
    usage_tips: '"强调听民声、察民意的重要性。可用于领导讲话中谈及群众路线、社会稳定、舆论引导等内容，引出正面做法。"'
    usage_scene:
      - 论述支撑
    applicable_types: '["讲话", "报告"]'
    importance: A
    usage: dictionary
    book: 石头哥_公文写作进阶速查

  # ============ 管理主题 ============

  - id: GS-003
    type: PM
    category: golden_sentence
    topic: 管理
    title: 以人为镜，可以明得失
    quote: '"以人为镜，可以明得失。"'
    source: '"后晋·刘昫等《旧唐书·魏徵传》（唐太宗语）"'
    meaning: '"把他人作为镜子，可以看清自己的是非得失。比喻善于倾听他人意见，博采众长，自我完善。"'
    usage_tips: '"适用于谈领导干部修身律己、听取批评意见、开展批评与自我批评的讲话和报告，尤其适合民主生活会场合。"'
    usage_scene:
      - 开头引题
      - 论述支撑
    applicable_types: '["讲话", "汇报"]'
    importance: A
    usage: dictionary
    book: 石头哥_公文写作进阶速查

  - id: GS-004
    type: PM
    category: golden_sentence
    topic: 管理
    title: 尚贤者，政之本也
    quote: '"尚贤者，政之本也。"'
    source: '"战国·墨子《墨子·尚贤》"'
    meaning: '"崇尚贤能的人是为政的根本。将尚贤提到政本高度，强调选贤任能的核心地位。"'
    usage_tips: '"可用于人才工作、干部选拔任用、人才强国战略相关讲话和报告，置于段首统领全段。"'
    usage_scene:
      - 开头引题
      - 论述支撑
    applicable_types: '["汇报", "报告", "讲话"]'
    importance: A
    usage: dictionary
    book: 石头哥_公文写作进阶速查

  - id: GS-005
    type: PM
    category: golden_sentence
    topic: 管理
    title: 功以才成，业由才广
    quote: '"功以才成，业由才广。"'
    source: '"东晋·习凿齿《襄阳耆旧记》"'
    meaning: '"功绩有人才方能建立，事业有人才才能发展。强调人才对于建功立业的决定性作用。"'
    usage_tips: '"适合号召重视人才引进、培养，强调人才是第一资源的讲话和工作报告。"'
    usage_scene:
      - 论述支撑
      - 结尾升华
    applicable_types: '["汇报", "报告", "讲话"]'
    importance: B
    usage: dictionary
    book: 石头哥_公文写作进阶速查

  - id: GS-006
    type: PM
    category: golden_sentence
    topic: 管理
    title: 盖有非常之功，必待非常之人
    quote: '"盖有非常之功，必待非常之人。"'
    source: '"西汉·刘彻《求茂才异等诏》"'
    meaning: '"要建立不寻常的功业，必须依靠不寻常的人才。强调大事业需要大人才，要不拘一格用人才。"'
    usage_tips: '"适用于强调特殊领域人才重用、打破条框束缚、任人唯才唯贤的讲话，有历史权威背书，说服力强。"'
    usage_scene:
      - 开头引题
      - 论述支撑
    applicable_types: '["讲话", "报告"]'
    importance: A
    usage: dictionary
    book: 石头哥_公文写作进阶速查

  # ============ 廉政主题 ============

  - id: GS-007
    type: PM
    category: golden_sentence
    topic: 廉政
    title: 物必先腐，而后虫生
    quote: '"物必先腐也，而后虫生之；人必先疑也，而后谗入之。"'
    source: '"北宋·苏轼《范增论》"'
    meaning: '"世上的东西总是自身先腐烂，然后虫子才会寄生其上。比喻自身先有弱点而后才被外物侵害，强调从源头防腐。"'
    usage_tips: '"反腐倡廉讲话的经典用句，适合置于段首，引出从源头抓党风廉政建设的论述。注意原文是"物必先腐"而非"物必自腐"。"'
    usage_scene:
      - 开头引题
      - 论述支撑
    applicable_types: '["汇报", "报告", "讲话"]'
    importance: A
    usage: dictionary
    book: 石头哥_公文写作进阶速查

  - id: GS-008
    type: PM
    category: golden_sentence
    topic: 廉政
    title: 心不动于微利之诱，目不眩于五色之惑
    quote: '"心不动于微利之诱，目不眩于五色之惑。"'
    source: '"拼句：前句本《论语·子路》，后句本《道德经·第十二章》"'
    meaning: '"心灵不能被蝇头小利所诱惑，眼睛不能被五光十色所迷惑。表达古代"慎微""节欲"思想，强调廉洁自律。"'
    usage_tips: '"强调廉洁自律、守住底线时用，可直接引用为党员干部培养自我约束意识的行为准则。"'
    usage_scene:
      - 论述支撑
      - 结尾升华
    applicable_types: '["讲话", "汇报"]'
    importance: A
    usage: dictionary
    book: 石头哥_公文写作进阶速查

  - id: GS-009
    type: PM
    category: golden_sentence
    topic: 廉政
    title: 壁立千仞，无欲则刚
    quote: '"海纳百川，有容乃大；壁立千仞，无欲则刚。"'
    source: '"清·林则徐两广总督府对联"'
    meaning: '"千仞峭壁巍然屹立，因为它没有世俗欲望。人只有做到没有世俗欲望，才能达到大义凛然的境界。"'
    usage_tips: '"党风廉政建设讲话的不二选句，强调釜底抽薪——从源头消除腐败欲望，也可全联引用展现廉政格局。"'
    usage_scene:
      - 开头引题
      - 结尾升华
    applicable_types: '["讲话", "汇报"]'
    importance: A
    usage: dictionary
    book: 石头哥_公文写作进阶速查

  - id: GS-010
    type: PM
    category: golden_sentence
    topic: 廉政
    title: 非淡泊无以明志，非宁静无以致远
    quote: '"非淡泊无以明志，非宁静无以致远。"'
    source: '"三国蜀·诸葛亮《诫子书》"'
    meaning: '"不把名利看得轻淡就不会有明确的志向，不能平静地学习就不能实现远大目标。劝诫淡泊名利，涵养心性。"'
    usage_tips: '"用于强调领导干部淡泊名利、修身养性，在物质丰裕时代抵御享乐主义，是涵养正气的经典名句。"'
    usage_scene:
      - 开头引题
      - 论述支撑
      - 结尾升华
    applicable_types: '["讲话", "汇报"]'
    importance: A
    usage: dictionary
    book: 石头哥_公文写作进阶速查

  - id: GS-011
    type: PM
    category: golden_sentence
    topic: 廉政
    title: 不义而富且贵，于我如浮云
    quote: '"不义而富且贵，于我如浮云。"'
    source: '"春秋战国·《论语·述而》（孔子语）"'
    meaning: '"用不正当手段获得的荣华富贵，对我来说只是天际浮云，毫无意义。体现孔子义利观，富贵须以道义得之。"'
    usage_tips: '"可用于强调正确义利观、国际合作义利相兼的讲话，也可用于党员干部廉洁从政教育。"'
    usage_scene:
      - 论述支撑
    applicable_types: '["讲话", "报告"]'
    importance: B
    usage: dictionary
    book: 石头哥_公文写作进阶速查

  # ============ 担当主题 ============

  - id: GS-012
    type: PM
    category: golden_sentence
    topic: 担当
    title: 筚路蓝缕，以启山林
    quote: '"筚路蓝缕，以启山林。"'
    source: '"春秋·左丘明《左传·宣公十二年》"'
    meaning: '"驾着柴车，穿着破旧的衣服，去开辟山林。形容创业艰辛，勇于担当，不怕吃苦。"'
    usage_tips: '"适用于讲述党的奋斗历程、创业精神、艰苦岁月的讲话或汇报，表达不忘初心、继续奋斗之意。"'
    usage_scene:
      - 开头引题
      - 论述支撑
    applicable_types: '["汇报", "讲话", "报告"]'
    importance: A
