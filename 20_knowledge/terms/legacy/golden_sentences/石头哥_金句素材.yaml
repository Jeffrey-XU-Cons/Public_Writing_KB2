  # ============ 发展主题 ============

  - id: GS-019
    type: PM
    category: golden_sentence
    topic: 发展
    title: 壹引其纲，万目皆张
    quote: '"壹引其纲，万目皆张。"'
    source: '"战国·《吕氏春秋·离俗·用民》"'
    meaning: '"一提网的大绳子，许多网眼就会张开。以渔网为喻，强调做事要抓住主要环节，带动全局。成语"纲举目张"即出于此。"'
    usage_tips: '"部署工作、陈述规划、强调抓主要矛盾时，可置于段首。强调工作重点、关键抓手时使用。"'
    usage_scene:
      - 开头引题
      - 论述支撑
    applicable_types: '["汇报", "报告", "讲话", "方案"]'
    importance: A
    usage: dictionary
    book: 石头哥_公文写作进阶速查

  - id: GS-020
    type: PM
    category: golden_sentence
    topic: 发展
    title: 万山旁薄，必有主峰；龙衮九章，但挈一领
    quote: '"万山旁薄，必有主峰；龙衮九章，但挈一领。"'
    source: '"清·曾国藩《复陈右铭太守书》"'
    meaning: '"万座高山一定有最高的主峰；复杂的龙袍只要抓住衣领就能提起。比喻再复杂的事物也有关键所在，要善于抓住核心。"'
    usage_tips: '"谈政治方向、把握主要矛盾、抓住改革关键时使用，尤其适合党建类公文，强调政治方向是第一位的问题。"'
    usage_scene:
      - 论述支撑
    applicable_types: '["报告", "讲话"]'
    importance: A
    usage: dictionary
    book: 石头哥_公文写作进阶速查

  - id: GS-021
    type: PM
    category: golden_sentence
    topic: 发展
    title: 锐始者必图其终，成功者先计于始
    quote: '"锐始者必图其终，成功者先计于始。"'
    source: '"明·张居正《答中丞孙槐溪》"'
    meaning: '"急于开始的一定要考虑其结局，能成就功业的总在开始时就精心设计。说明做事必须善始善终。"'
    usage_tips: '"适用于与改革、项目推进相关的讲话，要求持之以恒善始善终，尤其在攻坚阶段强调规划和坚持的双重重要性。"'
    usage_scene:
      - 论述支撑
    applicable_types: '["报告", "讲话", "方案"]'
    importance: B
    usage: dictionary
    book: 石头哥_公文写作进阶速查

  - id: GS-022
    type: PM
    category: golden_sentence
    topic: 发展
    title: 登泰山而览群岳，则冈峦之本末可知也
    quote: '"登泰山而览群岳，则冈峦之本末可知也。"'
    source: '"唐·王勃《八卦大演论》"'
    meaning: '"登上泰山再看其他的山，就知道其他山峰为何以泰山为尊。比喻统之有宗，抓住根本即可驾驭全局，需登高望远。"'
    usage_tips: '"强调全局视野、系统思维，表明只有登高望远才能溯本求源，一以贯之，在更高层面实现整体把握。"'
    usage_scene:
      - 论述支撑
    applicable_types: '["报告", "讲话"]'
    importance: B
    usage: dictionary
    book: 石头哥_公文写作进阶速查

  - id: GS-023
    type: PM
    category: golden_sentence
    topic: 发展
    title: 见本而知末，执一而应万
    quote: '"见本而知末，执一而应万。"'
    source: '"春秋战国·文子《文子·微明》"'
    meaning: '"观察事物的开端就能预见结局，抓住事物的根本就可以控制全体。强调把握关键、抓住主要矛盾。"'
    usage_tips: '"面对繁重复杂任务时，用于强调从方法论上把握关键、剑指要害，使工作事半功倍。"'
    usage_scene:
      - 论述支撑
    applicable_types: '["报告", "讲话", "方案"]'
