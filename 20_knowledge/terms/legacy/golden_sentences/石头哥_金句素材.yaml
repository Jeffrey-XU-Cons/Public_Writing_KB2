    book: 石头哥_公文写作进阶速查

  - id: GS-013
    type: PM
    category: golden_sentence
    topic: 担当
    title: 天行健，君子以自强不息
    quote: '"天行健，君子以自强不息。"'
    source: '"先秦·《周易·乾卦·象传》"'
    meaning: '"天道运行刚健有力，君子应效法天道，自强不息，永不停歇地奋发向上。中华民族精神的经典表达。"'
    usage_tips: '"用途极广，适用于几乎所有奋斗、拼搏、自强类讲话，可置于结尾升华，也可作为开篇引题，气势磅礴。"'
    usage_scene:
      - 开头引题
      - 论述支撑
      - 结尾升华
    applicable_types: '["汇报", "报告", "讲话", "方案"]'
    importance: A
    usage: dictionary
    book: 石头哥_公文写作进阶速查

  - id: GS-014
    type: PM
    category: golden_sentence
    topic: 担当
    title: 多难兴国，殷忧启圣
    quote: '"多难兴国，殷忧启圣。"'
    source: '"北宋·《新唐书·张廷圭传》（引西晋·刘琨《劝进表》语）"'
    meaning: '"灾难频繁反而可以促使国家兴盛，忧患深重反而可以启迪君王圣明。强调困难与成就相辅相成的辩证关系。"'
    usage_tips: '"适用于面对困难和挑战时的讲话，鼓励上下同心、化危为机。可与"生于忧患，死于安乐"联用。"'
    usage_scene:
      - 开头引题
      - 论述支撑
    applicable_types: '["讲话", "报告"]'
    importance: A
    usage: dictionary
    book: 石头哥_公文写作进阶速查

  - id: GS-015
    type: PM
    category: golden_sentence
    topic: 担当
    title: 天下兴亡，匹夫有责
    quote: '"天下兴亡，匹夫有责。"'
    source: '"近现代·梁启超《无聊消遣》（本自清·顾炎武《日知录》）"'
    meaning: '"天下大事的兴盛与灭亡，每一个普通百姓都有不可推卸的责任。表达崇高的责任意识和爱国情怀。"'
    usage_tips: '"适合在排比句中作爱国情怀的表达，或强调公民担当意识，置于段中最为有力。"'
    usage_scene:
      - 论述支撑
      - 结尾升华
    applicable_types: '["汇报", "报告", "讲话"]'
    importance: A
    usage: dictionary
    book: 石头哥_公文写作进阶速查

  - id: GS-016
    type: PM
    category: golden_sentence
    topic: 担当
    title: 士不可以不弘毅，任重而道远
    quote: '"士不可以不弘毅，任重而道远。"'
    source: '"春秋战国·《论语·泰伯》（曾子语）"'
    meaning: '"读书人不可以不抱负远大、意志坚强，因为责任重大而道路遥远。成语"任重道远"即出于此。"'
    usage_tips: '"勉励青年干部最为合适，也可用于描述共产党员的使命担当，气势沉雄，感情真挚，置于结尾升华效果佳。"'
    usage_scene:
      - 论述支撑
      - 结尾升华
    applicable_types: '["讲话", "汇报"]'
    importance: A
    usage: dictionary
    book: 石头哥_公文写作进阶速查

  - id: GS-017
    type: PM
    category: golden_sentence
    topic: 担当
    title: 究天人之际，通古今之变
    quote: '"亦欲以究天人之际，通古今之变，成一家之言。"'
    source: '"西汉·司马迁《报任安书》"'
    meaning: '"研究探索自然规律和社会规律之间的关系，理顺从古代到现在的变化迁移。代表强烈的历史文化责任意识。"'
    usage_tips: '"可置于开头表明高度的责任意识，引出目前工作成就；也可直接引用说明要有大责任感、大历史观。"'
    usage_scene:
      - 开头引题
      - 论述支撑
    applicable_types: '["讲话", "报告"]'
    importance: B
    usage: dictionary
    book: 石头哥_公文写作进阶速查

  - id: GS-018
    type: PM
    category: golden_sentence
    topic: 担当
    title: 精卫衔微木，将以填沧海
    quote: '"精卫衔微木，将以填沧海。"'
    source: '"东晋·陶渊明《读山海经十三首》（其十）"'
    meaning: '"精卫含着微小的木块要填平东海。象征百折不回的毅力和意志，体现中华民族不畏困难的精神气质。"'
    usage_tips: '"鼓励大家不要自怨自艾，坚持到底，有诗意且不落俗套，适合结尾升华，言简意深。"'
    usage_scene:
